    { tipo:'select', target:'ventriculo-izquierdo', txt:'Selecciona en el modelo el <b>ventrículo izquierdo</b>.', hint:(id)=>`Has seleccionado ${S[id].nombre}. ${id.startsWith('auricula')?'Observa que los ventrículos se encuentran en la región inferior del corazón.':id==='ventriculo-derecho'?'Recuerda que en la vista frontal el lado izquierdo del corazón queda a tu derecha, y es la cámara de pared más gruesa.':'Busca la cámara inferior, grande y de pared gruesa, del lado izquierdo del corazón (tu derecha).'} Inténtalo nuevamente.` },
    { tipo:'select', target:'arteria-pulmonar', txt:'Selecciona el vaso por el que la sangre <b>sale hacia los pulmones</b>.', hint:(id)=>`Has seleccionado ${S[id].nombre}. ${id==='aorta'?'La aorta sale del ventrículo izquierdo hacia todo el cuerpo, no hacia los pulmones.':id==='venas-pulmonares'?'Las venas pulmonares traen sangre desde los pulmones; buscamos el vaso que la lleva hacia ellos.':'El vaso buscado nace del ventrículo derecho y lleva sangre pobre en oxígeno.'} Inténtalo nuevamente.` },
    { tipo:'order', txt:'Ordena las etapas del ciclo cardíaco.', seq:['El nodo sinoauricular genera el impulso','Las aurículas se contraen (sístole auricular)','Se cierran las válvulas tricúspide y mitral','Los ventrículos se contraen y expulsan la sangre','Se cierran las válvulas pulmonar y aórtica','El corazón se relaja y se llena (diástole)'] },
    { tipo:'match', txt:'Relaciona cada estructura con su función.', pairs:[['Válvula mitral','Impide que la sangre del ventrículo izquierdo regrese a la aurícula'],['Aorta','Distribuye sangre oxigenada a todo el cuerpo'],['Venas cavas','Traen sangre pobre en O₂ desde el cuerpo a la aurícula derecha'],['Tabique interventricular','Evita que se mezclen la sangre oxigenada y la desoxigenada']] },
    { tipo:'vf', txt:'"Las venas siempre transportan sangre pobre en oxígeno."', ok:false, model:'Es falso. Las venas se definen por llevar sangre hacia el corazón, no por su contenido de O₂. Las venas pulmonares traen sangre rica en oxígeno desde los pulmones a la aurícula izquierda.' }
  ];
  function render(){ body.innerHTML=''; onPick=null; if (E) E.select(null);
    if (item>=ITEMS.length){ const pct = Math.round(score/ITEMS.length*100); Store.completeActivity('eval-corazon',{score:`${score}/${ITEMS.length}`, attempts}); body.append(h('span',{class:'eyebrow anat'},'Resultado'), h('div',{class:'stat'}, h('span',{class:'v'},`${score}/${ITEMS.length}`), h('span',{class:'l'},`${pct} % de aciertos al primer intento · ${attempts} intentos totales`)), h('div',{class:'notice '+(pct>=80?'ok':pct>=60?'warn':'bad')}, pct>=80?'Excelente comprensión de la anatomía y la circulación.':pct>=60?'Buen avance. Repasa las estructuras donde fallaste en el Atlas 3D.':'Te recomendamos repetir la exploración guiada del corazón antes de volver a intentarlo.'), h('div',{class:'row'}, h('a',{class:'btn primary',href:'#/progreso'},'Ver mi progreso'), h('a',{class:'btn',href:'#/explorar/corazon'},'Volver al atlas'), h('button',{class:'btn',onclick:()=>{ item=0; score=0; attempts=0; render(); }},'Repetir'))); return; }

    const fb = h('div',{class:'notice',style:'display:none'}); const nextBtn = h('button',{class:'btn primary',style:'display:none;align-self:flex-start',onclick:()=>{ item++; render(); }},'Siguiente →');
    let att=0; const done = (ok) => { if (ok && att===1) score++; nextBtn.style.display=''; };
    if (it.tipo==='select'){ body.append(h('p',{class:'small muted'},'Haz clic directamente sobre la estructura en el modelo 3D (sin etiquetas).')); onPick = id => { att++; attempts++; E && E.select(id); Store.log('respuesta',{pregunta:'eval:'+it.target,opcion:id,correcto:id===it.target,intento:att}); if (id===it.target){ fb.className='notice ok'; fb.innerHTML=`<b>Correcto.</b> ${S[id].nombre}: ${S[id].n1}`; fb.style.display='flex'; onPick=null; done(true); } else { fb.className='notice warn'; fb.textContent='Aún no. '+it.hint(id); fb.style.display='flex'; } }; }
    else if (it.tipo==='order'){ let pos=0; const chips = h('div',{class:'stack'}); const seqEl = h('ol',{style:'padding-left:20px;font-size:.88rem;display:flex;flex-direction:column;gap:4px'}); it.seq.slice().sort(()=>Math.random()-0.5).forEach(t => chips.append(h('button',{class:'chip',style:'text-align:left;white-space:normal',onclick:function(){ if (this.classList.contains('ok')) return; att++; attempts++; if (t===it.seq[pos]){ this.classList.add('ok'); seqEl.append(h('li',{},t)); pos++; if (pos===it.seq.length){ fb.className='notice ok'; fb.textContent = att===it.seq.length ? 'Secuencia perfecta.' : 'Secuencia completada.'; fb.style.display='flex'; att = att===it.seq.length?1:2; done(true); } } else { this.classList.add('bad'); setTimeout(()=>this.classList.remove('bad'),700); fb.className='notice warn'; fb.textContent = pos===0 ? 'Aún no. Todo latido comienza con un impulso eléctrico: ¿quién lo genera?' : `Aún no. Después de "${it.seq[pos-1]}" viene otra etapa. Piensa en el orden: impulso → aurículas → cierre de válvulas AV → ventrículos → cierre de semilunares → relajación.`; fb.style.display='flex'; } Store.log('respuesta',{pregunta:'eval:orden-ciclo',opcion:t,correcto:t===it.seq[pos-1]}); }}, t))); body.append(h('p',{class:'small muted'},'Selecciona las etapas en orden, comenzando por la primera.'), chips, seqEl); }
    else if (it.tipo==='match'){ const right = it.pairs.map(p=>p[1]).sort(()=>Math.random()-0.5); let correct=0; const rows = h('div',{class:'stack'}); it.pairs.forEach(([a,b]) => { const sel = h('select',{'aria-label':a}); sel.append(h('option',{value:''},'Elige la función…')); right.forEach(r=>sel.append(h('option',{value:r},r))); rows.append(h('div',{class:'field'}, h('label',{},a), sel)); }); const check = h('button',{class:'btn sm primary',style:'align-self:flex-start',onclick:()=>{ att++; attempts++; const sels = $$('select',rows); if (sels.some(s=>!s.value)) return toast('Completa todas las relaciones.'); correct=0; const wrong=[]; sels.forEach((s,k)=>{ const ok = s.value===it.pairs[k][1]; s.style.borderColor = ok?'var(--ok)':'var(--bad)'; if (ok) correct++; else wrong.push(it.pairs[k][0]); }); Store.log('respuesta',{pregunta:'eval:relacionar',correcto:correct===4,intento:att}); if (correct===4){ fb.className='notice ok'; fb.textContent='Todas las relaciones son correctas.'; fb.style.display='flex'; check.disabled=true; done(true); } else { fb.className='notice warn'; fb.textContent=`Aún no: revisa ${wrong.join(' y ')}. Pista: las válvulas impiden retrocesos; los vasos transportan; el tabique separa.`; fb.style.display='flex'; } }},'Comprobar'); body.append(rows, check); }
    else if (it.tipo==='vf'){ let picked=null; const ta = h('textarea',{placeholder:'Argumenta tu respuesta con un ejemplo (mínimo 30 caracteres)…','aria-label':'Argumento'}); const vf = h('div',{class:'row'}, ['Verdadero','Falso'].map((t,k)=>h('button',{class:'chip',onclick:function(){ picked = k===0; $$('button',vf).forEach(b=>b.classList.remove('picked')); this.classList.add('picked'); }},t))); body.append(vf, ta, h('button',{class:'btn sm primary',style:'align-self:flex-start',onclick:function(){ if (picked===null) return toast('Elige verdadero o falso.'); if (ta.value.trim().length<30) return toast('Desarrolla tu argumento.'); att++; attempts++; const ok = picked===it.ok; fb.className='notice '+(ok?'ok':'warn'); fb.innerHTML = `<span><b>${ok?'Correcto.':'Aún no.'}</b> ${esc(it.model)} <br><br><i>Tu argumento:</i> "${esc(ta.value.trim())}". ¿Menciona un ejemplo concreto como las venas pulmonares?</span>`; fb.style.display='flex'; this.disabled=true; Store.addNote('conclusion','V/F argumentado (evaluación corazón): '+ta.value.trim()); Store.log('respuesta_abierta',{actividad:'eval-corazon',vf:picked,correcto:ok,longitud:ta.value.length}); done(ok); }},'Comprobar')); }
    body.append(fb, nextBtn);

    if (parts[1]==='progreso') return [...out, { t:'Mi progreso' }];
    const rec = Object.entries(BIO.cn.recursos).find(([k,r]) => r.href === '#'+path);
    return [...out, { t: rec ? rec[1].t : 'Recurso' }];

/* ---------- Recorrido guiado (globos sobre la interfaz) ---------- */
const TOUR = [
  { sel:'#nav-main', t:'Tus áreas de Ciencias Naturales', d:'Mundo celular, Cuerpo humano y salud, Genética y evolución, Biodiversidad y ecosistemas. Debajo están las actividades transversales.', pos:'right' },
  { sel:'.areas-grid', t:'Entra por tu área', d:'Cada tarjeta muestra cuántos recursos tienes disponibles y tu avance en ese tema.', pos:'bottom', go:'#/' },
  { sel:'.prog', t:'Primero se explora; después se explica', d:'Todos los recursos siguen estos 7 pasos. Toca cualquiera para ver cómo se vive con el corazón.', pos:'top' },
  { sel:'#btn-bell', t:'Tus avisos', d:'Aquí aparecen los recordatorios amables: lo que quedó a medias y lo que está por vencer. Sin alarmas ni castigos.', pos:'bottom' },
  { sel:'#btn-a11y', t:'Mi forma de aprender', d:'Letra más grande, tipografía legible, alto contraste, menos movimiento y lectura en voz alta.', pos:'bottom' },
  { sel:'#search-input', t:'Busca cualquier cosa', d:'Escribe "mitocondria", "ventrículo" o "fotosíntesis" y llegas directo.', pos:'bottom' },
  { sel:'#crumbs, .view', t:'Si te pierdes, mira el mapa', d:'Arriba siempre sabrás dónde estás y tendrás un enlace al mapa de la plataforma.', pos:'bottom' }
];
function startTour(i){
  const coach = $('#coach'), hole = $('#coach-hole'), card = $('#coach-card');
  let idx = i || 0;
  const end = () => { coach.hidden = true; Store.ses.tour = true; Store.save(); window.removeEventListener('resize', place); window.removeEventListener('scroll', place); };
  function place(){
    const st = TOUR[idx]; const el = st.sel.split(',').map(s=>$(s.trim())).find(Boolean);
    if (!el) return next();
    const r = el.getBoundingClientRect();
    const pad = 6, top = Math.max(4, r.top-pad), left = Math.max(4, r.left-pad);
    Object.assign(hole.style, { top:top+'px', left:left+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px' });
    const cw = Math.min(340, window.innerWidth-24);
    let ct = r.bottom + 14, cl = Math.min(Math.max(12, r.left), window.innerWidth-cw-12);
    if (st.pos==='right' && window.innerWidth>900){ ct = Math.max(12, r.top+16); cl = Math.min(r.right+16, window.innerWidth-cw-12); }
    if (st.pos==='top' || ct + 190 > window.innerHeight) ct = Math.max(12, r.top - 180);
    Object.assign(card.style, { top:ct+'px', left:cl+'px', width:cw+'px' });
  }
  function render(){
    const st = TOUR[idx];
    if (st.go && !location.hash.startsWith(st.go.replace('#',''))) { if (location.hash !== st.go) { navigate(st.go); } }
    card.innerHTML='';
    card.append(h('span',{class:'eyebrow'},`Paso ${idx+1} de ${TOUR.length}`), h('h3',{},st.t), h('p',{},st.d),
      h('div',{class:'row',style:'justify-content:space-between;margin-top:6px'},
        h('button',{class:'btn sm ghost',onclick:end},'Saltar'),
        h('div',{class:'row',style:'gap:6px'},
          idx>0 ? h('button',{class:'btn sm',onclick:()=>{ idx--; render(); }},'←') : null,
          h('button',{class:'btn sm primary',onclick:next}, idx===TOUR.length-1 ? 'Terminar' : 'Siguiente →'))));
    const el = TOUR[idx].sel.split(',').map(s=>$(s.trim())).find(Boolean);
    if (el) el.scrollIntoView({ block:'center', behavior: Store.s.a11y.motion ? 'auto':'smooth' });
    setTimeout(place, 220);
  }
  function next(){ if (idx >= TOUR.length-1) return end(); idx++; render(); }
  coach.hidden = false; render();
  window.addEventListener('resize', place); window.addEventListener('scroll', place, { passive:true });
  coach.onclick = e => { if (e.target === coach) end(); };
  document.addEventListener('keydown', function esc(e){ if (e.key==='Escape'){ end(); document.removeEventListener('keydown', esc); } });
}

/* sugerencia de siguiente paso: primero lo vencido, luego el reto a medias, luego lo no empezado */
function nextStep(){
  const av = Store.avisos();
  const venc = av.find(a=>a.tipo==='vencimiento'); if (venc) return { em:'📌', t:venc.t, d:venc.d || 'Tarea asignada por tu docente.', href:venc.href };
  const reto = av.find(a=>a.tipo==='reto'); if (reto) return { em:'🎯', t:reto.t, d:reto.d, href:reto.href };
  const mine = BIO.areas.filter(a=>Store.areaStatus(a)==='actual');
  const res = mine.flatMap(a=>areaRes(a.id)).find(r => r.ok && r.act && !Store.s.activities[r.act]?.done);
  if (res) return { em:res.em, t:res.t, d:res.reto || res.d, href:res.href };
  return { em:'🗺', t:'Explora tu área', d:'Abre un modelo 3D y cumple su reto.', href: mine[0] ? '#/area/'+mine[0].id : '#/explorar' };
}

<script>
/* =====================================================================
   PANEL DOCENTE: resumen, libro de calificaciones, estudiantes,
   códigos por año y paralelo, adaptaciones NEE, seguimiento y reportes
   ===================================================================== */
const DOC = {
  year: 2, par: 'A',
  prog(){ const p = Store.prog(); return (Store.ses.rol==='docente' && Store.ses.programa) ? Store.ses.programa : p; },
  /* cursos que puede ver: los asignados por la administración o, si no hay, todos los de su asignatura */
  cursosVisibles(){
    const prog = DOC.prog();
    const asign = (Store.ses.docenteId && typeof Admin !== 'undefined') ? Admin.cursosDeDocente(Store.ses.docenteId) : [];
    if (asign.length) return asign;
    const cursos = (typeof Admin !== 'undefined' ? Admin.cursos() : []).filter(c => c.prog === prog);
    if (cursos.length) return cursos;
    return BIO.nivelesDe(prog).flatMap(n => ['A','B'].map(p => ({ id:'v'+n.id+p, prog, nivel:n.id, paralelo:p, virtual:true })));
  },
  nivelesVisibles(){ return [...new Set(DOC.cursosVisibles().map(c => +c.nivel))].sort((a,b)=>a-b); },
  paralelosDe(nivel){ return [...new Set(DOC.cursosVisibles().filter(c=>+c.nivel===+nivel).map(c=>c.paralelo))].sort(); },

      .map(([em,t,d]) => h('div',{class:'stack',style:'gap:4px'}, h('span',{style:'font-size:1.4rem'},em), h('b',{},t), h('p',{class:'small muted'},d))))));

  view.append(h('div',{class:'notice info noprint',style:'margin-top:16px'}, h('span',{},'Con el servidor de la fase 2, este mismo resumen puede llegarle por correo una vez por semana, sin costo. Usted decide si lo quiere recibir.')));
  view.append(h('p',{class:'small muted',style:'margin-top:14px'},'Vista de solo lectura: el representante no puede modificar calificaciones ni actividades. Los datos mostrados corresponden al estudiante de demostración de este navegador.'));

<script>
/* =====================================================================
   VISTA DE ADMINISTRACIÓN · potestad total sobre los dos entornos
   Crea cursos, carga estudiantes, genera usuarios institucionales y
   crea las cuentas de docentes de Ciencias Naturales y de Biología.
   ===================================================================== */
const ADMIN_EMAIL = 'admin@anai.edu.ec';
const Admin = {
  get s(){ const a = Store.s.admin = Store.s.admin || { cursos:[], anio:'2027–2028' }; a.cursos = a.cursos || []; return a; },
  cursos(){ return this.s.cursos; },
  curso(id){ return this.cursos().find(c => c.id===id); },
  cursoDe(nivel, paralelo){ return this.cursos().find(c => +c.nivel===+nivel && c.paralelo===paralelo); },
  crearCurso({prog, nivel, paralelo, docenteId, anio}){
    if (this.cursoDe(nivel, paralelo)) return { ok:false, msg:'Ya existe un curso con ese nivel y paralelo.' };
    const c = { id:`c${Date.now().toString(36)}`, prog, nivel:+nivel, paralelo:String(paralelo).toUpperCase(), docenteId:docenteId||null, anio: anio || this.s.anio, creado:Date.now() };
    this.cursos().push(c); Store.save(); Store.log('admin_curso_creado', { nivel:c.nivel, paralelo:c.paralelo, prog });
    return { ok:true, curso:c };
  },
  borrarCurso(id){ this.s.cursos = this.cursos().filter(c=>c.id!==id); Store.save(); },
  estudiantesDe(c){ return Users.ofCourse(+c.nivel, c.paralelo); },
  /* ---- docentes ---- */
  docentes(){ return Object.values(Store.s.docentes || {}); },
  docente(id){ return (Store.s.docentes||{})[id]; },
  docentesDe(prog){ return this.docentes().filter(d => d.prog===prog); },
  emailDocente(nombres, apellidos){
    const n = sinTildes(String(nombres||'').trim().split(/\s+/)[0] || 'docente').toLowerCase().replace(/[^a-z]/g,'');
    const a = sinTildes(String(apellidos||'').trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z]/g,'');
    let base = a ? `${n}.${a}` : n, email = `${base}@${DOMINIO_DOC}`, i = 2;
    while (this.docentes().some(d => d.email === email)) email = `${base}${i++}@${DOMINIO_DOC}`;
    return email;
  },
  async crearDocente({nombres, apellidos, prog, cursos}){
    const d = Store.s.docentes = Store.s.docentes || {};
    const pass = generarPass(), id = 'd'+Date.now().toString(36);
    d[id] = { id, nombres:capital(nombres), apellidos:capital(apellidos), nombre:(capital(nombres)+' '+capital(apellidos)).trim(),
      email:this.emailDocente(nombres, apellidos), prog, cursos:cursos||[], temp:pass, hash: await hashPass(pass),
      cambiar:true, entregada:false, creado:Date.now(), ultimoAcceso:null };
    Store.save(); Store.log('admin_docente_creado', { prog }); return d[id];
  },
  async resetDocente(id){ const d = this.docente(id); if (!d) return null; const p = generarPass(); d.temp = p; d.hash = await hashPass(p); d.cambiar = true; d.entregada = false; Store.save(); return p; },
  borrarDocente(id){ const d = Store.s.docentes||{}; delete d[id]; Store.save(); },
  asignar(docenteId, cursoId, on){
    const d = this.docente(docenteId); if (!d) return; const set = new Set(d.cursos||[]);
    on ? set.add(cursoId) : set.delete(cursoId); d.cursos = [...set];
    const c = this.curso(cursoId); if (c){ if (on) c.docenteId = docenteId; else if (c.docenteId===docenteId) c.docenteId = null; }
    Store.save();
  },
  cursosDeDocente(id){ const d = this.docente(id); if (!d) return []; return this.cursos().filter(c => (d.cursos||[]).includes(c.id) || c.docenteId===id); },
  /* ---- respaldo ---- */
  respaldo(){ return JSON.stringify({ generado:new Date().toISOString(), anio:this.s.anio, cursos:this.cursos(), docentes:Store.s.docentes||{}, usuarios:Store.s.usuarios||{} }, null, 2); },
  restaurar(txt){ try { const d = JSON.parse(txt); if (d.cursos) this.s.cursos = d.cursos; if (d.docentes) Store.s.docentes = d.docentes; if (d.usuarios) Store.s.usuarios = d.usuarios; if (d.anio) this.s.anio = d.anio; Store.save(); return true; } catch(e){ return false; } }
};
const progPill = p => h('span',{class:'adm-prog '+p}, BIO.programas[p].em, BIO.programas[p].n);

route('/admin', (view, q) => {

  const cursos = Admin.cursos(), est = Users.all(), doc = Admin.docentes();

function admCursos(body, rerender){
  const prog = h('select',{'aria-label':'Entorno'}, Object.values(BIO.programas).map(p=>h('option',{value:p.id},p.n+' · '+p.sub)));

/* ---------- Estudiantes ---------- */
function admEstudiantes(body, rerender){
  const cursos = Admin.cursos();
  if (!cursos.length){ body.append(h('div',{class:'notice warn'},'Primero crea al menos un curso en la pestaña "Cursos".')); }
  const sel = h('select',{'aria-label':'Curso'}, cursos.map(c => h('option',{value:c.id}, `${BIO.nivel(c.nivel).corto} "${c.paralelo}" · ${BIO.programas[c.prog].n}`)));
  const ta = h('textarea',{placeholder:'Pega aquí el listado (código, apellidos, nombres, nivel, paralelo, correo del representante)…',style:'min-height:130px;font-family:var(--font-m);font-size:.8rem'});
  const file = h('input',{type:'file',accept:'.csv,.txt,text/csv',style:'display:none',onchange:e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ ta.value=rd.result; toast(`Archivo "${f.name}" cargado.`); }; rd.readAsText(f,'utf-8'); }});
  const rev = h('div',{class:'stack'});
  let revision = null;
  const cursoActual = () => Admin.curso(sel.value) || cursos[0];
  body.append(h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Cargar el listado de un curso'),
    h('p',{class:'small muted'},'Se reconocen las columnas en cualquier orden. Si el archivo no trae nivel ni paralelo, se usa el curso seleccionado. El usuario de cada estudiante se arma con su código: '+h('b',{}).textContent+`código@${DOMINIO_EST}.`),
    h('div',{class:'adm-form'}, h('label',{},'Curso destino', sel),
      h('div',{class:'row',style:'gap:6px'}, h('button',{class:'btn sm',onclick:()=>file.click()},'Subir CSV'), file,
        h('button',{class:'btn sm ghost',onclick:()=>descargarTexto('plantilla-estudiantes.csv', Users.plantillaCSV())},'Plantilla'),
        h('button',{class:'btn sm ghost',onclick:()=>{ const c = cursoActual(); ta.value = Users.ejemplo().replace(/;2;A;/g, `;${c.nivel};${c.paralelo};`); toast('Ejemplo cargado.'); }},'Ejemplo'))),
    ta,
    h('button',{class:'btn primary',style:'align-self:flex-start',onclick:()=>{ const c = cursoActual(); if (!c) return toast('Crea primero un curso.');
      revision = Users.revisar(ta.value, c.nivel, c.paralelo); pintar(); }},'Revisar listado'), rev));
  function pintar(){
    rev.innerHTML=''; if (!revision) return;
    const { ok, errores } = revision;
    rev.append(h('div',{class:'row'}, h('span',{class:'pill ok'},`${ok.length} listos`), errores.length?h('span',{class:'pill bad'},`${errores.length} con problemas`):null));
    if (errores.length) rev.append(h('div',{class:'notice warn'}, h('span',{}, errores.slice(0,6).map(e=>`fila ${e.fila}: ${e.msg}`).join(' · '))));
    if (ok.length){
      rev.append(h('div',{class:'tablewrap'}, h('table',{class:'data'},
        h('thead',{},h('tr',{},h('th',{},'Código'),h('th',{},'Estudiante'),h('th',{},'Curso'),h('th',{},'Usuario'),h('th',{},'Estado'))),
        h('tbody',{}, ok.slice(0,50).map(f => h('tr',{}, h('td',{class:'mono'},f.codigo), h('td',{},f.nombre),
          h('td',{},`${BIO.nivel(f.year).corto} ${f.paralelo}`), h('td',{class:'mono small'},Users.emailOf(f.codigo)),
          h('td',{}, f.existe?h('span',{class:'pill warn'},'Ya existe'):h('span',{class:'pill ok'},'Nuevo'))))))));
      rev.append(h('button',{class:'btn primary',style:'align-self:flex-start',onclick:async function(){ this.disabled=true;
        const r = await Users.importar(ok); toast(`${r.nuevos} usuarios creados y ${r.actualizados} actualizados.`); revision=null; rerender(); }},'Generar usuarios y contraseñas'));
    }
  }
  /* listado global */
  const est = Users.all();
  if (!est.length) return;
  const filtro = h('select',{'aria-label':'Filtrar por curso',onchange:()=>pintarLista()}, h('option',{value:''},'Todos los cursos'),
    BIO.niveles.map(n => h('option',{value:n.id}, n.n)));
  const cont = h('div',{class:'stack'});
  body.append(h('div',{class:'row',style:'justify-content:space-between;margin:20px 0 8px;flex-wrap:wrap;gap:8px'},
    h('b',{},`Estudiantes con usuario (${est.length})`), h('div',{class:'row',style:'gap:6px'}, filtro,
      h('button',{class:'btn sm',onclick:()=>descargarTexto('credenciales-todos.csv', Users.csvCredenciales(Users.all()))},'Descargar credenciales'))), cont);
  function pintarLista(){
    cont.innerHTML='';
    const l = Users.all().filter(u => !filtro.value || +u.year === +filtro.value).sort((a,b)=> a.year-b.year || a.paralelo.localeCompare(b.paralelo) || a.nombre.localeCompare(b.nombre));
    cont.append(h('div',{class:'tablewrap'}, h('table',{class:'data'},
      h('thead',{},h('tr',{},h('th',{},'Código'),h('th',{},'Estudiante'),h('th',{},'Curso'),h('th',{},'Entorno'),h('th',{},'Usuario'),h('th',{},'Estado'),h('th',{},''))),
      h('tbody',{}, l.map(u => h('tr',{},
        h('td',{class:'mono'},u.codigo), h('td',{}, h('b',{},u.nombre)),
        h('td',{},`${BIO.nivel(u.year).corto} ${u.paralelo}`), h('td',{}, progPill(BIO.progOf(u.year))),
        h('td',{class:'mono small'},u.email),
        h('td',{}, u.entregada?h('span',{class:'pill ok'},'Entregada'):h('span',{class:'pill warn'},'Por entregar')),
        h('td',{style:'white-space:nowrap'}, h('div',{class:'row',style:'gap:6px;flex-wrap:nowrap'},
          h('button',{class:'btn sm ghost',onclick:()=>credModal(u, pintarLista)},'Entregar'),
          h('button',{class:'btn sm ghost',onclick:async()=>{ const p = await Users.resetPass(u.codigo); toast('Nueva contraseña: '+p); pintarLista(); }},'Restablecer')))))))));
  }
  pintarLista();
}

/* ---------- Docentes ---------- */
function admDocentes(body, rerender){
  const nom = h('input',{type:'text',placeholder:'Nombres','aria-label':'Nombres'});
  const ape = h('input',{type:'text',placeholder:'Apellidos','aria-label':'Apellidos'});

  const vista = h('span',{class:'small muted'});
  const actualizar = () => { vista.textContent = (nom.value||ape.value) ? 'Usuario: '+Admin.emailDocente(nom.value, ape.value) : `Usuario: nombre.apellido@${DOMINIO_DOC}`; };
  nom.addEventListener('input', actualizar); ape.addEventListener('input', actualizar); actualizar();
  body.append(h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Crear una cuenta docente'),
    h('p',{class:'small muted'},'Puede haber tantos docentes como haga falta en cada asignatura. Cada docente entra únicamente a su entorno y a los cursos que se le asignen; no administra usuarios.'),
    h('div',{class:'adm-form'}, h('label',{},'Nombres', nom), h('label',{},'Apellidos', ape), h('label',{},'Asignatura', prog),
      h('button',{class:'btn primary',onclick:async function(){ if (!nom.value.trim() || !ape.value.trim()) return toast('Escribe nombres y apellidos.');
        this.disabled = true; const d = await Admin.crearDocente({nombres:nom.value, apellidos:ape.value, prog:prog.value, cursos:[]});
        this.disabled = false; toast(`Cuenta creada: ${d.email}`); credDocenteModal(d, rerender); rerender(); }},'Crear docente')),
    vista));

  if (!ds.length){ body.append(h('div',{class:'ph',style:'margin-top:16px'}, h('b',{},'Todavía no hay docentes. '),'Crea la primera cuenta arriba. Recuerda: el docente no administra la plataforma, solo su asignatura y sus cursos.')); return; }

  const tbl = h('table',{class:'data'}, h('thead',{},h('tr',{},h('th',{},'Docente'),h('th',{},'Asignatura'),h('th',{},'Usuario'),h('th',{},'Cursos asignados'),h('th',{},'Estado'),h('th',{},''))),
    h('tbody',{}, ds.map(d => h('tr',{},
      h('td',{}, h('b',{},d.nombre)),
      h('td',{}, progPill(d.prog)),
      h('td',{class:'mono small'},d.email),
      h('td',{}, cursos.filter(c=>c.prog===d.prog).length
        ? h('div',{class:'row',style:'gap:4px;flex-wrap:wrap'}, cursos.filter(c=>c.prog===d.prog).map(c => {
            const on = (d.cursos||[]).includes(c.id);
            return h('button',{class:'chip'+(on?' picked':''),onclick:()=>{ Admin.asignar(d.id, c.id, !on); rerender(); }}, `${BIO.nivel(c.nivel).corto} ${c.paralelo}`); }))
        : h('span',{class:'small muted'},'Sin cursos de esta asignatura')),
      h('td',{}, d.entregada?h('span',{class:'pill ok'},'Entregada'):h('span',{class:'pill warn'},'Por entregar'),
        d.ultimoAcceso ? h('div',{class:'small muted'},'Ingresó '+timeAgo(d.ultimoAcceso)) : h('div',{class:'small muted'},'Sin ingresar')),
      h('td',{style:'white-space:nowrap'}, h('div',{class:'row',style:'gap:6px;flex-wrap:nowrap'},
        h('button',{class:'btn sm ghost',onclick:()=>credDocenteModal(d, rerender)},'Credenciales'),
        h('button',{class:'btn sm ghost',onclick:async()=>{ await Admin.resetDocente(d.id); rerender(); toast('Contraseña restablecida.'); }},'Restablecer'),
        h('button',{class:'btn sm ghost',onclick:()=>{ if (confirm(`¿Eliminar la cuenta de ${d.nombre}?`)){ Admin.borrarDocente(d.id); rerender(); } }},'Eliminar')))))));
  body.append(h('div',{class:'tablewrap',style:'margin-top:16px'}, tbl));
  body.append(h('p',{class:'small muted',style:'margin-top:10px'},'El docente de Ciencias Naturales solo ve 8.º, 9.º y 10.º de EGB; el de Biología solo ve Bachillerato. Ninguno puede crear usuarios ni cursos.'));
}
function credDocenteModal(d, rerender){
  const txt = `Estimado/a ${d.nombres}, estas son sus credenciales de ANAI BioLab (${BIO.programas[d.prog].n}):\n\nUsuario: ${d.email}\nContraseña temporal: ${d.temp || '(ya la cambió)'}\n\nAl ingresar por primera vez el sistema le pedirá crear su propia contraseña.`;
  const ta = h('textarea',{style:'min-height:130px'}, txt);
  openModal(h('div',{class:'stack'}, h('span',{class:'eyebrow'},'Credenciales de docente'), h('h3',{},d.nombre),
    h('div',{class:'cred-box'}, h('div',{}, h('span',{class:'small muted'},'Usuario'), h('b',{class:'mono'},d.email)), h('div',{}, h('span',{class:'small muted'},'Contraseña temporal'), h('b',{class:'mono'},d.temp||'—'))),
    ta,
    h('div',{class:'row'}, h('a',{class:'btn primary sm',href:`mailto:${d.email}?subject=${encodeURIComponent('Acceso a ANAI BioLab')}&body=${encodeURIComponent(txt)}`,onclick:()=>{ d.entregada=true; Store.save(); }},'Enviar por correo'),
      h('button',{class:'btn sm',onclick:()=>{ copiarTexto(ta.value); d.entregada=true; Store.save(); rerender && rerender(); }},'Copiar'),
      h('button',{class:'btn sm ghost',onclick:closeModal},'Cerrar'))));
}

}

function admAjustes(body, rerender){
  const anio = h('input',{type:'text',value:Admin.s.anio,'aria-label':'Año lectivo'});
  const pass = h('input',{type:'text',value:Store.s.adminPass || 'AnaiAdmin2026','aria-label':'Contraseña de administración'});

    h('div',{class:'adm-form'},

  body.append(h('div',{class:'card stack',style:'margin-top:16px'}, h('span',{class:'eyebrow'},'Acceso de administración'),
    h('div',{class:'adm-form'}, h('label',{},'Usuario', h('input',{type:'text',value:ADMIN_EMAIL,disabled:true})), h('label',{},'Contraseña', pass),
      h('button',{class:'btn sm',onclick:()=>{ if (pass.value.trim().length<8) return toast('Usa al menos 8 caracteres.'); Store.s.adminPass = pass.value.trim(); Store.save(); toast('Contraseña de administración actualizada.'); }},'Cambiar'))));

    h('div',{class:'row',style:'gap:8px;flex-wrap:wrap'},
      h('button',{class:'btn sm',onclick:()=>descargarTexto('respaldo-anai-biolab.json', Admin.respaldo(), 'application/json')},'Descargar respaldo'),
      h('button',{class:'btn sm',onclick:()=>{ const ta = h('textarea',{style:'min-height:200px',placeholder:'Pega aquí el contenido del respaldo…'});
        openModal(h('div',{class:'stack'}, h('h3',{},'Restaurar respaldo'), ta, h('div',{class:'row'},
          h('button',{class:'btn primary sm',onclick:()=>{ if (Admin.restaurar(ta.value)){ closeModal(); rerender(); toast('Respaldo restaurado.'); } else toast('El archivo no es válido.'); }},'Restaurar'),
          h('button',{class:'btn sm ghost',onclick:closeModal},'Cancelar')))); }},'Restaurar respaldo'),
      h('button',{class:'btn sm',onclick:async()=>{ await admDemo(); rerender(); }},'Cargar datos de ejemplo'),
      h('button',{class:'btn sm ghost',onclick:()=>{ if (confirm('¿Borrar cursos, docentes y usuarios cargados? El progreso de demostración no se toca.')){ Admin.s.cursos = []; Store.s.docentes = {}; Users.borrarTodo(); rerender(); toast('Datos borrados.'); } }},'Borrar todo')),
    h('p',{class:'small muted'},'En esta versión de demostración todo se guarda en este navegador. Con el servidor de la fase 2, cursos, usuarios y calificaciones se sincronizan entre dispositivos y el respaldo deja de ser necesario.')));
}
/* datos de ejemplo: dos cursos por entorno con estudiantes y docentes */
async function admDemo(){
  const base = [ {prog:'cn', nivel:8, par:'A'}, {prog:'cn', nivel:9, par:'A'}, {prog:'bio', nivel:2, par:'A'} ];
  for (const b of base){ if (!Admin.cursoDe(b.nivel,b.par)) Admin.crearCurso({prog:b.prog, nivel:b.nivel, paralelo:b.par}); }
  const d1 = Admin.docentes().find(d=>d.prog==='cn') || await Admin.crearDocente({nombres:'Paola', apellidos:'Villacís', prog:'cn', cursos:[]});
  const d2 = Admin.docentes().find(d=>d.prog==='bio') || await Admin.crearDocente({nombres:'Jonathan', apellidos:'Heredia', prog:'bio', cursos:[]});
  Admin.cursos().filter(c=>c.prog==='cn').forEach(c => Admin.asignar(d1.id, c.id, true));
  Admin.cursos().filter(c=>c.prog==='bio').forEach(c => Admin.asignar(d2.id, c.id, true));
  const filas = [];
  const nombres = [['Andrade Mora','Mateo Sebastián'],['Cobo Vera','Valentina Isabel'],['Ríos Salas','Sebastián Andrés'],['Ortiz Palacios','Camila Doménica'],['Paredes Jaramillo','Nicolás'],['Mora Cedeño','Isabella'],['Vaca Espinoza','Emilio José'],['Salas Noboa','Doménica']];
  let cod = 215440;
  Admin.cursos().forEach(c => nombres.forEach(([ap,no]) => filas.push({ codigo:String(cod++), nombres:no, apellidos:ap, nombre:`${ap} ${no}`, year:c.nivel, paralelo:c.paralelo, rep:'', tel:'' })));
  await Users.importar(filas);
  toast('Datos de ejemplo cargados: 3 cursos, 2 docentes y 24 estudiantes.');
}

@media (max-width:860px){.dl-viewer .stage{height:420px}}

</style>
<script>
/* =====================================================================
   CIENCIAS NATURALES · CIENCIAS FÍSICAS · 8.º EGB Superior
   Unidad 1 · Medir la materia: masa, volumen, densidad y presión
   LABORATORIO VIRTUAL: densidad y flotación
   ===================================================================== */
(function(){

/* ---------- datos con valores reales ---------- */
/* v en mL (cm³), m en g → densidad = m/v en g/mL */
const DL_MAT = [
  { id:'corcho',   n:'Corcho',            em:'🟤', v:25, m:6.0,  rho:0.24, col:0xC08B5C, forma:'cil',    nota:'Corteza del alcornoque: hasta la mitad de su volumen es aire atrapado.' },
  { id:'balsa',    n:'Madera de balsa',   em:'🪵', v:40, m:6.4,  rho:0.16, col:0xE0CDA0, forma:'caja',  g:'f',   nota:'La balsa es ecuatoriana: el Ecuador es el principal productor del mundo.' },
  { id:'hielo',    n:'Hielo',             em:'🧊', v:50, m:46.0, rho:0.92, col:0xBFE3EF, forma:'caja',   tr:0.55, nota:'El agua es rarísima: al congelarse se expande, por eso el hielo flota.' },
  { id:'pet',      n:'Plástico PET',      em:'🥤', v:20, m:27.6, rho:1.38, col:0x6FB6D6, forma:'cil',    tr:0.6,  nota:'El PET de las botellas se hunde; por eso se separa del polietileno en agua.' },
  { id:'vidrio',   n:'Vidrio',            em:'🔵', v:16, m:40.0, rho:2.50, col:0xA8CBD2, forma:'esfera', tr:0.62, nota:'Canica de vidrio común (sílice fundida con sosa y cal).' },
  { id:'aluminio', n:'Aluminio',          em:'⬜', v:30, m:81.0, rho:2.70, col:0xC6CBD2, forma:'caja',   met:0.75, nota:'Metal liviano: por eso se usa en aviones, latas y ventanas.' },
  { id:'hierro',   n:'Hierro',            em:'⬛', v:10, m:78.7, rho:7.87, col:0x62676E, forma:'cil',    met:0.8,  nota:'Aunque la pieza es pequeña, pesa más que el bloque de aluminio.' },
  { id:'pomez',    n:'Piedra pómez',      em:'🪨', v:25, m:16.0, rho:0.64, col:0x9C968B, forma:'blob',  g:'f',   nota:'Roca volcánica llena de burbujas de gas: es piedra y, aun así, flota.' }
];
const DL_LIQ = [
  { id:'agua',      n:'Agua dulce',            rho:1.00, col:0x5BB7D6, nota:'Referencia universal: 1 mL de agua tiene una masa de 1 g.' },
  { id:'mar',       n:'Agua de mar',           rho:1.03, col:0x3F97B8, nota:'La sal disuelta añade masa sin añadir casi volumen: por eso flotamos mejor en el mar.' },
  { id:'aceite',    n:'Aceite de cocina',      rho:0.92, col:0xD9B441, nota:'Menos denso que el agua: por eso queda encima en el sartén.' },
  { id:'alcohol',   n:'Alcohol antiséptico',   rho:0.79, col:0xCFE0E8, nota:'Etanol: el líquido menos denso de esta mesa.' },
  { id:'glicerina', n:'Glicerina',             rho:1.26, col:0xCBD79A, nota:'Espesa y densa; se usa en jarabes y jabones.' },
  { id:'salmuera',  n:'Salmuera saturada',     rho:1.20, col:0x9FC8CE, nota:'Agua con toda la sal que puede disolver, como en las salinas de Salinas de Guaranda.' },
  { id:'mercurio',  n:'Mercurio (simulación)', rho:13.53, col:0xB9BEC6, nota:'Metal líquido, tóxico: jamás se manipula en el aula. Aquí solo es una simulación.' }
];
const DL_M = Object.fromEntries(DL_MAT.map(m=>[m.id,m]));
const DL_L = Object.fromEntries(DL_LIQ.map(l=>[l.id,l]));

/* ---------- escala y geometría coherentes ---------- */
const CM_U = 5;                 // 1 unidad de mundo = 5 cm
const U = cm => cm/CM_U;
const TK = { x:-1.8, z:0.55, w:1.6, d:1.0, h:2.4, t:0.055 };   // pecera: 8 cm × 5 cm × 12 cm útiles
const ML_U = (TK.w*CM_U)*(TK.d*CM_U)*CM_U;              // mL por unidad de altura (= 200)
const CAP = ML_U*TK.h;                                  // capacidad (480 mL)
const V0 = 250;                                         // líquido inicial
const BAL = { x:1.3, z:0.55 };                         // balanza
const REP = { z:-1.45, y:2.70 };                        // repisa

/* dimensiones reales de cada pieza a partir de su volumen */
DL_MAT.forEach(o => {
  if (o.forma==='caja'){ const s = Math.cbrt(o.v); o.wid = U(s); o.hgt = U(s); o.dep = U(s); }
  else if (o.forma==='cil'){ const hc = 1.25*Math.cbrt(o.v), rc = Math.sqrt(o.v/(Math.PI*hc)); o.wid = U(2*rc); o.hgt = U(hc); o.dep = o.wid; o.r = U(rc); }
  else { const rc = Math.cbrt(3*o.v/(4*Math.PI)); o.wid = U(2*rc); o.hgt = U(2*rc); o.dep = o.wid; o.r = U(rc); }
});
/* posiciones en la repisa */
(function(){ let x = 0; const gap = 0.16; DL_MAT.forEach(o => { x += o.wid/2; o.rx = x; x += o.wid/2 + gap; }); const tot = x - gap; DL_MAT.forEach(o => { o.rx -= tot/2; o.ry = REP.y + o.hgt/2; }); })();

const dl2 = v => v.toFixed(2).replace('.', ',');
const dl1 = v => v.toFixed(1).replace('.', ',');
const dlEl  = o => (o.g==='f' ? 'la ' : 'el ') + o.n.toLowerCase();      // "el corcho", "la piedra pómez"
const dlDel = o => (o.g==='f' ? 'de la ' : 'del ') + o.n.toLowerCase();  // "del corcho", "de la piedra pómez"
const dlCap = t => t.charAt(0).toUpperCase() + t.slice(1);

route('/cn/lab/densidad', (view) => {
  view.classList.add('wide');
  const ACT = 'cn-lab-densidad';
  const suave = () => motionOK() && !Store.s.a11y.motion;   // ¿se permite animación?

  /* ---------------- estado ---------------- */
  const L = {
    liq: 'agua',
    sel: DL_MAT[0].id,
    ob: Object.fromEntries(DL_MAT.map(o=>[o.id,{ est:'estante', m:null, v:null, dens:false, pred:null }])),
    filas: [],            // {mat, m, v, rho, liq, flota}
    prof: 3,              // profundidad del manómetro en cm
    retoLiq: false,
    retoQuiz: false,
    intentos: 0
  };
  const liq = () => DL_L[L.liq];
  const sel = () => DL_M[L.sel];
  const enLiquido = () => DL_MAT.filter(o => L.ob[o.id].est==='liquido' || L.ob[o.id].est==='midiendo');

  /* resultado físico de un objeto en el líquido actual */
  function frac(o){ return clamp(o.rho/liq().rho, 0, 1); }
  function resultado(o, lq){ const r = (lq||liq()).rho; if (o.rho < r*0.985) return 'flota'; if (o.rho > r*1.015) return 'hunde'; return 'entre'; }
  function desplazado(o){ const st = L.ob[o.id].est; if (st==='midiendo') return o.v; if (st!=='liquido') return 0; return resultado(o)==='flota' ? frac(o)*o.v : o.v; }
  function nivelML(){ return V0 + DL_MAT.reduce((s,o)=>s+desplazado(o), 0); }
  function nivelU(){ return Math.min(nivelML(), CAP)/ML_U; }
  function derrama(){ return nivelML() > CAP; }

  /* posición objetivo de cada objeto (coordenadas de mundo) */
  function posDe(o){
    const st = L.ob[o.id].est;
    if (st==='balanza') return [BAL.x, 0.37 + o.hgt/2, BAL.z];
    if (st==='estante') return [o.rx, o.ry, REP.z];
    const lvl = nivelU(); const dentro = enLiquido(); const i = dentro.indexOf(o), n = dentro.length;
    let dx = 0; if (n>1){ const paso = Math.min(0.5, (TK.w-0.25)/n); dx = (i-(n-1)/2)*paso; }
    const x = TK.x + dx, z = TK.z + ((n>2 && i%2) ? 0.16 : 0);
    if (st==='midiendo') return [x, Math.max(o.hgt/2+0.03, lvl*0.5), z];
    const res = resultado(o);
    if (res==='hunde') return [x, o.hgt/2 + 0.03, z];
    if (res==='entre') return [x, Math.max(o.hgt/2+0.03, lvl*0.55), z];
    return [x, lvl - frac(o)*o.hgt + o.hgt/2, z];
  }

  /* ---------------- encabezado ---------------- */
  view.append(h('div',{class:'page-head',style:'margin-bottom:14px'},
    h('div',{},
      h('span',{class:'eyebrow lab'},'Ciencias Naturales · Ciencias Físicas · 8.º EGB · Unidad 1'),
      h('h1',{},'¿Por qué un barco de acero flota y una canica se hunde?'),
      h('p',{},'Mide la masa en la balanza, mide el volumen por desplazamiento de agua, calcula la densidad y pon a prueba tu predicción. Después cambia el líquido: vas a descubrir que flotar no es una propiedad del objeto.')),
    h('span',{class:'pill lab'},'Laboratorio virtual')));

  /* ---------------- franja propósito · observa · reto ---------------- */
  const retoSt = h('div',{class:'notice'},'Pendiente: hasta ahora el bloque de aluminio se ha hundido en todos los líquidos que probaste.');
  const retoQ = h('div',{});
  view.append(h('section',{class:'reto static'}, h('div',{class:'reto-body'},
    h('div',{class:'reto-col'}, h('span',{class:'eyebrow'},'Propósito'),
      h('p',{},'Comprender que la densidad es una propiedad de cada material (masa dividida para volumen) y que un cuerpo flota cuando su densidad es menor que la del líquido, no cuando “pesa poco”.')),
    h('div',{class:'reto-col'}, h('span',{class:'eyebrow'},'Observa'),
      h('ul',{class:'checks plain'}, [
        'Cuánto sube el nivel del líquido al sumergir cada pieza',
        'Qué parte del objeto queda bajo la superficie cuando flota',
        'Qué le pasa al mismo objeto cuando cambias de líquido',
        'Cómo cambia el manómetro al bajar a más profundidad'
      ].map(t => h('li',{}, h('span',{class:'ck dotck','aria-hidden':'true'}), t)))),
    h('div',{class:'reto-col'}, h('span',{class:'eyebrow'},'🎯 Reto'),
      h('p',{style:'font-weight:600'},'Encuentra un líquido en el que el bloque de aluminio flote y explica por qué no basta con que el objeto sea liviano.'),
      retoSt, retoQ))));

  /* ---------------- escenario ---------------- */
  const stage = h('div',{class:'stage'}), panel = h('div',{class:'panel'});
  view.append(h('div',{class:'viewer dl-viewer'}, stage, panel));

  const nivelTxt = h('span',{class:'stage-note'},'—');
  const balTxt = h('span',{class:'stage-note'},'Balanza: 0,0 g');
  const desTxt = h('span',{class:'stage-note'},'Volumen desplazado: —');
  stage.append(h('div',{class:'stage-top'}, h('span',{class:'pill lab'},'Mesa de laboratorio'), nivelTxt, balTxt, desTxt));
  const avisoEl = h('div',{class:'notice warn',style:'display:none;max-width:420px'});
  stage.append(h('div',{class:'stage-bottom'}, avisoEl));

  /* ---------------- 3D ---------------- */
  let E = null, mallas = {}, aguaMesh = null, manoMesh = null, svg2D = null;
  const anim = {};   // id → {from, to, t, dur, luego}
  const cola = {};   // id → pasos pendientes

  function crearEscena(){
    E = new Engine3D(stage, {
      radius:11.6, phi:1.31, theta:0.24, minR:3.2, maxR:20, target:[-0.25,1.5,-0.1], exposure:0.88, floor:0.012, floorSize:7.5,
      aria:'Mesa de laboratorio en 3D: pecera con líquido, balanza digital y repisa con ocho objetos. Arrastra para rotar. También puedes usar la lista de objetos y los botones del panel.',
      onSelect:(id)=>{ if (id && DL_M[id]) elegir(id, 'modelo'); }
    });
    /* mesa */
    const mesa = new THREE.Mesh(new THREE.BoxGeometry(7.0, 0.18, 3.4), mat(0xC9B79A, {roughness:0.72, clearcoat:0.15}));
    mesa.position.set(0, -0.09, 0); E.addPart('mesa', [mesa], {pickable:false});
    const franja = new THREE.Mesh(new THREE.BoxGeometry(7.0, 0.05, 3.4), mat(0x8F7F68, {roughness:0.8}));
    franja.position.set(0, -0.2, 0); E.addPart('mesa-borde', [franja], {pickable:false});
    /* repisa */
    const tabla = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.1, 0.62), mat(0xB99C77, {roughness:0.7}));
    tabla.position.set(0, REP.y-0.05, REP.z);
    const sopA = new THREE.Mesh(new THREE.BoxGeometry(0.12, REP.y, 0.5), mat(0xA88C6A,{roughness:0.75})); sopA.position.set(-2.55, REP.y/2, REP.z);
    const sopB = sopA.clone(); sopB.position.x = 2.55;
    E.addPart('repisa', [tabla, sopA, sopB], {pickable:false});
    E.addLabel('repisa', 'Repisa de materiales', [0, REP.y+0.95, REP.z]);
    /* pecera de vidrio: fondo + 4 paredes */
    const vidrioM = new THREE.MeshPhysicalMaterial({ color:0xDCEFF4, roughness:0.06, metalness:0, transparent:true, opacity:0.11, clearcoat:1, clearcoatRoughness:0.04, side:THREE.DoubleSide, depthWrite:false });
    const W = TK.w+2*TK.t, D = TK.d+2*TK.t, t = TK.t, paredes = [];
    const fondo = new THREE.Mesh(new THREE.BoxGeometry(W, t, D), vidrioM); fondo.position.set(TK.x, -t/2+0.001, TK.z); paredes.push(fondo);
    [[-(TK.w+t)/2,0],[ (TK.w+t)/2,0]].forEach(([dx]) => { const m2 = new THREE.Mesh(new THREE.BoxGeometry(t, TK.h, D), vidrioM); m2.position.set(TK.x+dx, TK.h/2, TK.z); paredes.push(m2); });
    [[0,-(TK.d+t)/2],[0,(TK.d+t)/2]].forEach(([,dz]) => { const m2 = new THREE.Mesh(new THREE.BoxGeometry(W, TK.h, t), vidrioM); m2.position.set(TK.x, TK.h/2, TK.z+dz); paredes.push(m2); });
    E.addPart('pecera', paredes, {pickable:false, passThrough:true});
    E.addLabel('pecera', 'Probeta graduada', [TK.x, TK.h+0.3, TK.z]);
    /* marcas de graduación cada 100 mL */
    const marcaM = mat(0x5B6770, {roughness:0.6});
    for (let v=100; v<=CAP; v+=100){ const y = v/ML_U; const mk = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.018, 0.02), marcaM); mk.position.set(TK.x - TK.w/2 + 0.13, y, TK.z+TK.d/2+t/2+0.005); E.addPart('marca-'+v, [mk], {pickable:false}); }
    /* líquido */
    const agM = new THREE.MeshPhysicalMaterial({ color:liq().col, roughness:0.08, metalness:0, transparent:true, opacity:0.62, clearcoat:0.9, clearcoatRoughness:0.08, depthWrite:false });
    aguaMesh = new THREE.Mesh(new THREE.BoxGeometry(TK.w, 1, TK.d), agM);
    E.addPart('liquido', [aguaMesh], {pickable:false, passThrough:true});
    /* balanza digital */
    const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.3, 1.0), mat(0x2F3A44,{roughness:0.5, clearcoat:0.6})); cuerpo.position.set(BAL.x, 0.15, BAL.z);
    const plato = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.06, 40), mat(0xD6DCE2,{roughness:0.28, metalness:0.7, clearcoat:0.8})); plato.position.set(BAL.x, 0.33, BAL.z);
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.30, 0.06), mat(0x1C242B,{roughness:0.35})); post.position.set(BAL.x, 0.36, BAL.z-0.56); post.rotation.x = -0.35;
    const pant = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.22), new THREE.MeshBasicMaterial({color:0x9BE8C0})); pant.position.set(BAL.x, 0.365, BAL.z-0.585); pant.rotation.x = -0.35;
    E.addPart('balanza', [cuerpo, plato, post, pant], {pickable:false});
    E.addLabel('balanza', 'Balanza: 0,0 g', [BAL.x, 0.95, BAL.z]);
    /* manómetro (sensor de presión) */
    const vara = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.2, 10), mat(0x8D95A0,{roughness:0.4, metalness:0.5}));
    const disco = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.05, 24), mat(0xE06C4A,{roughness:0.35}));
    E.addPart('manometro', [vara, disco], {pickable:false});
    manoMesh = { vara, disco };
    E.addLabel('manometro', 'Manómetro', [TK.x + TK.w/2 - 0.25, TK.h + 0.75, TK.z]);
    /* objetos */
    DL_MAT.forEach(o => {
      let g;
      if (o.forma==='caja') g = new THREE.BoxGeometry(o.wid, o.hgt, o.dep);
      else if (o.forma==='cil') g = new THREE.CylinderGeometry(o.r, o.r, o.hgt, 26);
      else g = Kit.sculpt({ w:32, h:22, radii:[o.r,o.r,o.r], disp:(p,d)=>o.r*0.16*Kit.fbm(d.x*3.1, d.y*3.1, d.z*3.1, 3) });
      const m2 = new THREE.Mesh(g, mat(o.col, Object.assign({ roughness: o.met ? 0.28 : 0.62, metalness: o.met || 0, clearcoat: o.met ? 0.7 : 0.25 }, o.tr ? { transparent:true, opacity:o.tr } : {})));
      m2.position.set(o.rx, o.ry, REP.z);
      E.addPart(o.id, [m2], { pickable:true });
      E.addLabel(o.id, o.n, [o.rx, o.ry + o.hgt/2 + 0.2, REP.z]);
      mallas[o.id] = m2;
    });
    /* etiquetas siguen a las piezas en movimiento */
    E.onFrame((t2, dt) => {
      DL_MAT.forEach(o => { const l = E.labels.get(o.id), m2 = mallas[o.id]; if (l && m2) l.pos.set(m2.position.x, m2.position.y + o.hgt/2 + 0.2, m2.position.z); });
      pasoAnimacion(dt);
    });
    sincronizar(true);
  }

  /* ---- animación: cola de pasos por objeto ---- */
  function irA(id, to, dur, luego){
    const m2 = mallas[id]; if (!m2){ luego && luego(); return; }
    anim[id] = { from:m2.position.clone(), to:new THREE.Vector3(to[0],to[1],to[2]), t:0, dur: suave() ? dur : 0.001, luego };
  }
  function correr(id, pasos){ cola[id] = pasos.slice(); siguiente(id); }
  function siguiente(id){
    const p = cola[id] && cola[id].shift(); if (!p) return;
    if (typeof p === 'function'){ p(); siguiente(id); }
    else if (p.espera !== undefined){ anim[id] = { espera: suave() ? p.espera : 0.01, t:0, luego:()=>siguiente(id) }; }
    else irA(id, p.to, p.dur, ()=>siguiente(id));
  }
  function pasoAnimacion(dt){
    Object.keys(anim).forEach(id => {
      const a = anim[id]; if (!a) return;
      a.t += dt;
      if (a.espera !== undefined){ if (a.t >= a.espera){ delete anim[id]; a.luego && a.luego(); } return; }
      if (!mallas[id]){ delete anim[id]; a.luego && a.luego(); return; }
      const k = Math.min(1, a.t/a.dur), e = k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      mallas[id].position.lerpVectors(a.from, a.to, e);
      if (k>=1){ delete anim[id]; a.luego && a.luego(); }
    });
  }

  /* ---- sincronizar la escena con el estado ---- */
  function sincronizar(inmediato){
    const lvl = nivelU();
    if (aguaMesh){
      aguaMesh.scale.y = Math.max(0.001, lvl); aguaMesh.position.set(TK.x, lvl/2, TK.z);
      aguaMesh.material.color.set(liq().col); aguaMesh.material.opacity = L.liq==='mercurio' ? 0.95 : 0.62;
      aguaMesh.material.metalness = L.liq==='mercurio' ? 0.9 : 0;
      aguaMesh.material.roughness = L.liq==='mercurio' ? 0.12 : 0.08;
    }
    if (manoMesh){ const y = Math.max(0.05, lvl - U(L.prof)); manoMesh.disco.position.set(TK.x + TK.w/2 - 0.22, y, TK.z-0.3); manoMesh.vara.position.set(TK.x + TK.w/2 - 0.22, y + 1.15, TK.z-0.3); }
    DL_MAT.forEach(o => { if (!mallas[o.id]) return; if (inmediato || (!anim[o.id] && !(cola[o.id]||[]).length)) { const p = posDe(o); if (inmediato) mallas[o.id].position.set(p[0],p[1],p[2]); else irA(o.id, p, 0.5); } });
    const ml = nivelML();
    nivelTxt.textContent = `Nivel: ${dl1(Math.min(ml,CAP))} mL de ${liq().n.toLowerCase()}`;
    avisoEl.style.display = derrama() ? 'flex' : 'none';
    if (derrama()) avisoEl.textContent = `Se derramaría: la probeta solo tiene ${CAP} mL. Devuelve alguna pieza a la repisa.`;
    dibujar2D(); actualizarPresion(); renderTabla();
  }

  /* ---------------- alternativa 2D (sin WebGL) ---------------- */
  function crear2D(){
    const box = h('div',{class:'ph',style:'padding:10px'});
    box.append(h('p',{class:'small muted',style:'margin-bottom:8px'},'Tu dispositivo no puede mostrar gráficos 3D. Este esquema en 2D hace exactamente lo mismo: los datos, las mediciones, el cálculo y la tabla son idénticos.'));
    const ns = 'http://www.w3.org/2000/svg';
    const el = document.createElementNS(ns,'svg'); el.setAttribute('viewBox','0 0 640 400'); el.setAttribute('class','dl-svg'); el.setAttribute('role','img'); el.setAttribute('aria-label','Esquema de la mesa de laboratorio con la probeta, la balanza y la repisa de materiales');
    box.append(el); stage.append(box); svg2D = el;
    dibujar2D();
    el.addEventListener('click', e => { const t2 = e.target.closest('[data-id]'); if (t2) elegir(t2.dataset.id, 'esquema'); });
  }
  function dibujar2D(){
    if (!svg2D) return;
    const lvl = Math.min(nivelML(), CAP)/CAP;            // 0..1 de la altura útil
    const TX=40, TY=110, TW=150, TH=250;                 // probeta
    const px = v => TX + v, py = v => TY + v;
    let s = '';
    s += `<rect x="0" y="0" width="640" height="400" fill="var(--bg-2)"/>`;
    s += `<rect x="10" y="360" width="620" height="18" rx="4" fill="var(--line-2)"/>`;
    /* probeta */
    s += `<rect x="${TX}" y="${TY}" width="${TW}" height="${TH}" fill="none" stroke="var(--ink-3)" stroke-width="3"/>`;
    const hAgua = TH*lvl;
    s += `<rect x="${TX+2}" y="${TY+TH-hAgua}" width="${TW-4}" height="${hAgua}" fill="${'#'+liq().col.toString(16).padStart(6,'0')}" opacity="0.55"/>`;
    s += `<line x1="${TX+2}" y1="${TY+TH-hAgua}" x2="${TX+TW-2}" y2="${TY+TH-hAgua}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<text x="${TX+TW+8}" y="${TY+TH-hAgua+4}" font-size="13" fill="var(--ink-2)">${dl1(Math.min(nivelML(),CAP))} mL</text>`;
    s += `<text x="${TX}" y="${TY-10}" font-size="13" font-weight="700" fill="var(--ink)">Probeta · ${liq().n}</text>`;
    /* objetos dentro */
    const dentro = enLiquido();
    dentro.forEach((o,i) => {
      const w = 22 + o.v*0.5, res = resultado(o), f = frac(o);
      const cx = TX + TW/2 + (i-(dentro.length-1)/2)*36;
      const alto = 20 + o.v*0.35;
      let top;
      if (L.ob[o.id].est==='midiendo') top = TY+TH-hAgua + hAgua*0.4;
      else if (res==='hunde') top = TY+TH-alto-3;
      else if (res==='entre') top = TY+TH-hAgua+hAgua*0.45;
      else top = TY+TH-hAgua - alto*(1-f);
      s += `<rect data-id="${o.id}" x="${cx-w/2}" y="${top}" width="${w}" height="${alto}" rx="4" fill="#${o.col.toString(16).padStart(6,'0')}" stroke="var(--ink)" stroke-width="${L.sel===o.id?3:1}"><title>${esc(o.n)} · ${esc(NOMBRE_RES[res])}</title></rect>`;
    });
    /* balanza */
    s += `<rect x="260" y="300" width="130" height="30" rx="6" fill="var(--ink-3)"/><rect x="275" y="288" width="100" height="12" rx="3" fill="var(--line-2)"/>`;
    const B = DL_MAT.find(o=>L.ob[o.id].est==='balanza');
    s += `<rect x="285" y="255" width="80" height="26" rx="4" fill="#0F2A22"/><text x="325" y="273" font-size="15" font-family="monospace" fill="#8FE9BE" text-anchor="middle">${B?dl1(B.m):'0,0'} g</text>`;
    if (B) s += `<rect x="300" y="282" width="50" height="6" rx="3" fill="#${B.col.toString(16).padStart(6,'0')}"/>`;
    s += `<text x="325" y="348" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle">Balanza digital</text>`;
    /* repisa */
    s += `<rect x="255" y="120" width="370" height="8" rx="3" fill="var(--line-2)"/><text x="255" y="108" font-size="13" font-weight="700" fill="var(--ink)">Repisa de materiales</text>`;
    let ex = 262;
    DL_MAT.forEach(o => {
      if (L.ob[o.id].est!=='estante'){ ex += 44; return; }
      const w = 30, alto = 22 + o.v*0.2;
      s += `<rect data-id="${o.id}" x="${ex}" y="${120-alto}" width="${w}" height="${alto}" rx="4" fill="#${o.col.toString(16).padStart(6,'0')}" stroke="var(--ink)" stroke-width="${L.sel===o.id?3:1}"><title>${esc(o.n)}</title></rect>`;
      ex += 44;
    });
    /* manómetro */
    const my = TY + TH - hAgua + (TH*U(L.prof)/TK.h);
    s += `<line x1="${TX+TW-26}" y1="${TY-6}" x2="${TX+TW-26}" y2="${Math.min(my,TY+TH-4)}" stroke="var(--ink-3)" stroke-width="3"/>`;
    s += `<circle cx="${TX+TW-26}" cy="${Math.min(my,TY+TH-4)}" r="7" fill="var(--bad)"/>`;
    svg2D.innerHTML = s;
  }

  /* ---------------- acciones ---------------- */
  function elegir(id, origen){ if (!DL_M[id]) return; L.sel = id; densInp.value = ''; densFB.style.display = 'none'; if (E) E.select(id); Store.log('laboratorio',{lab:'densidad', accion:'seleccionar', material:id, origen:origen||'panel'}); sincronizar(); renderPanel(); }

  function pesar(){
    const o = sel(), st = L.ob[o.id];
    if (st.est==='midiendo') return toast('Espera a que termine la medición de volumen.');
    const previo = DL_MAT.find(x => x.id!==o.id && L.ob[x.id].est==='balanza');
    if (previo){ L.ob[previo.id].est = 'estante'; const p = posDe(previo); correr(previo.id, [{to:[previo.rx, previo.ry+0.5, previo.z||REP.z], dur:0.35},{to:p, dur:0.35}]); }
    st.est = 'balanza'; st.m = o.m;
    balTxt.textContent = 'Balanza: pesando…';
    const destino = posDe(o);
    correr(o.id, [ {to:[mallas[o.id]?mallas[o.id].position.x:0, 1.9, mallas[o.id]?mallas[o.id].position.z:0], dur:0.4}, {to:[destino[0], 1.9, destino[2]], dur:0.5}, {to:destino, dur:0.5}, ()=>{ balTxt.textContent = `Balanza: ${dl1(o.m)} g`; const lb = E && E.labels.get('balanza'); if (lb) lb.el.textContent = `Balanza: ${dl1(o.m)} g`; toast(`La balanza marca ${dl1(o.m)} g.`); sincronizar(); renderPanel(); } ]);
    Store.log('laboratorio',{lab:'densidad', accion:'pesar', material:o.id, masa:o.m});
    sincronizar(); renderPanel();
  }

  function medirVolumen(){
    const o = sel(), st = L.ob[o.id];
    if (st.est==='midiendo') return;
    if (nivelML() + o.v > CAP) return toast('No cabe: el líquido se derramaría. Devuelve alguna pieza a la repisa.');
    const antes = nivelML();
    st.est = 'midiendo';
    const dentroPos = posDe(o);
    desTxt.textContent = 'Midiendo…';
    correr(o.id, [
      {to:[mallas[o.id]?mallas[o.id].position.x:0, TK.h+0.5, mallas[o.id]?mallas[o.id].position.z:0], dur:0.4},
      {to:[TK.x, TK.h+0.5, TK.z], dur:0.5},
      {to:dentroPos, dur:0.7},
      ()=>{ st.v = o.v; const despues = nivelML();
        desTxt.textContent = `Volumen desplazado: ${dl1(despues-antes)} mL (de ${dl1(antes)} a ${dl1(despues)} mL)`;
        toast(`El nivel subió de ${dl1(antes)} a ${dl1(despues)} mL: el volumen del objeto es ${dl1(o.v)} mL.`);
        Store.log('laboratorio',{lab:'densidad', accion:'medir_volumen', material:o.id, volumen:o.v});
        sincronizar(); renderPanel(); },
      {espera:1.6},
      ()=>{ st.est='estante'; sincronizar(); renderPanel(); },
      {to:[TK.x, TK.h+0.5, TK.z], dur:0.6},
      {to:[o.rx, o.ry+0.35, REP.z], dur:0.5},
      {to:[o.rx, o.ry, REP.z], dur:0.3},
      ()=>{ sincronizar(); renderPanel(); }
    ]);
    sincronizar();
  }

  function soltar(){
    const o = sel(), st = L.ob[o.id];
    if (st.est==='liquido') return toast('Esta pieza ya está en el líquido.');
    if (!st.pred) return toast('Antes de soltar, escribe tu predicción: ¿flota, se hunde o queda entre dos aguas?');
    if (nivelML() + o.v > CAP) return toast('No cabe: el líquido se derramaría. Devuelve alguna pieza a la repisa.');
    st.est = 'liquido';
    const destino = posDe(o);
    correr(o.id, [
      {to:[mallas[o.id]?mallas[o.id].position.x:0, TK.h+0.5, mallas[o.id]?mallas[o.id].position.z:0], dur:0.35},
      {to:[destino[0], TK.h+0.5, destino[2]], dur:0.45},
      {to:[destino[0], destino[1]-0.35, destino[2]], dur:0.55},   // se hunde de más por la inercia
      {to:destino, dur:0.5},
      ()=>{ evaluarPrediccion(o); sincronizar(); renderPanel(); }
    ]);
    sincronizar();
  }

  function devolver(){
    const o = sel(), st = L.ob[o.id];
    if (st.est==='estante') return toast('Esta pieza ya está en la repisa.');
    st.est = 'estante'; st.pred = null;
    if (balTxt.textContent.indexOf(dl1(o.m))>=0){ balTxt.textContent = 'Balanza: 0,0 g'; const lb = E && E.labels.get('balanza'); if (lb) lb.el.textContent = 'Balanza: 0,0 g'; }
    correr(o.id, [{to:[mallas[o.id]?mallas[o.id].position.x:0, TK.h+0.5, mallas[o.id]?mallas[o.id].position.z:0], dur:0.45}, {to:[o.rx, o.ry, REP.z], dur:0.55}, ()=>{ sincronizar(); renderPanel(); }]);
    sincronizar();
  }

  const NOMBRE_RES = { flota:'flota', hunde:'se hunde', entre:'queda entre dos aguas' };
  function evaluarPrediccion(o){
    const st = L.ob[o.id], res = resultado(o), lq = liq(), f = frac(o);
    const acerto = st.pred === res;
    const detalle = res==='flota'
      ? `${dlCap(dlEl(o))} tiene una densidad de ${dl2(o.rho)} g/mL y el líquido ${dl2(lq.rho)} g/mL. Como el objeto es menos denso, flota con el ${Math.round(f*100)} % de su volumen sumergido y el ${Math.round((1-f)*100)} % fuera.`
      : res==='hunde'
        ? `${dlCap(dlEl(o))} tiene ${dl2(o.rho)} g/mL y el líquido ${dl2(lq.rho)} g/mL. Al ser más denso, el empuje no alcanza a sostenerlo y se va al fondo.`
        : `Las densidades son prácticamente iguales (${dl2(o.rho)} g/mL y ${dl2(lq.rho)} g/mL): el objeto queda suspendido, ni sube ni baja. A esto se le dice flotabilidad neutra.`;
    predFB.className = 'notice ' + (acerto ? 'ok' : 'warn');
    predFB.innerHTML = `<span><b>${acerto ? 'Tu predicción se cumplió: ' : 'Tu predicción decía “'+NOMBRE_RES[st.pred]+'”, pero '}</b>${acerto?'':'el resultado es que '}<b>${NOMBRE_RES[res]}</b>. ${esc(detalle)}</span>`;
    predFB.style.display = 'flex';
    L.filas.push({ mat:o.n, id:o.id, m:o.m, v:o.v, rho:o.rho, liq:lq.n, res });
    Store.log('laboratorio',{lab:'densidad', accion:'soltar', material:o.id, liquido:L.liq, prediccion:st.pred, resultado:res, acerto});
    if (o.id==='aluminio' && res!=='hunde' && !L.retoLiq){
      L.retoLiq = true;
      retoSt.className = 'notice ok';
      retoSt.innerHTML = `<span><b>¡Lo encontraste!</b> El aluminio (${dl2(o.rho)} g/mL) flota en ${lq.n.toLowerCase()} (${dl2(lq.rho)} g/mL). No cambió el objeto: cambió con qué lo comparamos. Ahora responde la pregunta para cerrar el reto.</span>`;
      mostrarQuiz();
    }
    renderTabla();
  }

  /* ---------------- panel ---------------- */

  function actualizarPresion(){
    if (!presA) return;
    const maxProf = Math.max(1, Math.round(Math.min(nivelML(),CAP)/ML_U*CM_U));
    if (+presProf.max !== maxProf) presProf.max = maxProf;
    const prof = Math.min(L.prof, maxProf);
    presOut.value = dl1(prof)+' cm';
    const p = liq().rho*1000 * 9.8 * (prof/100);
    presA.innerHTML = ''; presA.append(dl1(p/1000), ' ', h('span',{class:'u'},'kPa'));
    presB.innerHTML = ''; presB.append(dl1(p/1000 + 72), ' ', h('span',{class:'u'},'kPa'));
  }

    cardLiq.innerHTML = '';

    cardLiq.append(h('span',{class:'eyebrow lab'},'1 · Líquido de la probeta'), chips, h('p',{class:'small muted'}, liq().nota), h('div',{class:'dl-read'},
      h('div',{class:'readout'}, h('div',{class:'v'}, dl2(liq().rho), ' ', h('span',{class:'u'},'g/mL')), h('div',{class:'l'},'Densidad del líquido')),
      h('div',{class:'readout'}, h('div',{class:'v'}, dl1(Math.min(nivelML(),CAP)), ' ', h('span',{class:'u'},'mL')), h('div',{class:'l'},'Nivel actual'))));

    /* objetos */
    cardObj.innerHTML = '';
    const lista = h('div',{class:'dl-objs',role:'group','aria-label':'Objetos disponibles'});
    DL_MAT.forEach(o => {
      const st = L.ob[o.id];

        h('span',{class:'sw',style:`background:#${o.col.toString(16).padStart(6,'0')}`}), h('span',{}, o.em+' '+o.n, h('span',{class:'st'}, etiqueta))));
    });

    /* acciones */
    cardAcc.innerHTML = '';
    const o = sel(), st = L.ob[o.id];
    const pred = h('div',{class:'dl-pred'});
    [['flota','Flotará'],['entre','Quedará entre dos aguas'],['hunde','Se hundirá']].forEach(([k,t]) => pred.append(h('button',{class:'chip'+(st.pred===k?' picked':''),'aria-pressed':st.pred===k,'aria-label':`Predecir que ${t.toLowerCase()}`,onclick:()=>{ st.pred=k; Store.log('laboratorio',{lab:'densidad',accion:'predecir',material:o.id,liquido:L.liq,prediccion:k}); renderPanel(); }}, t)));
    cardAcc.append(h('span',{class:'eyebrow lab'},'3 · Mide y predice'),
      h('div',{class:'row'},
        h('button',{class:'btn sm','aria-label':`Pesar ${dlEl(o)} en la balanza`,onclick:pesar}, '⚖️ Pesar'),
        h('button',{class:'btn sm','aria-label':`Medir el volumen ${dlDel(o)} por desplazamiento de agua`,onclick:medirVolumen}, '💧 Medir volumen'),
        h('button',{class:'btn sm','aria-label':`Devolver ${dlEl(o)} a la repisa`,onclick:devolver}, '↩︎ Devolver')),
      h('div',{class:'dl-read'},
        h('div',{class:'readout'}, h('div',{class:'v'}, st.m===null?'—':dl1(st.m), ' ', h('span',{class:'u'},'g')), h('div',{class:'l'},'Masa medida')),
        h('div',{class:'readout'}, h('div',{class:'v'}, st.v===null?'—':dl1(st.v), ' ', h('span',{class:'u'},'mL')), h('div',{class:'l'},'Volumen medido'))),
      h('p',{class:'small',style:'font-weight:600;margin-top:2px'},'Antes de soltarlo, ¿qué va a pasar en ', liq().n.toLowerCase(), '?'),
      pred,
      h('button',{class:'btn primary sm',style:'align-self:flex-start','aria-label':`Soltar ${dlEl(o)} en el líquido`,onclick:soltar}, '🫳 Soltar en el líquido'),
      predFB);

    /* densidad */
    cardDens.innerHTML = '';
    cardDens.append(h('span',{class:'eyebrow lab'},'4 · Calcula la densidad'),
      h('p',{class:'small muted'},'Densidad = masa dividida para volumen. Escribe el resultado en g/mL con coma decimal; se acepta un margen del 5 %.'),
      h('div',{class:'field'}, h('label',{for:'dl-dens'}, `Densidad ${dlDel(o)} (g/mL)`), densInp),
      h('button',{class:'btn sm',style:'align-self:flex-start','aria-label':'Comprobar la densidad calculada',onclick:comprobarDensidad},'Comprobar'),
      densFB);
    if (L.ob[o.id].dens){ densFB.className='notice ok'; densFB.innerHTML = `<span><b>Correcto.</b> La densidad ${esc(dlDel(o))} es ${dl2(o.rho)} g/mL.</span>`; densFB.style.display='flex'; }

    /* presión */
    cardPres.innerHTML = '';
    const maxProf = Math.max(1, Math.round(Math.min(nivelML(),CAP)/ML_U*CM_U));
    presProf = h('input',{type:'range',min:0,max:maxProf,step:0.5,value:Math.min(L.prof,maxProf),id:'dl-prof','aria-label':'Profundidad del manómetro en centímetros'});
    presOut = h('output',{}, dl1(Math.min(L.prof,maxProf))+' cm');
    presProf.addEventListener('input',()=>{ L.prof = +presProf.value; sincronizar(); });
    presA = h('div',{class:'v'}); presB = h('div',{class:'v'});
    cardPres.append(h('span',{class:'eyebrow lab'},'5 · Presión en el líquido'),
      h('div',{class:'slider'}, h('label',{for:'dl-prof'},'Profundidad del manómetro'), presOut, presProf),
      h('div',{class:'dl-read'},
        h('div',{class:'readout'}, presA, h('div',{class:'l'},'Presión del líquido')),
        h('div',{class:'readout'}, presB, h('div',{class:'l'},'Total con la atmósfera de Quito'))),
      h('p',{class:'dl-hint'},'p = densidad × gravedad × profundidad  ·  g = 9,8 m/s²  ·  atmósfera en Quito ≈ 72 kPa'),
      h('p',{class:'small muted'},'La presión no depende de la forma del recipiente ni de cuánta agua haya: solo de la profundidad y de la densidad del líquido.'));
    actualizarPresion();
  }

  function cambiarLiquido(id){
    if (L.liq===id) return;
    L.liq = id;
    predFB.style.display = 'none';
    Store.log('laboratorio',{lab:'densidad', accion:'cambiar_liquido', liquido:id});
    const reacomoda = enLiquido();
    sincronizar(); renderPanel();
    if (reacomoda.length){
      const resumen = reacomoda.map(o => `${dlEl(o)} ${NOMBRE_RES[resultado(o)]}`).join('; ');
      toast(`En ${DL_L[id].n.toLowerCase()}: ${resumen}.`);
      reacomoda.forEach(o => { if (L.ob[o.id].est!=='liquido') return; const fila = L.filas.find(f2 => f2.id===o.id && f2.liq===DL_L[id].n); if (!fila) L.filas.push({ mat:o.n, id:o.id, m:o.m, v:o.v, rho:o.rho, liq:DL_L[id].n, res:resultado(o) }); });
      const al = reacomoda.find(o=>o.id==='aluminio');
      if (al && resultado(al)!=='hunde' && !L.retoLiq){ L.retoLiq = true; retoSt.className='notice ok'; retoSt.innerHTML = `<span><b>¡Lo encontraste!</b> El aluminio (2,70 g/mL) flota en ${DL_L[id].n.toLowerCase()} (${dl2(DL_L[id].rho)} g/mL). No cambió el objeto: cambió con qué lo comparamos.</span>`; mostrarQuiz(); }
      renderTabla();
    }
  }

  function comprobarDensidad(){
    const o = sel(), st = L.ob[o.id];
    if (st.m===null || st.v===null) return toast('Primero pesa el objeto y mide su volumen.');
    const txt = String(densInp.value).trim().replace(',', '.');
    const d = parseFloat(txt);
    if (!isFinite(d)) { densFB.className='notice warn'; densFB.innerHTML='<span><b>Escribe un número.</b> Por ejemplo 2,70 (con coma decimal).</span>'; densFB.style.display='flex'; return; }
    const ok = st.m/st.v, inv = st.v/st.m;
    L.intentos++;
    const cerca = (a,b) => Math.abs(a-b) <= 0.05*Math.abs(b);
    let clase='warn', msg;
    if (cerca(d, ok)){
      clase='ok'; st.dens = true;
      msg = `<b>Correcto.</b> ${dl1(st.m)} g ÷ ${dl1(st.v)} mL = ${dl2(ok)} g/mL. Esa es la densidad ${esc(dlDel(o))} y no cambia aunque cortes la pieza en dos: es una propiedad del material.`;
      Store.log('laboratorio',{lab:'densidad', accion:'densidad_ok', material:o.id, intentos:L.intentos});
    } else if (cerca(d, inv)){
      msg = `<b>Dividiste al revés.</b> Pusiste volumen ÷ masa (${dl1(st.v)} ÷ ${dl1(st.m)}). La densidad responde “¿cuántos gramos hay en cada mililitro?”, así que va masa ÷ volumen: ${dl1(st.m)} ÷ ${dl1(st.v)}.`;
    } else if (cerca(d, ok*1000)){
      msg = `<b>Ese valor está en otras unidades.</b> ${dl1(ok*1000)} es la densidad en kg/m³. Aquí la balanza da gramos y la probeta mililitros, así que el resultado va en g/mL: divide y quedará ${dl2(ok)}.`;
    } else if (cerca(d, ok/1000)){
      msg = `<b>Te sobró una división entre mil.</b> No hace falta convertir: los datos ya están en g y en mL, así que el resultado sale directo en g/mL (${dl2(ok)}).`;
    } else if (cerca(d, st.m-st.v) && Math.abs(st.m-st.v)>0.5){
      msg = `<b>Restaste en lugar de dividir.</b> La densidad no es “masa menos volumen”: es cuántos gramos caben en cada mililitro, o sea una división.`;
    } else if (cerca(d, st.m)){
      msg = `<b>Ese es el valor de la masa, no de la densidad.</b> Falta dividir esa masa para los ${dl1(st.v)} mL que ocupa.`;
    } else {
      msg = `<b>Revisa la operación.</b> Tienes ${dl1(st.m)} g y ${dl1(st.v)} mL. Haz ${dl1(st.m)} ÷ ${dl1(st.v)} y redondea a dos decimales; recuerda escribirlo con coma decimal.`;
    }
    densFB.className = 'notice '+clase; densFB.innerHTML = '<span>'+msg+'</span>'; densFB.style.display='flex';
    Store.log('laboratorio',{lab:'densidad', accion:'densidad_intento', material:o.id, valor:d, correcto:clase==='ok'});
  }

  /* ---------------- tabla, gráfico y cuaderno ---------------- */
  const tablaWrap = h('div',{class:'tablewrap'});
  const chartWrap = h('div',{class:'card',style:'padding:12px'});
  const chart = h('canvas',{class:'chart',style:'height:260px'});
  chartWrap.append(h('span',{class:'eyebrow lab'},'Masa (g) frente a volumen (mL): cada material es una recta y su pendiente es su densidad'), chart);
  const guardar = h('button',{class:'btn sm',style:'align-self:flex-start','aria-label':'Guardar la tabla de datos en el cuaderno de campo',onclick:()=>{
    if (!L.filas.length) return toast('Todavía no has soltado ninguna pieza en el líquido.');
    const txt = 'Lab densidad y flotación · ' + L.filas.map(f2 => `${f2.mat}: ${dl1(f2.m)} g, ${dl1(f2.v)} mL, ${dl2(f2.rho)} g/mL, en ${f2.liq.toLowerCase()} ${NOMBRE_RES[f2.res]}`).join(' | ');
    Store.addNote('resultado', txt);
    toast('Tabla guardada en tu cuaderno de campo.');
    Store.log('laboratorio',{lab:'densidad', accion:'guardar_tabla', filas:L.filas.length});
  }},'📓 Guardar la tabla en el cuaderno');

  function renderTabla(){
    tablaWrap.innerHTML = '';
    if (!L.filas.length){ tablaWrap.append(h('div',{class:'ph'},'Aún no hay datos. Pesa una pieza, mide su volumen, predice y suéltala: cada ensayo se registra aquí.')); dibujarChart(); return; }
    const t2 = h('table',{class:'data'},
      h('thead',{}, h('tr',{}, h('th',{},'#'), h('th',{},'Material'), h('th',{},'Masa (g)'), h('th',{},'Volumen (mL)'), h('th',{},'Densidad (g/mL)'), h('th',{},'Líquido'), h('th',{},'¿Qué pasó?'))),
      h('tbody',{}, L.filas.map((f2,i) => h('tr',{},
        h('td',{class:'num'}, i+1), h('td',{}, f2.mat),
        h('td',{class:'num'}, f2.m===null?'—':dl1(f2.m)), h('td',{class:'num'}, f2.v===null?'—':dl1(f2.v)),
        h('td',{class:'num'}, h('b',{}, dl2(f2.rho))), h('td',{}, f2.liq),
        h('td',{}, h('span',{class:'pill '+(f2.res==='flota'?'ok':f2.res==='hunde'?'bad':'warn')}, f2.res==='flota'?'▲ flotó':f2.res==='hunde'?'▼ se hundió':'◆ entre dos aguas'))))));
    tablaWrap.append(t2);
    dibujarChart();
  }
  const COLS = ['--lab','--accent','--eco','--gen','--mis','--anat','--cell','--warn'];
  function dibujarChart(){
    const usados = [];
    L.filas.forEach(f2 => { if (f2.m===null || f2.v===null) return; if (!usados.some(u=>u.id===f2.id)) usados.push(f2); });
    const series = usados.map((f2,i) => { const xf = Math.min(60, 100/f2.rho); return { label:f2.mat, color:cssVar(COLS[i%COLS.length])||'#4A90A4', dots:true, pts:[{x:0,y:0},{x:f2.v,y:f2.m},{x:xf,y:f2.rho*xf}].sort((a,b)=>a.x-b.x) }; });
    series.push({ label:'Agua (1,00 g/mL)', color:cssVar('--ink-3')||'#8A8A8A', pts:[{x:0,y:0},{x:60,y:60}] });
    lineChart(chart, { series, xmin:0, xmax:60, ymin:0, ymax:100, xlabel:'volumen (mL)', ylabel:'masa (g)', xfmt:v=>Math.round(v), yfmt:v=>Math.round(v), xticks:6 });
  }

  /* ---------------- reto: pregunta ---------------- */
  let quizPuesto = false;
  function mostrarQuiz(){
    if (quizPuesto) return; quizPuesto = true;
    retoQ.append(quizBlock({
      q:'El mismo bloque de aluminio se hunde en el agua y flota en el mercurio. ¿Por qué?',
      ops:[
        'Porque los metales siempre se hunden en el agua y el mercurio es la única excepción, ya que también es metal',
        'Porque flotar depende de comparar densidades: el aluminio (2,70 g/mL) es más denso que el agua (1,00 g/mL) pero menos denso que el mercurio (13,53 g/mL)',
        'Porque el bloque de aluminio es liviano y el mercurio es un líquido muy pesado que lo empuja hacia arriba'
      ],
      ok:1,
      fb:'Flotar no es una propiedad del objeto: es una relación entre dos densidades. Si la densidad del objeto es menor que la del líquido, flota; si es mayor, se hunde; si son iguales, queda entre dos aguas. Por eso un barco de acero flota: su casco encierra aire y la densidad promedio del conjunto baja por debajo de 1,00 g/mL.',
      wrong:[
        'No es cuestión de ser metal: la piedra pómez no es metal y flota, y el vidrio tampoco lo es y se hunde. Además el aluminio también flota en un líquido no metálico si este fuera más denso que 2,70 g/mL. Lo que decide es la comparación de densidades.',
        'Cuidado con “liviano”: el bloque de aluminio (81,0 g) es más pesado que el trozo de hielo (46,0 g) y aun así el hielo flota en agua y el aluminio no. Lo que importa no es la masa sola, sino cuánta masa hay en cada mililitro.'
      ]
    }, (intentos) => {
      L.retoQuiz = true;
      Store.completeActivity(ACT, { score: intentos===1 ? '1.er intento' : `${intentos} intentos`, attempts: intentos });
      Store.log('laboratorio',{lab:'densidad', accion:'reto_resuelto', intentos});
      retoQ.append(h('div',{class:'notice ok'},'Reto resuelto y guardado en tu progreso. Prueba ahora con el hielo en aceite: las densidades son casi iguales.'));
    }));
  }

  /* ---------------- montaje final ---------------- */
  view.append(h('div',{style:'height:16px'}),
    h('div',{class:'grid g2'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow lab'},'Tabla de datos'), tablaWrap, guardar),
      chartWrap));

  let raf2D = null;
  if (webglOK){ try { crearEscena(); } catch(e){ console.warn('lab densidad 3D', e); if (E){ try{E.dispose();}catch(e2){} } E = null; mallas = {}; } }
  if (!E) {
    crear2D(); sincronizar(true);
    let ult = performance.now();
    const tic = (ahora) => { raf2D = requestAnimationFrame(tic); const dt = Math.min((ahora-ult)/1000, 0.05); ult = ahora; if (!document.hidden) pasoAnimacion(dt); };
    raf2D = requestAnimationFrame(tic);
  }
  renderPanel(); renderTabla();
  if (Store.s.activities[ACT]?.done){ L.retoLiq = true; retoSt.className='notice ok'; retoSt.textContent='Reto resuelto ✓ Puedes repetirlo con otros materiales y líquidos.'; }

  return { unmount(){ if (raf2D) cancelAnimationFrame(raf2D); if (E) { try { E.dispose(); } catch(e){} } E = null; } };
});

})();
</script>
