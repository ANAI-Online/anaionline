  structures:[
    {id:"lobulo-frontal", nombre:"Lóbulo frontal", capa:"corteza", color:"#D9827A", pos:[1.35,0.8,1.0], lbl:[2.05,1.75,1.35],
      n1:"Parte anterior de la corteza cerebral. Planifica, decide, controla el movimiento voluntario y produce el lenguaje hablado.",
      n2:"Contiene la corteza motora primaria, justo delante de la cisura central, que envía órdenes a los músculos del lado opuesto del cuerpo, y el área de Broca (en el hemisferio izquierdo en la mayoría de las personas), necesaria para producir el habla. La corteza prefrontal, la región más anterior, se encarga del razonamiento, la atención, la toma de decisiones y el control de los impulsos.",
      n3:"La corteza prefrontal es la última región del cerebro en madurar: su desarrollo continúa hasta los 20–25 años, lo que ayuda a explicar por qué en la adolescencia la búsqueda de recompensas y el control de impulsos aún no están en equilibrio. El caso de Phineas Gage (1848), que sobrevivió a una barra de hierro que atravesó su lóbulo frontal, mostró por primera vez que esta región influye en la personalidad y el juicio.",
      dato:"Es la última región cerebral en madurar: hasta los 20–25 años.", conecta:["lobulo-parietal","lobulo-temporal","medula","cerebelo"], temas:["Sistema nervioso","Movimiento voluntario","Toma de decisiones"],
      quiz:{q:"¿Qué función se afectaría más si se lesionara la corteza prefrontal?", ops:["La visión","La planificación y el control de impulsos","El equilibrio"], ok:1, fb:"La corteza prefrontal integra información para planificar, decidir y frenar impulsos.", wrong:["La visión se procesa en el lóbulo occipital, en la parte posterior.","El equilibrio depende sobre todo del cerebelo."]}},
    {id:"lobulo-parietal", nombre:"Lóbulo parietal", capa:"corteza", color:"#D8A55E", pos:[-0.45,1.3,1.0], lbl:[-0.55,2.35,1.25],
      n1:"Región superior y posterior. Procesa las sensaciones del cuerpo: tacto, temperatura, dolor y posición de las extremidades.",
      n2:"Su franja anterior es la corteza somatosensorial, que recibe información del lado opuesto del cuerpo; las regiones con más receptores (manos, labios, lengua) ocupan más corteza. Integra además información espacial: dónde están los objetos y dónde está el cuerpo respecto a ellos.",
      n3:"El 'homúnculo sensorial' es un mapa distorsionado del cuerpo sobre la corteza: las manos y la cara ocupan más superficie que el tronco entero. Las lesiones parietales del hemisferio derecho pueden producir 'negligencia': la persona ignora el lado izquierdo del espacio aunque vea con normalidad.",
      dato:"Las manos y los labios ocupan más corteza que todo el tronco.", conecta:["talamo","lobulo-frontal","lobulo-occipital"], temas:["Sensibilidad","Percepción espacial"],
      quiz:{q:"La información del tacto de la mano derecha llega principalmente a…", ops:["el lóbulo parietal izquierdo","el lóbulo parietal derecho","el cerebelo"], ok:0, fb:"Las vías sensoriales se cruzan: cada hemisferio procesa el lado opuesto del cuerpo.", wrong:["Recuerda que las vías se cruzan en el tronco y la médula: el lado derecho del cuerpo se procesa en el hemisferio izquierdo.","El cerebelo coordina el movimiento; no es donde se percibe el tacto."]}},
    {id:"lobulo-temporal", nombre:"Lóbulo temporal", capa:"corteza", color:"#7FA9C9", pos:[0.3,-0.55,1.35], lbl:[1.0,-1.25,1.95],
      n1:"Región lateral, a la altura de las orejas. Procesa la audición, comprende el lenguaje y participa en la memoria.",
      n2:"La corteza auditiva primaria recibe la información del oído. El área de Wernicke (hemisferio izquierdo en la mayoría de las personas) permite comprender el lenguaje: quien la lesiona habla con fluidez pero sin sentido. En su cara interna aloja el hipocampo, esencial para formar nuevos recuerdos.",
      n3:"El giro fusiforme, en la base del lóbulo temporal, se especializa en reconocer caras: su lesión produce prosopagnosia, la incapacidad de reconocer rostros conocidos, incluso el propio. Las áreas de Broca (frontal) y Wernicke (temporal) están conectadas por un haz de fibras, el fascículo arqueado.",
      dato:"Alberga el área que permite comprender lo que escuchamos.", conecta:["hipocampo","lobulo-frontal","talamo"], temas:["Audición","Lenguaje","Memoria"],
      quiz:{q:"Una persona escucha con normalidad pero no comprende las palabras. ¿Qué región está probablemente afectada?", ops:["El lóbulo occipital","El área de Wernicke, en el lóbulo temporal","El cerebelo"], ok:1, fb:"El área de Wernicke da significado a las palabras que oímos.", wrong:["El occipital procesa la visión, no el lenguaje oído.","El cerebelo coordina movimientos; no interpreta el lenguaje."]}},
    {id:"lobulo-occipital", nombre:"Lóbulo occipital", capa:"corteza", color:"#8FB98A", pos:[-2.05,0.45,0.8], lbl:[-3.0,1.1,1.0],
      n1:"Región posterior. Recibe e interpreta la información visual que llega desde los ojos.",
      n2:"La corteza visual primaria recibe las señales de la retina (a través del tálamo) y detecta bordes, orientaciones y colores; áreas vecinas reconocen formas, movimiento y objetos. Un golpe en la nuca puede hacer 'ver estrellas' por la estimulación de esta corteza.",
      n3:"Cada hemisferio procesa el campo visual opuesto: el occipital izquierdo 've' la mitad derecha del mundo. La información viaja luego por dos rutas: la ventral ('qué es', hacia el temporal) y la dorsal ('dónde está', hacia el parietal).",
      dato:"El ojo capta la luz, pero es el lóbulo occipital el que 've'.", conecta:["talamo","lobulo-parietal","lobulo-temporal"], temas:["Visión","Percepción"],
      quiz:{q:"¿Qué ocurriría si se lesionara por completo el lóbulo occipital aunque los ojos estuvieran sanos?", ops:["Nada, la visión depende solo de los ojos","Ceguera cortical: los ojos captan luz pero el cerebro no la interpreta","Pérdida de audición"], ok:1, fb:"Ver es interpretar: sin corteza visual no hay percepción aunque la retina funcione.", wrong:["Los ojos captan, pero interpretar la imagen es tarea de la corteza.","La audición se procesa en el lóbulo temporal."]}},
    {id:"cerebelo", nombre:"Cerebelo", capa:"cerebelo-tronco", color:"#B08AC9", pos:[-1.55,-1.15,0.7], lbl:[-2.65,-1.75,1.2],
      n1:"'Cerebro pequeño', situado bajo los hemisferios. Coordina los movimientos, el equilibrio y la postura.",
      n2:"No inicia el movimiento, pero lo afina: compara la orden motora de la corteza con la información que llega de los músculos y del oído interno y corrige los errores en tiempo real. Por eso podemos caminar sin pensar en cada paso o tocar un instrumento con precisión.",
      n3:"Contiene más de la mitad de todas las neuronas del encéfalo a pesar de ocupar solo el 10 % de su volumen. Participa en el aprendizaje motor: la práctica repetida 'graba' en el cerebelo movimientos que al principio eran torpes. El alcohol afecta especialmente al cerebelo, de ahí la pérdida de coordinación.",
      dato:"Contiene más de la mitad de las neuronas del encéfalo.", conecta:["tronco","lobulo-frontal","medula"], temas:["Coordinación","Equilibrio","Aprendizaje motor"],
      quiz:{q:"El cerebelo…", ops:["decide qué movimiento realizar","coordina y afina los movimientos que decide la corteza","procesa la visión"], ok:1, fb:"La decisión es cortical; el cerebelo ajusta fuerza, tiempo y precisión.", wrong:["La decisión de moverse nace en la corteza frontal.","La visión se procesa en el occipital."]}},
    {id:"tronco", nombre:"Tronco encefálico", capa:"cerebelo-tronco", color:"#C9B79A", pos:[-0.4,-1.3,0], lbl:[0.75,-2.2,0.7],
      n1:"Conecta el cerebro con la médula espinal. Controla funciones vitales automáticas: respiración, latido y presión arterial.",
      n2:"Está formado por el mesencéfalo, el puente y el bulbo raquídeo. En el bulbo se encuentran los centros respiratorio y cardiovascular, que ajustan la frecuencia respiratoria y cardíaca según el CO₂ y el pH de la sangre. Por él pasan todas las vías que unen el cerebro con el cuerpo, y en él se cruza la mayoría.",
      n3:"El bulbo controla también reflejos como toser, estornudar, tragar y vomitar. La formación reticular, una red de neuronas del tronco, regula la vigilia y el sueño. Una lesión grave del tronco es incompatible con la vida sin soporte artificial: por eso la 'muerte encefálica' se define por la pérdida irreversible de sus funciones.",
      dato:"Aquí se decide cuántas veces respiras por minuto sin que lo pienses.", conecta:["medula","cerebelo","hipotalamo"], temas:["Funciones vitales","Homeostasis","Respiración"],
      quiz:{q:"Durante el ejercicio aumenta el CO₂ en sangre. ¿Qué estructura lo detecta y aumenta la respiración?", ops:["El lóbulo frontal","El centro respiratorio del bulbo raquídeo","El cerebelo"], ok:1, fb:"El bulbo ajusta la respiración de forma automática según el CO₂ y el pH.", wrong:["El lóbulo frontal puede modificar la respiración de forma voluntaria, pero el control automático es del tronco.","El cerebelo coordina movimientos; no regula la respiración."]}},
    {id:"medula", nombre:"Médula espinal", capa:"cerebelo-tronco", color:"#C9B79A", pos:[-0.66,-3.2,0], lbl:[0.45,-3.55,0.6],
      n1:"Cordón nervioso dentro de la columna vertebral. Comunica el encéfalo con el cuerpo y produce los reflejos.",
      n2:"Por ella descienden las órdenes motoras y ascienden las sensaciones. Los reflejos (retirar la mano de algo caliente) se procesan en la médula sin esperar al cerebro: el receptor envía la señal, una interneurona la pasa a una neurona motora y el músculo responde en milisegundos. El cerebro se entera después.",
      n3:"En su interior la sustancia gris (cuerpos neuronales) tiene forma de mariposa y la sustancia blanca (axones con mielina) la rodea, al revés que en el cerebro. Una lesión medular interrumpe la comunicación por debajo del nivel dañado: cuanto más alta, mayor es la zona afectada.",
      dato:"Un reflejo tarda ~30 ms; la sensación consciente, unos 500 ms.", conecta:["tronco","lobulo-frontal","lobulo-parietal"], temas:["Reflejos","Vías nerviosas"],
      quiz:{q:"¿Por qué retiras la mano de una estufa caliente antes de sentir dolor?", ops:["Porque el dolor no existe hasta que el cerebro lo procesa","Porque el reflejo se procesa en la médula espinal, sin pasar por el cerebro","Porque el cerebelo actúa más rápido que el cerebro"], ok:1, fb:"El arco reflejo medular responde en milisegundos; la sensación consciente llega después.", wrong:["Es cierto que el dolor es consciente en el cerebro, pero la retirada ocurre antes gracias a la médula.","El cerebelo coordina, pero el reflejo de retirada es medular."]}},
    {id:"cuerpo-calloso", nombre:"Cuerpo calloso", capa:"profundas", color:"#EFE6D6", pos:[0,0.8,0], lbl:[0.3,1.35,-1.5], interno:true,
      n1:"Haz de unos 200 millones de fibras que une los dos hemisferios cerebrales.",
      n2:"Permite que la información de un hemisferio llegue al otro: lo que ve el hemisferio derecho (campo visual izquierdo) puede ser nombrado por el izquierdo (donde suele estar el lenguaje) gracias a él.",
      n3:"En pacientes con 'cerebro dividido' (cuerpo calloso seccionado para tratar epilepsias graves), los experimentos de Sperry y Gazzaniga mostraron que cada hemisferio puede procesar información sin que el otro 'lo sepa'.",
      dato:"Es la 'autopista' de 200 millones de fibras entre hemisferios.", conecta:["lobulo-frontal","lobulo-parietal","lobulo-occipital"], temas:["Hemisferios","Comunicación interna"],
      quiz:{q:"¿Qué función cumple el cuerpo calloso?", ops:["Producir líquido cefalorraquídeo","Comunicar los dos hemisferios","Controlar la respiración"], ok:1, fb:"Sin él, cada hemisferio trabajaría de forma aislada.", wrong:["El líquido cefalorraquídeo lo producen los plexos coroideos de los ventrículos.","La respiración la controla el tronco encefálico."]}},
    {id:"talamo", nombre:"Tálamo", capa:"profundas", color:"#9B6FB5", pos:[-0.1,0.05,0.3], lbl:[-1.35,0.25,-1.4], interno:true,
      n1:"Estación de relevo en el centro del cerebro: casi toda la información sensorial pasa por él antes de llegar a la corteza.",
      n2:"Recibe señales de la vista, el oído, el tacto y el gusto (no del olfato) y las dirige a la región correspondiente de la corteza. También filtra: decide qué información merece atención.",
      n3:"Participa en la regulación del sueño y la conciencia; durante el sueño profundo 'cierra la puerta' a la mayoría de estímulos sensoriales. Las lesiones talámicas pueden producir dolor intenso y persistente (síndrome talámico).",
      dato:"El olfato es el único sentido que llega a la corteza sin pasar por el tálamo.", conecta:["lobulo-parietal","lobulo-occipital","hipotalamo"], temas:["Sensibilidad","Atención","Sueño"],
      quiz:{q:"¿Cuál es el único sentido que NO pasa por el tálamo?", ops:["La vista","El olfato","El tacto"], ok:1, fb:"El olfato llega directamente a la corteza olfativa; es el sentido más antiguo evolutivamente.", wrong:["La vista pasa por el tálamo (núcleo geniculado lateral) antes de llegar al occipital.","El tacto pasa por el tálamo antes de llegar al parietal."]}},
    {id:"hipotalamo", nombre:"Hipotálamo", capa:"profundas", color:"#E0A040", pos:[0.3,-0.36,0], lbl:[1.65,-0.65,-1.1], interno:true,
      n1:"Pequeña región bajo el tálamo. Regula la temperatura, el hambre, la sed, el sueño y controla la hipófisis.",
      n2:"Es el puente entre el sistema nervioso y el endocrino: mide la temperatura y la composición de la sangre y responde con señales nerviosas (sudar, tiritar) y hormonales (a través de la hipófisis). Es un centro clave de la homeostasis.",
      n3:"Contiene el 'reloj biológico' (núcleo supraquiasmático), que sincroniza los ritmos circadianos con la luz del día. Produce oxitocina y vasopresina (hormona antidiurética), que se liberan en la hipófisis posterior.",
      dato:"Pesa unos 4 gramos y regula la temperatura de todo el cuerpo.", conecta:["hipofisis","talamo","tronco"], temas:["Homeostasis","Sistema endocrino","Ritmos circadianos"],
      quiz:{q:"Tienes fiebre. ¿Qué estructura 'sube el termostato' del cuerpo?", ops:["El hipotálamo","El cerebelo","El lóbulo occipital"], ok:0, fb:"Sustancias liberadas durante la infección hacen que el hipotálamo eleve la temperatura de referencia.", wrong:["El cerebelo coordina movimientos.","El occipital procesa la visión."]}},
    {id:"hipofisis", nombre:"Hipófisis", capa:"profundas", color:"#E8C0A0", pos:[0.42,-1.0,0], lbl:[1.9,-1.55,-0.6],
      n1:"Glándula del tamaño de un guisante, colgada bajo el hipotálamo. Produce hormonas que controlan otras glándulas.",
      n2:"Su parte anterior libera hormona del crecimiento, TSH (tiroides), ACTH (suprarrenales), FSH y LH (gónadas) y prolactina, bajo las órdenes del hipotálamo. Su parte posterior almacena y libera oxitocina y vasopresina producidas en el hipotálamo.",
      n3:"Se aloja en una cavidad ósea llamada silla turca. Un exceso de hormona del crecimiento en la infancia produce gigantismo; en la adultez, acromegalia. Los tumores hipofisarios pueden comprimir el quiasma óptico y reducir el campo visual lateral.",
      dato:"Llamada 'glándula maestra', aunque obedece al hipotálamo.", conecta:["hipotalamo"], temas:["Sistema endocrino","Crecimiento","Pubertad"],
      quiz:{q:"La hipófisis pertenece…", ops:["solo al sistema nervioso","al sistema endocrino, controlada por el hipotálamo","al sistema digestivo"], ok:1, fb:"Es una glándula endocrina cuyas órdenes vienen del hipotálamo: un ejemplo de conexión nervioso-endocrina.", wrong:["Produce hormonas: es una glándula endocrina, aunque está unida al hipotálamo.","No tiene relación con la digestión."]}},
    {id:"hipocampo", nombre:"Hipocampo", capa:"profundas", color:"#5F9DB0", pos:[-0.2,-0.55,0.85], lbl:[-0.7,-2.05,1.95], interno:true,
      n1:"Estructura curva dentro del lóbulo temporal. Imprescindible para formar nuevos recuerdos y orientarse en el espacio.",
      n2:"Convierte la memoria a corto plazo en memoria a largo plazo, que luego se almacena en la corteza. Contiene 'células de lugar' que se activan cuando estamos en un sitio concreto: una especie de GPS interno.",
      n3:"El paciente H.M., al que se le extirparon ambos hipocampos en 1953, no pudo formar recuerdos nuevos el resto de su vida, aunque conservó los antiguos y podía aprender habilidades motoras. Es una de las pocas regiones donde nacen neuronas nuevas en adultos; el estrés crónico y la falta de sueño lo perjudican.",
      dato:"Dormir bien consolida la memoria: el hipocampo 'repasa' durante el sueño.", conecta:["lobulo-temporal","lobulo-frontal"], temas:["Memoria","Aprendizaje","Sueño"],
      quiz:{q:"¿Qué ocurriría si el hipocampo dejara de funcionar?", ops:["Se perderían todos los recuerdos antiguos","No se podrían formar recuerdos nuevos","Se perdería la visión"], ok:1, fb:"Los recuerdos antiguos ya están en la corteza; lo que falla es fabricar recuerdos nuevos (amnesia anterógrada).", wrong:["Los recuerdos antiguos se conservan porque ya se almacenaron en la corteza.","La visión no depende del hipocampo."]}}
  ],

    {id:"traquea", nombre:"Tráquea", capa:"via-aerea", color:"#E4D2BD", pos:[0,2.6,0], lbl:[1.05,3.1,0.5],

/* generador determinista: los mismos datos en cada visita */
function lcg(seed){ let s = seed>>>0; return () => (s = (s*1664525 + 1013904223)>>>0) / 4294967296; }
function buildRoster(){
  const out = []; let k = 0;
  const grupos = [ {year:1, par:'A', n:10}, {year:1, par:'B', n:8}, {year:2, par:'A', n:11}, {year:2, par:'B', n:8}, {year:3, par:'A', n:8} ];
  grupos.forEach(g => {
    const items = BIO.gradeItemsOf(g.year);
    for (let i=0;i<g.n;i++){
      const r = lcg(97 + k*31 + g.year*7);
      const nombre = NOMBRES[k % NOMBRES.length]; k++;
      const nivel = 0.3 + r()*0.68;                       // desempeño general del estudiante
      const notas = {};

      items.forEach((it,j) => { const hecho = r() < (nivel + 0.18 - j*0.045); if (hecho) notas[it.id] = Math.max(3.5, Math.min(10, Math.round((4.2 + nivel*5.6 + DIF[j%11]*1.6 + (r()-0.5)*2.6)*10)/10)); });
      const dias = Math.round(Math.pow(r(),2)*14);         // días desde la última conexión
      const adapt = []; if (r()<0.16) adapt.push('letra-grande'); if (r()<0.12) adapt.push('voz'); if (r()<0.1) adapt.push('pistas'); if (r()<0.08) adapt.push('tiempo');
      out.push({ id:'e'+k, nombre, year:g.year, paralelo:g.par,
        email: nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,'').split(' ').join('.')+'@anai.edu.ec',
        rep: REPRE[k % REPRE.length], repTel:'09'+String(80000000 + Math.floor(r()*19999999)),
        notas, dias, min: 60 + Math.round(nivel*260), adapt, demo:false });
    }
  });
  return out;
}

<script>

const h = (tag, attrs={}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- STORE ---------- */
const DEFAULT_STATE = () => ({
  version: 1,
  user: { id:"demo-mateo", nombre:"Mateo Andrade", iniciales:"MA", curso:"2.º de Bachillerato", rol:"estudiante" },
  /* sesión: rol, año matriculado y código usado (con servidor, esto lo valida el backend) */
  session: { rol:"estudiante", year:null, paralelo:null, code:null, onboarded:false, tour:false, invitado:false, repaso:true },
  /* accesibilidad: "Mi forma de aprender" */
  a11y: { text:1, font:"", spacing:0, contrast:false, motion:false, focus:false, tts:false, level:1, hints:false },
  visitas: { last:null, prev:null, total:0 },
  avisos: { leidos:[], prefs:{ inactividad:true, vencimientos:true, logros:true } },
  usuarios: {},             // listado cargado por la docente: código → usuario, contraseña temporal (hash) y curso
  yearUnits: null,          // reasignación de unidades por año hecha por la docente
  docente: { adapt:{}, notas:{}, codes:null },
  xp: 740,
  badges: ["explorador-celular"],
  // progreso base por unidad (datos ficticios de demostración → 37 %)
  unitBase: {1:100, 2:90, 3:60, 4:30, 5:0, 6:60, 7:30, 8:0, 9:0, 10:0},
  activities: {},          // id → {done, score, at}
  seen: { corazon: [], "celula-animal": [] },
  notebook: [
    { id:"n1", k:"observacion", at: Date.now()-86400000*3, txt:"Las células de la epidermis de cebolla se ven como ladrillos alineados; la pared celular es muy evidente y el núcleo aparece como un punto oscuro en cada una." },
    { id:"n2", k:"hipotesis", at: Date.now()-86400000*2, txt:"Si aumenta la temperatura, la levadura producirá más CO₂ porque sus enzimas trabajan más rápido, hasta un límite en el que se desnaturalizan." }
  ],
  events: [],
  settings: { motion: true },
  lastActivity: { t:"Explorar la célula animal", at: Date.now()-86400000*4, href:"#/explorar/celula" },

});
const KEY = 'anai-biolab-v1';
const Store = {
  s: null,
  load(){ try { const raw = localStorage.getItem(KEY); this.s = raw ? Object.assign(DEFAULT_STATE(), JSON.parse(raw)) : DEFAULT_STATE(); } catch(e){ this.s = DEFAULT_STATE(); } return this.s; },
  save(){ try { localStorage.setItem(KEY, JSON.stringify(this.s)); } catch(e){} },
  reset(){ try { localStorage.removeItem(KEY); } catch(e){} this.s = DEFAULT_STATE(); },
  /* Analítica: esquema de eventos exportable (usuario, actividad, modelo, estructura, fecha, duración, intentos, resultado) */
  log(type, data={}){
    const ev = Object.assign({ id: Math.random().toString(36).slice(2,9), usuario:this.s.user.id, tipo:type, fecha:new Date().toISOString(), ruta:location.hash }, data);
    this.s.events.push(ev); if (this.s.events.length > 600) this.s.events.splice(0, this.s.events.length-600);
    this.save(); return ev;
  },
  addXP(n, why){ this.s.xp += n; this.save(); if (n>0) toast(`+${n} XP · ${why}`); },
  completeActivity(id, extra={}){
    const a = BIO.activities[id]; if (!a) return;
    const first = !this.s.activities[id]?.done;
    this.s.activities[id] = Object.assign({}, this.s.activities[id]||{}, {done:true, at:Date.now()}, extra);
    this.s.lastActivity = { t:a.t, at:Date.now(), href:location.hash };
    this.log('actividad_completada', { actividad:id, resultado:extra.score ?? null, intentos: extra.attempts ?? null });
    if (first) this.addXP(a.xp, a.t);
    this.save();
  },
  markSeen(model, id){
    const arr = this.s.seen[model] = this.s.seen[model] || [];
    if (!arr.includes(id)) { arr.push(id); this.save(); }
  },
  grantBadge(id){
    if (this.s.badges.includes(id)) return false;
    this.s.badges.push(id); this.save();
    const b = BIO.badges.find(x=>x.id===id); toast(`${b.em} Insignia obtenida: ${b.n}`); this.log('insignia', {insignia:id}); return true;
  },
  addNote(k, txt, extra={}){ const e = Object.assign({ id:Math.random().toString(36).slice(2,9), k, at:Date.now(), txt }, extra); this.s.notebook.unshift(e); this.save(); this.log('cuaderno', {clase:k}); return e; },
  /* ---- sesión y año ---- */
  get ses(){ return this.s.session; },
  yearUnits(){ return this.s.yearUnits || Object.fromEntries(BIO.years.map(y=>[y.id,y.unidades])); },
  year(){ return this.ses.year; },
  enroll(code, opts={}){
    const c = (this.s.docente.codes || BIO.accessCodes).find(x => x.code.toUpperCase() === String(code||'').trim().toUpperCase());

    if (!c.activo) return { ok:false, msg:'Ese código ya no está activo. Tu docente puede darte el código vigente.' };

  /* estado de una unidad para el estudiante: de su año, de repaso o de un año posterior */
  unitStatus(u){ const y = this.year(); if (!y) return 'actual'; const yu = BIO.yearOfUnit(u); return yu===y ? 'actual' : yu<y ? 'repaso' : 'proximo'; },

  touchVisit(){ const v = this.s.visitas; const now = Date.now();

    if (p.vencimientos) (BIO.assignments||[]).filter(a => (!ses.year || a.year===ses.year) && (!ses.paralelo || a.paralelo===ses.paralelo)).forEach(a => {

function quizBlock(q, onDone){
  const wrap = h('div',{class:'stack'}, h('p',{style:'font-weight:600'},q.q));
  const fb = h('div',{class:'notice',style:'display:none'});
  let attempts=0, solved=false;
  q.ops.forEach((o,i)=>{
    const b = h('button',{class:'opt',onclick:()=>{
      if (solved) return; attempts++;
      if (i===q.ok){ solved=true; b.classList.add('ok'); fb.className='notice ok'; fb.innerHTML=`<b>Correcto.</b> ${esc(q.fb)}`; fb.style.display='flex'; onDone && onDone(attempts); }
      else { b.classList.add('bad'); fb.className='notice warn'; fb.innerHTML=`<b>Aún no.</b> ${esc(q.wrong?.[i<q.ok?i:i-1] || 'Revisa la estructura y su relación con el flujo de sangre, e inténtalo de nuevo.')}`; fb.style.display='flex'; }
      Store.log('respuesta',{pregunta:q.q,opcion:i,correcto:i===q.ok,intento:attempts});
    }}, h('span',{class:'k'},String.fromCharCode(65+i)), o);
    wrap.append(b);
  });
  wrap.append(fb); return wrap;
}

/* ---------- Gráficos (canvas, un solo eje, marcas finas, tooltip) ---------- */
function lineChart(canvas, opts){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const W = canvas.clientWidth||600, H = canvas.clientHeight||280; canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const ink = cssVar('--ink'), ink3 = cssVar('--ink-3'), grid = cssVar('--chart-grid');
  const pad = {l:48,r:16,t:16,b:36}; const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const series = opts.series; const xs = series.flatMap(s=>s.pts.map(p=>p.x)), ys = series.flatMap(s=>s.pts.map(p=>p.y));
  const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v,1)))); const m = v/p; const k = m<=1?1:m<=2?2:m<=2.5?2.5:m<=4?4:m<=5?5:m<=8?8:10; return k*p; };
  const xmin = opts.xmin ?? Math.min(...xs), xmax = opts.xmax ?? Math.max(...xs); const ymin = opts.ymin ?? 0, ymax = opts.ymax ?? nice(Math.max(...ys,1)*1.2);
  const X = x => pad.l + (x-xmin)/((xmax-xmin)||1)*pw, Y = y => pad.t + ph - (y-ymin)/((ymax-ymin)||1)*ph;
  ctx.clearRect(0,0,W,H); ctx.font = '11px "IBM Plex Mono", monospace'; ctx.fillStyle = ink3; ctx.strokeStyle = grid; ctx.lineWidth = 1;
  const yt = 4; for (let i=0;i<=yt;i++){ const v = ymin + (ymax-ymin)*i/yt; const y = Y(v); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke(); ctx.textAlign='right'; ctx.fillText(opts.yfmt ? opts.yfmt(v) : Math.round(v), pad.l-8, y+4); }
  const xt = opts.xticks || 5; for (let i=0;i<=xt;i++){ const v = xmin + (xmax-xmin)*i/xt; ctx.textAlign='center'; ctx.fillText(opts.xfmt ? opts.xfmt(v) : Math.round(v), X(v), H-pad.b+18); }
  ctx.fillStyle = ink3; ctx.textAlign='left'; if (opts.ylabel) ctx.fillText(opts.ylabel, pad.l, pad.t-4); if (opts.xlabel){ ctx.textAlign='right'; ctx.fillText(opts.xlabel, W-pad.r, H-6); }
  series.forEach(s => { ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin='round'; ctx.beginPath(); s.pts.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y))); ctx.stroke();
    if (s.dots) s.pts.forEach(p => { ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(X(p.x),Y(p.y),4,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=cssVar('--bg-2'); ctx.lineWidth=2; ctx.stroke(); });
    if (s.label && s.pts.length){ const last = s.pts[s.pts.length-1]; ctx.fillStyle = ink; ctx.font='600 11px "IBM Plex Sans", sans-serif'; ctx.textAlign='right'; ctx.fillText(s.label, X(last.x), Y(last.y)-8); }
  });
  // hover
  if (!canvas._hover){ canvas._hover = true; const tip = h('div',{class:'phase',style:'position:absolute;pointer-events:none;display:none'}); canvas.parentElement.style.position='relative'; canvas.parentElement.append(tip);
    canvas.addEventListener('mousemove', e => { const o = canvas._opts; if (!o) return; const r = canvas.getBoundingClientRect(); const mx = e.clientX-r.left; let best=null; o.series.forEach(s=>s.pts.forEach(p=>{ const d=Math.abs(o.X(p.x)-mx); if(!best||d<best.d) best={d,p,s}; })); if (best && best.d<24){ tip.style.display='block'; tip.style.left=(o.X(best.p.x)+10)+'px'; tip.style.top=(o.Y(best.p.y)-28)+'px'; tip.textContent = `${best.s.label||''} ${o.xfmt?o.xfmt(best.p.x):best.p.x} → ${o.yfmt?o.yfmt(best.p.y):Math.round(best.p.y*10)/10}`; } else tip.style.display='none'; });
    canvas.addEventListener('mouseleave', ()=> tip.style.display='none'); }
  canvas._opts = Object.assign({}, opts, {X, Y});
}

/* ---------- utilidades de texto ---------- */
const capital = s => String(s||'').toLowerCase().replace(/(^|[\s'-])([a-záéíóúñü])/g, (m,a,b)=>a+b.toUpperCase()).trim();
const sinTildes = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
/* Separa un texto tabular (CSV con , o ; , o pegado desde Excel con tabulaciones) */
function parseTabular(txt){
  const lineas = String(txt||'').split(/\r?\n/).filter(l => l.trim().length);
  if (!lineas.length) return [];
  const conteo = s => ({ ';': (s.match(/;/g)||[]).length, ',': (s.match(/,/g)||[]).length, '\t': (s.match(/\t/g)||[]).length });
  const c = conteo(lineas[0]); const sep = c['\t'] >= Math.max(c[';'],c[',']) && c['\t']>0 ? '\t' : c[';'] >= c[','] ? ';' : ',';
  return lineas.map(l => {
    const out = []; let cur = '', q = false;
    for (let i=0;i<l.length;i++){ const ch = l[i];
      if (ch === '"'){ if (q && l[i+1] === '"'){ cur += '"'; i++; } else q = !q; }
      else if (ch === sep && !q){ out.push(cur); cur = ''; }
      else cur += ch; }
    out.push(cur); return out.map(x => x.trim());
  });
}

function mapearEncabezado(fila){
  const map = {}; fila.forEach((h0,i) => { const k = sinTildes(String(h0).toLowerCase()).trim();
    for (const [campo,alias] of Object.entries(COLS)) if (alias.some(a => sinTildes(a) === k)) { if (map[campo]===undefined) map[campo] = i; } });

}

  revisar(txt, yearPorDefecto, parPorDefecto){

    let map = mapearEncabezado(filas[0]); let inicio = 1;
    if (map.codigo === undefined && map.nombre_completo === undefined && map.nombres === undefined){ map = { codigo:0, nombre_completo:1, year:2, paralelo:3 }; inicio = 0; }
    const ok = [], errores = [], vistos = new Set();
    for (let i = inicio; i < filas.length; i++){
      const f = filas[i]; if (!f.join('').trim()) continue;
      const codigo = String(f[map.codigo] ?? '').trim();
      let nombres = map.nombres!==undefined ? f[map.nombres] : '', apellidos = map.apellidos!==undefined ? f[map.apellidos] : '';

        if (partes.length >= 3){ apellidos = partes.slice(0,2).join(' '); nombres = partes.slice(2).join(' '); }
        else { apellidos = partes[0]||''; nombres = partes.slice(1).join(' '); } }
      const year = yearDe(map.year!==undefined ? f[map.year] : '') || yearPorDefecto;
      const paralelo = String((map.paralelo!==undefined ? f[map.paralelo] : '') || parPorDefecto || 'A').trim().toUpperCase().slice(0,2);

      if (!codigo) { errores.push({ fila, msg:'Falta el código del estudiante.' }); continue; }

      if (!nombres && !apellidos) { errores.push({ fila, msg:`Sin nombre para el código ${codigo}.` }); continue; }

  spotlight(id){ this.parts.forEach(p => p.meshes.forEach(m => { const mat = m.material; if (!mat || !mat.color) return; if (!mat.userData.c0) mat.userData.c0 = mat.color.clone(); mat.color.copy(mat.userData.c0); if (id && p.id !== id && !p.passThrough && !this.detail) mat.color.multiplyScalar(0.55); })); }
  /* ---- vista en detalle: aislar, ampliar, girar, marcadores numerados ---- */
  fitPoints(pts, k=2.4){ const b = new THREE.Box3(); pts.forEach(q => b.expandByPoint(V3(q))); this.goalTarget.copy(b.getCenter(new THREE.Vector3())); this.goal.r = clamp(Math.max(b.getSize(new THREE.Vector3()).length()*k, 2.2), this.opts.minR, this.opts.maxR); }

  fit(id, k=1.5){ const p = this.parts.get(id); if (!p) return; const box = new THREE.Box3(); p.meshes.forEach(m => { if (!m.geometry || m.isInstancedMesh || m.isPoints) return; if (!m.geometry.boundingBox) m.geometry.computeBoundingBox(); m.updateMatrixWorld(); box.union(m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld)); }); if (box.isEmpty()) return; this.goalTarget.copy(box.getCenter(new THREE.Vector3())); this.goal.r = clamp(box.getSize(new THREE.Vector3()).length()*k, this.opts.minR, this.opts.maxR); }
  enterDetail(id, pts){ if (this.detail) this.exitDetail(); this.detail = id; this._sv = { minR:this.opts.minR, labels:this._labelsOn!==false, r:this.goal.r, t:this.goalTarget.clone() }; this.opts.minR = 0.7;

  /* si la estructura tiene varias copias repartidas (p. ej. mitocondrias), se amplía la zona donde están sus partes numeradas */
  fitDetail(id, pts){ if (pts && pts.length > 1){ const b = new THREE.Box3(); pts.forEach(q => b.expandByPoint(V3(q))); const ps = b.getSize(new THREE.Vector3()).length(); if (ps < 0.45*this.partSize(id)) return this.fitPoints(pts); } this.fit(id); }
  exitDetail(){ if (!this.detail) return; this.parts.forEach(p => { if (p._go !== undefined){ this.setOpacity(p.id, p._go); delete p._go; } }); this.detail = null; this.opts.minR = this._sv.minR; this.setLabels(this._sv.labels); this.goal.r = this._sv.r; this.goalTarget.copy(this._sv.t); this.clearMarkers(); this.spin = false; this.spotlight(this.selected); }
  setMarkers(list, onClick){ this.clearMarkers(); if (!this.markersEl){ this.markersEl = h('div',{class:'markers'}); this.container.append(this.markersEl); } this.markers = list.map((mk,i) => { const el = h('button',{class:'mk',type:'button',title:mk.n,'aria-label':`${i+1}. ${mk.n}`,onclick:()=>onClick && onClick(i)}, String(i+1)); this.markersEl.append(el); return { el, pos:V3(mk.at) }; }); }
  clearMarkers(){ (this.markers||[]).forEach(m => m.el.remove()); this.markers = []; }
  highlightMarker(i){ (this.markers||[]).forEach((m,j) => m.el.classList.toggle('on', i===j)); }
  refreshEmissive(){ this.parts.forEach(p => p.meshes.forEach(m => { if (!m.material || !m.material.emissive) return; const sel = p.id===this.selected, hov = p.id===this.hovered; m.material.emissive.set(sel||hov ? 0xffffff : 0x000000); m.material.emissiveIntensity = sel ? 0.13 : hov ? 0.08 : 0; })); }
  setVisible(id, v){ const p = this.parts.get(id); if (!p) return; p.visible = v; p.meshes.forEach(m => m.visible = v); const l = this.labels.get(id); if (l) l.el.style.display = v ? '' : 'none'; }
  setOpacity(id, o){ const p = this.parts.get(id); if (!p) return; p.opacity = o; p.meshes.forEach(m => { if (!m.material || m.userData.keepOpacity) return; const bo = m.userData.bo ?? 1; m.material.opacity = bo*o; m.material.transparent = !!m.userData.bt || o<0.99; m.material.depthWrite = o>=0.99 ? (m.userData.bd ?? true) : false; }); }
  setExplode(f){ this.parts.forEach(p => { if (!p.explodeDir) return; p.meshes.forEach(m => { m.position.copy(m.userData.base).addScaledVector(p.explodeDir, f*1.5); }); const l = this.labels.get(p.id); if (l) l.pos.copy(l.base||(l.base=l.pos.clone())).addScaledVector(p.explodeDir, f*1.5); }); }

  updateLabels(){ this.updateMarkers(); if (this._labelsOn===false) return; const W = this.container.clientWidth, H = this.container.clientHeight; const cam = this.camera.position.clone().sub(this.target).normalize(); const v = new THREE.Vector3();
    this.labels.forEach((l,id) => { const p = this.parts.get(id); if (p && !p.visible){ l.el.style.display='none'; return; } v.copy(l.pos).project(this.camera); const dir = l.pos.clone().sub(this.target).normalize(); const front = dir.dot(cam) > -0.35; if (v.z>1 || !front){ l.el.style.display='none'; return; } l.el.style.display=''; l.el.style.left = ((v.x+1)/2*W)+'px'; l.el.style.top = ((1-v.y)/2*H)+'px'; }); }
  updateMarkers(){ if (!this.markers || !this.markers.length) return; const W = this.container.clientWidth, H = this.container.clientHeight, v = new THREE.Vector3(); this.markers.forEach(m => { v.copy(m.pos).project(this.camera); if (v.z>1){ m.el.style.display='none'; return; } m.el.style.display=''; m.el.style.left = ((v.x+1)/2*W)+'px'; m.el.style.top = ((1-v.y)/2*H)+'px'; }); }
  loop(){
    this.raf = requestAnimationFrame(this.loop);
    if (!this.active || document.hidden) return;

    if ((this.opts.autoRotate || this.spin) && motionOK()) this.goal.theta += dt*(this.spin ? 0.16 : 0.25);

    if (this.outlines && this.outlines.length){ if (this._om) this._om.opacity = motionOK() ? 0.5 + 0.4*Math.sin(t*4.2) : 0.8; this.outlines.forEach(o => { o.src.updateMatrixWorld(); o.m.matrix.copy(o.src.matrixWorld); o.m.matrixWorldNeedsUpdate = true; o.m.visible = o.src.visible; }); }

  }
  capture(){ this.renderer.render(this.scene, this.camera); const src = this.canvas; const out = document.createElement('canvas'); const w = 480, hh = Math.round(480*src.height/src.width); out.width=w; out.height=hh; const ctx = out.getContext('2d'); ctx.fillStyle = cssVar('--bg-2'); ctx.fillRect(0,0,w,hh); ctx.drawImage(src,0,0,w,hh); return out.toDataURL('image/jpeg', 0.72); }
  dispose(){ this.active=false; cancelAnimationFrame(this.raf); this.ro.disconnect(); document.removeEventListener('visibilitychange', this.visHandler); this.scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ ['map','bumpMap','normalMap','roughnessMap','alphaMap'].forEach(k => m[k] && m[k].dispose()); m.dispose(); }); } }); if (this.scene.environment) this.scene.environment.dispose(); this.renderer.dispose(); this.canvas.remove(); this.labelsEl.remove(); }
}

/* ---------- utilidades geométricas ---------- */
const mat = (color, extra={}) => new THREE.MeshPhysicalMaterial(Object.assign({ color, roughness:0.5, metalness:0, clearcoat:0.35, clearcoatRoughness:0.35 }, extra));
const V3 = a => new THREE.Vector3(a[0],a[1],a[2]);
const curveOf = pts => new THREE.CatmullRomCurve3(pts.map(V3), false, 'catmullrom', 0.4);
function tube(pts, radius, color, low){ const c = curveOf(pts); const g = new THREE.TubeGeometry(c, low?32:64, radius, low?8:14, false); const m = new THREE.Mesh(g, mat(color)); m.userData.curve = c; return m; }
function blob(radius, scale, pos, color, low){ const g = new THREE.SphereGeometry(radius, low?28:48, low?20:36); const m = new THREE.Mesh(g, mat(color)); m.scale.set(...scale); m.position.set(...pos); return m; }

<script>
/* =====================================================================
   MODELO: CORAZÓN DETALLADO (procedimental, simplificado con fines educativos)
   Ventrículos con ápex, orejuelas, surcos con grasa, vasos coronarios pegados
   a la superficie, grandes vasos cónicos con lumen, válvulas con valvas que
   se abren y cierran según el ciclo cardíaco. Sustituible por un glTF.
   ===================================================================== */
function buildHeart(E){
  const low = E.low; const D = BIO.heart; const S = Object.fromEntries(D.structures.map(s=>[s.id,s]));
  const add = (id, meshes, extra={}) => { const s = S[id]; const p = E.addPart(id, meshes, Object.assign({ capa:s.capa, interno:s.interno, explodeDir: V3(s.pos).sub(new THREE.Vector3(0,-0.2,0)).normalize() }, extra)); E.addLabel(id, s.nombre, s.lbl); return p; };
  const muscle = (tint, tex='myocardium') => Kit.tissue({ tex, rep:[3,2], bump:0.018, coat:0.65, coatRough:0.26, rough:0.4, color:tint });
  const chamber = o => { const g = Kit.sculpt({ shape: d => { const p = d.clone(); if (o.apex && d.y<0){ const k = 1 - o.apex*Math.pow(-d.y,1.7); p.x*=k; p.z*=k; } if (o.flatBack && d.z<0) p.z*=o.flatBack; if (o.flatTop && d.y>0) p.y*=o.flatTop; p.x*=o.r[0]; p.y*=o.r[1]; p.z*=o.r[2]; return p; },
      disp: p => o.amp*Kit.fbm(p.x*o.f+o.seed, p.y*o.f, p.z*o.f, 3) });
    const m = new THREE.Mesh(g, o.mat); m.position.set(...o.c); if (o.rot) m.rotation.set(...o.rot); return m; };

  /* --- cámaras --- */
  /* Masa ventricular única, dividida por el plano del tabique: surcos interventriculares sin costuras */
  const VR = [1.45,1.72,1.22], VC = [0.25,-0.9,0.05], VROT = [-0.25,0,0.4];
  const sIV = (x,y,z) => 0.75*z - 0.62*x + 0.38*y;   // coordenadas normalizadas; >0.05 → ventrículo derecho
  const vg = Kit.sculpt({ shape: d => { const p = d.clone(); if (d.y<0){ const k = 1 - 0.6*Math.pow(-d.y,1.6); p.x*=k; p.z*=k; } if (d.y>0) p.y*=0.72; if (d.z<0) p.z*=0.85; return p.multiply(V3(VR)); },
    disp: (p,d) => { const n = d; const sv = sIV(n.x, n.y, n.z) - 0.05; return 0.028*Kit.fbm(p.x*2+1, p.y*2, p.z*2, 3) - 0.07*Math.exp(-Math.pow(sv/0.06,2)); }, store: (p,d) => sIV(d.x,d.y,d.z) - 0.05 });
  const vParts = Kit.splitPlane(vg, i => vg.userData.extra[i], 'lv', 'rv');
  const lv = new THREE.Mesh(vParts.lv, muscle(0xffffff)), rv = new THREE.Mesh(vParts.rv, muscle(0xfff2ef));
  [lv, rv].forEach(m => { m.position.set(...VC); m.rotation.set(...VROT); });
  const conus = chamber({ r:[0.4,0.66,0.38], c:[0.04,0.12,0.66], rot:[-0.15,0,-0.5], amp:0.025, f:2.4, seed:5, mat:rv.material });
  const ra = chamber({ r:[0.82,0.86,0.76], c:[-1.12,0.62,-0.05], amp:0.04, f:3.2, seed:7, mat:muscle(0xf4dde2,'atrium') });
  const raA = chamber({ r:[0.62,0.26,0.3], c:[-0.6,1.05,0.5], rot:[0.3,-0.75,0.5], amp:0.035, f:5, seed:9, mat:ra.material });
  const la = chamber({ r:[0.86,0.62,0.7], c:[0.7,0.8,-0.65], amp:0.04, f:3.0, seed:11, mat:muscle(0xf6e2e4,'atrium') });
  const laA = chamber({ r:[0.56,0.22,0.28], c:[1.25,0.85,0.25], rot:[0.2,0.6,-0.6], amp:0.035, f:5, seed:13, mat:la.material });
  const tag = (arr, sub) => { arr.forEach(m => m.userData.sub = sub); return arr; };
  raA.userData.sub = 'orejuela'; laA.userData.sub = 'orejuela'; conus.userData.sub = 'cono';
  add('ventriculo-izquierdo', [lv]); add('ventriculo-derecho', [rv, conus]); add('auricula-derecha', [ra, raA]); add('auricula-izquierda', [la, laA]);
  const sep = chamber({ r:[0.07,0.95,0.62], c:[0,0,0], amp:0.01, f:3, seed:15, mat:muscle(0xd8b0b0) });
  { const nl = new THREE.Vector3(-0.62/VR[0], 0.38/VR[1], 0.75/VR[2]).normalize(); const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(...VROT)); const nw = nl.clone().applyQuaternion(q);
    const cl = new THREE.Vector3(0.0, -0.1*VR[1], (0.05+0.38*0.25)/0.75*VR[2]).applyQuaternion(q).add(V3(VC)); sep.position.copy(cl); sep.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), nw).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), 0)); }
  add('tabique', [sep], { explodeDir:new THREE.Vector3(0,0,1) });

  /* --- grandes vasos --- */
  const artMat = () => Kit.tissue({ tex:'artery', rep:[5,1], bump:0.01, coat:0.75, coatRough:0.22, rough:0.35 });
  const veinMat = () => Kit.tissue({ tex:'vein', rep:[5,1], bump:0.01, coat:0.75, coatRough:0.22, rough:0.35 });
  const vessel = (pts, r0, r1, m, caps, lumen, o={}) => { const g = Kit.taper(pts, r0, r1, o); const c = g.userData.curve; const out = [new THREE.Mesh(g, m)]; if (caps.includes(1)) out.push(...Kit.cap(c, true, g.userData.r1, m, lumen)); if (caps.includes(0)) out.push(...Kit.cap(c, false, g.userData.r0, m, lumen)); return out; };
  const LA_ = 0x3a0d0c, LV_ = 0x141a36;
  const aM = artMat();
  const aorta = [
    ...tag(vessel([[0.1,0.35,-0.1],[-0.2,1.4,0.1],[-0.3,2.3,0.05],[0.0,3.05,-0.3],[0.75,3.0,-0.85],[1.05,2.3,-1.25],[1.05,1.0,-1.35],[1.0,-1.0,-1.4],[0.95,-2.6,-1.4]], 0, 0, aM, [1], LA_, { rfn:u => 0.27 + 0.07*Math.exp(-Math.pow((u-0.03)/0.04,2)) + 0.04*(1-u), seg: low?60:120 }),'main'),
    ...tag(vessel([[-0.05,2.95,-0.2],[-0.3,3.55,-0.2],[-0.5,4.05,-0.15]], 0.17, 0.14, aM, [1], LA_),'bt'),
    ...tag(vessel([[0.32,3.08,-0.45],[0.36,3.6,-0.47],[0.38,4.0,-0.48]], 0.12, 0.11, aM, [1], LA_),'cci'),
    ...tag(vessel([[0.6,3.02,-0.72],[0.8,3.5,-0.8],[0.95,3.9,-0.82]], 0.13, 0.12, aM, [1], LA_),'sci')
  ];
  add('aorta', aorta);
  const pM = veinMat();
  add('arteria-pulmonar', [
    ...tag(vessel([[0.3,0.62,0.72],[0.42,1.3,0.52],[0.45,1.9,0.12]], 0.35, 0.31, pM, [], LV_),'tronco'),
    ...tag(vessel([[0.45,1.9,0.12],[1.1,2.05,-0.25],[1.95,2.0,-0.35]], 0.28, 0.22, pM, [1], LV_),'izq'),
    ...tag(vessel([[0.45,1.9,0.12],[-0.1,1.95,-0.6],[-1.2,1.9,-0.68],[-2.3,1.85,-0.6]], 0.27, 0.22, pM, [1], LV_),'der')
  ]);
  const cM = veinMat();
  add('vena-cava-superior', vessel([[-1.05,3.4,0.0],[-1.12,2.4,0.05],[-1.15,1.45,0.02]], 0.27, 0.28, cM, [0], LV_));
  add('vena-cava-inferior', vessel([[-1.15,0.2,-0.15],[-1.2,-0.9,-0.4],[-1.25,-2.4,-0.45]], 0.3, 0.3, veinMat(), [1], LV_));
  const pvM = artMat();
  add('venas-pulmonares', [
    ...tag(vessel([[0.2,1.0,-1.05],[-0.7,1.15,-1.25],[-1.7,1.25,-1.2]], 0.15, 0.13, pvM, [1], LA_),'der'),
    ...tag(vessel([[0.25,0.62,-1.05],[-0.7,0.58,-1.3],[-1.7,0.52,-1.25]], 0.15, 0.13, pvM, [1], LA_),'der'),
    ...tag(vessel([[1.3,1.0,-0.8],[1.9,1.2,-0.9],[2.5,1.35,-0.85]], 0.15, 0.13, pvM, [1], LA_),'izq'),
    ...tag(vessel([[1.3,0.62,-0.85],[1.9,0.58,-0.95],[2.5,0.52,-0.9]], 0.15, 0.13, pvM, [1], LA_),'izq')
  ]);

  /* --- vasos coronarios y grasa epicárdica, pegados a la superficie --- */
  const surf = [lv, rv, ra, la, raA, laA, conus]; const ctr = new THREE.Vector3(0.1,-0.4,0.1);
  const onSurf = (pts, n, lift) => Kit.snap(Kit.densify(pts, n), surf, ctr, lift);
  const corA = Kit.tissue({ color:0xC8352C, rough:0.3, coat:0.8, coatRough:0.2 }), corV = Kit.tissue({ color:0x4F5E9C, rough:0.32, coat:0.8, coatRough:0.2 }), fatM = Kit.tissue({ tex:'fat', rep:[8,1], bump:0.035, coat:0.6, rough:0.45, color:0xE8D2B0 });
  const cor = []; const route = (pts, n, r0, r1, m, lift=0.055) => { const s = onSurf(pts, n, lift); if (s.length>3){ const me = new THREE.Mesh(Kit.taper(s, r0, r1, { seg: low?24:48, rad:8 }), m); me.userData.sub = m===corA ? 'art' : 'ven'; cor.push(me); } return s; };
  const fat = (pts, n, r) => { const s = onSurf(pts, n, -0.06); if (s.length>3) { const g = Kit.taper(s, r, r*0.65, { seg: low?30:60, rad:12, bumpy:0.55, bf:10, seed:3 }); const me = new THREE.Mesh(g, fatM); me.userData.sub = 'grasa'; cor.push(me); } };

<script>
/* =====================================================================
   MODELO: CÉLULA ANIMAL DETALLADA (vista en corte, simplificada)
   Membrana de doble capa con proteínas, envoltura nuclear con poros,
   cromatina y nucléolo, mitocondrias abiertas con crestas, cisternas del
   RER con ribosomas, red del REL, Golgi con vesículas, lisosomas,
   centríolos 9×3 y citoesqueleto.
   ===================================================================== */
function buildCell(E){
  const low = E.low; const S = Object.fromEntries(BIO.cell.structures.map(s=>[s.id,s]));
  const add = (id, meshes, lblPos, extra={}) => { const p = E.addPart(id, meshes, Object.assign({ explodeDir: V3(lblPos).normalize() }, extra)); E.addLabel(id, S[id].nombre, lblPos); return p; };
  const R = Kit.rng(17);
  const CAM = new THREE.Vector3(0.37,0.32,0.87).normalize();
  const phiC = Math.atan2(CAM.z, -CAM.x);          // ángulo φ de la esfera que mira a la cámara
  const cutStart = (len) => phiC + (Math.PI*2 - len)/2;   // la cuña retirada queda centrada hacia la cámara
  const org = (color, o={}) => Kit.tissue(Object.assign({ color, rough:0.38, coat:0.7, coatRough:0.22 }, o));
  const xf = (g, pos, quat, scale) => { const m = new THREE.Matrix4().compose(pos, quat || new THREE.Quaternion(), scale || new THREE.Vector3(1,1,1)); g.applyMatrix4(m); return g; };
  const randDir = () => new THREE.Vector3(R()*2-1, R()*2-1, R()*2-1).normalize();
  const inCut = (p, c, ang=0.8) => { const d = p.clone().sub(c); d.y *= 0.4; return d.normalize().dot(CAM) > Math.cos(ang); };

  /* --- membrana plasmática: doble capa, corte en cuña, proteínas --- */
  const MS = [3.55, 2.95, 3.1];
  const mDisp = d => 0.07*Kit.fbm(d.x*1.6+3, d.y*1.6, d.z*1.6, 3);
  const shell = (k, cut) => Kit.sculpt({ w: low?64:110, h: low?44:80, phiStart: cut ? cutStart(1.5*Math.PI) : 0, phiLength: cut ? 1.5*Math.PI : Math.PI*2, shape: d => new THREE.Vector3(d.x*MS[0]*k, d.y*MS[1]*k, d.z*MS[2]*k), disp: (p,d) => mDisp(d)*k });
  const geo = { outCut: shell(1, true), outFull: shell(1, false), inCut: shell(0.975, true), inFull: shell(0.975, false) };
  const mOut = Kit.tissue({ tex:'membrane', rep:[8,5], bump:0.03, color:0x8FD0DA, transparent:true, opacity:0.42, rough:0.25, coat:0.9, coatRough:0.15, side:THREE.DoubleSide, depthWrite:false });
  const mIn = Kit.tissue({ color:0xC7ECEF, transparent:true, opacity:0.3, rough:0.3, coat:0.6, side:THREE.DoubleSide, depthWrite:false });
  const outer = new THREE.Mesh(geo.outCut, mOut), inner = new THREE.Mesh(geo.inCut, mIn); outer.renderOrder = 2; inner.renderOrder = 1;

  const rimGeo = (() => { const P = [], I = []; const edges = [cutStart(1.5*Math.PI), cutStart(1.5*Math.PI)+1.5*Math.PI]; let base = 0;
    edges.forEach(phi => { const N = 40; for (let i=0;i<=N;i++){ const th = i/N*Math.PI; const d = new THREE.Vector3(-Math.cos(phi)*Math.sin(th), Math.cos(th), Math.sin(phi)*Math.sin(th)); const e = 1 + mDisp(d)/Math.max(0.01, 1); [1,0.975].forEach(k => { const dd = mDisp(d)*k; P.push(d.x*(MS[0]*k)+d.x*dd, d.y*(MS[1]*k)+d.y*dd, d.z*(MS[2]*k)+d.z*dd); }); }
      for (let i=0;i<N;i++){ const a = base+i*2; I.push(a, a+1, a+2, a+1, a+3, a+2); } base += (N+1)*2; });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P,3)); g.setIndex(I); g.computeVertexNormals(); return g; })();
  const rim = new THREE.Mesh(rimGeo, Kit.tissue({ color:0x4FAFBF, rough:0.4, coat:0.5, side:THREE.DoubleSide }));
  // proteínas de membrana (mosaico fluido)
  const protG = THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.04, 0.08, 4, 8) : new THREE.CylinderGeometry(0.042, 0.042, 0.13, 10);
  const nProt = low ? 70 : 150; const prot = new THREE.InstancedMesh(protG, org(0x8C7CC4), nProt); const prot2 = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8), org(0xD6B06A), Math.floor(nProt*0.6));
  const dm = new THREE.Object3D(); let pi = 0, pj = 0;
  for (let i=0;i<nProt*2 && (pi<nProt || pj<prot2.count);i++){ const d = randDir(); const p = new THREE.Vector3(d.x*MS[0], d.y*MS[1], d.z*MS[2]).addScaledVector(d, mDisp(d)); if (inCut(p, new THREE.Vector3(), 0.78)) continue; dm.position.copy(p); dm.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d); dm.updateMatrix(); if (i%3 && pi<nProt) prot.setMatrixAt(pi++, dm.matrix); else if (pj<prot2.count) prot2.setMatrixAt(pj++, dm.matrix); }
  prot.count = pi; prot2.count = pj;
  [outer, inner, rim].forEach(m => m.userData.sub='bicapa'); prot.userData.sub = prot2.userData.sub = 'prot';
  add('membrana', [outer, inner, rim, prot, prot2], [2.7,2.7,1.0], { explodeDir:new THREE.Vector3(0,0,0), passThrough:true });

  /* --- citoplasma: citoesqueleto (microtúbulos desde el centrosoma) y gránulos --- */
  const CS = new THREE.Vector3(-0.35,1.3,0.75);
  const mts = []; for (let i=0;i<(low?26:48);i++){ const d = randDir(); const end = new THREE.Vector3(d.x*MS[0]*0.9, d.y*MS[1]*0.9, d.z*MS[2]*0.9); const mid = CS.clone().lerp(end, 0.5).add(randDir().multiplyScalar(0.35)); mts.push(Kit.taper([CS.clone().addScaledVector(d,0.2), mid, end], 0.012, 0.01, { seg:16, rad:4 })); }

  const gr = new THREE.BufferGeometry(); const gn = low?160:360; const ga = new Float32Array(gn*3); for (let i=0;i<gn;i++){ const d = randDir(), r = 0.35+R()*0.55; ga[i*3]=d.x*MS[0]*r; ga[i*3+1]=d.y*MS[1]*r; ga[i*3+2]=d.z*MS[2]*r; } gr.setAttribute('position', new THREE.BufferAttribute(ga,3));
  const gran = new THREE.Points(gr, new THREE.PointsMaterial({ color:0x9CCFD6, size:0.045, transparent:true, opacity:0.6, depthWrite:false }));
  add('citoplasma', [cyto, gran], [-3.0,-1.2,1.7], { pickable:false, explodeDir:new THREE.Vector3(0,0,0) });

  /* --- núcleo: doble envoltura con poros, cromatina --- */
  const NC = new THREE.Vector3(0.3,0.2,0), NR = 1.1;
  const nShell = (k, cut) => { const g = Kit.sculpt({ w: low?48:80, h: low?34:60, phiStart: cut ? cutStart(1.5*Math.PI) : 0, phiLength: cut ? 1.5*Math.PI : Math.PI*2, radii:[NR*k, NR*0.95*k, NR*k], disp:(p,d) => 0.03*Kit.fbm(d.x*2+9, d.y*2, d.z*2, 2) }); g.translate(NC.x,NC.y,NC.z); return g; };
  const ngeo = { outCut:nShell(1,true), outFull:nShell(1,false), inCut:nShell(0.94,true), inFull:nShell(0.94,false) };
  const nOut = new THREE.Mesh(ngeo.outCut, Kit.tissue({ tex:'membrane', rep:[4,3], bump:0.015, color:0x7E66CC, rough:0.35, coat:0.7, side:THREE.DoubleSide }));
  const nIn = new THREE.Mesh(ngeo.inCut, Kit.tissue({ color:0x5E4AA6, rough:0.5, coat:0.3, side:THREE.BackSide }));
  const poreN = low?50:110; const pores = new THREE.InstancedMesh(new THREE.TorusGeometry(0.05, 0.018, 6, 14), org(0xC9B8F2), poreN); let pc = 0;
  for (let i=0;i<poreN*3 && pc<poreN;i++){ const d = randDir(); if (d.dot(CAM) > 0.55) continue; dm.position.copy(NC).add(new THREE.Vector3(d.x*NR*1.005, d.y*NR*0.95*1.005, d.z*NR*1.005)); dm.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), d); dm.updateMatrix(); pores.setMatrixAt(pc++, dm.matrix); } pores.count = pc;
  const chrom = []; for (let i=0;i<(low?10:18);i++){ let p = NC.clone().add(randDir().multiplyScalar(R()*0.6)); const pts = [p.clone()]; for (let j=0;j<7;j++){ p = p.clone().add(randDir().multiplyScalar(0.28)); if (p.distanceTo(NC) > 0.9) p.sub(NC).multiplyScalar(0.8).add(NC); pts.push(p); } chrom.push(Kit.taper(pts, 0.035, 0.03, { seg:30, rad:5, bumpy:0.4, bf:20, seed:i })); }

<script>
/* =====================================================================

const smooth01 = v => v<0?0:v>1?1:v*v*(3-2*v);
const lin = v => Math.pow(Math.max(0,v), 2.2);
const gauss = (d,w) => Math.exp(-(d*d)/(w*w));

/* ============================== CEREBRO ============================== */
function buildBrain(E){
  const low = E.low; const D = BIO.brain; const S = Object.fromEntries(D.structures.map(s=>[s.id,s]));
  const add = (id, meshes, extra={}) => { const s=S[id]; const p = E.addPart(id, meshes, Object.assign({ capa:s.capa, interno:s.interno, explodeDir:V3(s.pos).sub(new THREE.Vector3(-0.3,-0.3,0)).normalize() }, extra)); E.addLabel(id, s.nombre, s.lbl); return p; };
  const LOBE = { 'lobulo-frontal':[0.86,0.52,0.47], 'lobulo-parietal':[0.86,0.68,0.40], 'lobulo-temporal':[0.52,0.66,0.80], 'lobulo-occipital':[0.58,0.74,0.52] };
  const GYR = [0.88,0.64,0.58], SUL = [0.40,0.17,0.17];
  const yS = x => -0.35 + (1.2 - x)*0.33, xC = y => -0.1 + (1.65 - y)*0.36, xO = y => -1.6 + 0.22*(y - 0.3);
  const lobeOf = (x,y) => (y < yS(x) && x > -1.55 && x < 1.45) ? 'lobulo-temporal' : x > xC(y) ? 'lobulo-frontal' : x < xO(y) ? 'lobulo-occipital' : 'lobulo-parietal';
  const hemis = {}; const natural = {}, coded = {};
  [1,-1].forEach(sg => {
    const cz = sg*0.2; const info = [];
    const g = Kit.sculpt({ w: low?120:200, h: low?90:150,
      shape: d => { const lat = d.z*sg; let x = 2.45*d.x, y = d.y>0 ? 1.62*d.y : 1.08*d.y; let z = lat>0 ? 1.5*d.z : 0.14*d.z; z *= 0.86 + 0.16*smooth01((0.7 - d.x)/1.2);
        if (d.y<0.15 && lat>-0.2) y -= 0.55*gauss(d.x-0.12,0.42)*smooth01((0.15-d.y)/0.5)*smooth01((lat+0.2)/0.5);
        if (d.x>0.35 && d.y<0) y += 0.3*smooth01((d.x-0.35)/0.45)*(-d.y);
        if (d.x<-0.45 && d.y<0) y += 0.22*smooth01((-d.x-0.45)/0.4)*(-d.y);
        return new THREE.Vector3(x, y+0.35, z+cz); },

        const dz = med*(-0.11*sul + 0.03*(1-sul)) - 0.1*b; info.push(Math.min(1, Math.pow(sul*med + b, 0.8))); return dz; },
      store: (p,d) => lobeOf(p.x, p.y-0.35) });
    const t = info; const nat = new Float32Array(g.attributes.position.count*3), cod = new Float32Array(nat.length);
    for (let i=0;i<g.attributes.position.count;i++){ const k = t[i], L = LOBE[g.userData.extra[i]]; const sh = 1 - 0.55*k; for (let c=0;c<3;c++){ nat[i*3+c] = lin(GYR[c]+(SUL[c]-GYR[c])*k); cod[i*3+c] = lin(L[c]*sh); } }

  [-2.65,-3.05,-3.45,-3.85].forEach((y,i) => [1,-1].forEach(sg => { const x = -0.64 - 0.02*i; const nv = new THREE.Mesh(Kit.taper([[x,y,sg*0.15],[x+0.05,y-0.12,sg*0.5],[x+0.12,y-0.35,sg*0.95]], 0.045, 0.03, { seg:12, rad:6 }), cordMat); nv.userData.sub = 'nervios'; cord.push(nv); }));

  /* estructuras profundas */
  const cc = new THREE.Mesh(Kit.taper([[1.1,0.3,0],[0.75,0.72,0],[0,0.88,0],[-0.8,0.7,0],[-1.12,0.38,0]], 0, 0, { rfn:u => 0.1 + 0.08*gauss(u,0.15) + 0.1*gauss(u-1,0.14) }), Kit.tissue({ color:0xF3EBDD, rough:0.4, coat:0.45 })); cc.scale.set(1,1,2.6);

function buildLungs(E){

  const lungMat = (tint) => Kit.tissue({ tex:'lung', rep:[4,3], bump:0.022, coat:0.7, coatRough:0.3, rough:0.5, color:tint });

  const vA = [...vesselA]; vA.push(Kit.taper([[0,1.5,0.45],[-0.45,1.35,0.45],[-0.9,1.15,0.35]], 0.17, 0.15), Kit.taper([[0,1.5,0.45],[0.5,1.4,0.45],[1.0,1.2,0.35]], 0.17, 0.15), Kit.taper([[0,1.2,0.6],[0,1.5,0.45]], 0.2, 0.18));

  sacs.forEach((sc, si) => { const cc = AC.clone().add(sc); for (let i=0;i<9;i++){ const dir = new THREE.Vector3(R()-0.5,R()-0.5,R()-0.5).normalize(); const r = 0.12 + R()*0.04; const c = cc.clone().addScaledVector(dir, 0.16); alvCenters.push(c); const g = new THREE.SphereGeometry(r, 18, 14); g.translate(c.x,c.y,c.z); alvGeos.push(g);
      for (let k=0;k<3;k++){ const ax = new THREE.Vector3(R()-0.5,R()-0.5,R()-0.5).normalize(); const u = new THREE.Vector3().crossVectors(ax, new THREE.Vector3(0,1,0.3)).normalize(); const v = new THREE.Vector3().crossVectors(ax, u); const a0 = R()*6, pts = []; for (let j=0;j<=10;j++){ const a = a0 + j/10*3.6; pts.push(c.clone().addScaledVector(u, Math.cos(a)*(r+0.012)).addScaledVector(v, Math.sin(a)*(r+0.012))); }

    const lay = h('div',{class:'layers'}); D.structures.forEach(s => lay.append(h('label',{class:'toggle'}, h('input',{type:'checkbox',checked:E?E.parts.get(s.id).visible:true,onchange:e=>E&&E.setVisible(s.id,e.target.checked)}), s.nombre)));

  function select(id, src){

    const seen = Store.s.seen['celula-animal'].length; if (seen>=6) Store.completeActivity('explorar-celula'); if (seen>=D.structures.length) Store.grantBadge('explorador-celular');

const RBC_STATIONS = [
  { id:'tejidos', n:'Tejidos', sat:75, view:'tissue', t:'Estás dentro de un glóbulo rojo en un capilar del músculo de la pierna. Acabas de entregar oxígeno a las células musculares y has recogido el dióxido de carbono que producen sus mitocondrias. Tu hemoglobina lleva ahora poco O₂: la sangre es oscura.', q:{ q:'¿De dónde proviene el CO₂ que acaba de recoger el glóbulo rojo?', ops:['Del aire que entra por la piel','De la respiración celular en las mitocondrias','De la digestión de los alimentos en el intestino'], ok:1, fb:'Las mitocondrias oxidan la glucosa para obtener ATP y liberan CO₂ como producto; ese CO₂ difunde a la sangre.', wrong:['La piel humana no realiza intercambio gaseoso significativo. Piensa en qué proceso celular produce CO₂.','La digestión no produce CO₂ directamente; el CO₂ aparece cuando la célula usa los nutrientes para obtener energía.'] } },
  { id:'venas', n:'Venas', sat:75, focus:'vena-cava-inferior', r:7, t:'Los capilares se reúnen en vénulas y luego en venas cada vez más grandes. La presión es muy baja aquí; las válvulas venosas y la contracción de los músculos de la pierna te empujan hacia arriba, contra la gravedad.', q:{ q:'¿Qué impide que la sangre de las venas de las piernas retroceda hacia abajo?', ops:['La fuerza de bombeo directa del corazón','Las válvulas venosas y la compresión de los músculos','La gravedad'], ok:1, fb:'La presión que llega a las venas es mínima. Las válvulas solo permiten el flujo hacia el corazón y los músculos actúan como una bomba al contraerse.', wrong:['El corazón bombea, pero la presión ya casi se ha agotado cuando la sangre llega a las venas de las piernas.','La gravedad empuja la sangre hacia abajo: es justo el problema que las válvulas resuelven.'] } },
  { id:'vena-cava', n:'Vena cava', sat:75, focus:'vena-cava-inferior', r:6, t:'Entras en la vena cava inferior, la vena más ancha del cuerpo. Aquí se junta toda la sangre desoxigenada de la mitad inferior del cuerpo. La vena cava superior trae la de la cabeza y los brazos. Ambas desembocan en la misma cámara.' },
  { id:'ad', n:'Aurícula derecha', sat:75, focus:'auricula-derecha', r:6, t:'Llegas a la aurícula derecha. Sus paredes son delgadas. Sientes un pequeño impulso: el nodo sinoauricular acaba de disparar y la aurícula se contrae.', dec:{ q:'La aurícula se contrae. ¿Hacia dónde continúa el glóbulo rojo?', ops:[ {t:'Al ventrículo derecho, atravesando la válvula tricúspide', ok:true}, {t:'A la aurícula izquierda, a través del tabique', fb:'Aún no. El tabique interauricular separa por completo ambas aurículas después del nacimiento: la sangre pobre en oxígeno nunca pasa directamente al lado izquierdo. Observa que debajo de la aurícula hay un ventrículo.'}, {t:'Directamente a la arteria pulmonar', fb:'Todavía no. La aurícula no tiene fuerza para enviar la sangre a los pulmones; esa tarea corresponde al ventrículo derecho, que está justo debajo.'} ] } },
  { id:'vd', n:'Ventrículo derecho', sat:75, focus:'ventriculo-derecho', r:6, t:'Estás en el ventrículo derecho. La válvula tricúspide se cierra detrás de ti (primer ruido cardíaco) y la pared muscular se contrae con fuerza moderada: los pulmones están muy cerca y no hace falta mucha presión.', dec:{ q:'El ventrículo derecho se contrae. ¿Por qué vaso sale el glóbulo rojo?', ops:[ {t:'Por la aorta', fb:'No. La aorta nace del ventrículo izquierdo. El tabique interventricular impide el paso entre ventrículos; el derecho tiene su propia salida.'}, {t:'Por la arteria pulmonar', ok:true}, {t:'De regreso por la vena cava', fb:'No. Las venas cavas traen sangre hacia el corazón y la válvula tricúspide se cierra durante la contracción justamente para evitar el retroceso.'} ] } },
  { id:'ap', n:'Arteria pulmonar', sat:75, focus:'arteria-pulmonar', r:6, t:'Atraviesas la válvula pulmonar y entras en el tronco pulmonar, que se divide en dos: una arteria para cada pulmón. Sigues llevando poco oxígeno.', q:{ q:'La arteria pulmonar transporta sangre…', ops:['rica en oxígeno, como todas las arterias','pobre en oxígeno, aunque es una arteria'], ok:1, fb:'Arteria significa "sale del corazón", no "lleva oxígeno". La arteria pulmonar es la excepción que confirma la regla: sale del corazón con sangre desoxigenada rumbo a los pulmones.', wrong:['Revisa el color con que se representa este vaso en el modelo: sale del ventrículo derecho con la misma sangre que llegó por las venas cavas.'] } },
  { id:'pulmones', n:'Pulmones · intercambio gaseoso', sat:75, view:'lung', t:'Estás en un capilar pulmonar, pegado a un alvéolo. Solo una capa de células te separa del aire recién inspirado, rico en O₂ y pobre en CO₂. Los gases se mueven por difusión: de donde hay más hacia donde hay menos.' },
  { id:'vp', n:'Venas pulmonares', sat:98, focus:'venas-pulmonares', r:6, t:'Sales del pulmón por una de las cuatro venas pulmonares con la hemoglobina casi saturada (≈98 %). La sangre es ahora de color rojo brillante. Son las únicas venas que transportan sangre oxigenada.' },
  { id:'ai', n:'Aurícula izquierda', sat:98, focus:'auricula-izquierda', r:6, t:'Llegas a la aurícula izquierda. Se contrae a la vez que la derecha: ambos lados del corazón laten sincronizados, aunque manejan sangre distinta.', dec:{ q:'¿Qué válvula debe atravesar el glóbulo rojo para llegar al ventrículo izquierdo?', ops:[ {t:'La válvula tricúspide', fb:'No. La tricúspide está en el lado derecho (truco: "tri" y "derecha" comparten la letra r… y la tricúspide siempre está a la derecha). En el lado izquierdo la válvula tiene dos valvas.'}, {t:'La válvula mitral (bicúspide)', ok:true}, {t:'La válvula aórtica', fb:'No. La aórtica está a la salida del ventrículo izquierdo, no a su entrada. Primero hay que entrar al ventrículo.'} ] } },
  { id:'vi', n:'Ventrículo izquierdo', sat:98, focus:'ventriculo-izquierdo', r:6, t:'Estás en la cámara más poderosa. Su pared es hasta tres veces más gruesa que la del ventrículo derecho. Cuando se contrae genera unos 120 mmHg: suficiente para llevarte hasta los dedos de los pies o al cerebro.', q:{ q:'¿Por qué el ventrículo izquierdo necesita una pared tan gruesa?', ops:['Porque bombea más sangre por latido que el derecho','Porque debe generar más presión: el circuito hacia todo el cuerpo es largo y resistente','Porque el ventrículo izquierdo late más rápido'], ok:1, fb:'Ambos ventrículos expulsan el mismo volumen por latido y laten al mismo ritmo; la diferencia es la presión necesaria para recorrer todo el cuerpo.', wrong:['Ambos ventrículos bombean el mismo volumen; si no, la sangre se acumularía en un circuito.','Ambos ventrículos laten simultáneamente y al mismo ritmo.'] } },
  { id:'aorta', n:'Aorta', sat:98, focus:'aorta', r:7, t:'La válvula aórtica se abre y sales disparado a la aorta. Sus paredes elásticas se distienden con cada latido y se retraen después, manteniendo el flujo continuo. Desde el arco aórtico salen ramas hacia la cabeza y los brazos; la aorta descendente reparte el resto.' },
  { id:'tejidos2', n:'Tejidos', sat:98, view:'tissue2', t:'Regresas a un capilar del músculo. Las células están usando O₂ en sus mitocondrias y produciendo CO₂. Entregas el oxígeno y recoges el CO₂. El ciclo empieza otra vez: el recorrido completo dura menos de un minuto en reposo.' }
];

  function rbcBox(sat){ const col = sat>90 ? 'var(--oxy)' : 'var(--deoxy)'; return h('div',{class:'rbc',style:`--rbc:${col}`}, h('div',{class:'cell3'}), h('div',{style:'flex:1'}, h('div',{class:'row',style:'justify-content:space-between'}, h('b',{},'Glóbulo rojo'), h('span',{class:'sat'},`Saturación de O₂: ${sat} %`)), h('div',{class:'o2bar'}, h('i',{style:`left:${sat}%`})), h('div',{class:'small muted'},sat>90?'Hemoglobina cargada de O₂ · sangre rojo brillante':'Hemoglobina con poco O₂ · transporta CO₂ · sangre oscura'))); }
  function renderRoute(){ routeEl.innerHTML=''; RBC_STATIONS.forEach((s,i)=>routeEl.append(h('span',{class: i<idx?'done': i===idx&&!finished?'now':''},s.n.split(' ·')[0]))); }

    </defs>
    <path d="M194 0 C196 18 198 26 201 40 L221 40 C224 26 226 18 228 0 Z" fill="#EAD7C5" stroke="#C7B09A" stroke-width="1.2"/>

/* ---------- Recorrido guiado (globos sobre la interfaz) ---------- */
const TOUR = [
  { sel:'#nav-main', t:'Tus áreas de Ciencias Naturales', d:'Mundo celular, Cuerpo humano y salud, Genética y evolución, Biodiversidad y ecosistemas. Debajo están las actividades transversales.', pos:'right' },
  { sel:'.areas-grid', t:'Entra por tu área', d:'Cada tarjeta muestra cuántos recursos tienes disponibles y tu avance en ese tema.', pos:'bottom', go:'#/' },
  { sel:'.prog', t:'Primero se explora; después se explica', d:'Todos los recursos siguen estos 7 pasos. Toca cualquiera para ver cómo se vive con el corazón.', pos:'top' },
  { sel:'#btn-bell', t:'Tus avisos', d:'Aquí aparecen los recordatorios amables: lo que quedó a medias y lo que está por vencer. Sin alarmas ni castigos.', pos:'bottom' },
  { sel:'#btn-a11y', t:'Mi forma de aprender', d:'Letra más grande, tipografía legible, alto contraste, menos movimiento y lectura en voz alta.', pos:'bottom' },
  { sel:'#search-input', t:'Busca cualquier cosa', d:'Escribe "mitocondria", "ventrículo" o "fotosíntesis" y llegas directo.', pos:'bottom' },
  { sel:'#crumbs, .view', t:'Si te pierdes, mira el mapa', d:'Arriba siempre sabrás dónde estás y tendrás un enlace al mapa de la plataforma.', pos:'bottom' }
];
function startTour(i){
  const coach = $('#coach'), hole = $('#coach-hole'), card = $('#coach-card');
  let idx = i || 0;
  const end = () => { coach.hidden = true; Store.ses.tour = true; Store.save(); window.removeEventListener('resize', place); window.removeEventListener('scroll', place); };
  function place(){
    const st = TOUR[idx]; const el = st.sel.split(',').map(s=>$(s.trim())).find(Boolean);
    if (!el) return next();
    const r = el.getBoundingClientRect();
    const pad = 6, top = Math.max(4, r.top-pad), left = Math.max(4, r.left-pad);
    Object.assign(hole.style, { top:top+'px', left:left+'px', width:(r.width+pad*2)+'px', height:(r.height+pad*2)+'px' });
    const cw = Math.min(340, window.innerWidth-24);
    let ct = r.bottom + 14, cl = Math.min(Math.max(12, r.left), window.innerWidth-cw-12);
    if (st.pos==='right' && window.innerWidth>900){ ct = Math.max(12, r.top+16); cl = Math.min(r.right+16, window.innerWidth-cw-12); }
    if (st.pos==='top' || ct + 190 > window.innerHeight) ct = Math.max(12, r.top - 180);
    Object.assign(card.style, { top:ct+'px', left:cl+'px', width:cw+'px' });
  }
  function render(){
    const st = TOUR[idx];
    if (st.go && !location.hash.startsWith(st.go.replace('#',''))) { if (location.hash !== st.go) { navigate(st.go); } }
    card.innerHTML='';
    card.append(h('span',{class:'eyebrow'},`Paso ${idx+1} de ${TOUR.length}`), h('h3',{},st.t), h('p',{},st.d),
      h('div',{class:'row',style:'justify-content:space-between;margin-top:6px'},
        h('button',{class:'btn sm ghost',onclick:end},'Saltar'),
        h('div',{class:'row',style:'gap:6px'},
          idx>0 ? h('button',{class:'btn sm',onclick:()=>{ idx--; render(); }},'←') : null,
          h('button',{class:'btn sm primary',onclick:next}, idx===TOUR.length-1 ? 'Terminar' : 'Siguiente →'))));
    const el = TOUR[idx].sel.split(',').map(s=>$(s.trim())).find(Boolean);
    if (el) el.scrollIntoView({ block:'center', behavior: Store.s.a11y.motion ? 'auto':'smooth' });
    setTimeout(place, 220);
  }
  function next(){ if (idx >= TOUR.length-1) return end(); idx++; render(); }
  coach.hidden = false; render();
  window.addEventListener('resize', place); window.addEventListener('scroll', place, { passive:true });
  coach.onclick = e => { if (e.target === coach) end(); };
  document.addEventListener('keydown', function esc(e){ if (e.key==='Escape'){ end(); document.removeEventListener('keydown', esc); } });
}

/* sugerencia de siguiente paso: primero lo vencido, luego el reto a medias, luego lo no empezado */
function nextStep(){
  const av = Store.avisos();
  const venc = av.find(a=>a.tipo==='vencimiento'); if (venc) return { em:'📌', t:venc.t, d:venc.d || 'Tarea asignada por tu docente.', href:venc.href };
  const reto = av.find(a=>a.tipo==='reto'); if (reto) return { em:'🎯', t:reto.t, d:reto.d, href:reto.href };
  const mine = BIO.areas.filter(a=>Store.areaStatus(a)==='actual');
  const res = mine.flatMap(a=>areaRes(a.id)).find(r => r.ok && r.act && !Store.s.activities[r.act]?.done);
  if (res) return { em:res.em, t:res.t, d:res.reto || res.d, href:res.href };
  return { em:'🗺', t:'Explora tu área', d:'Abre un modelo 3D y cumple su reto.', href: mine[0] ? '#/area/'+mine[0].id : '#/explorar' };
}

  importados(){ return Users.ofCourse(DOC.year, DOC.par); },

      const dias = vivo ? Store.daysAway() : (u.ultimoAcceso ? Math.floor((Date.now()-u.ultimoAcceso)/86400000) : null);
      return { id:u.codigo, nombre:u.nombre + (vivo?' (en vivo)':''), year:u.year, paralelo:u.paralelo, email:u.email,
        rep:u.rep || 'Representante', repTel:(u.tel||'0990000000').replace(/\D/g,'') || '0990000000',
        notas, dias, min: vivo ? Store.s.timeMin + Math.round(Store.s.events.length*0.4) + 186 : 0,

<script>
