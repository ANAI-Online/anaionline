/* ============================== PULMONES ============================== */
function buildLungs(E){
  const low = E.low; const D = BIO.lungs; const S = Object.fromEntries(D.structures.map(s=>[s.id,s]));
  const add = (id, meshes, extra={}) => { const s=S[id]; const p = E.addPart(id, meshes, Object.assign({ capa:s.capa, explodeDir:V3(s.pos).sub(new THREE.Vector3(0,0.3,0)).normalize() }, extra)); E.addLabel(id, s.nombre, s.lbl); return p; };
  const R = Kit.rng(5);
  const cart = () => Kit.tissue({ tex:'cartilage', rep:[3,1], bump:0.01, coat:0.55, coatRough:0.3, rough:0.4 });

  /* --- laringe --- */
  const lm = cart();
  const thy = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.38, 0.72, 28, 6, true, -0.66*Math.PI, 1.32*Math.PI), lm); { const p = thy.geometry.attributes.position; for (let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i), y=p.getY(i); if (z>0) p.setZ(i, z + 0.12*Math.exp(-x*x/0.02)*(0.6+y)); } thy.geometry.computeVertexNormals(); } thy.material.side = THREE.DoubleSide; thy.position.set(0,4.0,0.05);
  const cri = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.08, 10, 32), lm); cri.rotation.x = Math.PI/2; cri.position.set(0,3.55,0);
  const epi = new THREE.Mesh(Kit.sculpt({ radii:[0.24,0.36,0.05], w:28, h:20 }), cart()); epi.position.set(0,4.45,-0.2); epi.rotation.x = -0.35;
  const hyo = new THREE.Mesh(Kit.taper([[-0.5,4.58,-0.25],[-0.38,4.62,0.28],[0,4.62,0.44],[0.38,4.62,0.28],[0.5,4.58,-0.25]], 0.05, 0.05, { seg:30, rad:8 }), Kit.tissue({ color:0xEDE4D2, rough:0.35, coat:0.4 }));
  add('laringe', [thy, cri, epi, hyo]);

  /* --- tráquea con anillos en C --- */
  const ringGeos = []; const ringArc = 1.62*Math.PI;
  const cRing = (pos, dir, r) => { const g = new THREE.TorusGeometry(r, 0.052, 8, 26, ringArc); g.rotateX(Math.PI/2); const gc = new THREE.Vector3(Math.cos(ringArc+ (2*Math.PI-ringArc)/2), 0, Math.sin(ringArc+(2*Math.PI-ringArc)/2)); const phi = Math.atan2(0,-1) - Math.atan2(gc.x, gc.z); g.rotateY(phi); const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize()); g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(q)); g.translate(pos.x,pos.y,pos.z); ringGeos.push(g); };
  for (let y=3.35; y>1.75; y-=0.2) cRing(new THREE.Vector3(0,y,0), new THREE.Vector3(0,1,0), 0.31);
  const trM = new THREE.Mesh(Kit.merge(ringGeos.splice(0)), cart());
  const memb = new THREE.Mesh(Kit.taper([[0,3.48,0],[0,2.5,0],[0,1.62,0]], 0.29, 0.29), Kit.tissue({ color:0xD9A79C, rough:0.5, coat:0.4, tex:'tissue', rep:[3,1], bump:0.006 }));
  add('traquea', [trM, memb]);

  /* --- pulmones: forma real, cisuras, lóbulos --- */
  const lungs = {}; const C = { R:new THREE.Vector3(-1.75,-0.25,0.05), L:new THREE.Vector3(1.75,-0.3,0.05) };
  const yO = Z => -0.35 - 0.72*Z;
  const lungMesh = (side) => { const s = side==='R' ? -1 : 1; const info = [];
    const g = Kit.sculpt({ w: low?72:128, h: low?56:100,
      shape: d => { const dl = d.x*s; const k = d.y>0 ? 1 - 0.45*Math.pow(d.y,1.3) : 1; let X = (dl>0 ? 1.2 : 0.8)*dl*k, Z = (d.z>0 ? 1.22 : 1.42)*d.z*k; let y = d.y>0 ? 2.25*d.y : 2.3*d.y;
        if (d.y<-0.15) y += 1.15*Math.exp(-((X+0.05)*(X+0.05)/0.45 + Z*Z/0.7))*smooth01((-d.y-0.15)/0.5);
        if (dl<0) X += 0.22*Math.exp(-((y-0.15)*(y-0.15)/0.35 + Z*Z/0.22));
        if (s>0 && dl<0 && y<0.7) X += 0.5*Math.exp(-((y+0.55)*(y+0.55)/0.55 + (Z-0.65)*(Z-0.65)/0.45));
        if (s<0 && dl<0 && y<0.4) X += 0.18*Math.exp(-((y+0.7)*(y+0.7)/0.5 + (Z-0.5)*(Z-0.5)/0.5));
        return new THREE.Vector3(s*X, y, Z); },
      disp: (p) => { let b = 0.9*gauss(p.y - yO(p.z), 0.06); if (s<0 && p.y > yO(p.z)) b = Math.max(b, 0.8*gauss(p.y-0.35, 0.05)*smooth01((p.z+0.6)/0.4)); info.push(b); return 0.018*Kit.fbm(p.x*2.2+s, p.y*2.2, p.z*2.2, 3) - 0.1*b; },
      store: (p) => p.y < yO(p.z) ? 'inf' : (s<0 && p.y < 0.35 ? 'med' : 'sup') });
    return { g, parts: Kit.split(g, i => g.userData.extra[i]) }; };
  const lungMat = (tint) => Kit.tissue({ tex:'lung', rep:[4,3], bump:0.022, coat:0.7, coatRough:0.3, rough:0.5, color:tint });
  ['R','L'].forEach(side => { const { g, parts } = lungMesh(side); const m = lungMat(side==='R' ? 0xffffff : 0xfff4f2); lungs[side] = { g, meshes: Object.values(parts).map(pg => { const me = new THREE.Mesh(pg, m); me.position.copy(C[side]); return me; }) }; });
  add('pulmon-derecho', lungs.R.meshes); add('pulmon-izquierdo', lungs.L.meshes);
  const plM = () => new THREE.MeshPhysicalMaterial({ color:0xA9D2E6, transparent:true, opacity:0.08, roughness:0.12, clearcoat:1, depthWrite:false, side:THREE.DoubleSide });
  const pleura = ['R','L'].map(side => { const me = new THREE.Mesh(lungs[side].g, plM()); me.position.copy(C[side]); me.scale.setScalar(1.045); return me; });
  add('pleura', pleura, { passThrough:true, explodeDir:new THREE.Vector3(0,0,0) });

  /* --- árbol bronquial ramificado --- */
  const inside = (p, side) => { const c = C[side]; const dx = (p.x-c.x)/1.05, dy = (p.y-c.y)/(p.y>c.y?2.0:1.7), dz = (p.z-c.z)/1.15; return dx*dx+dy*dy+dz*dz < 0.82; };
  const bigGeos = [], smallGeos = [], jointGeos = [], airPaths = [], vesselA = [], vesselV = [];
  const tubeSeg = (a, b, r0, r1, list, bend) => { const mid = a.clone().lerp(b, 0.5).add(bend || new THREE.Vector3()); list.push(Kit.taper([a, mid, b], r0, r1, { seg: 10, rad: low?6:8 })); const j = new THREE.SphereGeometry(r1*1.02, 8, 6); j.translate(b.x,b.y,b.z); jointGeos.push(j); };
  const maxGen = low ? 3 : 4;
  const branch = (side, start, dir, len, r, gen, path) => {
    let end = start.clone().addScaledVector(dir, len); let tries = 0; while (!inside(end, side) && tries < 6){ dir.lerp(C[side].clone().sub(start).normalize(), 0.35).normalize(); len *= 0.8; end = start.clone().addScaledVector(dir, len); tries++; }
    tubeSeg(start, end, r, r*0.86, gen<=0 ? bigGeos : smallGeos, new THREE.Vector3((R()-0.5)*0.06,(R()-0.5)*0.06,(R()-0.5)*0.06));
    if (gen <= 1){ const perp = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,0,1)).normalize().multiplyScalar(r*1.6 + 0.03); vesselA.push(Kit.taper([start.clone().add(perp), end.clone().add(perp)], r*0.95, r*0.8, { seg:8, rad:6 })); }
    const p2 = path.concat([end]);
    if (gen >= maxGen){ airPaths.push(p2); return; }
    for (let k=0;k<2;k++){ const axis = new THREE.Vector3(R()-0.5,R()-0.5,R()-0.5).cross(dir).normalize(); const nd = dir.clone().applyAxisAngle(axis, (k? -1:1)*(0.45+R()*0.3)).normalize(); branch(side, end, nd, len*0.74, r*0.7, gen+1, p2); }
  };
  const carina = new THREE.Vector3(0,1.6,0);
  const mainR = new THREE.Vector3(-0.85,1.02,0), mainL = new THREE.Vector3(1.0,0.82,0);
  const bronchi = [];
  bronchi.push(Kit.taper([carina, carina.clone().lerp(mainR,0.5).add(new THREE.Vector3(0,0.05,0)), mainR], 0.2, 0.17), Kit.taper([carina, carina.clone().lerp(mainL,0.5).add(new THREE.Vector3(0,0.08,0)), mainL], 0.19, 0.16));
  for (let t=0.25;t<0.9;t+=0.3){ cRing(carina.clone().lerp(mainR,t), mainR.clone().sub(carina), 0.2); cRing(carina.clone().lerp(mainL,t), mainL.clone().sub(carina), 0.19); }

<script>

function stageChrome(stage, E, opts){
  const top = h('div',{class:'stage-top'}), bottom = h('div',{class:'stage-bottom'});

  const reset = h('button',{class:'btn sm',onclick:()=>E && E.resetView(),title:'Restablecer vista','aria-label':'Restablecer vista'},'↺ Vista');
  const cap = h('button',{class:'btn sm',onclick:()=>{ if (!E) return toast('La captura requiere el modelo 3D.'); const img = E.capture(); Store.addNote('captura', opts.captureTxt(), {img}); Store.log('captura',{modelo:opts.model}); toast('Captura guardada en tu cuaderno de campo.'); }},'Capturar');
  const fs = h('button',{class:'btn sm',title:'Pantalla completa','aria-label':'Pantalla completa',onclick:()=>{ if (document.fullscreenElement) document.exitFullscreen(); else stage.requestFullscreen && stage.requestFullscreen(); }},'⛶');
  top.append(opts.left || h('span'), h('span',{class:'grow'}), lblBtn, reset, cap, fs);
  const phase = h('span',{class:'phase',style:'display:none'});
  bottom.append(phase, h('span',{class:'stage-note'},'Modelo simplificado con fines educativos'));
  stage.append(top, bottom);
  return { phase };
}

function organView(view, q, D, build){
  const S = Object.fromEntries(D.structures.map(s=>[s.id,s]));
  view.classList.add('wide');
  view.append(h('div',{class:'page-head',style:'margin-bottom:14px'}, h('div',{}, h('span',{class:'eyebrow anat'},D.eyebrow), h('h1',{},D.nombre), h('p',{},D.intro)), h('div',{class:'row'}, D.related.map(r => h('a',{class:'btn sm',href:r.href},r.t)))));

  let E=null, M=null, mode='libre', guideIdx=0, guideDone=false, selected=null, hidden=new Set(), tab='explorar', opacity=D.opacityDefault ?? 1;
  const modeSeg = h('div',{class:'segmented',role:'tablist'}, h('button',{role:'tab','aria-selected':'true',onclick:()=>setMode('libre')},'Exploración libre'), h('button',{role:'tab','aria-selected':'false',onclick:()=>setMode('guiada')},'Exploración guiada'));

  const chrome = stageChrome(stage, E, { left:modeSeg, model:D.id, captureTxt:()=>`Captura · ${D.nombre}${selected?` · ${S[selected].nombre}`:''}` });
  if (E && M) E.onFrame(()=>{ const t = M.phaseText ? M.phaseText() : ''; if (chrome.phase.textContent!==t) chrome.phase.textContent=t; chrome.phase.style.display = t ? '' : 'none'; });
  if (!E){ if (D.id==='corazon') stage.append(heart2D((id)=>select(id,'esquema'))); stage.append(h('div',{class:'notice info',style:'position:absolute;left:12px;right:12px;top:56px'},'WebGL no disponible: usa la lista de estructuras para explorar el contenido.')); }
  const applyOpacity = o => { opacity=o; if (M && M.setOpacity) M.setOpacity(o); else if (E) D.structures.forEach(s => { if (D.opacityCapas.includes(s.capa) && !s.interno) E.setOpacity(s.id, o); }); if (M) M.opacity = o; };
  if (E && opacity<1) applyOpacity(opacity);
  const setLayer = (capa,on) => { if (M && M.setLayer && D.id==='corazon') M.setLayer(capa,on); else D.structures.filter(s=>s.capa===capa).forEach(s => E && E.setVisible(s.id,on)); };

  const tabs = h('div',{class:'tabs',role:'tablist'}); const tabBody = h('div',{class:'stack'});
  const TABS = [['explorar','Explorar'],['capas','Capas'],['animacion','Animación'],['quiz','Quiz']];
  TABS.forEach(([id,t]) => tabs.append(h('button',{role:'tab','aria-selected':id===tab,onclick:()=>{ tab=id; renderTab(); }},t)));
  panel.append(h('div',{class:'card'},tabs,h('div',{style:'height:12px'}),tabBody));
  const listEl = h('ul',{class:'struct-list','aria-label':'Estructuras'});
  const seen = () => Store.s.seen[D.id] || [];
  function renderList(){ listEl.innerHTML=''; const sn = seen(); D.structures.forEach(s => listEl.append(h('li',{}, h('button',{'aria-pressed':selected===s.id,onclick:()=>select(s.id,'lista')}, h('span',{class:'sw',style:`background:${s.color}`}), s.nombre, sn.includes(s.id)?h('span',{class:'seen'},'✓'):null)))); }
  function renderTab(){ $$('button',tabs).forEach((b,i)=>b.setAttribute('aria-selected', TABS[i][0]===tab)); tabBody.innerHTML='';
    if (tab==='explorar'){ if (mode==='guiada') tabBody.append(guideBox()); tabBody.append(selected ? hotspotCard(S[selected]) : h('div',{class:'notice'},'Selecciona una estructura en el modelo, en una etiqueta o en la lista. Arrastra para rotar · rueda para acercar · Shift + arrastrar para desplazar · teclado: flechas, + y −.')); tabBody.append(h('div',{}, h('span',{class:'eyebrow'},'Estructuras'), listEl)); renderList(); }
    else if (tab==='capas') tabBody.append(layersBox());
    else if (tab==='animacion') tabBody.append(animBox());
    else tabBody.append(quizBox());
  }
  function hotspotCard(s){
    const capaN = (D.capas.find(c=>c.id===s.capa)||{}).n || '';
    return h('div',{class:'hcard stack',style:'gap:4px'},
      h('div',{class:'row',style:'justify-content:space-between'}, h('span',{class:'pill anat'},capaN), h('span',{class:'mono small muted'},`${seen().length}/${D.structures.length} exploradas`)),
      h('h3',{},s.nombre),
      h('div',{class:'q'},'¿Qué es? · ¿Qué hace?'), depthBlock(s),
      h('div',{class:'q'},'Dato importante'), h('p',{},s.dato),
      h('div',{class:'q'},'Conecta con'), h('div',{class:'conecta'}, s.conecta.map(id => S[id] ? h('button',{onclick:()=>select(id,'conecta')},'→ '+S[id].nombre) : null), (s.temas||[]).map(t => h('button',{style:'border-style:dashed',onclick:()=>toast(`Tema transversal: ${t}. Se relaciona con ${s.nombre}.`)},t))),
      h('div',{class:'ctrl-row',style:'margin-top:10px'},
        h('button',{class:'btn sm primary',onclick:()=>{ if (!M) return toast('Requiere el modelo 3D.'); const a = M.anims[0]; M.anims.forEach(x=>x.set(x===a || x.id==='flujo')); if (a.needsOpacity && opacity>a.needsOpacity+0.1) applyOpacity(a.needsOpacity); tab='animacion'; renderTab(); if (!a.focus) E.focus(V3(s.pos), D.focusR); Store.log('animacion',{modelo:D.id,estructura:s.id}); }},'Ver funcionamiento'),
        h('button',{class:'btn sm',onclick:()=>{ tab='quiz'; renderTab(); }},'Comprueba lo aprendido'),
        h('button',{class:'btn sm',onclick:()=>{ if(!E) return; D.structures.forEach(x=>E.setVisible(x.id, x.id===s.id)); hidden = new Set(D.structures.filter(x=>x.id!==s.id).map(x=>x.id)); toast(`Aislado: ${s.nombre}. Usa Capas → Mostrar todo para volver.`); }},'Aislar'),
        h('button',{class:'btn sm',onclick:()=>{ if(!E) return; E.setVisible(s.id,false); hidden.add(s.id); toast(`${s.nombre}: oculta.`); }},'Ocultar'),
        h('button',{class:'btn sm ghost',onclick:()=>{ Store.addNote('observacion', `${s.nombre}: ${s.n1} Dato: ${s.dato}`); toast('Guardado en tu cuaderno.'); }},'Guardar en cuaderno')));
  }
  function layersBox(){
    const box = h('div',{class:'stack'});
    const lay = h('div',{class:'layers'}); D.capas.forEach(c => { const on = D.structures.filter(s=>s.capa===c.id).some(s=>!hidden.has(s.id)); lay.append(h('label',{class:'toggle'}, h('input',{type:'checkbox',checked:on,onchange:e=>{ if(!E) return; setLayer(c.id, e.target.checked); D.structures.filter(s=>s.capa===c.id).forEach(s=> e.target.checked?hidden.delete(s.id):hidden.add(s.id)); const inner = D.structures.some(s=>s.capa===c.id && s.interno); if (inner && e.target.checked && opacity>0.6){ applyOpacity(0.35); op.value=35; opOut.value='35 %'; toast('Se activó la transparencia para ver las estructuras internas.'); } }}), c.n)); });
    if (M && M.colorModes){ const cm = h('div',{class:'segmented',role:'tablist',style:'align-self:flex-start'}); M.colorModes.forEach(c => cm.append(h('button',{role:'tab','aria-selected':M.colorMode===c.id,onclick:()=>{ M.setColorMode(c.id); $$('button',cm).forEach(b=>b.setAttribute('aria-selected', b.textContent===c.n)); Store.log('modo_color',{modelo:D.id,modo:c.id}); }},c.n))); box.append(h('span',{class:'eyebrow'},'Color'), cm); }
    box.append(h('span',{class:'eyebrow'},'Capas visibles'), lay);
    const op = h('input',{type:'range',min:10,max:100,value:Math.round(opacity*100),id:'op-range'}); const opOut = h('output',{},op.value+' %'); op.addEventListener('input',()=>{ opOut.value=op.value+' %'; applyOpacity(op.value/100); });
    const ex = h('input',{type:'range',min:0,max:100,value:0,id:'ex-range'}); const exOut = h('output',{},'0 %'); ex.addEventListener('input',()=>{ exOut.value=ex.value+' %'; E && E.setExplode(ex.value/100); });
    box.append(h('div',{class:'slider'}, h('label',{for:'op-range'},D.opacityLabel), opOut, op), h('div',{class:'slider'}, h('label',{for:'ex-range'},'Separar estructuras (vista explosionada)'), exOut, ex));
    box.append(h('div',{class:'ctrl-row'}, h('button',{class:'btn sm',onclick:()=>{ op.value=30; opOut.value='30 %'; applyOpacity(0.3); }},'Ver interior'), h('button',{class:'btn sm',onclick:()=>{ op.value=100; opOut.value='100 %'; applyOpacity(1); ex.value=0; exOut.value='0 %'; E && E.setExplode(0); }},'Vista sólida'), h('button',{class:'btn sm',onclick:()=>{ D.structures.forEach(s=>E&&E.setVisible(s.id,true)); hidden.clear(); renderTab(); }},'Mostrar todo')));
    if (hidden.size) box.append(h('p',{class:'small muted'},`Ocultas: ${[...hidden].map(id=>S[id].nombre).join(', ')}`));
    box.append(h('div',{class:'notice'},D.id==='corazon' ? 'Sugerencia: activa solo "Vasos" y separa las estructuras para ver por dónde entra y sale la sangre.' : D.id==='cerebro' ? 'Sugerencia: baja la transparencia de la corteza para ver el tálamo, el hipotálamo y el hipocampo.' : 'Sugerencia: oculta "Pulmones y pleura" para ver el árbol bronquial completo.'));
    return box;
  }
  function animBox(){
    const box = h('div',{class:'stack'}, h('span',{class:'eyebrow'},'Procesos dinámicos'));
    if (!M){ box.append(h('div',{class:'notice'},'Las animaciones requieren el modelo 3D.')); return box; }
    M.anims.forEach(a => { const inp = h('input',{type:'checkbox',checked:a.on}); inp.addEventListener('change',()=>{ a.set(inp.checked); if (inp.checked && a.needsOpacity && opacity>a.needsOpacity+0.1){ applyOpacity(a.needsOpacity); toast('Transparencia ajustada para ver el proceso dentro del órgano.'); } if (mode==='guiada' && !guideDone && D.guiada[guideIdx]?.tipo==='anim' && D.guiada[guideIdx].target===a.id && inp.checked) guideAdvance(true); Store.log('animacion',{modelo:D.id,animacion:a.id,activa:inp.checked}); }); box.append(h('label',{class:'toggle'},inp,a.label)); });
    const sp = h('input',{type:'range',min:25,max:250,value:100,id:'sp-range'}); const spOut = h('output',{},'1.0×'); sp.addEventListener('input',()=>{ spOut.value=(sp.value/100).toFixed(1)+'×'; M.setSpeed && M.setSpeed(sp.value/100); });
    box.append(h('div',{class:'slider'}, h('label',{for:'sp-range'},'Velocidad'), spOut, sp));
    (M.legend||[]).forEach(l => box.append(h('div',{class:'row small',style:'flex-wrap:nowrap'}, h('span',{class:'dot',style:`background:${l.color};flex:none`}), h('span',{},l.txt))));
    if (D.funciones && M.highlight){ const fx = h('div',{class:'conecta'}); D.funciones.forEach(f => fx.append(h('button',{onclick:()=>{ M.highlight(f.ids); toast(`${f.t}: intervienen ${f.ids.map(id=>S[id].nombre).join(', ')}.`, 4500); Store.log('funcion_cerebral',{funcion:f.t}); }},f.t))); box.append(h('span',{class:'eyebrow',style:'margin-top:6px'},'¿Qué se activa cuando…?'), fx); }
    if (M.observa) box.append(h('div',{class:'notice'},h('span',{},h('b',{},'Observa: '),M.observa)));
    if (!motionOK()) box.append(h('div',{class:'notice warn'},'Las animaciones están pausadas (botón ⏸ de la barra superior o preferencia del sistema).'));

  }
  function quizBox(){
    const box = h('div',{class:'stack'});
    if (!selected) box.append(h('div',{class:'notice'},'Selecciona una estructura para responder su pregunta de comprobación.'));
    else { const s = S[selected]; box.append(h('span',{class:'eyebrow'},'Comprueba · '+s.nombre), quizBlock(s.quiz, attempts => { Store.addXP(attempts===1?10:5, 'Comprobación: '+s.nombre); })); }

  function guideBox(){

    const st = D.guiada[guideIdx]; const box = h('div',{class:'guide-step stack',style:'gap:8px'}, h('div',{class:'row',style:'justify-content:space-between'}, h('b',{},`Paso ${guideIdx+1} de ${D.guiada.length}`), h('span',{class:'mono small muted'},'guiada')), h('p',{class:'small',html:st.txt}));

  function guideAdvance(stay){ guideIdx++; if (guideIdx>=D.guiada.length){ guideDone=true; Store.completeActivity(D.guidedActivity); toast('Exploración guiada completada.'); } else if (stay) toast('Paso completado. Vuelve a Explorar para ver el siguiente.'); if (!stay) { tab='explorar'; renderTab(); } }
  function setMode(m){ mode=m; $$('button',modeSeg).forEach((b,i)=>b.setAttribute('aria-selected', (i===0)===(m==='libre'))); tab='explorar'; renderTab(); Store.log('modo_exploracion',{modelo:D.id,modo:m}); }

    const n = seen().length; if (n>=D.seenThreshold) Store.completeActivity(D.activity); if (n>=D.structures.length) Store.grantBadge(D.badge);
    if (tab!=='explorar' && tab!=='quiz') tab='explorar'; renderTab();
  }
  function hint(target, picked){ const t=S[target], p=S[picked];
    if (D.id==='corazon' && t.capa==='camaras' && p.capa==='camaras'){ const tv = t.id.startsWith('ventriculo'), pv = p.id.startsWith('ventriculo'); if (tv!==pv) return tv ? 'Los ventrículos se encuentran en la región inferior del corazón.' : 'Las aurículas se encuentran en la región superior del corazón.'; return 'Recuerda que en la vista frontal el lado derecho del corazón queda a tu izquierda.'; }
    if (D.id==='corazon' && t.capa==='vasos') return 'Busca entre los vasos: los azules traen o llevan sangre pobre en oxígeno; los rojos, sangre rica en oxígeno.';
    if (t.capa!==p.capa) return `La estructura buscada está en la capa "${(D.capas.find(c=>c.id===t.capa)||{}).n}". ${p.nombre}: ${p.n1}`;
    return `${p.nombre}: ${p.n1} Observa de nuevo la posición y la función que buscas.`; }
  renderTab();

  return { unmount(){ E && E.dispose(); } };
}

route('/explorar/celula', (view, q) => {

  const stage = h('div',{class:'stage'}), panel = h('div',{class:'panel'});

  [['explorar','Explorar'],['capas','Capas'],['quiz','Quiz visual']].forEach(([id,t]) => tabs.append(h('button',{role:'tab','aria-selected':id===tab,onclick:()=>{ tab=id; renderTab(); }},t)));

  function card(s){

    const more = h('div',{class:'stack',style:'display:none'}, h('div',{class:'q'},'Nivel 3 · Profundizar'), h('p',{},s.n3));

    return h('div',{class:'hcard stack',style:'gap:4px'},
      h('div',{class:'row',style:'justify-content:space-between'}, h('span',{class:'pill cell'},'Organelo / componente'), h('span',{class:'mono small muted'},`${seenN}/${D.structures.length} explorados`)),
      h('h3',{},s.nombre),
      h('div',{class:'q'},'Función'), h('p',{},s.funcion),
      h('div',{class:'q'},'Estructura'), h('p',{},s.estructura),
      h('div',{class:'q'},'Relaciones'), h('p',{},s.relaciones),

        h('button',{class:'btn sm primary',onclick:()=>{ if (!M) return toast('Requiere el modelo 3D.'); actionTxt = `${s.accion.t}: ${s.accion.d} ` + (M.action(s.id)||''); act.textContent = actionTxt; act.style.display=''; Store.log('animacion',{modelo:'celula-animal',estructura:s.id,accion:s.accion.t}); }},'Ver en acción'),

    const ex = h('input',{type:'range',min:0,max:100,value:0,id:'cell-ex'}); const exOut = h('output',{},'0 %'); ex.addEventListener('input',()=>{ exOut.value=ex.value+' %'; E && E.setExplode(ex.value/100); });
    if (M && M.setCutaway){ const cutIn = h('input',{type:'checkbox',checked:M.cutaway}); cutIn.addEventListener('change',()=>{ M.setCutaway(cutIn.checked); Store.log('vista_corte',{modelo:'celula-animal',activa:cutIn.checked}); }); box.append(h('label',{class:'toggle'},cutIn,'Vista en corte (se retira una cuña para ver el interior)')); }
    box.append(h('div',{class:'slider'}, h('label',{for:'memb-op'},'Opacidad de la membrana'), opOut, op), h('div',{class:'slider'}, h('label',{for:'cell-ex'},'Separar organelos'), exOut, ex));
    const lay = h('div',{class:'layers'}); D.structures.forEach(s => lay.append(h('label',{class:'toggle'}, h('input',{type:'checkbox',checked:E?E.parts.get(s.id).visible:true,onchange:e=>E&&E.setVisible(s.id,e.target.checked)}), s.nombre)));
    box.append(h('span',{class:'eyebrow'},'Componentes visibles'), lay, h('button',{class:'btn sm',onclick:()=>{ D.structures.forEach(s=>E&&E.setVisible(s.id,true)); renderTab(); }},'Mostrar todo'));
    return box;
  }
  const VQ = [ {target:'mitocondria', q:'Selecciona en el modelo el organelo que produce la mayor parte del ATP.'}, {target:'nucleo', q:'Selecciona la estructura que contiene el ADN y controla la actividad celular.'}, {target:'golgi', q:'Selecciona el organelo que empaqueta y envía proteínas en vesículas.'}, {target:'lisosomas', q:'Selecciona los organelos encargados de la digestión celular.'} ];

    return box;

    if (tab==='explorar'){ tabBody.append(selected ? card(S[selected]) : h('div',{class:'notice'},'Selecciona un organelo en el modelo o en la lista. La membrana es translúcida: haz clic a través de ella.')); tabBody.append(h('div',{}, h('span',{class:'eyebrow'},'Componentes'), listEl)); renderList(); }
    else if (tab==='capas') tabBody.append(layersBox()); else tabBody.append(quizBox()); }
  function select(id, src){

    selected=id; actionTxt=''; M && M.stop(); E && E.select(id); Store.markSeen('celula-animal', id); Store.log('seleccion_estructura',{modelo:'celula-animal',estructura:id,origen:src});
    const seen = Store.s.seen['celula-animal'].length; if (seen>=6) Store.completeActivity('explorar-celula'); if (seen>=D.structures.length) Store.grantBadge('explorador-celular');
    tab='explorar'; renderTab();
  }

  return { unmount(){ E && E.dispose(); } };
});

const RBC_STATIONS = [
  { id:'tejidos', n:'Tejidos', sat:75, view:'tissue', t:'Estás dentro de un glóbulo rojo en un capilar del músculo de la pierna. Acabas de entregar oxígeno a las células musculares y has recogido el dióxido de carbono que producen sus mitocondrias. Tu hemoglobina lleva ahora poco O₂: la sangre es oscura.', q:{ q:'¿De dónde proviene el CO₂ que acaba de recoger el glóbulo rojo?', ops:['Del aire que entra por la piel','De la respiración celular en las mitocondrias','De la digestión de los alimentos en el intestino'], ok:1, fb:'Las mitocondrias oxidan la glucosa para obtener ATP y liberan CO₂ como producto; ese CO₂ difunde a la sangre.', wrong:['La piel humana no realiza intercambio gaseoso significativo. Piensa en qué proceso celular produce CO₂.','La digestión no produce CO₂ directamente; el CO₂ aparece cuando la célula usa los nutrientes para obtener energía.'] } },
  { id:'venas', n:'Venas', sat:75, focus:'vena-cava-inferior', r:7, t:'Los capilares se reúnen en vénulas y luego en venas cada vez más grandes. La presión es muy baja aquí; las válvulas venosas y la contracción de los músculos de la pierna te empujan hacia arriba, contra la gravedad.', q:{ q:'¿Qué impide que la sangre de las venas de las piernas retroceda hacia abajo?', ops:['La fuerza de bombeo directa del corazón','Las válvulas venosas y la compresión de los músculos','La gravedad'], ok:1, fb:'La presión que llega a las venas es mínima. Las válvulas solo permiten el flujo hacia el corazón y los músculos actúan como una bomba al contraerse.', wrong:['El corazón bombea, pero la presión ya casi se ha agotado cuando la sangre llega a las venas de las piernas.','La gravedad empuja la sangre hacia abajo: es justo el problema que las válvulas resuelven.'] } },
  { id:'vena-cava', n:'Vena cava', sat:75, focus:'vena-cava-inferior', r:6, t:'Entras en la vena cava inferior, la vena más ancha del cuerpo. Aquí se junta toda la sangre desoxigenada de la mitad inferior del cuerpo. La vena cava superior trae la de la cabeza y los brazos. Ambas desembocan en la misma cámara.' },
  { id:'ad', n:'Aurícula derecha', sat:75, focus:'auricula-derecha', r:6, t:'Llegas a la aurícula derecha. Sus paredes son delgadas. Sientes un pequeño impulso: el nodo sinoauricular acaba de disparar y la aurícula se contrae.', dec:{ q:'La aurícula se contrae. ¿Hacia dónde continúa el glóbulo rojo?', ops:[ {t:'Al ventrículo derecho, atravesando la válvula tricúspide', ok:true}, {t:'A la aurícula izquierda, a través del tabique', fb:'Aún no. El tabique interauricular separa por completo ambas aurículas después del nacimiento: la sangre pobre en oxígeno nunca pasa directamente al lado izquierdo. Observa que debajo de la aurícula hay un ventrículo.'}, {t:'Directamente a la arteria pulmonar', fb:'Todavía no. La aurícula no tiene fuerza para enviar la sangre a los pulmones; esa tarea corresponde al ventrículo derecho, que está justo debajo.'} ] } },
  { id:'vd', n:'Ventrículo derecho', sat:75, focus:'ventriculo-derecho', r:6, t:'Estás en el ventrículo derecho. La válvula tricúspide se cierra detrás de ti (primer ruido cardíaco) y la pared muscular se contrae con fuerza moderada: los pulmones están muy cerca y no hace falta mucha presión.', dec:{ q:'El ventrículo derecho se contrae. ¿Por qué vaso sale el glóbulo rojo?', ops:[ {t:'Por la aorta', fb:'No. La aorta nace del ventrículo izquierdo. El tabique interventricular impide el paso entre ventrículos; el derecho tiene su propia salida.'}, {t:'Por la arteria pulmonar', ok:true}, {t:'De regreso por la vena cava', fb:'No. Las venas cavas traen sangre hacia el corazón y la válvula tricúspide se cierra durante la contracción justamente para evitar el retroceso.'} ] } },
  { id:'ap', n:'Arteria pulmonar', sat:75, focus:'arteria-pulmonar', r:6, t:'Atraviesas la válvula pulmonar y entras en el tronco pulmonar, que se divide en dos: una arteria para cada pulmón. Sigues llevando poco oxígeno.', q:{ q:'La arteria pulmonar transporta sangre…', ops:['rica en oxígeno, como todas las arterias','pobre en oxígeno, aunque es una arteria'], ok:1, fb:'Arteria significa "sale del corazón", no "lleva oxígeno". La arteria pulmonar es la excepción que confirma la regla: sale del corazón con sangre desoxigenada rumbo a los pulmones.', wrong:['Revisa el color con que se representa este vaso en el modelo: sale del ventrículo derecho con la misma sangre que llegó por las venas cavas.'] } },
  { id:'pulmones', n:'Pulmones · intercambio gaseoso', sat:75, view:'lung', t:'Estás en un capilar pulmonar, pegado a un alvéolo. Solo una capa de células te separa del aire recién inspirado, rico en O₂ y pobre en CO₂. Los gases se mueven por difusión: de donde hay más hacia donde hay menos.' },
  { id:'vp', n:'Venas pulmonares', sat:98, focus:'venas-pulmonares', r:6, t:'Sales del pulmón por una de las cuatro venas pulmonares con la hemoglobina casi saturada (≈98 %). La sangre es ahora de color rojo brillante. Son las únicas venas que transportan sangre oxigenada.' },
  { id:'ai', n:'Aurícula izquierda', sat:98, focus:'auricula-izquierda', r:6, t:'Llegas a la aurícula izquierda. Se contrae a la vez que la derecha: ambos lados del corazón laten sincronizados, aunque manejan sangre distinta.', dec:{ q:'¿Qué válvula debe atravesar el glóbulo rojo para llegar al ventrículo izquierdo?', ops:[ {t:'La válvula tricúspide', fb:'No. La tricúspide está en el lado derecho (truco: "tri" y "derecha" comparten la letra r… y la tricúspide siempre está a la derecha). En el lado izquierdo la válvula tiene dos valvas.'}, {t:'La válvula mitral (bicúspide)', ok:true}, {t:'La válvula aórtica', fb:'No. La aórtica está a la salida del ventrículo izquierdo, no a su entrada. Primero hay que entrar al ventrículo.'} ] } },
  { id:'vi', n:'Ventrículo izquierdo', sat:98, focus:'ventriculo-izquierdo', r:6, t:'Estás en la cámara más poderosa. Su pared es hasta tres veces más gruesa que la del ventrículo derecho. Cuando se contrae genera unos 120 mmHg: suficiente para llevarte hasta los dedos de los pies o al cerebro.', q:{ q:'¿Por qué el ventrículo izquierdo necesita una pared tan gruesa?', ops:['Porque bombea más sangre por latido que el derecho','Porque debe generar más presión: el circuito hacia todo el cuerpo es largo y resistente','Porque el ventrículo izquierdo late más rápido'], ok:1, fb:'Ambos ventrículos expulsan el mismo volumen por latido y laten al mismo ritmo; la diferencia es la presión necesaria para recorrer todo el cuerpo.', wrong:['Ambos ventrículos bombean el mismo volumen; si no, la sangre se acumularía en un circuito.','Ambos ventrículos laten simultáneamente y al mismo ritmo.'] } },
  { id:'aorta', n:'Aorta', sat:98, focus:'aorta', r:7, t:'La válvula aórtica se abre y sales disparado a la aorta. Sus paredes elásticas se distienden con cada latido y se retraen después, manteniendo el flujo continuo. Desde el arco aórtico salen ramas hacia la cabeza y los brazos; la aorta descendente reparte el resto.' },
  { id:'tejidos2', n:'Tejidos', sat:98, view:'tissue2', t:'Regresas a un capilar del músculo. Las células están usando O₂ en sus mitocondrias y produciendo CO₂. Entregas el oxígeno y recoges el CO₂. El ciclo empieza otra vez: el recorrido completo dura menos de un minuto en reposo.' }
];
