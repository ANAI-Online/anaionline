<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ANAI BioLab · Laboratorio Virtual de Biología para Bachillerato de ANAI Online. Explora la vida: desde una molécula hasta un ecosistema.">
<meta name="theme-color" content="#0E1F33">
<title>ANAI BioLab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1F33'/%3E%3Cpath d='M20 10c0 10 24 14 24 30a12 12 0 0 1-24 0c0-16 24-20 24-30' fill='none' stroke='%233FC1D3' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F4F7FA; --bg-2:#FFFFFF; --bg-3:#E9EEF4; --bg-deep:#0E1F33;
  --ink:#10233A; --ink-2:#3E5170; --ink-3:#7A8AA3; --line:#D6DEE8; --line-2:#C2CCD9;
  --brand:#0E1F33; --accent:#0F8A9C; --accent-2:#0B6E7C; --accent-soft:#D9F0F3; --accent-ink:#FFFFFF;
  --anat:#C9463F; --anat-soft:#F9E1DF; --cell:#0F8A9C; --cell-soft:#D9F0F3; --gen:#6A58C7; --gen-soft:#E7E2F8;
  --eco:#3B8F52; --eco-soft:#DCEFE1; --lab:#C7841F; --lab-soft:#FBEBD2; --mis:#B0891C; --mis-soft:#F7EDCB;
  --ok:#2E8B57; --warn:#C7841F; --bad:#C0392B; --info:#2B6CB0;
  --oxy:#D64545; --deoxy:#3E63B8;
  --shadow:0 1px 2px rgba(16,35,58,.06),0 8px 24px rgba(16,35,58,.08);
  --shadow-lg:0 2px 6px rgba(16,35,58,.08),0 24px 48px rgba(16,35,58,.16);
  --r-s:6px; --r:12px; --r-l:20px;
  --font-d:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-b:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --hero-bg:#0E1F33; --hero-ink:#F4F7FA; --hero-ink-2:#9FB3CC;
  --chart-grid:#E3E9F0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1524; --bg-2:#122036; --bg-3:#182A44; --bg-deep:#070E19;
    --ink:#EAF0F7; --ink-2:#B4C2D6; --ink-3:#7F92AD; --line:#233852; --line-2:#2F4762;
    --brand:#EAF0F7; --accent:#3FC1D3; --accent-2:#6FD5E3; --accent-soft:#12303B; --accent-ink:#06171C;
    --anat:#E8635C; --anat-soft:#3A1F1E; --cell:#3FC1D3; --cell-soft:#12303B; --gen:#9B8BE8; --gen-soft:#26224A;
    --eco:#5DBB77; --eco-soft:#173324; --lab:#E5A445; --lab-soft:#3B2B12; --mis:#D9B44A; --mis-soft:#3A2F12;
    --ok:#5DBB77; --warn:#E5A445; --bad:#E86A5C; --info:#6FA8E8;
    --oxy:#F06A6A; --deoxy:#6C8FE0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 48px rgba(0,0,0,.5);
    --hero-bg:#070E19; --hero-ink:#EAF0F7; --hero-ink-2:#8FA5C2;
    --chart-grid:#1F3049;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1524; --bg-2:#122036; --bg-3:#182A44; --bg-deep:#070E19;
  --ink:#EAF0F7; --ink-2:#B4C2D6; --ink-3:#7F92AD; --line:#233852; --line-2:#2F4762;
  --brand:#EAF0F7; --accent:#3FC1D3; --accent-2:#6FD5E3; --accent-soft:#12303B; --accent-ink:#06171C;
  --anat:#E8635C; --anat-soft:#3A1F1E; --cell:#3FC1D3; --cell-soft:#12303B; --gen:#9B8BE8; --gen-soft:#26224A;
  --eco:#5DBB77; --eco-soft:#173324; --lab:#E5A445; --lab-soft:#3B2B12; --mis:#D9B44A; --mis-soft:#3A2F12;
  --ok:#5DBB77; --warn:#E5A445; --bad:#E86A5C; --info:#6FA8E8;
  --oxy:#F06A6A; --deoxy:#6C8FE0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 48px rgba(0,0,0,.5);
  --hero-bg:#070E19; --hero-ink:#EAF0F7; --hero-ink-2:#8FA5C2;
  --chart-grid:#1F3049;
  color-scheme:dark;
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:800}
h2{font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:800}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:.85rem}
.eyebrow{font-family:var(--font-d);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow.anat{color:var(--anat)} .eyebrow.cell{color:var(--cell)} .eyebrow.gen{color:var(--gen)} .eyebrow.eco{color:var(--eco)} .eyebrow.lab{color:var(--lab)} .eyebrow.mis{color:var(--mis)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1 1 auto}
.hidden-x{display:none!important}

/* ============ SHELL ============ */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sidebar{background:var(--bg-2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;text-decoration:none!important;color:var(--ink)}
.logo-mark{width:34px;height:34px;border-radius:9px;background:var(--bg-deep);display:grid;place-items:center;flex:none}
.logo-mark svg{width:22px;height:22px}
.logo b{font-family:var(--font-d);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;display:block;line-height:1.1}
.logo .sub{font-size:.68rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav-group{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px;font-family:var(--font-d)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none!important;font-weight:500;font-size:.92rem}
.nav a:hover{background:var(--bg-3);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav a .ico{width:18px;height:18px;flex:none;display:inline-grid;place-items:center;color:var(--ink-3)}
.nav a[aria-current="page"] .ico{color:var(--accent)}
.nav a .tag{margin-left:auto;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.sidebar-foot{margin-top:auto;padding:10px 8px;font-size:.78rem;color:var(--ink-3);border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.search{flex:1 1 320px;max-width:560px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg-2);font-size:.92rem}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:none;max-height:60vh;overflow:auto;z-index:30}
.search-results.open{display:block}
.sr-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;text-decoration:none!important;color:var(--ink)}
.sr-item:hover,.sr-item:focus{background:var(--bg-3)}
.sr-item .k{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--bg-3);color:var(--ink-3);flex:none;min-width:70px;text-align:center}
.sr-item>span:last-child{flex:1;min-width:0}
.sr-item .t{font-weight:600;font-size:.9rem}
.sr-item .d{font-size:.8rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:700;font-family:var(--font-d);font-size:.85rem;flex:none}
.userchip{display:flex;align-items:center;gap:10px;margin-left:auto}
.userchip .n{font-weight:600;font-size:.88rem;line-height:1.1}
.userchip .c{font-size:.74rem;color:var(--ink-3)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg-2);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--bg-3)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.view{padding:26px 28px 60px;max-width:1280px;width:100%;margin:0 auto}
.view.wide{max-width:1480px}
.bottomnav{display:none}

/* ============ COMPONENTS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg-2);font-weight:600;font-size:.9rem;text-decoration:none!important;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--bg-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-3)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:8px}
.btn.lg{padding:14px 24px;font-size:1rem;border-radius:12px}
.btn.anat{background:var(--anat);color:#fff;border-color:transparent}
.btn.mis{background:var(--mis);color:#fff;border-color:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.pad-l{padding:24px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg-3);color:var(--ink-2)}
.pill.anat{background:var(--anat-soft);color:var(--anat)} .pill.cell{background:var(--cell-soft);color:var(--cell)} .pill.gen{background:var(--gen-soft);color:var(--gen)} .pill.eco{background:var(--eco-soft);color:var(--eco)} .pill.lab{background:var(--lab-soft);color:var(--lab)} .pill.mis{background:var(--mis-soft);color:var(--mis)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)} .pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)} .pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.progress{height:8px;background:var(--bg-3);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.progress.anat>i{background:var(--anat)} .progress.cell>i{background:var(--cell)} .progress.gen>i{background:var(--gen)} .progress.eco>i{background:var(--eco)} .progress.lab>i{background:var(--lab)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{max-width:62ch;color:var(--ink-2);margin-top:6px}
.notice{padding:10px 14px;border-radius:10px;background:var(--bg-3);font-size:.85rem;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.notice.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink)} .notice.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--ink)} .notice.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--ink)} .notice.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--ink)}
.notice b{font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
textarea,input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg-2)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.slider label{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.slider output{font-family:var(--font-m);font-size:.82rem;color:var(--ink);font-variant-numeric:tabular-nums}
.slider input{grid-column:1/-1}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-2);position:relative;margin:0;cursor:pointer;transition:background .2s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(14px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:9px 10px;border:0;background:none;color:var(--ink-3);font-weight:600;font-size:.83rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--ink-3);font-weight:500} .kv dd{margin:0;font-weight:600}
table.data{width:100%;border-collapse:collapse;font-size:.86rem}
table.data th{text-align:left;font-weight:600;color:var(--ink-3);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line)}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data td.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;text-align:right}
table.data tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--bg-deep);color:#F4F7FA;padding:11px 16px;border-radius:12px;font-weight:500;font-size:.9rem;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:min(92vw,520px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.badge-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:12px;border:1px solid var(--line);text-align:center;background:var(--bg-2)}
.badge-tile .em{font-size:1.7rem;line-height:1}
.badge-tile .n{font-weight:700;font-size:.8rem;font-family:var(--font-d)}
.badge-tile .d{font-size:.72rem;color:var(--ink-3)}
.badge-tile.locked{opacity:.45;filter:grayscale(1)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--font-d);font-size:1.6rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.78rem;color:var(--ink-3);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);font-size:.85rem;font-weight:600}
.chip:hover{background:var(--bg-3)}
.chip.picked{background:var(--accent-soft);border-color:var(--accent)}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:var(--bad)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg-2);text-align:left;width:100%;font-weight:500}
.opt:hover{background:var(--bg-3)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.opt .k{font-family:var(--font-m);font-size:.78rem;color:var(--ink-3);flex:none;padding-top:2px}
.level-tabs{display:inline-flex;background:var(--bg-3);border-radius:8px;padding:3px;gap:2px}
.level-tabs button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:.76rem;font-weight:700;color:var(--ink-3)}
.level-tabs button[aria-selected="true"]{background:var(--bg-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(7,14,25,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--bg-2);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.ph{border:1px dashed var(--line-2);border-radius:var(--r);padding:18px;color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--line) 40%,transparent) 10px 11px)}
.ph b{color:var(--ink-2)}
.tile{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r-l);border:1px solid var(--line);background:var(--bg-2);text-decoration:none!important;color:var(--ink);position:relative;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem}
.tile h3{font-size:1.02rem}
.tile p{font-size:.85rem;color:var(--ink-2)}
.tile .soon{position:absolute;top:14px;right:14px}
.tile.anat .ico{background:var(--anat-soft)} .tile.cell .ico{background:var(--cell-soft)} .tile.gen .ico{background:var(--gen-soft)} .tile.eco .ico{background:var(--eco-soft)} .tile.lab .ico{background:var(--lab-soft)} .tile.mis .ico{background:var(--mis-soft)}

/* ============ HOME ============ */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--r-l);display:grid;grid-template-columns:1.05fr 1fr;gap:20px;overflow:hidden;position:relative;min-height:440px;margin-bottom:22px}
.hero-text{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;z-index:2}
.hero-text .eyebrow{color:var(--hero-ink-2)}
.hero-text h1{font-size:clamp(2.2rem,4.4vw,3.4rem);letter-spacing:-.03em}

      n1:"Cámara superior izquierda. Recibe sangre rica en oxígeno que llega de los pulmones por las venas pulmonares.",
      n2:"Cuatro venas pulmonares (dos por cada pulmón) desembocan en ella. Al contraerse, envía la sangre oxigenada al ventrículo izquierdo a través de la válvula mitral (bicúspide). Sus paredes son delgadas, como las de la aurícula derecha, porque el trayecto hasta el ventrículo es muy corto.",
      n3:"Las aurículas cumplen además una función endocrina: sus células liberan el péptido natriurético auricular (PNA) cuando se estiran por exceso de volumen, lo que estimula a los riñones a eliminar sodio y agua, ayudando a regular la presión arterial. Es un buen ejemplo de la conexión entre el sistema circulatorio, el endocrino y el urinario.",
      dato:"Es la única cámara que recibe sangre directamente desde los pulmones.",
      conecta:["venas-pulmonares","valvula-mitral","ventriculo-izquierdo"], temas:["Circulación pulmonar","Intercambio gaseoso"],
      quiz:{q:"¿Por qué vasos llega la sangre a la aurícula izquierda?", ops:["Venas cavas","Arteria pulmonar","Venas pulmonares"], ok:2, fb:"Las venas pulmonares son los únicos vasos del cuerpo llamados 'venas' que transportan sangre oxigenada: traen la sangre desde los pulmones hasta la aurícula izquierda."}},
    {id:"ventriculo-derecho", nombre:"Ventrículo derecho", capa:"camaras", color:"#A8443C", pos:[-0.35,-0.55,0.7], lbl:[-1.55,-1.0,1.0],
      n1:"Cámara inferior derecha. Bombea sangre pobre en oxígeno hacia los pulmones por la arteria pulmonar.",
      n2:"Recibe la sangre de la aurícula derecha y la impulsa a través de la válvula pulmonar hacia el tronco pulmonar. Su pared es más gruesa que la de las aurículas pero más delgada que la del ventrículo izquierdo, porque los pulmones están muy cerca y el circuito pulmonar ofrece poca resistencia.",
      n3:"La presión que genera el ventrículo derecho durante la sístole es de unos 25 mmHg, frente a los 120 mmHg del ventrículo izquierdo. Ambos ventrículos expulsan, sin embargo, el mismo volumen de sangre por latido (unos 70 mL en reposo): si no fuera así, la sangre se acumularía en uno de los dos circuitos. Este equilibrio se conoce como ley de Frank-Starling.",
      dato:"Bombea el mismo volumen que el ventrículo izquierdo, pero con cinco veces menos presión.",
      conecta:["auricula-derecha","valvula-pulmonar","arteria-pulmonar","tabique"], temas:["Circulación pulmonar","Presión arterial"],
      quiz:{q:"¿Hacia dónde envía la sangre el ventrículo derecho?", ops:["Hacia la aorta y todo el cuerpo","Hacia los pulmones por la arteria pulmonar","Hacia la aurícula izquierda"], ok:1, fb:"El ventrículo derecho impulsa la sangre desoxigenada a los pulmones a través de la válvula pulmonar y la arteria pulmonar."}},
    {id:"ventriculo-izquierdo", nombre:"Ventrículo izquierdo", capa:"camaras", color:"#9A3B34", pos:[0.8,-1.1,-0.2], lbl:[2.05,-1.4,0.3],
      n1:"Cámara inferior izquierda, la más musculosa. Bombea sangre oxigenada a todo el cuerpo por la aorta.",
      n2:"Su pared muscular (miocardio) es dos o tres veces más gruesa que la del ventrículo derecho porque debe generar presión suficiente para que la sangre llegue hasta los pies y el cerebro. Recibe sangre de la aurícula izquierda a través de la válvula mitral y la expulsa por la válvula aórtica.",
      n3:"El volumen que expulsa en cada latido (volumen sistólico, ~70 mL) multiplicado por la frecuencia cardíaca da el gasto cardíaco: unos 5 L/min en reposo, que puede superar los 20 L/min durante ejercicio intenso. El músculo cardíaco, a diferencia del esquelético, no se fatiga y se contrae de forma involuntaria y rítmica; sus células están unidas por discos intercalares que transmiten el impulso eléctrico de una a otra.",
      dato:"Su pared es hasta tres veces más gruesa que la del ventrículo derecho.",
      conecta:["auricula-izquierda","valvula-mitral","valvula-aortica","aorta","tabique"], temas:["Circulación sistémica","Presión arterial","Actividad física"],
      quiz:{q:"¿Por qué el ventrículo izquierdo tiene la pared más gruesa?", ops:["Porque recibe más sangre que el derecho","Porque debe generar más presión para impulsar la sangre a todo el cuerpo","Porque contiene el marcapasos del corazón"], ok:1, fb:"Ambos ventrículos bombean el mismo volumen; la diferencia está en la presión. El circuito sistémico es mucho más largo y resistente, así que el ventrículo izquierdo necesita más músculo."}},
    {id:"vena-cava-superior", nombre:"Vena cava superior", capa:"vasos", color:"#4A6FB5", pos:[-1.12,2.4,0.05], lbl:[-1.9,3.05,0.2],
      n1:"Gran vena que trae sangre pobre en oxígeno de la cabeza, el cuello y los brazos a la aurícula derecha.",
      n2:"Se forma por la unión de las venas braquiocefálicas. Al igual que la vena cava inferior, no tiene válvula en su desembocadura: la sangre entra en la aurícula derecha impulsada por la diferencia de presión y con ayuda de la respiración.",
      n3:"Las venas tienen paredes más delgadas y menos elásticas que las arterias, y su presión es muy baja (cerca de 0–5 mmHg cuando llegan al corazón). Por eso el retorno venoso depende de mecanismos auxiliares: la 'bomba muscular' de las piernas, las válvulas venosas y los cambios de presión torácica durante la inspiración.",
      dato:"La sangre de las venas cavas ha entregado su oxígeno y regresa cargada de CO₂.",
      conecta:["auricula-derecha","vena-cava-inferior"], temas:["Retorno venoso","Sistema circulatorio"],
      quiz:{q:"¿De qué regiones del cuerpo trae sangre la vena cava superior?", ops:["De las piernas y el abdomen","De la cabeza, el cuello y los brazos","De los pulmones"], ok:1, fb:"La cava superior drena la mitad superior del cuerpo; la cava inferior, la mitad inferior."}},
    {id:"vena-cava-inferior", nombre:"Vena cava inferior", capa:"vasos", color:"#4A6FB5", pos:[-1.2,-0.9,-0.4], lbl:[-2.05,-1.95,-0.2],
      n1:"Gran vena que trae sangre pobre en oxígeno del tronco, el abdomen y las piernas a la aurícula derecha.",
      n2:"Es la vena de mayor diámetro del cuerpo. Recoge la sangre de las venas ilíacas, renales y hepáticas, entre otras, y entra en la aurícula derecha por su parte inferior.",
      n3:"Antes de llegar al corazón, la sangre de los intestinos pasa primero por el hígado a través de la vena porta (sistema porta hepático), donde se filtran y procesan los nutrientes absorbidos. Luego las venas hepáticas la vierten en la cava inferior. Es un ejemplo de conexión directa entre el sistema digestivo y el circulatorio.",
      dato:"Es la vena más ancha del cuerpo humano.",
      conecta:["auricula-derecha","vena-cava-superior"], temas:["Retorno venoso","Sistema digestivo"],
      quiz:{q:"La sangre de la vena cava inferior es…", ops:["rica en oxígeno","pobre en oxígeno y rica en CO₂","igual a la de la aorta"], ok:1, fb:"Toda la sangre que llega por las cavas ya entregó oxígeno a los tejidos y transporta el CO₂ producido por la respiración celular."}},
    {id:"arteria-pulmonar", nombre:"Arteria pulmonar", capa:"vasos", color:"#3E63B8", pos:[0.42,1.3,0.52], lbl:[1.05,1.6,0.95],
      n1:"Lleva sangre pobre en oxígeno desde el ventrículo derecho hasta los pulmones. Es la única arteria con sangre desoxigenada.",
      n2:"Sale del ventrículo derecho como tronco pulmonar y se divide en arteria pulmonar derecha e izquierda, una para cada pulmón. Se llama 'arteria' porque sale del corazón, no por el tipo de sangre que transporta: las arterias siempre alejan la sangre del corazón y las venas siempre la devuelven.",
      n3:"Dentro de los pulmones se ramifica hasta formar capilares que rodean los alvéolos; allí el CO₂ difunde hacia el aire alveolar y el O₂ hacia la sangre. La presión en la circulación pulmonar es baja (~25/8 mmHg), lo que evita que el plasma se filtre hacia los alvéolos y los inunde.",
      dato:"Es la excepción de la regla: una arteria con sangre pobre en oxígeno.",
      conecta:["ventriculo-derecho","valvula-pulmonar","venas-pulmonares"], temas:["Circulación pulmonar","Intercambio gaseoso","Respiración"],
      quiz:{q:"¿Por qué la arteria pulmonar se llama 'arteria' aunque transporta sangre desoxigenada?", ops:["Porque tiene paredes musculares gruesas","Porque sale del corazón: las arterias siempre alejan la sangre del corazón","Porque conecta con la aorta"], ok:1, fb:"Arteria y vena se definen por la dirección del flujo respecto al corazón, no por el contenido de oxígeno."}},
    {id:"venas-pulmonares", nombre:"Venas pulmonares", capa:"vasos", color:"#C8322E", pos:[1.9,1.2,-0.9], lbl:[2.65,1.75,-0.6],
      n1:"Cuatro venas que traen sangre rica en oxígeno desde los pulmones hasta la aurícula izquierda.",
      n2:"Dos salen de cada pulmón. Son las únicas venas del cuerpo que transportan sangre oxigenada, porque acaban de recoger el oxígeno captado en los alvéolos.",
      n3:"La sangre que sale de los pulmones tiene una saturación de oxígeno cercana al 97–99 %: casi todas las moléculas de hemoglobina de los glóbulos rojos llevan cuatro moléculas de O₂ unidas. Al pasar por los tejidos la saturación baja a ~70–75 % en reposo, y mucho más durante el ejercicio intenso.",
      dato:"Son las únicas venas con sangre oxigenada.",
      conecta:["auricula-izquierda","arteria-pulmonar"], temas:["Circulación pulmonar","Hemoglobina"],
      quiz:{q:"¿Qué tienen de especial las venas pulmonares?", ops:["Son las únicas venas que llevan sangre oxigenada","Son las venas más largas del cuerpo","Tienen válvulas que impiden el retorno"], ok:0, fb:"Recogen la sangre recién oxigenada en los alvéolos y la conducen a la aurícula izquierda."}},
    {id:"aorta", nombre:"Aorta", capa:"vasos", color:"#C8322E", pos:[-0.3,2.3,0.05], lbl:[0.15,3.5,-0.15],
      n1:"La arteria más grande del cuerpo. Distribuye la sangre oxigenada desde el ventrículo izquierdo a todos los órganos.",
      n2:"Sale del ventrículo izquierdo, forma un arco (cayado aórtico) del que nacen las arterias hacia la cabeza y los brazos, y desciende por el tórax y el abdomen dando ramas a todos los órganos. Sus paredes son gruesas y elásticas para soportar la alta presión de cada latido.",
      n3:"La elasticidad de la aorta funciona como un amortiguador: se distiende en la sístole y se retrae en la diástole, manteniendo el flujo continuo aunque el corazón bombee a pulsos. Con la edad o por hábitos poco saludables las arterias pueden endurecerse (arteriosclerosis), lo que eleva la presión arterial y sobrecarga el ventrículo izquierdo.",
      dato:"Tiene unos 2,5 cm de diámetro y sus paredes son elásticas.",
      conecta:["ventriculo-izquierdo","valvula-aortica","vasos-coronarios"], temas:["Circulación sistémica","Presión arterial","Homeostasis"],
      quiz:{q:"¿Qué tipo de sangre transporta la aorta?", ops:["Sangre oxigenada hacia los tejidos","Sangre desoxigenada hacia los pulmones","Sangre desoxigenada hacia el corazón"], ok:0, fb:"La aorta recibe la sangre del ventrículo izquierdo, que acaba de llegar oxigenada desde los pulmones, y la reparte a todo el cuerpo."}},
    {id:"valvula-tricuspide", nombre:"Válvula tricúspide", capa:"valvulas", color:"#E8DCCB", pos:[-0.85,0.02,0.2], lbl:[-2.15,0.3,0.85],
      n1:"Válvula de tres valvas entre la aurícula derecha y el ventrículo derecho. Impide que la sangre retroceda.",
      n2:"Se abre cuando la aurícula se contrae y se cierra cuando el ventrículo se contrae, de modo que la sangre solo puede avanzar hacia la arteria pulmonar. Su cierre produce el primer ruido cardíaco ('lub').",
      n3:"Las valvas están sujetas por cuerdas tendinosas a los músculos papilares de la pared ventricular; estos se contraen junto con el ventrículo para que la válvula no se invierta hacia la aurícula. Cuando una válvula no cierra bien se produce un soplo cardíaco, un sonido audible con el estetoscopio.",
      dato:"El cierre de las válvulas auriculoventriculares produce el sonido 'lub'.",
      conecta:["auricula-derecha","ventriculo-derecho"], temas:["Ciclo cardíaco","Ruidos cardíacos"],
      quiz:{q:"¿Cuál es la función principal de las válvulas cardíacas?", ops:["Generar el impulso eléctrico","Impedir que la sangre retroceda","Oxigenar la sangre"], ok:1, fb:"Las válvulas garantizan un flujo en un solo sentido; el impulso lo genera el nodo sinoauricular y la oxigenación ocurre en los pulmones."}},
    {id:"valvula-mitral", nombre:"Válvula mitral (bicúspide)", capa:"valvulas", color:"#E8DCCB", pos:[0.62,0.05,-0.35], lbl:[2.15,-0.05,0.15],
      n1:"Válvula de dos valvas entre la aurícula izquierda y el ventrículo izquierdo.",
      n2:"Funciona igual que la tricúspide: se abre durante el llenado del ventrículo y se cierra durante su contracción, evitando que la sangre regrese a la aurícula izquierda y a los pulmones.",
      n3:"Es la válvula que soporta mayor presión, porque el ventrículo izquierdo genera unos 120 mmHg. Su nombre proviene de la mitra, el gorro de dos puntas de los obispos. La estenosis mitral (estrechamiento) y la insuficiencia mitral (cierre incompleto) son alteraciones frecuentes.",
      dato:"Es la única válvula del corazón con solo dos valvas.",
      conecta:["auricula-izquierda","ventriculo-izquierdo"], temas:["Ciclo cardíaco"],
      quiz:{q:"¿Entre qué cámaras se encuentra la válvula mitral?", ops:["Aurícula derecha y ventrículo derecho","Aurícula izquierda y ventrículo izquierdo","Ventrículo izquierdo y aorta"], ok:1, fb:"La mitral separa las cámaras izquierdas; entre el ventrículo izquierdo y la aorta está la válvula aórtica."}},
    {id:"valvula-pulmonar", nombre:"Válvula pulmonar", capa:"valvulas", color:"#E8DCCB", pos:[0.3,0.62,0.72], lbl:[-0.45,1.25,1.3],
      n1:"Válvula semilunar entre el ventrículo derecho y la arteria pulmonar.",
      n2:"Tiene tres valvas en forma de media luna. Se abre cuando el ventrículo derecho se contrae y se cierra cuando se relaja, para que la sangre de la arteria pulmonar no regrese al ventrículo.",
      n3:"El cierre simultáneo de las válvulas pulmonar y aórtica produce el segundo ruido cardíaco ('dub'). A diferencia de las válvulas auriculoventriculares, las semilunares no tienen cuerdas tendinosas: se cierran pasivamente cuando la presión del vaso supera la del ventrículo.",
      dato:"Las válvulas semilunares se cierran solas cuando la presión del vaso supera la del ventrículo.",
      conecta:["ventriculo-derecho","arteria-pulmonar"], temas:["Ciclo cardíaco"],
      quiz:{q:"¿Cuándo se cierra la válvula pulmonar?", ops:["Cuando el ventrículo derecho se contrae","Cuando el ventrículo derecho se relaja","Cuando la aurícula derecha se contrae"], ok:1, fb:"Al relajarse el ventrículo, la presión en la arteria pulmonar es mayor y empuja las valvas hasta cerrarlas."}},
    {id:"valvula-aortica", nombre:"Válvula aórtica", capa:"valvulas", color:"#E8DCCB", pos:[0.1,0.38,-0.1], lbl:[1.25,0.55,0.95],
      n1:"Válvula semilunar entre el ventrículo izquierdo y la aorta.",
      n2:"Se abre cuando el ventrículo izquierdo se contrae y expulsa la sangre a la aorta; se cierra al relajarse el ventrículo, evitando que la sangre regrese.",
      n3:"Justo por encima de la válvula aórtica nacen las arterias coronarias, que irrigan al propio músculo cardíaco. Se llenan sobre todo durante la diástole, cuando la válvula está cerrada y la presión de la aorta empuja la sangre hacia ellas. La obstrucción de una arteria coronaria provoca un infarto de miocardio.",
      dato:"Sobre esta válvula nacen las arterias coronarias que alimentan al corazón.",
      conecta:["ventriculo-izquierdo","aorta","vasos-coronarios"], temas:["Ciclo cardíaco","Salud cardiovascular"],
      quiz:{q:"¿Qué ocurriría si la válvula aórtica no cerrara bien?", ops:["La sangre regresaría al ventrículo izquierdo durante la diástole","La sangre pasaría al ventrículo derecho","No pasaría nada porque la aorta es elástica"], ok:0, fb:"Sin un cierre correcto, parte de la sangre expulsada retorna al ventrículo (insuficiencia aórtica), reduciendo la eficiencia de cada latido."}},
    {id:"vasos-coronarios", nombre:"Vasos coronarios", capa:"vasos", color:"#C8463C", pos:[0.4,-0.6,1.15], lbl:[0.75,-0.35,1.6],
      n1:"Arterias y venas que recorren la superficie del corazón y alimentan al propio músculo cardíaco. Van acompañadas de grasa epicárdica.",
      n2:"Las arterias coronarias derecha e izquierda nacen de la aorta, justo por encima de la válvula aórtica. La izquierda se divide en la descendente anterior, que baja por el surco entre los dos ventrículos, y la circunfleja, que rodea el corazón por el surco auriculoventricular. Las venas cardíacas recogen la sangre ya usada y la vierten en el seno coronario, que desemboca en la aurícula derecha.",
      n3:"El corazón pesa unos 300 g, pero recibe cerca del 5 % del gasto cardíaco. Las coronarias se llenan sobre todo durante la diástole, porque en la sístole el músculo contraído las comprime. Si una placa de ateroma obstruye una arteria coronaria, el músculo que depende de ella queda sin oxígeno: es el infarto de miocardio. La grasa amarillenta de los surcos es normal y rodea y protege a los vasos.",
      dato:"El corazón no se alimenta de la sangre que pasa por sus cavidades, sino de sus propias arterias.",
      conecta:["aorta","valvula-aortica","ventriculo-izquierdo","auricula-derecha"], temas:["Infarto de miocardio","Salud cardiovascular","Irrigación"],
      quiz:{q:"¿Por qué la obstrucción de una arteria coronaria causa un infarto?", ops:["Porque impide que la sangre salga del corazón hacia el cuerpo","Porque una parte del músculo cardíaco deja de recibir oxígeno","Porque las válvulas dejan de cerrarse"], ok:1, fb:"El miocardio depende de las coronarias para recibir O₂; sin él, sus células mueren.", wrong:["La sangre sigue saliendo por la aorta; el problema es la irrigación del propio músculo.","Las válvulas no son el problema principal: el daño es la muerte del músculo sin oxígeno."]}},
    {id:"tabique", nombre:"Tabique interventricular", capa:"camaras", color:"#7E2C2A", pos:[0.2,-0.85,0.25], lbl:[0.3,-2.7,0.95], interno:true,
      n1:"Pared muscular que separa completamente el ventrículo derecho del izquierdo.",
      n2:"Gracias al tabique, la sangre desoxigenada del lado derecho nunca se mezcla con la sangre oxigenada del lado izquierdo. Existe también un tabique interauricular entre las dos aurículas.",
      n3:"Antes del nacimiento, el tabique interauricular tiene un orificio (foramen oval) que permite a la sangre saltarse los pulmones, que aún no funcionan. Normalmente se cierra tras el primer llanto. Si el tabique interventricular no se cierra por completo, queda una comunicación interventricular, una de las cardiopatías congénitas más frecuentes.",
      dato:"Impide que se mezclen la sangre oxigenada y la desoxigenada.",
      conecta:["ventriculo-derecho","ventriculo-izquierdo"], temas:["Circulación doble","Desarrollo embrionario"],
      quiz:{q:"¿Qué consecuencia tendría una abertura en el tabique interventricular?", ops:["Se mezclaría sangre oxigenada con desoxigenada","El corazón latiría más despacio","La sangre no llegaría a los pulmones"], ok:0, fb:"Parte de la sangre oxigenada pasaría del ventrículo izquierdo al derecho (mayor presión → menor presión), mezclándose y reduciendo el oxígeno que llega a los tejidos."}}
  ],
  capas:[{id:"camaras",n:"Cámaras"},{id:"vasos",n:"Vasos"},{id:"valvulas",n:"Válvulas"}],
  guiada:[
    {tipo:"select", target:"auricula-derecha", txt:"Localiza y selecciona la <b>aurícula derecha</b>. Pista: está en la parte superior, del lado por el que llegan las venas cavas (a tu izquierda en la vista frontal)."},
    {tipo:"select", target:"ventriculo-derecho", txt:"Ahora identifica el <b>ventrículo derecho</b>. Los ventrículos ocupan la región inferior del corazón."},
    {tipo:"anim", target:"flujo", txt:"Activa el <b>flujo sanguíneo</b> (Animación → Flujo sanguíneo) y observa con qué color circula la sangre por el lado derecho y por el izquierdo."},
    {tipo:"select", target:"arteria-pulmonar", txt:"Selecciona el vaso por el que <b>sale</b> la sangre del ventrículo derecho."},

    {tipo:"text", txt:"Explica con tus palabras el recorrido de una gota de sangre desde que entra por la vena cava hasta que sale por la aorta. Menciona las cuatro cámaras. Tu respuesta se guardará en el cuaderno."}

  const chamber = o => { const g = Kit.sculpt({ shape: d => { const p = d.clone(); if (o.apex && d.y<0){ const k = 1 - o.apex*Math.pow(-d.y,1.7); p.x*=k; p.z*=k; } if (o.flatBack && d.z<0) p.z*=o.flatBack; if (o.flatTop && d.y>0) p.y*=o.flatTop; p.x*=o.r[0]; p.y*=o.r[1]; p.z*=o.r[2]; return p; },

    const m = new THREE.Mesh(g, o.mat); m.position.set(...o.c); if (o.rot) m.rotation.set(...o.rot); return m; };

  /* --- cámaras --- */
  /* Masa ventricular única, dividida por el plano del tabique: surcos interventriculares sin costuras */
  const VR = [1.45,1.72,1.22], VC = [0.25,-0.9,0.05], VROT = [-0.25,0,0.4];
  const sIV = (x,y,z) => 0.75*z - 0.62*x + 0.38*y;   // coordenadas normalizadas; >0.05 → ventrículo derecho
  const vg = Kit.sculpt({ shape: d => { const p = d.clone(); if (d.y<0){ const k = 1 - 0.6*Math.pow(-d.y,1.6); p.x*=k; p.z*=k; } if (d.y>0) p.y*=0.72; if (d.z<0) p.z*=0.85; return p.multiply(V3(VR)); },
    disp: (p,d) => { const n = d; const sv = sIV(n.x, n.y, n.z) - 0.05; return 0.028*Kit.fbm(p.x*2+1, p.y*2, p.z*2, 3) - 0.07*Math.exp(-Math.pow(sv/0.06,2)); }, store: (p,d) => sIV(d.x,d.y,d.z) > 0.05 ? 'rv' : 'lv' });
  const vParts = Kit.split(vg, i => vg.userData.extra[i]);
  const lv = new THREE.Mesh(vParts.lv, muscle(0xffffff)), rv = new THREE.Mesh(vParts.rv, muscle(0xfff2ef));
  [lv, rv].forEach(m => { m.position.set(...VC); m.rotation.set(...VROT); });
  const conus = chamber({ r:[0.4,0.66,0.38], c:[0.04,0.12,0.66], rot:[-0.15,0,-0.5], amp:0.025, f:2.4, seed:5, mat:rv.material });
  const ra = chamber({ r:[0.82,0.86,0.76], c:[-1.12,0.62,-0.05], amp:0.04, f:3.2, seed:7, mat:muscle(0xf4dde2,'atrium') });
  const raA = chamber({ r:[0.62,0.26,0.3], c:[-0.6,1.05,0.5], rot:[0.3,-0.75,0.5], amp:0.035, f:5, seed:9, mat:ra.material });
  const la = chamber({ r:[0.86,0.62,0.7], c:[0.7,0.8,-0.65], amp:0.04, f:3.0, seed:11, mat:muscle(0xf6e2e4,'atrium') });
  const laA = chamber({ r:[0.56,0.22,0.28], c:[1.25,0.85,0.25], rot:[0.2,0.6,-0.6], amp:0.035, f:5, seed:13, mat:la.material });
  add('ventriculo-izquierdo', [lv]); add('ventriculo-derecho', [rv, conus]); add('auricula-derecha', [ra, raA]); add('auricula-izquierda', [la, laA]);
  const sep = chamber({ r:[0.07,0.95,0.62], c:[0,0,0], amp:0.01, f:3, seed:15, mat:muscle(0xd8b0b0) });
  { const nl = new THREE.Vector3(-0.62/VR[0], 0.38/VR[1], 0.75/VR[2]).normalize(); const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(...VROT)); const nw = nl.clone().applyQuaternion(q);
    const cl = new THREE.Vector3(0.0, -0.1*VR[1], (0.05+0.38*0.25)/0.75*VR[2]).applyQuaternion(q).add(V3(VC)); sep.position.copy(cl); sep.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), nw).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), 0)); }
  add('tabique', [sep], { explodeDir:new THREE.Vector3(0,0,1) });

  /* --- grandes vasos --- */
  const artMat = () => Kit.tissue({ tex:'artery', rep:[5,1], bump:0.01, coat:0.75, coatRough:0.22, rough:0.35 });
  const veinMat = () => Kit.tissue({ tex:'vein', rep:[5,1], bump:0.01, coat:0.75, coatRough:0.22, rough:0.35 });
  const vessel = (pts, r0, r1, m, caps, lumen, o={}) => { const g = Kit.taper(pts, r0, r1, o); const c = g.userData.curve; const out = [new THREE.Mesh(g, m)]; if (caps.includes(1)) out.push(...Kit.cap(c, true, g.userData.r1, m, lumen)); if (caps.includes(0)) out.push(...Kit.cap(c, false, g.userData.r0, m, lumen)); return out; };
  const LA_ = 0x3a0d0c, LV_ = 0x141a36;
  const aM = artMat();
  const aorta = [
    ...vessel([[0.1,0.35,-0.1],[-0.2,1.4,0.1],[-0.3,2.3,0.05],[0.0,3.05,-0.3],[0.75,3.0,-0.85],[1.05,2.3,-1.25],[1.05,1.0,-1.35],[1.0,-1.0,-1.4],[0.95,-2.6,-1.4]], 0, 0, aM, [1], LA_, { rfn:u => 0.27 + 0.07*Math.exp(-Math.pow((u-0.03)/0.04,2)) + 0.04*(1-u), seg: low?60:120 }),
    ...vessel([[-0.05,2.95,-0.2],[-0.3,3.55,-0.2],[-0.5,4.05,-0.15]], 0.17, 0.14, aM, [1], LA_),
    ...vessel([[0.32,3.08,-0.45],[0.36,3.6,-0.47],[0.38,4.0,-0.48]], 0.12, 0.11, aM, [1], LA_),
    ...vessel([[0.6,3.02,-0.72],[0.8,3.5,-0.8],[0.95,3.9,-0.82]], 0.13, 0.12, aM, [1], LA_)
  ];
  add('aorta', aorta);
  const pM = veinMat();
  add('arteria-pulmonar', [
    ...vessel([[0.3,0.62,0.72],[0.42,1.3,0.52],[0.45,1.9,0.12]], 0.35, 0.31, pM, [], LV_),
    ...vessel([[0.45,1.9,0.12],[1.1,2.05,-0.25],[1.95,2.0,-0.35]], 0.28, 0.22, pM, [1], LV_),
    ...vessel([[0.45,1.9,0.12],[-0.1,1.95,-0.6],[-1.2,1.9,-0.68],[-2.3,1.85,-0.6]], 0.27, 0.22, pM, [1], LV_)
  ]);
  const cM = veinMat();
  add('vena-cava-superior', vessel([[-1.05,3.4,0.0],[-1.12,2.4,0.05],[-1.15,1.45,0.02]], 0.27, 0.28, cM, [0], LV_));
  add('vena-cava-inferior', vessel([[-1.15,0.2,-0.15],[-1.2,-0.9,-0.4],[-1.25,-2.4,-0.45]], 0.3, 0.3, veinMat(), [1], LV_));
  const pvM = artMat();
  add('venas-pulmonares', [
    ...vessel([[0.2,1.0,-1.05],[-0.7,1.15,-1.25],[-1.7,1.25,-1.2]], 0.15, 0.13, pvM, [1], LA_),
    ...vessel([[0.25,0.62,-1.05],[-0.7,0.58,-1.3],[-1.7,0.52,-1.25]], 0.15, 0.13, pvM, [1], LA_),
    ...vessel([[1.3,1.0,-0.8],[1.9,1.2,-0.9],[2.5,1.35,-0.85]], 0.15, 0.13, pvM, [1], LA_),
    ...vessel([[1.3,0.62,-0.85],[1.9,0.58,-0.95],[2.5,0.52,-0.9]], 0.15, 0.13, pvM, [1], LA_)
  ]);

  /* --- vasos coronarios y grasa epicárdica, pegados a la superficie --- */
  const surf = [lv, rv, ra, la, raA, laA, conus]; const ctr = new THREE.Vector3(0.1,-0.4,0.1);
  const onSurf = (pts, n, lift) => Kit.snap(Kit.densify(pts, n), surf, ctr, lift);
  const corA = Kit.tissue({ color:0xC8352C, rough:0.3, coat:0.8, coatRough:0.2 }), corV = Kit.tissue({ color:0x4F5E9C, rough:0.32, coat:0.8, coatRough:0.2 }), fatM = Kit.tissue({ tex:'fat', rep:[8,1], bump:0.035, coat:0.6, rough:0.45, color:0xE8D2B0 });
  const cor = []; const route = (pts, n, r0, r1, m, lift=0.055) => { const s = onSurf(pts, n, lift); if (s.length>3) cor.push(new THREE.Mesh(Kit.taper(s, r0, r1, { seg: low?24:48, rad:8 }), m)); return s; };
  const fat = (pts, n, r) => { const s = onSurf(pts, n, -0.06); if (s.length>3) { const g = Kit.taper(s, r, r*0.65, { seg: low?30:60, rad:12, bumpy:0.55, bf:10, seed:3 }); cor.push(new THREE.Mesh(g, fatM)); } };
  fat([[0.55,0.3,1.3],[0.4,-0.4,1.35],[0.35,-1.1,1.25],[0.6,-1.8,1.05],[0.95,-2.2,0.7]], 22, 0.15);
  fat([[-0.3,0.35,1.1],[-1.0,0.25,1.0],[-1.6,-0.05,0.55],[-1.75,-0.6,-0.1]], 18, 0.17);
  fat([[0.8,0.35,0.95],[1.45,0.3,0.4],[1.75,0.15,-0.3],[1.45,0.05,-1.0]], 18, 0.15);
  route([[0.55,0.35,1.3],[0.4,-0.4,1.35],[0.35,-1.1,1.25],[0.6,-1.8,1.05],[1.02,-2.35,0.6]], 26, 0.07, 0.035, corA);
  route([[0.4,-0.5,1.35],[0.9,-0.8,1.1],[1.4,-1.1,0.7]], 12, 0.045, 0.025, corA);
  route([[0.8,0.35,0.95],[1.45,0.3,0.4],[1.75,0.15,-0.3],[1.45,0.05,-1.0]], 20, 0.06, 0.04, corA);
  route([[1.72,0.1,-0.2],[1.95,-0.7,-0.1],[1.8,-1.4,0.0]], 12, 0.045, 0.025, corA);
  route([[-0.3,0.4,1.1],[-1.0,0.25,1.0],[-1.6,-0.05,0.55],[-1.75,-0.6,-0.1],[-1.25,-1.1,-0.65]], 24, 0.065, 0.04, corA);
  route([[-1.55,-0.1,0.6],[-1.4,-0.8,0.85],[-1.0,-1.4,0.9]], 12, 0.04, 0.022, corA);
  route([[0.68,0.3,1.3],[0.58,-0.4,1.36],[0.54,-1.1,1.27],[0.78,-1.75,1.05]], 22, 0.045, 0.028, corV, 0.05);
  route([[-0.25,-0.9,1.1],[-0.55,-1.4,0.95]], 8, 0.035, 0.02, corV, 0.06);
  if (cor.length) add('vasos-coronarios', cor);

  /* --- válvulas con valvas --- */
  const leafMat = () => Kit.tissue({ color:0xEFE2D2, rough:0.35, coat:0.6, side:THREE.DoubleSide, tex:'tissue', rep:[1,1], bump:0.004 });
  const X = new THREE.Vector3(1,0,0);
  const valves = [];
  const valve = (id, c, axis, r, n, semilunar) => { const C = V3(c), A = V3(axis).normalize(); const U = new THREE.Vector3().crossVectors(A, Math.abs(A.y)<0.9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0)).normalize(); const W = new THREE.Vector3().crossVectors(A, U).normalize();
    const m0 = leafMat(); const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.035, 10, 40), Kit.tissue({ color:0xE6D3BE, rough:0.4, coat:0.5 })); ring.position.copy(C); ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), A);
    const meshes = [ring]; const span = Math.PI*2/n, gap = 0.05;
    for (let k=0;k<n;k++){ const th = k*span + span/2; const rd = U.clone().multiplyScalar(Math.cos(th)).addScaledVector(W, Math.sin(th)); const td = U.clone().multiplyScalar(-Math.sin(th)).addScaledVector(W, Math.cos(th)); const H = C.clone().addScaledVector(rd, r);
      const Q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(td, rd.clone().negate(), A)); const Qi = Q.clone().invert();
      const NS = 7, NT = 9, P = [], I = []; for (let i=0;i<=NS;i++){ const s = i/NS; for (let j=0;j<=NT;j++){ const t = j/NT*2-1; const ang = th + t*(span/2-gap)*(1-0.35*s); const dir = U.clone().multiplyScalar(Math.cos(ang)).addScaledVector(W, Math.sin(ang)); const w = C.clone().addScaledVector(dir, r*(1-s*0.96)).addScaledVector(A, (semilunar?-1:1)*0.22*r*Math.sin(Math.PI*s*0.9)*(1-Math.abs(t)*0.3)); w.sub(H).applyQuaternion(Qi); P.push(w.x,w.y,w.z); } }
      for (let i=0;i<NS;i++) for (let j=0;j<NT;j++){ const a=i*(NT+1)+j, b=a+1, cc=a+NT+1, d=cc+1; I.push(a,cc,b, b,cc,d); }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P,3)); g.setIndex(I); g.computeVertexNormals(); const uv = []; for (let i=0;i<=NS;i++) for (let j=0;j<=NT;j++) uv.push(j/NT, i/NS); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
      const leaf = new THREE.Mesh(g, m0); leaf.position.copy(H); leaf.quaternion.copy(Q); leaf.userData.q0 = Q.clone(); leaf.userData.leaf = true; meshes.push(leaf); }
    add(id, meshes); valves.push({ id, meshes, semilunar, open:0 }); };
  valve('valvula-tricuspide', S['valvula-tricuspide'].pos, [0.25,-1,0.25], 0.36, 3, false);
  valve('valvula-mitral', S['valvula-mitral'].pos, [-0.1,-1,0.35], 0.34, 2, false);
  valve('valvula-pulmonar', S['valvula-pulmonar'].pos, [0.15,1,-0.25], 0.3, 3, true);
  valve('valvula-aortica', S['valvula-aortica'].pos, [-0.25,1,0.2], 0.3, 3, true);

  /* --- flujo sanguíneo: glóbulos rojos (discos bicóncavos simplificados) --- */
  const paths = [
    { oxy:false, pts:[[-1.05,3.4,0.0],[-1.12,2.4,0.05],[-1.15,1.45,0.02],[-1.1,0.75,0.0],[-0.85,0.15,0.2],[-0.5,-0.5,0.45],[-0.3,-0.9,0.55],[-0.1,-0.3,0.72],[0.3,0.62,0.72],[0.42,1.3,0.52],[0.45,1.9,0.12],[-0.1,1.95,-0.6],[-1.2,1.9,-0.68],[-2.3,1.85,-0.6]] },
    { oxy:false, pts:[[-1.25,-2.4,-0.45],[-1.2,-0.9,-0.4],[-1.15,0.2,-0.15],[-1.1,0.7,0.0],[-0.85,0.15,0.2],[-0.45,-0.55,0.45],[-0.2,-0.8,0.6],[-0.05,-0.2,0.74],[0.3,0.62,0.72],[0.42,1.3,0.52],[0.45,1.9,0.12],[1.1,2.05,-0.25],[1.95,2.0,-0.35]] },
    { oxy:true, pts:[[-1.7,1.25,-1.2],[-0.7,1.15,-1.25],[0.2,1.0,-1.05],[0.7,0.8,-0.65],[0.62,0.05,-0.35],[0.8,-0.9,-0.1],[1.0,-1.6,0.05],[0.6,-0.8,-0.05],[0.1,0.38,-0.1],[-0.2,1.4,0.1],[-0.3,2.3,0.05],[0.0,3.05,-0.3],[0.75,3.0,-0.85],[1.05,2.3,-1.25],[1.05,1.0,-1.35],[0.95,-2.6,-1.4]] },
    { oxy:true, pts:[[2.5,1.35,-0.85],[1.9,1.2,-0.9],[1.3,1.0,-0.8],[0.7,0.8,-0.65],[0.62,0.05,-0.35],[0.9,-1.0,-0.05],[0.55,-0.7,-0.1],[0.1,0.38,-0.1],[-0.2,1.4,0.1],[-0.3,2.3,0.05],[-0.05,2.95,-0.2],[-0.35,3.6,-0.2],[-0.5,4.05,-0.15]] }
  ];
  const flow = { on:false, speed:1, meshes:[] };
  const rbcG = new THREE.SphereGeometry(0.075, 14, 10); { const p = rbcG.attributes.position; for (let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i); const rr = Math.hypot(x,z)/0.075; p.setY(i, y*0.42*(0.55+0.6*rr*rr)); } rbcG.computeVertexNormals(); }
  const oxyM = new THREE.MeshPhysicalMaterial({ color:0xE0342E, emissive:0x8a1010, emissiveIntensity:0.35, roughness:0.35, clearcoat:0.8 }), deoM = new THREE.MeshPhysicalMaterial({ color:0x4660C8, emissive:0x1a2a70, emissiveIntensity:0.35, roughness:0.35, clearcoat:0.8 });
  const RR = Kit.rng(21);
  paths.forEach(p => { const curve = Kit.curve(p.pts); const n = low ? 12 : 22; for (let i=0;i<n;i++){ const m = new THREE.Mesh(rbcG, p.oxy ? oxyM : deoM); m.userData = { t:i/n, curve, spin:new THREE.Vector3(RR()*2-1,RR()*2-1,RR()*2-1).normalize(), off:new THREE.Vector3(RR()-0.5,RR()-0.5,RR()-0.5).multiplyScalar(0.12) }; m.rotation.set(RR()*3,RR()*3,RR()*3); m.visible=false; E.scene.add(m); flow.meshes.push(m); } });

  const beatParts = { atr:['auricula-derecha','auricula-izquierda'], ven:['ventriculo-derecho','ventriculo-izquierdo','tabique'] };
  const model = {
    flow, beat:{ on:false, speed:1, phase:0.6 }, opacity:1,
    setFlow(on){ flow.on = on; flow.meshes.forEach(m => m.visible = on); },
    setBeat(on){ this.beat.on = on; if (!on){ [...beatParts.atr, ...beatParts.ven, 'vasos-coronarios'].forEach(id => { const p = E.parts.get(id); p && p.meshes.forEach(m=>m.scale.copy(m.userData.baseScale)); }); valves.forEach(v => { v.open = 0; setLeaves(v, 0); }); } },
    setLayer(capa, on){ D.structures.filter(s=>s.capa===capa).forEach(s => E.setVisible(s.id, on)); },
    setOpacity(o){ this.opacity=o; D.structures.forEach(s => { if (s.capa==='camaras' && !s.interno) E.setOpacity(s.id, o); }); E.setOpacity('vasos-coronarios', o<0.6 ? Math.max(o,0.25) : 1); },
    phaseName(){ const p = this.beat.phase; return p<0.15 ? 'Sístole auricular · las aurículas se contraen; tricúspide y mitral abiertas' : p<0.45 ? 'Sístole ventricular · se cierran tricúspide y mitral ("lub"); se abren pulmonar y aórtica' : 'Diástole · se cierran pulmonar y aórtica ("dub"); el corazón se relaja y se llena'; },
    phaseText(){ return this.beat.on ? this.phaseName() : ''; },
    setSpeed(k){ this.beat.speed=k; this.flow.speed=k; },
    legend:[{color:'var(--deoxy)',txt:'Glóbulos rojos con poco O₂ (lado derecho, arteria pulmonar)'},{color:'var(--oxy)',txt:'Glóbulos rojos cargados de O₂ (lado izquierdo, aorta)'},{color:'#EFE2D2',txt:'Valvas: se abren y cierran con cada fase'}],
    observa:'el lado derecho y el izquierdo se contraen al mismo tiempo, pero la sangre de cada lado nunca se mezcla. Mira las valvas: cuando los ventrículos se contraen, la tricúspide y la mitral se cierran y la pulmonar y la aórtica se abren.'
  };
  model.anims = [
    { id:'latido', label:'Latido y válvulas (ciclo cardíaco)', get on(){ return model.beat.on; }, set(on){ model.setBeat(on); } },
    { id:'flujo', label:'Flujo sanguíneo (glóbulos rojos)', get on(){ return model.flow.on; }, set(on){ model.setFlow(on); }, needsOpacity:0.5 }
  ];
  const qT = new THREE.Quaternion();
  function setLeaves(v, open){ v.meshes.forEach(m => { if (!m.userData.leaf) return; m.quaternion.copy(m.userData.q0).multiply(qT.setFromAxisAngle(X, open*(v.semilunar?1.05:1.2))); }); }
  E.onFrame((t, dt) => {
    if (!motionOK()) return;
    if (flow.on) flow.meshes.forEach(m => { const u = m.userData; u.t = (u.t + dt*0.055*flow.speed) % 1; m.position.copy(u.curve.getPointAt(u.t)).add(u.off); m.rotateOnAxis(u.spin, dt*2); });
    if (model.beat.on){ model.beat.phase = (model.beat.phase + dt*0.9*model.beat.speed) % 1; const p = model.beat.phase;
      const atr = p<0.15 ? 1-0.08*Math.sin(p/0.15*Math.PI) : 1; const ven = (p>=0.15 && p<0.45) ? 1-0.085*Math.sin((p-0.15)/0.3*Math.PI) : 1;
      beatParts.atr.forEach(id => E.parts.get(id).meshes.forEach(m => m.scale.copy(m.userData.baseScale).multiplyScalar(atr)));
      beatParts.ven.forEach(id => E.parts.get(id).meshes.forEach(m => m.scale.copy(m.userData.baseScale).multiplyScalar(ven)));
      const cp = E.parts.get('vasos-coronarios'); if (cp) cp.meshes.forEach(m => m.scale.setScalar(0.35+0.65*ven));
      valves.forEach(v => { const target = v.semilunar ? ((p>0.17 && p<0.43) ? 1 : 0) : ((p<0.15 || p>0.47) ? 1 : 0); v.open += (target - v.open)*Math.min(1, dt*14); setLeaves(v, v.open); }); }
  });
  return model;
}
</script>
<script>
/* =====================================================================
   MODELO: CÉLULA ANIMAL DETALLADA (vista en corte, simplificada)
   Membrana de doble capa con proteínas, envoltura nuclear con poros,
   cromatina y nucléolo, mitocondrias abiertas con crestas, cisternas del
   RER con ribosomas, red del REL, Golgi con vesículas, lisosomas,
   centríolos 9×3 y citoesqueleto.
   ===================================================================== */
function buildCell(E){
  const low = E.low; const S = Object.fromEntries(BIO.cell.structures.map(s=>[s.id,s]));
  const add = (id, meshes, lblPos, extra={}) => { const p = E.addPart(id, meshes, Object.assign({ explodeDir: V3(lblPos).normalize() }, extra)); E.addLabel(id, S[id].nombre, lblPos); return p; };
  const R = Kit.rng(17);
  const CAM = new THREE.Vector3(0.37,0.32,0.87).normalize();
  const phiC = Math.atan2(CAM.z, -CAM.x);          // ángulo φ de la esfera que mira a la cámara
  const cutStart = (len) => phiC + (Math.PI*2 - len)/2;   // la cuña retirada queda centrada hacia la cámara

  const xf = (g, pos, quat, scale) => { const m = new THREE.Matrix4().compose(pos, quat || new THREE.Quaternion(), scale || new THREE.Vector3(1,1,1)); g.applyMatrix4(m); return g; };
  const randDir = () => new THREE.Vector3(R()*2-1, R()*2-1, R()*2-1).normalize();
  const inCut = (p, c, ang=0.8) => { const d = p.clone().sub(c); d.y *= 0.4; return d.normalize().dot(CAM) > Math.cos(ang); };

  /* --- membrana plasmática: doble capa, corte en cuña, proteínas --- */
  const MS = [3.55, 2.95, 3.1];

  const geo = { outCut: shell(1, true), outFull: shell(1, false), inCut: shell(0.975, true), inFull: shell(0.975, false) };
  const mOut = Kit.tissue({ tex:'membrane', rep:[8,5], bump:0.03, color:0x8FD0DA, transparent:true, opacity:0.42, rough:0.25, coat:0.9, coatRough:0.15, side:THREE.DoubleSide, depthWrite:false });
  const mIn = Kit.tissue({ color:0xC7ECEF, transparent:true, opacity:0.3, rough:0.3, coat:0.6, side:THREE.DoubleSide, depthWrite:false });
  const outer = new THREE.Mesh(geo.outCut, mOut), inner = new THREE.Mesh(geo.inCut, mIn); outer.renderOrder = 2; inner.renderOrder = 1;

  const rimGeo = (() => { const P = [], I = []; const edges = [cutStart(1.5*Math.PI), cutStart(1.5*Math.PI)+1.5*Math.PI]; let base = 0;
    edges.forEach(phi => { const N = 40; for (let i=0;i<=N;i++){ const th = i/N*Math.PI; const d = new THREE.Vector3(-Math.cos(phi)*Math.sin(th), Math.cos(th), Math.sin(phi)*Math.sin(th)); const e = 1 + mDisp(d)/Math.max(0.01, 1); [1,0.975].forEach(k => { const dd = mDisp(d)*k; P.push(d.x*(MS[0]*k)+d.x*dd, d.y*(MS[1]*k)+d.y*dd, d.z*(MS[2]*k)+d.z*dd); }); }
      for (let i=0;i<N;i++){ const a = base+i*2; I.push(a, a+1, a+2, a+1, a+3, a+2); } base += (N+1)*2; });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P,3)); g.setIndex(I); g.computeVertexNormals(); return g; })();
  const rim = new THREE.Mesh(rimGeo, Kit.tissue({ color:0x4FAFBF, rough:0.4, coat:0.5, side:THREE.DoubleSide }));
  // proteínas de membrana (mosaico fluido)
  const protG = THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.04, 0.08, 4, 8) : new THREE.CylinderGeometry(0.042, 0.042, 0.13, 10);
  const nProt = low ? 70 : 150; const prot = new THREE.InstancedMesh(protG, org(0x8C7CC4), nProt); const prot2 = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8), org(0xD6B06A), Math.floor(nProt*0.6));
  const dm = new THREE.Object3D(); let pi = 0, pj = 0;
  for (let i=0;i<nProt*2 && (pi<nProt || pj<prot2.count);i++){ const d = randDir(); const p = new THREE.Vector3(d.x*MS[0], d.y*MS[1], d.z*MS[2]).addScaledVector(d, mDisp(d)); if (inCut(p, new THREE.Vector3(), 0.78)) continue; dm.position.copy(p); dm.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d); dm.updateMatrix(); if (i%3 && pi<nProt) prot.setMatrixAt(pi++, dm.matrix); else if (pj<prot2.count) prot2.setMatrixAt(pj++, dm.matrix); }
  prot.count = pi; prot2.count = pj;
  add('membrana', [outer, inner, rim, prot, prot2], [2.7,2.7,1.0], { explodeDir:new THREE.Vector3(0,0,0), passThrough:true });

  /* --- citoplasma: citoesqueleto (microtúbulos desde el centrosoma) y gránulos --- */
  const CS = new THREE.Vector3(-0.35,1.3,0.75);
  const mts = []; for (let i=0;i<(low?26:48);i++){ const d = randDir(); const end = new THREE.Vector3(d.x*MS[0]*0.9, d.y*MS[1]*0.9, d.z*MS[2]*0.9); const mid = CS.clone().lerp(end, 0.5).add(randDir().multiplyScalar(0.35)); mts.push(Kit.taper([CS.clone().addScaledVector(d,0.2), mid, end], 0.012, 0.01, { seg:16, rad:4 })); }
  const cyto = new THREE.Mesh(Kit.merge(mts), new THREE.MeshStandardMaterial({ color:0x8FD8B0, transparent:true, opacity:0.55, roughness:0.5, depthWrite:false }));
  const gr = new THREE.BufferGeometry(); const gn = low?160:360; const ga = new Float32Array(gn*3); for (let i=0;i<gn;i++){ const d = randDir(), r = 0.35+R()*0.55; ga[i*3]=d.x*MS[0]*r; ga[i*3+1]=d.y*MS[1]*r; ga[i*3+2]=d.z*MS[2]*r; } gr.setAttribute('position', new THREE.BufferAttribute(ga,3));
  const gran = new THREE.Points(gr, new THREE.PointsMaterial({ color:0x9CCFD6, size:0.045, transparent:true, opacity:0.6, depthWrite:false }));
  add('citoplasma', [cyto, gran], [-3.0,-1.2,1.7], { pickable:false, explodeDir:new THREE.Vector3(0,0,0) });

  /* --- núcleo: doble envoltura con poros, cromatina --- */
  const NC = new THREE.Vector3(0.3,0.2,0), NR = 1.1;
  const nShell = (k, cut) => { const g = Kit.sculpt({ w: low?48:80, h: low?34:60, phiStart: cut ? cutStart(1.5*Math.PI) : 0, phiLength: cut ? 1.5*Math.PI : Math.PI*2, radii:[NR*k, NR*0.95*k, NR*k], disp:(p,d) => 0.03*Kit.fbm(d.x*2+9, d.y*2, d.z*2, 2) }); g.translate(NC.x,NC.y,NC.z); return g; };
  const ngeo = { outCut:nShell(1,true), outFull:nShell(1,false), inCut:nShell(0.94,true), inFull:nShell(0.94,false) };
  const nOut = new THREE.Mesh(ngeo.outCut, Kit.tissue({ tex:'membrane', rep:[4,3], bump:0.015, color:0x7E66CC, rough:0.35, coat:0.7, side:THREE.DoubleSide }));
  const nIn = new THREE.Mesh(ngeo.inCut, Kit.tissue({ color:0x5E4AA6, rough:0.5, coat:0.3, side:THREE.BackSide }));
  const poreN = low?50:110; const pores = new THREE.InstancedMesh(new THREE.TorusGeometry(0.05, 0.018, 6, 14), org(0xC9B8F2), poreN); let pc = 0;
  for (let i=0;i<poreN*3 && pc<poreN;i++){ const d = randDir(); if (d.dot(CAM) > 0.55) continue; dm.position.copy(NC).add(new THREE.Vector3(d.x*NR*1.005, d.y*NR*0.95*1.005, d.z*NR*1.005)); dm.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), d); dm.updateMatrix(); pores.setMatrixAt(pc++, dm.matrix); } pores.count = pc;
  const chrom = []; for (let i=0;i<(low?10:18);i++){ let p = NC.clone().add(randDir().multiplyScalar(R()*0.6)); const pts = [p.clone()]; for (let j=0;j<7;j++){ p = p.clone().add(randDir().multiplyScalar(0.28)); if (p.distanceTo(NC) > 0.9) p.sub(NC).multiplyScalar(0.8).add(NC); pts.push(p); } chrom.push(Kit.taper(pts, 0.035, 0.03, { seg:30, rad:5, bumpy:0.4, bf:20, seed:i })); }

  const nuc = new THREE.Mesh(Kit.sculpt({ radii:[0.36,0.33,0.35], w:40, h:30, disp:(p)=>0.04*Kit.n3(p.x*9,p.y*9,p.z*9) }), Kit.tissue({ tex:'granular', rep:[3,2], bump:0.02, color:0x3A2478, rough:0.55, coat:0.3 }));

  /* --- retículo endoplasmático rugoso: cisternas + ribosomas --- */

  const sheets = [], riboPts = [];
  [[1.35,4.3,1.9,0.34],[1.5,4.0,2.1,0.4],[1.66,4.5,1.8,0.3],[1.82,4.1,2.0,0.42],[1.98,4.4,1.7,0.36]].forEach(([r,ps,pl,ts],k) => {

    for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n = v.clone().normalize(); v.addScaledVector(n, 0.06*Math.sin(v.x*5+k)+0.05*Math.sin(v.y*6+v.z*4)); p.setXYZ(i,v.x,v.y,v.z); } g.computeVertexNormals(); g.translate(NC.x,NC.y,NC.z); sheets.push(g);
    for (let i=0;i<(low?60:130);i++){ const vi = Math.floor(R()*p.count); riboPts.push(new THREE.Vector3(p.getX(vi)+NC.x, p.getY(vi)+NC.y, p.getZ(vi)+NC.z).add(randDir().multiplyScalar(0.045))); } });
  const rerMesh = new THREE.Mesh(Kit.merge(sheets), rerM);
  const rrib = new THREE.InstancedMesh(new THREE.SphereGeometry(0.028, 6, 5), org(0x2F2A44, { rough:0.6, coat:0.2 }), riboPts.length); riboPts.forEach((p,i) => { dm.position.copy(p); dm.quaternion.identity(); dm.updateMatrix(); rrib.setMatrixAt(i, dm.matrix); });

  const relC = new THREE.Vector3(2.05,0.35,0.55); const rel = []; for (let i=0;i<(low?9:16);i++){ const pts = []; let p = relC.clone().add(randDir().multiplyScalar(0.55)); for (let j=0;j<5;j++){ pts.push(p.clone()); p = p.clone().add(randDir().multiplyScalar(0.32)); if (p.distanceTo(relC) > 0.85) p.sub(relC).multiplyScalar(0.7).add(relC); } rel.push(Kit.taper(pts, 0.05, 0.045, { seg:24, rad:7 })); }

  const gg = [], vesG = [];
  for (let i=0;i<5;i++){ const rr = 0.66 - i*0.07, SR = 0.95; const cap = new THREE.SphereGeometry(SR, low?28:44, 8, 0, Math.PI*2, 0, Math.asin(Math.min(0.99,rr/SR))); cap.translate(0,-SR,0); cap.scale(1.45,1,0.75); const off = new THREE.Vector3(0, i*0.15, 0); xf(cap, GC.clone().add(off.clone().applyQuaternion(gq)), gq); gg.push(cap);
    const ring = new THREE.TorusGeometry(rr, 0.028, 8, 40); ring.rotateX(Math.PI/2); ring.translate(0, -SR + Math.sqrt(SR*SR-rr*rr), 0); ring.scale(1.45,1,0.75); xf(ring, GC.clone().add(off.clone().applyQuaternion(gq)), gq); gg.push(ring); }

  [[-1.95,0.95,0.55],[1.95,-0.95,0.45],[-0.9,-1.95,-0.35],[1.4,1.65,-0.8],[-2.15,-0.55,-1.05],[0.9,-2.1,0.9]].forEach((c,k) => {
    const Z = CAM.clone().add(randDir().multiplyScalar(0.35)).normalize(); const Y = new THREE.Vector3().crossVectors(Z, randDir()).normalize(); const X = new THREE.Vector3().crossVectors(Y, Z); const q = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
    const L = 1.25 + R()*0.35, r = 0.3; const pos = V3(c);
    const o = new THREE.LatheGeometry(capsule(L, r, 16), low?20:32, 0.28*Math.PI, 1.44*Math.PI); xf(o, pos, q); mitoOut.push(o);
    const inn = new THREE.LatheGeometry(capsule(L*0.94, r*0.86, 16), low?20:32, 0.3*Math.PI, 1.4*Math.PI); xf(inn, pos, q); mitoIn.push(inn);
    const nC = 6; for (let j=0;j<nC;j++){ const y = -L*0.36 + j/(nC-1)*L*0.72; const w = r*0.82*Math.sqrt(1 - Math.pow(y/(L*0.5),2)); const pl = new THREE.PlaneGeometry(w*1.6, 0.3*r*2, 10, 3); const pp = pl.attributes.position; for (let i=0;i<pp.count;i++){ pp.setZ(i, 0.03*Math.sin(pp.getX(i)*28)); } pl.computeVertexNormals(); pl.rotateX(Math.PI/2); pl.translate((j%2 ? 1 : -1)*w*0.25, y, -0.02); xf(pl, pos, q); mitoIn.push(pl); } });
  add('mitocondria', [new THREE.Mesh(Kit.merge(mitoOut), org(0xE0784A, { side:THREE.DoubleSide })), new THREE.Mesh(Kit.merge(mitoIn), org(0xF4A77A, { side:THREE.DoubleSide }))], [-2.75,1.55,1.1]);

  /* --- lisosomas: membrana + contenido denso --- */
  const lisO = [], lisI = []; [[1.25,-1.95,1.15],[-2.0,1.95,-0.4],[2.35,0.9,-0.95],[-0.4,2.25,-1.1],[1.9,-0.2,1.9]].forEach(p => { const a = new THREE.SphereGeometry(0.22,18,14); a.translate(...p); lisO.push(a); const b = Kit.sculpt({ radii:[0.16,0.16,0.16], w:20, h:14, disp:(q)=>0.03*Kit.n3(q.x*20,q.y*20,q.z*20) }); b.translate(...p); lisI.push(b); });
  add('lisosomas', [new THREE.Mesh(Kit.merge(lisO), org(0xD27AA6, { transparent:true, opacity:0.55, depthWrite:false })), new THREE.Mesh(Kit.merge(lisI), org(0x8E2E62))], [2.1,-2.6,1.6]);

  /* --- ribosomas libres y polirribosomas --- */
  const fr = []; for (let i=0;i<(low?140:320);i++){ const d = randDir(), r = 0.45+R()*0.45; const p = new THREE.Vector3(d.x*MS[0]*r, d.y*MS[1]*r, d.z*MS[2]*r); if (p.distanceTo(NC) < 1.35) continue; fr.push(p); }

  const pcm = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), new THREE.MeshStandardMaterial({ color:0x8FA8C6, transparent:true, opacity:0.18, depthWrite:false })); pcm.position.copy(CS).add(new THREE.Vector3(0.15,-0.1,0));

  const anim = { active:null, parts:[], t:0 };
  const pgeo = new THREE.SphereGeometry(0.06,10,8);
  const routes = {
    mitocondria:{ from:[-1.95,0.95,0.55], to:[[-0.5,2.4,0.4],[-2.6,-0.5,1.6],[-1.0,0.3,2.3]], color:0xFFC24A, txt:'ATP saliendo de la mitocondria hacia el citoplasma' },
    nucleo:{ from:[0.3,0.2,0], to:[[2.4,-1.9,-0.9],[1.9,-1.4,1.6],[-2.0,-1.2,1.0]], color:0xB8A8FF, txt:'ARN mensajero saliendo por los poros nucleares hacia los ribosomas' },
    nucleolo:{ from:[0.58,0.32,0.38], to:[[2.4,-1.9,-0.9],[-2.2,-1.5,0.8]], color:0x8E78E0, txt:'Subunidades ribosómicas saliendo del núcleo' },
    rer:{ from:[-0.9,-0.6,0.9], to:[[-1.2,-0.55,1.45]], color:0x9CC4EA, txt:'Vesículas con proteínas viajando del retículo al Golgi' },
    rel:{ from:[2.05,0.35,0.55], to:[[0.2,3.0,0.9],[3.0,-1.4,1.2]], color:0xBFDDF2, txt:'Lípidos nuevos incorporándose a las membranas' },
    golgi:{ from:[-1.2,-0.55,1.45], to:[[-2.0,-1.4,2.5],[-0.2,-2.3,2.1]], color:0xFFD27A, txt:'Vesículas de secreción viajando hacia la membrana (exocitosis)' },
    lisosomas:{ from:[1.25,-1.95,1.15], to:[[1.7,-2.6,1.8]], color:0xF08CC0, txt:'Lisosoma fusionándose con una vesícula para digerir su contenido' },
    ribosomas:{ from:[2.4,-1.9,-0.9], to:[[2.6,-1.2,-1.6],[1.6,-2.4,-1.2]], color:0x6A6488, txt:'Proteínas recién sintetizadas liberadas al citosol' },
    membrana:{ from:[0.6,3.6,0.9], to:[[0.3,2.1,0.6]], color:0x7FE0EC, txt:'Moléculas cruzando la membrana por difusión y por proteínas de transporte' },
    citoplasma:{ from:[-2.2,-2.2,1.0], to:[[-1.95,0.95,0.55]], color:0xB5E3E8, txt:'Piruvato (de la glucólisis) entrando a la mitocondria' },
    centriolos:{ from:[-0.2,1.2,0.75], to:[[-3.0,1.2,0.8],[2.6,1.2,0.8]], color:0x7FA0C8, txt:'Microtúbulos del huso mitótico extendiéndose hacia los polos' }
  };

  const model = {
    action(id){ this.stop(); const r = routes[id]; if (!r) return null; anim.active = r; const m = new THREE.MeshBasicMaterial({ color:r.color, toneMapped:false }); r.to.forEach(to => { for (let i=0;i<7;i++){ const p = new THREE.Mesh(pgeo, m); p.userData = { from:V3(r.from), to:V3(to), off:i/7 }; E.scene.add(p); anim.parts.push(p); } }); return r.txt; },

  return model;
}

<script>
/* =====================================================================
   MODELOS DETALLADOS: CEREBRO · PULMONES (procedimentales, simplificados)
   Contrato: build(E) → { anims, setSpeed, phaseText, legend, observa, [colorModes] }
   ===================================================================== */
const smooth01 = v => v<0?0:v>1?1:v*v*(3-2*v);
const lin = v => Math.pow(Math.max(0,v), 2.2);
const gauss = (d,w) => Math.exp(-(d*d)/(w*w));

/* ============================== CEREBRO ============================== */
function buildBrain(E){
  const low = E.low; const D = BIO.brain; const S = Object.fromEntries(D.structures.map(s=>[s.id,s]));
  const add = (id, meshes, extra={}) => { const s=S[id]; const p = E.addPart(id, meshes, Object.assign({ capa:s.capa, interno:s.interno, explodeDir:V3(s.pos).sub(new THREE.Vector3(-0.3,-0.3,0)).normalize() }, extra)); E.addLabel(id, s.nombre, s.lbl); return p; };

  const yS = x => -0.35 + (1.2 - x)*0.33, xC = y => -0.1 + (1.65 - y)*0.36, xO = y => -1.6 + 0.22*(y - 0.3);
  const lobeOf = (x,y) => (y < yS(x) && x > -1.55 && x < 1.45) ? 'lobulo-temporal' : x > xC(y) ? 'lobulo-frontal' : x < xO(y) ? 'lobulo-occipital' : 'lobulo-parietal';
  const hemis = {}; const natural = {}, coded = {};
  [1,-1].forEach(sg => {
    const cz = sg*0.2; const info = [];
    const g = Kit.sculpt({ w: low?120:200, h: low?90:150,
      shape: d => { const lat = d.z*sg; let x = 2.45*d.x, y = d.y>0 ? 1.62*d.y : 1.08*d.y; let z = lat>0 ? 1.5*d.z : 0.14*d.z; z *= 0.86 + 0.16*smooth01((0.7 - d.x)/1.2);
        if (d.y<0.15 && lat>-0.2) y -= 0.55*gauss(d.x-0.12,0.42)*smooth01((0.15-d.y)/0.5)*smooth01((lat+0.2)/0.5);
        if (d.x>0.35 && d.y<0) y += 0.3*smooth01((d.x-0.35)/0.45)*(-d.y);

        return new THREE.Vector3(x, y+0.35, z+cz); },
      disp: (p,d) => { const lat = d.z*sg, med = lat<0.1 ? 0.55 : 1; const n = Kit.n3(p.x*1.25+sg*3, p.y*1.25, p.z*1.25) + 0.45*Kit.n3(p.x*2.6+7, p.y*2.6, p.z*2.6);
        const sul = gauss(n, 0.1); const yy = p.y-0.35; let b = 0;
        if (p.x>-1.5 && p.x<1.35) b = Math.max(b, 1.9*gauss(yy - yS(p.x), 0.07)*(lat>-0.1?1:0.3));
        if (yy > yS(p.x)) b = Math.max(b, 1.1*gauss(p.x - xC(yy), 0.055));
        b = Math.max(b, 0.8*gauss(p.x - xO(yy), 0.06));
        const dz = med*(-0.11*sul + 0.03*(1-sul)) - 0.1*b; info.push(Math.min(1, Math.pow(sul*med + b, 0.8))); return dz; },
      store: (p,d) => lobeOf(p.x, p.y-0.35) });
    const t = info; const nat = new Float32Array(g.attributes.position.count*3), cod = new Float32Array(nat.length);
    for (let i=0;i<g.attributes.position.count;i++){ const k = t[i], L = LOBE[g.userData.extra[i]]; const sh = 1 - 0.55*k; for (let c=0;c<3;c++){ nat[i*3+c] = lin(GYR[c]+(SUL[c]-GYR[c])*k); cod[i*3+c] = lin(L[c]*sh); } }
    g.setAttribute('color', new THREE.BufferAttribute(nat.slice(),3)); g.userData.nat = nat; g.userData.cod = cod;
    hemis[sg] = Kit.split(g, i => g.userData.extra[i]);
    // copias de color por región
    Object.entries(hemis[sg]).forEach(([id, sub]) => { sub.userData = { nat: sub.attributes.color.array.slice() }; });
    // recalcular codificado por región: color del lóbulo * sombreado
    Object.entries(hemis[sg]).forEach(([id, sub]) => { const a = sub.userData.nat, L = LOBE[id]; const c = new Float32Array(a.length); for (let i=0;i<a.length;i+=3){ const k = (GYR[0]-Math.pow(a[i],1/2.2))/(GYR[0]-SUL[0]); const sh = 1-0.55*Math.max(0,Math.min(1,k)); c[i]=lin(L[0]*sh); c[i+1]=lin(L[1]*sh); c[i+2]=lin(L[2]*sh); } sub.userData.cod = c; });
  });
  const cortexMat = () => Kit.tissue({ vc:true, rough:0.52, coat:0.45, coatRough:0.35, tex:'tissue', rep:[6,6], bump:0.01, env:0.8 });
  const lobeMeshes = {};
  Object.keys(LOBE).forEach(id => { const m = cortexMat(); lobeMeshes[id] = [1,-1].filter(sg => hemis[sg][id]).map(sg => new THREE.Mesh(hemis[sg][id], m)); add(id, lobeMeshes[id]); });

  /* cerebelo con folias */
  const cbMat = Kit.tissue({ vc:true, rough:0.5, coat:0.35, coatRough:0.4 });
  const cb = [1,-1].map(sg => { const g = Kit.sculpt({ w: low?72:120, h: low?54:90, shape: d => new THREE.Vector3(1.0*d.x, 0.6*d.y*(d.y>0?1:1.1), 0.82*d.z + (d.z*sg<0 ? 0.35*d.z : 0)),
      disp: (p) => { const a = Math.atan2(p.y+0.1, p.x+0.25); const f = Math.sin(a*30 + 1.8*Kit.n3(p.x*2,p.y*2,p.z*2)); return 0.03*f; },
      color: (p,d,dz,o) => { const k = Math.max(0,Math.min(1,0.5 - dz/0.06)); o[0]=lin(0.86-0.42*k); o[1]=lin(0.62-0.42*k); o[2]=lin(0.57-0.38*k); } });
    const m = new THREE.Mesh(g, cbMat); m.position.set(-1.55,-1.12,sg*0.6); return m; });
  add('cerebelo', cb);
  const stemMat = Kit.tissue({ color:0xE4C3AE, rough:0.48, coat:0.4, tex:'tissue', rep:[2,6], bump:0.008 });
  add('tronco', [new THREE.Mesh(Kit.taper([[-0.1,-0.15,0],[-0.3,-0.9,0],[-0.5,-1.75,0],[-0.6,-2.35,0]], 0, 0, { rfn:u => 0.3 + 0.17*gauss(u-0.45,0.16) - 0.06*u }), stemMat)]);
  const cord = [new THREE.Mesh(Kit.taper([[-0.6,-2.3,0],[-0.66,-3.2,0],[-0.72,-4.15,0]], 0.23, 0.18), stemMat)];
  [-2.65,-3.05,-3.45,-3.85].forEach((y,i) => [1,-1].forEach(sg => { const x = -0.64 - 0.02*i; cord.push(new THREE.Mesh(Kit.taper([[x,y,sg*0.15],[x+0.05,y-0.12,sg*0.5],[x+0.12,y-0.35,sg*0.95]], 0.045, 0.03, { seg:12, rad:6 }), stemMat)); }));
  add('medula', cord);

  /* estructuras profundas */
  const cc = new THREE.Mesh(Kit.taper([[1.1,0.3,0],[0.75,0.72,0],[0,0.88,0],[-0.8,0.7,0],[-1.12,0.38,0]], 0, 0, { rfn:u => 0.1 + 0.08*gauss(u,0.15) + 0.1*gauss(u-1,0.14) }), Kit.tissue({ color:0xF3EBDD, rough:0.4, coat:0.45 })); cc.scale.set(1,1,2.6);
  add('cuerpo-calloso', [cc]);
  const deep = (c, r, col, rot) => { const m = new THREE.Mesh(Kit.sculpt({ radii:r, w:40, h:30, disp:(p)=>0.012*Kit.n3(p.x*6,p.y*6,p.z*6) }), Kit.tissue({ color:col, rough:0.42, coat:0.5 })); m.position.set(...c); if (rot) m.rotation.set(...rot); return m; };
  add('talamo', [deep([-0.1,0.05,0.3],[0.5,0.3,0.25],0x9B6FB5), deep([-0.1,0.05,-0.3],[0.5,0.3,0.25],0x9B6FB5)]);
  add('hipotalamo', [deep([0.3,-0.36,0],[0.3,0.19,0.28],0xE0A040)]);
  add('hipofisis', [deep([0.46,-1.0,0],[0.2,0.16,0.2],0xE8B890), deep([0.3,-1.0,0],[0.12,0.12,0.14],0xD8A07A), new THREE.Mesh(Kit.taper([[0.3,-0.5,0],[0.36,-0.72,0],[0.4,-0.9,0]], 0.06, 0.045, { seg:12, rad:8 }), Kit.tissue({ color:0xE0B08A, rough:0.45 }))]);
  const hipM = Kit.tissue({ color:0x5F9DB0, rough:0.4, coat:0.5 });
  add('hipocampo', [1,-1].map(sg => new THREE.Mesh(Kit.taper([[-0.95,-0.2,sg*0.72],[-0.55,-0.5,sg*0.84],[0.05,-0.62,sg*0.9],[0.5,-0.55,sg*0.86],[0.62,-0.42,sg*0.8]], 0, 0, { rfn:u => 0.07 + 0.1*u*u }), hipM)));

  /* impulso nervioso */
  const route = Kit.curve([[3.0,-4.3,1.8],[1.3,-4.0,0.9],[-0.66,-3.6,0.1],[-0.5,-1.8,0.05],[-0.2,-0.3,0.1],[-0.1,0.1,0.35],[-0.3,1.45,1.0],[0.35,1.55,1.0],[1.0,1.3,1.1],[0.3,0.2,0.3],[-0.4,-1.6,0.05],[-0.66,-3.5,0.1],[1.0,-4.1,1.0],[3.0,-4.5,2.1]]);
  const imp = { on:false, t:0, speed:1, parts:[] }; const pm = new THREE.MeshBasicMaterial({ color:0xFFE38A, toneMapped:false }); const pg = new THREE.SphereGeometry(0.075,10,8);
  for (let i=0;i<10;i++){ const m = new THREE.Mesh(pg, pm); m.visible=false; m.userData.off = -i*0.01; m.scale.setScalar(1-i*0.07); E.scene.add(m); imp.parts.push(m); }
  const handG = Kit.sculpt({ radii:[0.42,0.14,0.3], w:32, h:24 }); const hand = new THREE.Mesh(handG, Kit.tissue({ color:0xE2B597, rough:0.55, coat:0.2 })); hand.position.set(3.2,-4.45,1.95); hand.visible=false; E.scene.add(hand);
  const stim = new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12), new THREE.MeshBasicMaterial({ color:0xFF6A3D, toneMapped:false })); stim.position.set(3.45,-4.2,2.2); stim.visible=false; E.scene.add(stim);

  };
