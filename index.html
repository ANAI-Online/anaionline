    proposito:'Explicar el movimiento de los planetas alrededor del Sol y reconocer la radiación electromagnética como la única evidencia que tenemos de lo que ocurre a millones de kilómetros.',
    observa:[
      'Qué le pasa al modelo cuando pides la escala real de distancias',
      'Cuántas vueltas da Mercurio mientras la Tierra da una sola',
      'Cómo cambia tu peso (no tu masa) de un mundo a otro',
      'Que el infrarrojo se siente caliente, pero el ultravioleta es el que daña'
    ],
    reto:'Responde las cuatro preguntas del reto final: escala, tamaño, energía de la radiación y por qué “en el espacio hace frío” es una frase tramposa.',
    statusEl: retoSt
  }));

  /* ---- pestañas ---- */
  const tabs = h('div',{class:'tabs',role:'tablist',style:'margin-bottom:14px'});
  const paneSolar = h('div',{role:'tabpanel','aria-label':'Sistema solar'});
  const paneEsp   = h('div',{role:'tabpanel','aria-label':'Espectro electromagnético',style:'display:none'});
  let tab = tabIni === 'espectro' ? 'espectro' : 'solar';
  const bSolar = h('button',{role:'tab',onclick:()=>setTab('solar')},'🪐 Sistema solar 3D');
  const bEsp   = h('button',{role:'tab',onclick:()=>setTab('espectro')},'🌈 Espectro electromagnético');
  tabs.append(bSolar, bEsp);
  function setTab(t){
    tab = t;
    bSolar.setAttribute('aria-selected', t==='solar');
    bEsp.setAttribute('aria-selected', t==='espectro');
    paneSolar.style.display = t==='solar' ? '' : 'none';
    paneEsp.style.display   = t==='espectro' ? '' : 'none';
    if (t==='solar' && E) E.resize();
    Store.log('pestania',{vista:'cn-sim-espacio',pestania:t});
  }

  /* =================================================================
     BLOQUE 1 · SISTEMA SOLAR
     ================================================================= */
  const S = { escala:'did', vel: espQuieto() ? 0 : 10, dias:0, sel:'tierra', masa:45 };
  const stage = h('div',{class:'stage esp-stage',style:'align-self:start;height:600px;min-height:600px'}), panel = h('div',{class:'panel'});

  /* controles sobre el escenario */
  const segEscala = h('div',{class:'segmented',role:'group','aria-label':'Escala del modelo'});
  const btnDid  = h('button',{onclick:()=>setEscala('did'),'aria-label':'Escala didáctica'},'Escala didáctica');
  const btnReal = h('button',{onclick:()=>setEscala('real'),'aria-label':'Escala real de distancias'},'Escala real de distancias');
  segEscala.append(btnDid, btnReal);
  const chkLbl = h('input',{type:'checkbox',checked:true,'aria-label':'Mostrar etiquetas de los planetas',onchange:e=>{ if (E) E.setLabels(e.target.checked); }});
  const segVel = h('div',{class:'segmented',role:'group','aria-label':'Velocidad de la simulación'});
  const VELS = [[0,'⏸','Pausa'],[1,'×1','1 día por segundo'],[10,'×10','10 días por segundo'],[100,'×100','100 días por segundo']];
  const btnsVel = VELS.map(([v,txt,lab]) => h('button',{'aria-label':lab,onclick:()=>setVel(v)},txt));
  segVel.append(...btnsVel);
  const notaTiempo = h('span',{class:'stage-note'},'—');
  stage.append(h('div',{class:'stage-top'}, segEscala, h('label',{class:'toggle',style:'background:color-mix(in srgb,var(--bg-2) 85%,transparent);padding:4px 10px;border-radius:10px;border:1px solid var(--line)'}, chkLbl, 'Etiquetas')));
  stage.append(h('div',{class:'stage-bottom'}, segVel, notaTiempo));

  /* panel lateral */
  const listaEl = h('div',{class:'esp-plist',role:'group','aria-label':'Lista de cuerpos del sistema solar, seleccionables con el teclado'});
  const fichaEl = h('div',{class:'stack'});
  const vueltasEl = h('div',{class:'esp-vueltas','aria-live':'polite'});
  const readEl = h('div',{class:'readouts',style:'grid-template-columns:repeat(2,1fr)'});
  panel.append(
    h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Elige un cuerpo'), listaEl,
      h('p',{class:'small muted'},'También puedes hacer clic sobre el planeta en el modelo. Con el teclado: Tab para recorrer la lista y Enter para elegir.')),
    h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Ficha del cuerpo'), fichaEl),
    h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Reloj del modelo'), readEl, vueltasEl,
      h('p',{class:'small muted'},'“Vueltas” = órbitas completas alrededor del Sol desde que empezó la simulación.'))
  );

  const notaEscala = h('div',{class:'notice info'});
  paneSolar.append(h('div',{class:'viewer'}, stage, panel), h('div',{style:'height:14px'}), notaEscala);

  /* --- motor 3D --- */
  let E = null, sun = null, svg2d = null, marcas2d = null, raf2d = 0;
  const M = {};   /* mallas por id */
  const ORB = {}; /* líneas de órbita por id */
  let sunR = 1;

  if (webglOK){
    try {
      E = new Engine3D(stage, {
        radius:36, phi:0.86, theta:0.5, minR:2, maxR:72, target:[0,0,0], dark:true, exposure:1.0,
        aria:'Modelo 3D del sistema solar. Arrastra para rotar, rueda del ratón para acercar. Usa la lista de cuerpos para seleccionar con el teclado.',
        onSelect:(id)=>{ if (id) elegir(id.replace('-orb','')); }
      });
      construir3D();
    } catch(err){ console.warn('espacio 3D', err); E = null; }
  }
  if (!E){
    stage.append(construir2D());
  }

  function construir3D(){
    /* el Sol es la única fuente real: atenuamos las luces de estudio del motor */
    E.scene.traverse(o => { if (o.isDirectionalLight) o.intensity *= 0.22; if (o.isHemisphereLight) o.intensity = 0.10; });
    E.spotlight = () => {};   /* en el sistema solar no atenuamos los demás cuerpos al seleccionar uno */
    E.scene.add(new THREE.PointLight(0xfff2d8, 2.4));
    sun = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), new THREE.MeshBasicMaterial({ color:new THREE.Color(0xffc233).convertSRGBToLinear(), toneMapped:false }));
    E.addPart('sol', [sun], { passThrough:true });
    E.addLabel('sol','Sol',[0,1.4,0]);
    ESP_PLANETAS.forEach((p, i) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 30, 22), mat(p.color, { roughness:0.9, clearcoat:0, envMapIntensity:0.18 }));
      m.position.set(3 + i, 0, 0);
      const meshes = [m];
      if (p.id === 'saturno'){
        const ring = new THREE.Mesh(new THREE.RingGeometry(1.45, 2.35, 54),
          new THREE.MeshBasicMaterial({ color:new THREE.Color(0xc9ae76).convertSRGBToLinear(), side:THREE.DoubleSide, transparent:true, opacity:0.7, toneMapped:false }));
        ring.rotation.x = -Math.PI/2 + 0.38; ring.userData.ring = true;
        meshes.push(ring); M[p.id+'-ring'] = ring;
      }
      E.addPart(p.id, meshes);
      E.addLabel(p.id, p.n, [0,0,0]);
      M[p.id] = m;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(128*3), 3));
      const line = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ color:new THREE.Color(0x8ea2cc).convertSRGBToLinear(), transparent:true, opacity:0.5 }));
      E.addPart(p.id+'-orb', [line], { pickable:false, passThrough:true });
      ORB[p.id] = line;
    });
    aplicarEscala();
    E.onFrame((t, dt) => paso(dt));
  }

  /* --- escalas --- */
  const UA_REAL = 15 / 30.07;            /* unidades del modelo por UA en escala real */
  const R_SOL_KM = 696340, KM_UA = 149.6e6;
  function aplicarEscala(){
    const real = S.escala === 'real';
    ESP_PLANETAS.forEach((p, i) => {
      p._r   = real ? p.ua * UA_REAL : 3.0 + i*1.55;
      p._rad = real ? Math.max((p.dKm/2) / KM_UA * UA_REAL, 0.02)
                    : clamp(Math.pow(p.dKm/12742, 0.42) * 0.30, 0.09, 0.62);
    });
    sunR = real ? Math.max(R_SOL_KM / KM_UA * UA_REAL, 0.05) : 1.0;
    if (E){
      ESP_PLANETAS.forEach(p => {
        const inc = (ESP_INC[p.id]||0) * Math.PI/180;
        const pos = ORB[p.id].geometry.attributes.position;
        for (let k=0;k<128;k++){ const a = k/128*Math.PI*2;
          pos.setXYZ(k, Math.cos(a)*p._r, Math.sin(a)*p._r*Math.sin(inc), Math.sin(a)*p._r*Math.cos(inc)); }
        pos.needsUpdate = true; ORB[p.id].geometry.computeBoundingSphere();
      });
      posiciones3D();
    }
    posiciones2D();
    btnDid.setAttribute('aria-selected', !real); btnReal.setAttribute('aria-selected', real);
    notaEscala.innerHTML = real
      ? '<span><b>Escala real de distancias (los tamaños también).</b> Ahora las distancias entre las órbitas sí guardan la proporción verdadera… y los planetas prácticamente desaparecen. No es un error del programa: si el Sol tuviera el tamaño de una pelota de básquet (24 cm), la Tierra sería una bolita de 2,2 mm ubicada a 26 metros de distancia, y Neptuno estaría a 780 metros. Y aun así, en esta pantalla los planetas están dibujados <b>muchísimo más grandes</b> de lo que les tocaría, porque si no serían invisibles.</span>'
      : '<span><b>Escala didáctica (la de los libros y las maquetas).</b> Las órbitas están repartidas de forma pareja y los planetas agrandados para poder verlos y compararlos. Sirve para estudiar el orden, los tamaños relativos y los movimientos, pero <b>miente sobre las distancias</b>. Ningún dibujo escolar puede mostrar al mismo tiempo el tamaño real y la distancia real: el sistema solar es sobre todo espacio vacío. Cambia a “escala real de distancias” y compruébalo.</span>';
  }
  function setEscala(v){ S.escala = v; aplicarEscala(); Store.log('simulador',{modelo:'espacio',escala:v}); }

  /* --- tiempo --- */
  function setVel(v){
    S.vel = v;
    btnsVel.forEach((b,i) => b.setAttribute('aria-selected', VELS[i][0]===v));
    if (v>0 && !E && !raf2d) bucle2D();
    Store.log('simulador',{modelo:'espacio',velocidad:v});
  }
  let acum = 0;
  function paso(dt){
    if (S.vel > 0) S.dias += dt * S.vel;
    if (E) posiciones3D(); else posiciones2D();
    acum += dt;
    if (acum > 0.2){ acum = 0; refrescarTiempo(); }
  }
  function bucle2D(){
    let last = performance.now();
    const f = (now) => { raf2d = requestAnimationFrame(f); if (document.hidden) { last = now; return; }
      const dt = Math.min((now-last)/1000, 0.05); last = now; paso(dt); };
    raf2d = requestAnimationFrame(f);
  }
  function angulo(p){ return p._fase + (S.dias / p.pD) * Math.PI*2; }
  function posiciones3D(){
    if (!E) return;
    sun.scale.setScalar(sunR);
    const ls = E.labels.get('sol'); if (ls) ls.pos.set(0, sunR + 0.35, 0);
    ESP_PLANETAS.forEach(p => {
      const a = angulo(p), inc = (ESP_INC[p.id]||0) * Math.PI/180;
      const x = Math.cos(a)*p._r, y = Math.sin(a)*p._r*Math.sin(inc), z = Math.sin(a)*p._r*Math.cos(inc);
      const m = M[p.id]; m.position.set(x,y,z); m.scale.setScalar(p._rad);
      const ring = M['saturno-ring'];
      if (p.id==='saturno' && ring){ ring.position.set(x,y,z); ring.scale.setScalar(p._rad); }
      const l = E.labels.get(p.id); if (l) l.pos.set(x, y + p._rad + 0.22, z);
    });
  }

  function refrescarTiempo(){
    readEl.innerHTML = '';
    const anios = S.dias/365.25;
    [[espMil(S.dias), 'días terrestres', 'Tiempo transcurrido'],
     [espDec(anios,2), 'años terrestres', 'Lo mismo, en años de la Tierra']].forEach(([v,u,l]) =>
      readEl.append(h('div',{class:'readout'}, h('div',{class:'v'}, v, ' ', h('span',{class:'u'},u)), h('div',{class:'l'}, l))));
    vueltasEl.innerHTML = '';
    ESP_PLANETAS.forEach(p => vueltasEl.append(h('span',{}, h('i',{style:'background:'+p.hex}), p.n+' '+espDec(S.dias/p.pD, 2))));
    notaTiempo.textContent = S.vel===0 ? 'Simulación en pausa' : `${espMil(S.dias)} días terrestres · ${espDec(S.dias/365.25,2)} años`;
  }

  /* --- selección y ficha --- */
  const listaBtns = {};
  function pintarLista(){
    listaEl.innerHTML = '';
    listaBtns.sol = h('button',{'aria-pressed':'false','aria-label':'Sol',onclick:()=>elegir('sol')},
      h('span',{class:'esp-dot',style:'background:#ffce5a'}), 'Sol');
    listaEl.append(listaBtns.sol);
    ESP_PLANETAS.forEach(p => { listaBtns[p.id] = h('button',{'aria-pressed':'false','aria-label':p.n,onclick:()=>elegir(p.id)},
      h('span',{class:'esp-dot',style:'background:'+p.hex}), p.n); listaEl.append(listaBtns[p.id]); });
    marcarLista();
  }
  /* no se reconstruye la lista al elegir: así el foco del teclado no se pierde */
  function marcarLista(){ Object.entries(listaBtns).forEach(([k,b]) => b.setAttribute('aria-pressed', k===S.sel ? 'true' : 'false')); }
  function elegir(id){
    S.sel = id; marcarLista();
    if (E){ E.select(id); }
    if (marcas2d) Object.entries(marcas2d).forEach(([k,el]) => el.setAttribute('stroke', k===id ? '#ffffff' : 'none'));
    ficha(id);
    Store.log('seleccion',{modelo:'espacio',cuerpo:id});
  }
  function ficha(id){
    fichaEl.innerHTML = '';
    if (id === 'sol'){
      fichaEl.append(h('h3',{style:'margin:0'},'Sol'),
        h('dl',{class:'kv'},
          h('dt',{},'Diámetro'), h('dd',{},'1.392.700 km (unas 109 Tierras en fila)'),
          h('dt',{},'Distancia media a la Tierra'), h('dd',{},'1 UA = 149,6 millones de km'),
          h('dt',{},'Gravedad superficial'), h('dd',{},'274 m/s² (28 veces la de la Tierra)'),
          h('dt',{},'Temperatura'), h('dd',{},'≈ 5.500 °C en la superficie; 15 millones de °C en el núcleo'),
          h('dt',{},'Qué es'), h('dd',{},'Una estrella: una esfera de gas ionizado donde el hidrógeno se fusiona en helio')),
        h('p',{class:'small'},'Dato curioso: su luz demora unos 8 minutos y 20 segundos en llegar a nosotros. Cuando miras el Sol (nunca directamente), ves cómo era hace 8 minutos.'));
      return;
    }
    const p = ESP_PLANETAS.find(x => x.id === id); if (!p) return;
    const orden = ESP_PLANETAS.indexOf(p) + 1;
    fichaEl.append(
      h('div',{class:'row',style:'align-items:center;gap:8px'}, h('span',{class:'esp-dot',style:'width:18px;height:18px;background:'+p.hex}), h('h3',{style:'margin:0'}, p.n), h('span',{class:'pill'}, orden+'.º desde el Sol')),
      h('dl',{class:'kv'},
        h('dt',{},'Diámetro'), h('dd',{}, espMil(p.dKm)+' km'+(p.id==='tierra'?'':`  (${espDec(p.dKm/12742,2)} veces la Tierra)`)),
        h('dt',{},'Distancia media al Sol'), h('dd',{}, espDec(p.ua,2)+' UA · '+espDec(p.mkm,1)+' millones de km'),
        h('dt',{},'Periodo orbital'), h('dd',{}, p.pTxt),
        h('dt',{},'Gravedad superficial'), h('dd',{}, espDec(p.g,1)+' m/s²'),
        h('dt',{},'Temperatura media'), h('dd',{}, p.t),
        h('dt',{},'Lunas conocidas'), h('dd',{}, p.lunas===0 ? 'ninguna' : espMil(p.lunas))),
      h('div',{class:'notice'}, h('span',{}, h('b',{},'Dato curioso: '), p.dato)),
      h('p',{class:'small muted'},'Valores aproximados y redondeados. El número de lunas cambia: cada año se confirman nuevas.'));
    if (Store.s.a11y.tts) fichaEl.append(TTS.btn(()=>fichaEl.textContent, 'Leer la ficha'));
  }

  /* --- alternativa 2D sin WebGL --- */
  function construir2D(){
    const NS = 'http://www.w3.org/2000/svg';
    svg2d = document.createElementNS(NS,'svg');
    svg2d.setAttribute('viewBox','0 0 640 430');
    svg2d.setAttribute('role','img');
    svg2d.setAttribute('aria-label','Esquema en dos dimensiones del sistema solar: órbitas concéntricas alrededor del Sol. Los datos de cada planeta están en la lista y en la ficha.');
    const cx = 320, cy = 215;
    const fondo = document.createElementNS(NS,'rect');
    fondo.setAttribute('width','640'); fondo.setAttribute('height','430'); fondo.setAttribute('fill','#0d1220');
    svg2d.append(fondo);
    marcas2d = {};
    const orb2d = {};
    ESP_PLANETAS.forEach(p => {
      const e = document.createElementNS(NS,'ellipse');
      e.setAttribute('cx',cx); e.setAttribute('cy',cy); e.setAttribute('fill','none');
      e.setAttribute('stroke','#4a5a80'); e.setAttribute('stroke-width','1');
      svg2d.append(e); orb2d[p.id] = e;
    });
    const s = document.createElementNS(NS,'circle');
    s.setAttribute('cx',cx); s.setAttribute('cy',cy); s.setAttribute('fill','#ffce5a');
    s.setAttribute('data-id','sol'); s.setAttribute('tabindex','0'); s.setAttribute('role','button');
    s.setAttribute('aria-label','Sol'); svg2d.append(s); marcas2d.sol = s;
    ESP_PLANETAS.forEach(p => {
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('fill', p.hex); c.setAttribute('data-id', p.id);
      c.setAttribute('tabindex','0'); c.setAttribute('role','button'); c.setAttribute('aria-label', p.n);
      c.setAttribute('stroke-width','2'); c.setAttribute('stroke','none');
      svg2d.append(c); marcas2d[p.id] = c;
    });
    svg2d.addEventListener('click', e => { const t = e.target.closest('[data-id]'); if (t) elegir(t.dataset.id); });
    svg2d.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ const t = e.target.closest('[data-id]'); if (t){ e.preventDefault(); elegir(t.dataset.id); } } });
    svg2d._orb = orb2d;
    const wrap = h('div',{class:'esp-2d',style:'position:absolute;inset:0;padding:8px'});
    wrap.append(svg2d);
    const aviso = h('div',{class:'stage-note',style:'position:absolute;top:54px;left:12px;z-index:4'},'Sin WebGL: esquema 2D con los mismos datos y los mismos controles');
    const cont = h('div',{style:'position:absolute;inset:0'}, wrap, aviso);
    return cont;
  }
  function posiciones2D(){
    if (!svg2d) return;
    const real = S.escala === 'real';
    const cx = 320, cy = 215, MAXR = 272;
    const sr = real ? Math.max(R_SOL_KM/KM_UA/30.07*MAXR, 2.5) : 16;
    marcas2d.sol.setAttribute('r', sr.toFixed(2));
    ESP_PLANETAS.forEach((p,i) => {
      const rx = real ? p.ua/30.07*MAXR : 34 + i*34;
      const ry = rx*0.36;
      const o = svg2d._orb[p.id]; o.setAttribute('rx', rx.toFixed(1)); o.setAttribute('ry', ry.toFixed(1));
      const a = angulo(p);
      const pr = real ? Math.max((p.dKm/2)/KM_UA/30.07*MAXR, 1) : clamp(Math.pow(p.dKm/12742,0.42)*5.4, 2.2, 13);
      const c = marcas2d[p.id];
      c.setAttribute('cx', (cx + Math.cos(a)*rx).toFixed(1));
      c.setAttribute('cy', (cy + Math.sin(a)*ry).toFixed(1));
      c.setAttribute('r', pr.toFixed(2));
    });
  }

  /* --- gravedad: tu peso en cada mundo --- */
  const pesoTbl = h('div',{class:'tablewrap'});
  const inpMasa = h('input',{type:'number',min:'10',max:'200',step:'0.5',value:'45',id:'esp-masa','aria-label':'Tu masa en kilogramos'});
  inpMasa.addEventListener('input', () => { const v = parseFloat(inpMasa.value); if (!isNaN(v) && v>0){ S.masa = clamp(v, 1, 500); pintarPeso(); } });
  const MUNDOS = [['Luna', 1.62, '#c9c6c0'], ['Sol', 274, '#ffce5a']];
  function pintarPeso(){
    const filas = ESP_PLANETAS.map(p => [p.n, p.g, p.hex]).concat(MUNDOS);
    const t = h('table',{class:'data'},
      h('thead',{}, h('tr',{}, h('th',{},'Mundo'), h('th',{},'Gravedad (m/s²)'), h('th',{},'Tu peso (N)'), h('th',{},'Equivalente (kg-f)'), h('th',{},'Veces tu peso aquí'))),
      h('tbody',{}, filas.map(([n,g]) => {
        const peso = S.masa*g, kgf = peso/9.80665, rel = g/9.8;
        return h('tr',{}, h('td',{}, n), h('td',{class:'num'}, espDec(g,2)), h('td',{class:'num'}, espMil(peso)+' N'),
          h('td',{class:'num'}, espDec(kgf,1)+' kgf'),
          h('td',{class:'num'}, espDec(rel,2)+' ×'));
      })));
    pesoTbl.innerHTML = ''; pesoTbl.append(t);
  }
  const cardPeso = h('div',{class:'card stack'},
    h('span',{class:'eyebrow'},'Gravedad · ¿cuánto pesarías en cada mundo?'),
    h('p',{class:'small muted',html:'Tu <b>masa</b> es la misma en todas partes: es la cantidad de materia que tienes. Lo que cambia es tu <b>peso</b>, que es la fuerza con la que ese mundo te atrae: P = m · g. En la balanza de la tienda marcan kilogramos, pero en realidad miden una fuerza; por eso usamos el kilogramo-fuerza para comparar.'}),
    h('div',{class:'field',style:'max-width:260px'}, h('label',{for:'esp-masa'},'Tu masa (kg)'), inpMasa),
    pesoTbl,
    h('div',{class:'notice'}, h('span',{}, h('b',{},'Fíjate: '),'Mercurio y Marte tienen casi la misma gravedad aunque Marte es más grande. El peso no depende solo del tamaño: depende de la masa del cuerpo y de su radio. Y en Júpiter, con tu misma masa, casi no podrías levantarte del suelo.')));

  /* --- gráfico distancia vs periodo --- */
  const cvChart = h('canvas',{class:'chart',style:'height:260px'});
  const cardChart = h('div',{class:'card stack'},
    h('span',{class:'eyebrow'},'¿Hay una regla escondida? Distancia vs. periodo orbital'),
    h('p',{class:'small muted'},'Cada punto es un planeta: a la izquierda su distancia al Sol (en UA) y hacia arriba cuánto demora en dar una vuelta completa (en años terrestres). Observa la forma de la curva antes de leer cualquier fórmula.'),
    h('div',{style:'position:relative'}, cvChart),
    h('div',{class:'notice info'}, h('span',{html:'<b>Qué observar: </b>la línea no es recta. Neptuno está unas 30 veces más lejos que la Tierra, pero no demora 30 años: demora casi 165. Cuanto más lejos está un planeta, más largo es su camino <b>y</b> más lento se mueve por él. Johannes Kepler encontró esta relación en 1619 comparando justamente estos dos números; no la memorices: compruébala con los puntos.'})));

  paneSolar.append(h('div',{style:'height:14px'}), h('div',{class:'grid g2'}, cardPeso, cardChart));

  /* =================================================================
     BLOQUE 2 · ESPECTRO ELECTROMAGNÉTICO
     ================================================================= */
  const banda = h('div',{class:'esp-band',role:'group','aria-label':'Regiones del espectro electromagnético'});
  const fichaB = h('div',{class:'stack'});
  let selB = 'vis';
  const btnsB = ESP_BANDAS.map(b => h('button',{
    style:`background:${b.css};flex-grow:${b.peso}`,'aria-pressed':false,
    'aria-label':`${b.n}. Longitud de onda ${b.lam}`,
    onclick:()=>elegirBanda(b.id)
  }, b.n, h('small',{}, b.id==='vis' ? 'lo que vemos' : b.id==='radio' ? 'menos energía' : b.id==='gamma' ? 'más energía' : '')));
  banda.append(...btnsB);
  function elegirBanda(id){
    selB = id; btnsB.forEach((el,i) => el.setAttribute('aria-pressed', ESP_BANDAS[i].id===id));
    const b = ESP_BANDAS.find(x => x.id===id);
    fichaB.innerHTML = '';
    fichaB.append(
      h('h3',{style:'margin:0'}, b.n),
      h('dl',{class:'kv'},
        h('dt',{},'Longitud de onda típica'), h('dd',{}, b.lam),
        h('dt',{},'Energía por fotón (aprox.)'), h('dd',{}, b.ev)),
      h('span',{class:'eyebrow'},'Para qué sirve en la vida diaria'),
      h('ul',{class:'checks plain'}, b.usos.map(u => h('li',{}, h('span',{class:'ck dotck','aria-hidden':'true'}), u))),
      h('div',{class:'notice warn'}, h('span',{}, h('b',{},'Riesgo: '), b.riesgo)),
      h('div',{class:'notice ok'}, h('span',{}, h('b',{},'Cómo protegerse: '), b.proteccion)));
    if (Store.s.a11y.tts) fichaB.append(TTS.btn(()=>fichaB.textContent, 'Leer la ficha'));
    Store.log('seleccion',{modelo:'espectro',banda:id});
  }

  const svgEstrella = `<svg class="esp-star" viewBox="0 0 600 46" role="img" aria-label="Espectro de una estrella: franja continua de colores del violeta al rojo, cruzada por líneas oscuras de absorción">
    <defs><linearGradient id="espArcoiris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3fd6"/><stop offset="18%" stop-color="#3f5ed6"/><stop offset="38%" stop-color="#3fd67c"/>
      <stop offset="58%" stop-color="#e3e03f"/><stop offset="78%" stop-color="#e08a3f"/><stop offset="100%" stop-color="#d63f3f"/>
    </linearGradient></defs>
    <rect width="600" height="46" fill="url(#espArcoiris)"/>
    ${[62,148,166,238,299,388,401,470,527].map(x=>`<rect x="${x}" y="0" width="3" height="46" fill="#10131a" opacity=".85"/>`).join('')}
  </svg>`;

  paneEsp.append(
    h('div',{class:'card stack'},
      h('span',{class:'eyebrow'},'Toca cada región'),
      h('p',{class:'small muted'},'Todas son la misma cosa —radiación electromagnética— viajando a 300.000 km/s. Lo único que cambia es la longitud de onda: hacia la izquierda las ondas son largas y traen poca energía; hacia la derecha son cortísimas y cada fotón golpea con muchísima más fuerza. La franja visible, la única que ven tus ojos, es apenas una rendija en el medio.'),
      banda,
      h('div',{class:'esp-scale'}, h('span',{},'← ondas largas · poca energía'), h('span',{},'ondas cortas · mucha energía →'))),
    h('div',{style:'height:14px'}),
    h('div',{class:'grid g2'},
      h('div',{class:'card stack'}, fichaB),
      h('div',{class:'card stack'},
        h('span',{class:'eyebrow'},'¿Qué luz nos llega de las estrellas?'),
        h('p',{html:'Nunca hemos tocado una estrella y jamás lo haremos. Todo lo que sabemos de ellas llegó como radiación: es <b>evidencia indirecta</b>. Cuando esa luz se descompone con un prisma o una red de difracción, aparecen líneas oscuras en lugares precisos.'}),
        h('div',{html:svgEstrella}),
        h('p',{class:'small muted'},'Espectro de una estrella (esquema): la franja continua nos habla de su temperatura; las líneas oscuras, de su composición.'),
        h('p',{class:'small',html:'<b>Composición.</b> Cada elemento químico absorbe longitudes de onda exactas, como una huella digital. Si en el espectro falta justo la luz que absorbe el hidrógeno, es porque hay hidrógeno en esa estrella. Así se descubrió el helio en el Sol antes que en la Tierra.'}),
        h('p',{class:'small',html:'<b>Temperatura.</b> El color dominante delata el calor: las estrellas azules superan los 20.000 °C y las rojizas rondan los 3.000 °C. Es la misma regla del hierro en la fragua: primero rojo, después blanco.'}),
        h('p',{class:'small',html:'<b>Movimiento.</b> Si todas las líneas se corren hacia el rojo, la estrella o la galaxia se está alejando. Así supimos que el universo se expande.'}),
        h('div',{class:'notice info'}, h('span',{}, h('b',{},'Desde Ecuador, en la mitad del mundo: '),'parados sobre la línea equinoccial vemos, a lo largo del año, las constelaciones del hemisferio norte y las del sur; casi ningún otro país tiene ese cielo doble. La Estrella Polar aparece rozando el horizonte norte y la Cruz del Sur, el horizonte sur. Además, el Sol cae casi perpendicular al mediodía todo el año: por eso nuestro índice UV es de los más altos del planeta, incluso en días nublados y sobre todo en el páramo, donde hay menos atmósfera que filtre. Gorra, bloqueador y sombra no son exageración: son física.')))));

  /* =================================================================
     RETO
     ================================================================= */
  const retoWrap = h('div',{class:'card stack',style:'margin-top:16px'});
  const PREGUNTAS = [
    { q:'Un compañero dice: “los planetas más grandes están más lejos del Sol; por eso Júpiter es enorme”. ¿Qué respondes con los datos del simulador?',
      ops:['Tiene razón: el tamaño aumenta con la distancia al Sol',
           'No: Neptuno está mucho más lejos que Júpiter y es casi tres veces más pequeño. El tamaño y la distancia son datos independientes',
           'Tiene razón solo para los planetas rocosos'],
      ok:1,
      fb:'Exacto. Júpiter (139.820 km) está a 5,2 UA y Neptuno (49.244 km) a 30,1 UA: mucho más lejos y bastante más pequeño. Lo que sí cambia con la distancia es el tipo de planeta: cerca del Sol quedaron los rocosos y lejos, los gigantes gaseosos y helados.',
      wrong:['Revisa la ficha de Júpiter y la de Neptuno: compara el diámetro y la distancia. Neptuno está seis veces más lejos y es casi tres veces más pequeño.',
             'Entre los rocosos tampoco se cumple: Mercurio es el más cercano y es el más pequeño, pero Venus (más lejos que Mercurio) es apenas menor que la Tierra. No hay regla de tamaño según distancia.'] },
    { q:'Pon la simulación en ×100 y observa. ¿Por qué Mercurio da varias vueltas mientras la Tierra apenas completa una?',
      ops:['Porque Mercurio es más pequeño y le cuesta menos girar',
           'Porque su órbita es mucho más corta y, además, se mueve más rápido al estar más cerca del Sol',
           'Porque la Tierra se detiene de vez en cuando por las estaciones'],
      ok:1,
      fb:'Así es. Mercurio recorre un camino mucho más corto (0,39 UA de radio frente a 1 UA) y encima lo hace a mayor velocidad, porque cerca del Sol la atracción gravitatoria es más intensa. Resultado: 88 días frente a 365,25. Esa doble razón es la que Kepler resumió en su tercera ley.',
      wrong:['El tamaño del planeta no interviene: un planeta pequeño situado lejos, como Plutón, demora 248 años. Fíjate en el radio de la órbita.',
             'La Tierra nunca se detiene: se mueve a unos 30 km/s sin parar. Las estaciones se deben a la inclinación de su eje, no a cambios de velocidad apreciables.'] },
    { q:'El infrarrojo del Sol se siente caliente en la piel; el ultravioleta no se siente. Sin embargo, el que produce quemaduras y cáncer de piel es el ultravioleta. ¿Por qué?',
      ops:['Porque el ultravioleta calienta más que el infrarrojo, aunque no lo notemos',
           'Porque cada fotón ultravioleta lleva unos 4 eV, energía suficiente para romper enlaces del ADN, mientras que el infrarrojo (≈ 0,12 eV) solo hace vibrar las moléculas y eso lo percibimos como calor',
           'Porque el ultravioleta viaja más rápido que el infrarrojo y penetra más'],
      ok:1,
      fb:'Correcto. Sentir calor y hacer daño son cosas distintas. El infrarrojo agita moléculas: es calor. El ultravioleta es ionizante en su extremo: cada fotón tiene unas 30 veces más energía y puede romper moléculas, incluido el ADN. Por eso te quemas un día fresco y nublado en el páramo sin sentir nada.',
      wrong:['El ultravioleta no “calienta más”: calentar es agitar moléculas, y en eso el infrarrojo es el especialista. El daño del UV viene de la energía por fotón, no de la temperatura.',
             'Toda la radiación electromagnética viaja a la misma velocidad en el vacío: 300.000 km/s. Lo que cambia es la longitud de onda y, con ella, la energía de cada fotón.'] },
    { q:'“En el espacio hace frío porque está muy lejos del Sol.” En la Estación Espacial, a solo 400 km de altura, la cara iluminada supera los 120 °C y la sombreada baja de −150 °C. ¿Qué falla en esa frase?',
      ops:['Nada: a 400 km ya se está muy lejos del Sol y por eso hace frío',
           'Que en el vacío casi no hay materia: sin aire no hay conducción ni convección, solo radiación. Un objeto se calienta muchísimo al Sol y se enfría muchísimo en la sombra; la distancia apenas cambió',
           'Que el vacío es frío por naturaleza y enfría todo lo que toca'],
      ok:1,
      fb:'Eso es. La temperatura necesita materia que se agite; en el vacío casi no hay. El calor solo se transmite por radiación, y por eso los trajes y las naves llevan capas aislantes y reflectantes para ambos extremos. Además, 400 km no es nada: la distancia al Sol sigue siendo prácticamente 1 UA, es decir, 149,6 millones de kilómetros.',
      wrong:['Compara: la Tierra está a 149.600.000 km del Sol y la Estación, a 400 km más. Esa diferencia es de un 0,0003 %: no explica nada.',
             'El vacío no tiene temperatura propia porque casi no tiene partículas. No “enfría”: simplemente no hay aire que lleve calor hacia el objeto ni que se lo quite por contacto.'] }
  ];
  let resueltas = 0, intentosTot = 0;
  retoWrap.append(h('span',{class:'eyebrow'},'🎯 Reto final · errores que se repiten todos los años'),
    h('p',{class:'small muted'},'Antes de responder, usa el simulador: cambia la escala, pon la velocidad en ×100 y revisa las fichas. Si te equivocas, la retroalimentación te dice exactamente dónde mirar.'));
  PREGUNTAS.forEach(p => retoWrap.append(quizBlock(p, (intentos) => {
    resueltas++; intentosTot += intentos;
    if (resueltas === PREGUNTAS.length){
      Store.completeActivity('cn-sim-espacio', { score:`${PREGUNTAS.length}/${PREGUNTAS.length}`, attempts:intentosTot });
      retoSt.className = 'notice ok';
      retoSt.innerHTML = `<span><b>¡Reto resuelto!</b> Cuatro de cuatro con ${intentosTot} intento${intentosTot===1?'':'s'} en total. Ya puedes explicar las órbitas sin confundir la escala del modelo con los tamaños reales, y distinguir el calor (infrarrojo) del daño (ultravioleta).</span>`;
      retoWrap.append(h('div',{class:'notice ok'},'Actividad completada y registrada en tu progreso de la Unidad 3.'));
      toast('Reto del espacio completado ✓');
    }
  })));
  retoWrap.append(h('div',{class:'row',style:'margin-top:4px'},
    h('button',{class:'btn sm',onclick:()=>setTab('solar')},'Volver al sistema solar'),
    h('button',{class:'btn sm',onclick:()=>setTab('espectro')},'Volver al espectro'),
    h('a',{class:'btn sm ghost',href:'#/cn/sim/espectro'},'Abrir el espectro en su propia página')));

  view.append(tabs, paneSolar, paneEsp, retoWrap);

  /* ---- arranque ---- */
  ESP_PLANETAS.forEach((p,i) => { p._fase = i*1.1; });
  aplicarEscala();
  pintarLista(); ficha(S.sel); pintarPeso(); elegirBanda(selB);
  setVel(S.vel); setTab(tab);
  refrescarTiempo();
  if (E) E.select(S.sel); else posiciones2D();
  if (espQuieto()) notaTiempo.textContent = 'Simulación en pausa (preferencia de menos movimiento activa). Pulsa ×1, ×10 o ×100 cuando quieras.';
  setTimeout(() => {
    lineChart(cvChart, {
      series:[{ label:'planetas', color:cssVar('--accent'), dots:true, pts: ESP_PLANETAS.map(p => ({ x:p.ua, y:p.pA })) }],
      xmin:0, xmax:32, ymin:0, ymax:180, xticks:8,
      xlabel:'Distancia media al Sol (UA)', ylabel:'años terrestres',
      xfmt:v => espDec(v,0), yfmt:v => espDec(v,0)
    });
  }, 60);

  return { unmount(){ if (raf2d) cancelAnimationFrame(raf2d); raf2d = 0; if (E) E.dispose(); E = null; } };
}

route('/cn/sim/espacio',  (view, p) => espacioView(view, p && p.t === 'espectro' ? 'espectro' : 'solar'));
route('/cn/sim/espectro', (view) => espacioView(view, 'espectro'));

<script>
/* =====================================================================
   CIENCIAS NATURALES · CIENCIAS FÍSICAS
   Laboratorio virtual 3D: movimiento, fuerzas y energía
   8.º U2 · 9.º U1 · 10.º U1–U2
   ===================================================================== */
Object.assign(BIO.activities, {
  'cn-lab-movimiento': { t:'Laboratorio: movimiento, fuerzas y energía', unidad:1, peso:5, xp:140 }
});

const MOV_G  = { tierra:{ n:'Tierra', g:9.8 }, luna:{ n:'Luna', g:1.62 }, marte:{ n:'Marte', g:3.71 } };
const MOV_MU = { ideal:{ n:'Ideal (sin fricción)', k:0 }, hielo:{ n:'Hielo', k:0.05 }, madera:{ n:'Madera', k:0.30 }, caucho:{ n:'Caucho', k:0.70 } };
const MOV_L  = 3.0;            // longitud útil del riel, en metros
const MOV_U  = 3.0;            // unidades de escena por metro
/* número con coma decimal, como se escribe en Ecuador */
const movN = (v, d) => (typeof v === 'number' && isFinite(v) ? v : 0).toFixed(d === undefined ? 2 : d).replace('.', ',');
/* menos animación si la persona lo pidió en accesibilidad */
const movMotion = () => motionOK() && !Store.s.a11y.motion;

route('/cn/lab/movimiento', (view) => {
  view.classList.add('wide');

  /* ---------------- estado del laboratorio ---------------- */
  const S = {
    m:1.0, F:5.0, muKey:'madera', ang:0, gKey:'tierra',
    cutOn:false, cutAt:1.5, speed:1,
    t:0, s:0, v:0, running:false, ended:'',
    Edis:0, Wap:0, Jap:0, rec:[], runs:0, tAt2:null,
    gates:[{ pos:1.0, t:null }, { pos:2.0, t:null }],
    pred:null, predDone:false, solved: !!Store.s.activities['cn-lab-movimiento']?.done,
    quiz:0
  };
  const th   = () => S.ang * Math.PI / 180;
  const gg   = () => MOV_G[S.gKey].g;
  const muk  = () => MOV_MU[S.muKey].k;
  const mus  = () => MOV_MU[S.muKey].k * 1.2;

  /* ---------------- modelo físico (SI) ----------------
     Eje +s: a lo largo del riel, hacia adelante (subiendo la rampa).
     Peso W = m·g (vertical).  Normal N = W·cos θ.
     Componente del peso sobre el riel: -W·sen θ  (tira hacia abajo de la rampa).
     Fricción cinética: -sgn(v)·μk·N.  Estática: equilibra hasta μs·N.
     a = ΣF/m.                                                          */
  function forces(st){
    const g = gg(), a = th(), W = S.m * g, N = W * Math.cos(a), Wpar = -W * Math.sin(a);
    const Fap = (S.cutOn && st.s >= S.cutAt) ? 0 : S.F;
    const mot = Fap + Wpar;                 // fuerzas motrices sin fricción
    let Ff, quieto = false;
    if (Math.abs(st.v) < 1e-4) {
      if (Math.abs(mot) <= mus() * N) { Ff = -mot; quieto = true; }   // fricción estática: equilibra
      else Ff = -Math.sign(mot) * muk() * N;
    } else Ff = -Math.sign(st.v) * muk() * N;
    const net = mot + Ff;
    return { g, ang:a, W, N, Wpar, Fap, Ff, net, a: net / S.m, quieto };
  }

  function substep(dt){
    const f = forces(S);
    let v2 = S.v + f.a * dt;
    if (S.v * v2 < 0 && Math.abs(f.Fap + f.Wpar) <= mus() * f.N) v2 = 0;  // la fricción frena, no invierte
    const ds = v2 * dt;
    let s2 = S.s + ds, vPre = v2, tope = false;
    if (s2 >= MOV_L) { s2 = MOV_L; tope = true; S.ended = 'tope'; S.running = false; }  // fin del riel: se detiene la medición
    if (s2 <= 0 && v2 < 0) { s2 = 0; v2 = 0; S.ended = 'inicio'; S.running = false; }
    // energías y magnitudes acumuladas
    S.Edis += muk() * f.N * Math.abs(ds);
    S.Wap  += f.Fap * ds;
    S.Jap  += f.Fap * dt;
    // sensores fotoeléctricos
    S.gates.forEach(G2 => { if (G2.t === null && S.s < G2.pos && s2 >= G2.pos && v2 > 0) G2.t = S.t + dt * (G2.pos - S.s) / Math.max(ds, 1e-9); });
    if (S.tAt2 === null && S.s < 2.0 && s2 >= 2.0) S.tAt2 = S.t + dt * (2.0 - S.s) / Math.max(ds, 1e-9);
    S.s = s2; S.v = v2; S.t += dt;
    // último punto de la medición, justo al llegar al final del riel
    if (tope) { S.rec.push({ t:S.t, x:MOV_L, v:vPre, a:f.a }); lastRec = S.t; }
  }

  let lastRec = -1;
  function tick(dtReal){
    if (S.running) {
      const total = Math.min(dtReal, 0.05) * S.speed;
      const n = Math.max(1, Math.min(120, Math.ceil(total / 0.002)));
      const dt = total / n;
      for (let i = 0; i < n && S.running; i++) {
        substep(dt);
        if (S.running && S.t - lastRec >= 0.02) { lastRec = S.t; const f = forces(S); S.rec.push({ t:S.t, x:S.s, v:S.v, a:f.a }); if (S.rec.length > 1500) S.rec.shift(); }
      }
      if (S.running && S.t > 0.3 && Math.abs(S.v) < 1e-4 && Math.abs(forces(S).a) < 1e-4) { S.ended = 'quieto'; S.running = false; }
      if (!S.running) finishRun();
    }
    drawStage(dtReal); drawForceDiagram(); updateReadouts();
    chartT += dtReal; if (chartT > 0.08) { chartT = 0; drawCharts(); }
  }
  let chartT = 0;

  /* ---------------- cabecera y franja de propósito ---------------- */
  view.append(h('div', { class:'page-head', style:'margin-bottom:14px' },
    h('div', {},
      h('span', { class:'eyebrow lab' }, 'Laboratorio · Ciencias Naturales · Ciencias Físicas · 8.º, 9.º y 10.º EGB'),
      h('h1', {}, 'Pista de movimiento: fuerzas, gráficas y energía'),
      h('p', {}, 'Un riel con marcas cada 0,5 m, un carrito y sensores fotoeléctricos, igual que en el laboratorio real. Cambia la masa, la fuerza, la fricción, la inclinación y hasta la gravedad del planeta, y observa qué le ocurre al movimiento.')),
    h('span', { class:'pill lab' }, '+140 XP')));

  const retoSt = h('div', { class: S.solved ? 'notice ok' : 'notice' },
    S.solved ? 'Reto resuelto ✓' : 'Todavía no: suelta el carrito desde el reposo y ajusta la fuerza hasta cruzar la marca de 2,0 m a los 2,0 s.');
  view.append(purposeBanner({
    proposito:'Relacionar las fuerzas que actúan sobre un cuerpo con su aceleración, leer las gráficas del movimiento y seguir la energía mientras el carrito se mueve.',
    observa:[
      'Qué le pasa a la pendiente de la gráfica v-t cuando cambias la fuerza o la masa',
      'Qué hace el carrito cuando apagas la fuerza a mitad del recorrido',
      'Cómo la energía cinética, la potencial y la disipada por fricción suman siempre lo mismo'
    ],
    reto:'Consigue que el carrito recorra 2,0 m en exactamente 2,0 s partiendo del reposo. ¿Qué aceleración necesitas y con qué fuerza la logras?',
    statusEl: retoSt, done: S.solved
  }));

  /* ---------------- escenario (3D o 2D) y panel ---------------- */
  const stage = h('div', { class:'stage' });
  const panel = h('div', { class:'panel' });
  const layout = h('div', { class:'mov-wrap' }, stage, panel);
  view.append(layout);

  const hud = h('div', { class:'stage-top' },
    h('span', { class:'phase', id:'mov-hud' }, 'Listo para soltar'));
  stage.append(hud);

  function drawMini(cv, kind){

    if (kind === 0) { c.moveTo(16, H * 0.45); c.lineTo(W - 8, H * 0.45); }
    else if (kind === 1) { c.moveTo(16, H - 14); c.lineTo(W - 8, 10); }

  /* ---------------- diagrama de fuerzas (canvas 2D) ---------------- */
  function drawForceDiagram(){
    const dpr = Math.min(devicePixelRatio || 1, 2), W = fdCv.clientWidth || 320, H = fdCv.clientHeight || 230;
    if (fdCv.width !== W * dpr || fdCv.height !== H * dpr) { fdCv.width = W * dpr; fdCv.height = H * dpr; }
    const c = fdCv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    const f = forces(S), a = th();
    const ux = Math.cos(a), uy = -Math.sin(a);     // a lo largo del riel, hacia adelante
    const nx = Math.sin(a), ny = -Math.cos(a);     // normal a la superficie
    const cx = W / 2, cy = H / 2 + 14;
    // superficie
    c.strokeStyle = cssVar('--line-2') || '#bbb'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(cx - ux * W * 0.45 - nx * 14, cy - uy * W * 0.45 - ny * 14); c.lineTo(cx + ux * W * 0.45 - nx * 14, cy + uy * W * 0.45 - ny * 14); c.stroke();
    // carrito
    c.save(); c.translate(cx, cy); c.rotate(-a);
    c.fillStyle = cssVar('--lab') || '#2E86C1'; c.globalAlpha = 0.85;
    c.fillRect(-20, -12, 40, 20); c.globalAlpha = 1;
    c.fillStyle = cssVar('--ink-3') || '#777';
    [-12, 12].forEach(dx => { c.beginPath(); c.arc(dx, 10, 4, 0, Math.PI * 2); c.fill(); });
    c.restore();
    const Fref = Math.max(1, Math.abs(f.W), Math.abs(f.N), Math.abs(f.Fap), Math.abs(f.Ff), Math.abs(f.net));
    const k = Math.min(H * 0.34, W * 0.30) / Fref;
    function arrow(dx, dy, col, label){
      const len = Math.hypot(dx, dy); if (len < 1.5) return;
      const ex = cx + dx, ey = cy + dy, ang = Math.atan2(dy, dx);
      c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(ex - Math.cos(ang) * 8, ey - Math.sin(ang) * 8); c.stroke();
      c.beginPath(); c.moveTo(ex, ey);
      c.lineTo(ex - Math.cos(ang - 0.4) * 11, ey - Math.sin(ang - 0.4) * 11);
      c.lineTo(ex - Math.cos(ang + 0.4) * 11, ey - Math.sin(ang + 0.4) * 11);
      c.closePath(); c.fill();
      c.font = '600 10px "IBM Plex Sans", sans-serif'; c.textAlign = 'center';
      c.fillText(label, ex + Math.cos(ang) * 12, ey + Math.sin(ang) * 12 + 3);
    }
    arrow(0, f.W * k, '#C0392B', 'P');                       // peso: siempre vertical hacia abajo
    arrow(nx * f.N * k, ny * f.N * k, '#2E86C1', 'N');
    arrow(ux * f.Fap * k, uy * f.Fap * k, '#6C3483', 'F');
    arrow(ux * f.Ff * k, uy * f.Ff * k, '#B7791F', 'fr');
    c.globalAlpha = 0.95; arrow(ux * f.net * k, uy * f.net * k, '#1E8449', 'Fneta'); c.globalAlpha = 1;
    c.fillStyle = cssVar('--ink-3') || '#888'; c.font = '10px "IBM Plex Mono", monospace'; c.textAlign = 'left';
    c.fillText(`θ = ${movN(S.ang, 0)}°  ·  g = ${movN(gg(), 2)} m/s²  ·  μ = ${movN(muk(), 2)}`, 10, 16);
  }

  /* ---------------- gráficas x-t, v-t, a-t + pendiente ---------------- */
  function sampleAt(t){
    if (!S.rec.length) return null;
    let best = S.rec[0];
    for (const r of S.rec) { if (Math.abs(r.t - t) < Math.abs(best.t - t)) best = r; }
    return best;
  }
  function drawCharts(){
    const tmax = Math.max(1, S.rec.length ? S.rec[S.rec.length - 1].t : 1);
    const def = [
      { cv:cvX, key:'x', col:cssVar('--accent') || '#2E86C1', lab:'x (m)', inf:infX },
      { cv:cvV, key:'v', col:cssVar('--ok') || '#1E8449', lab:'v (m/s)', inf:infV },
      { cv:cvA, key:'a', col:cssVar('--warn') || '#B7791F', lab:'a (m/s²)', inf:infA }
    ];
    const t1 = Math.min(+sl1.value, +sl2.value), t2 = Math.max(+sl1.value, +sl2.value);
    const p1 = sampleAt(t1), p2 = sampleAt(t2);
    const show = slChk.checked && S.rec.length > 2 && p1 && p2 && Math.abs(p2.t - p1.t) > 1e-3;
    $('#mov-o1', slopeBox).value = movN(t1, 2) + ' s'; $('#mov-o2', slopeBox).value = movN(t2, 2) + ' s';
    def.forEach(d => {
      const pts = S.rec.map(r => ({ x:r.t, y:r[d.key] }));
      if (!pts.length) pts.push({ x:0, y:0 });
      const ys = pts.map(p => p.y);
      let lo = Math.min(0, ...ys), hi = Math.max(...ys, 0.1);
      const pad = (hi - lo) * 0.15 + 0.05; lo -= pad; hi += pad;
      lineChart(d.cv, { series:[{ pts, color:d.col }], xmin:0, xmax:tmax, ymin:lo, ymax:hi, xticks:4,
        xfmt:v2 => movN(v2, 1), yfmt:v2 => movN(v2, 1), ylabel:d.lab, xlabel:'t (s)' });
      if (show) {
        const o = d.cv._opts, c = d.cv.getContext('2d');
        const y1 = p1[d.key], y2 = p2[d.key];
        c.save(); c.strokeStyle = cssVar('--bad') || '#C0392B'; c.lineWidth = 1.8; c.setLineDash([5, 4]);
        c.beginPath(); c.moveTo(o.X(p1.t), o.Y(y1)); c.lineTo(o.X(p2.t), o.Y(y2)); c.stroke();
        c.setLineDash([]); c.fillStyle = cssVar('--bad') || '#C0392B';
        [[p1.t, y1], [p2.t, y2]].forEach(([tx, ty]) => { c.beginPath(); c.arc(o.X(tx), o.Y(ty), 4, 0, Math.PI * 2); c.fill(); });
        c.restore();
        const sl = (y2 - y1) / (p2.t - p1.t);
        d.inf.textContent = d.key === 'x' ? `pendiente = ${movN(sl, 2)} m/s (velocidad media)` :
          d.key === 'v' ? `pendiente = ${movN(sl, 2)} m/s² (aceleración media)` :
          `variación = ${movN(sl, 2)} m/s³`;
      } else d.inf.textContent = '';
    });
    if (show) {
      const vx = (p2.x - p1.x) / (p2.t - p1.t), av = (p2.v - p1.v) / (p2.t - p1.t);
      slOut.className = 'notice ok';
      slOut.innerHTML = `<span>Entre t₁ = ${movN(p1.t, 2)} s y t₂ = ${movN(p2.t, 2)} s: <b>Δx/Δt = ${movN(vx, 2)} m/s</b> (la pendiente de x-t <b>es</b> la velocidad media) y <b>Δv/Δt = ${movN(av, 2)} m/s²</b> (la pendiente de v-t <b>es</b> la aceleración media). Compáralos con las lecturas del carrito en esos instantes.</span>`;
    } else if (S.rec.length > 2) {
      slOut.className = 'notice';
      slOut.textContent = 'Activa «Mostrar la recta entre dos puntos» y mueve los dos instantes con el teclado o el ratón.';
    }
  }

  /* ---------------- escena 3D ---------------- */
  let E = null, cart = null, tiltG = null, gateMesh = [], wheels = [], beam = [];
  if (webglOK) {
    try {
      E = new Engine3D(stage, { radius:12.5, phi:1.16, theta:0.62, minR:5, maxR:24, target:[0, 0.35, 0], floor:-1.35, floorSize:13,
        aria:'Pista de movimiento en 3D: riel con marcas cada 0,5 metros, carrito y sensores fotoeléctricos. Usa los controles del panel para experimentar.' });
      buildScene();
    } catch (e) { console.warn(e); E = null; }
  }
  function buildScene(){
    const root = new THREE.Group(); E.scene.add(root);
    // mesa
    const table = new THREE.Mesh(new THREE.BoxGeometry(MOV_L * MOV_U + 1.4, 0.36, 2.6), mat(0xD9CBB6, { roughness:0.85, clearcoat:0 }));
    table.position.set(0.2, -1.05, 0); root.add(table);
    // grupo inclinable: pivote en el inicio del riel
    tiltG = new THREE.Group(); tiltG.position.set(-MOV_L * MOV_U / 2, 0, 0); root.add(tiltG);
    const railMat = mat(0x9AA7B4, { roughness:0.35, metalness:0.15 });
    [-0.42, 0.42].forEach(z => {
      const r = new THREE.Mesh(new THREE.BoxGeometry(MOV_L * MOV_U, 0.16, 0.16), railMat);
      r.position.set(MOV_L * MOV_U / 2, 0, z); tiltG.add(r);
    });
    const base = new THREE.Mesh(new THREE.BoxGeometry(MOV_L * MOV_U, 0.12, 1.1), mat(0x5B6670, { roughness:0.6 }));
    base.position.set(MOV_L * MOV_U / 2, -0.16, 0); tiltG.add(base);
    // marcas cada 0,5 m (las de metro entero, más altas y claras)
    for (let i = 0; i <= MOV_L / 0.5; i++) {
      const met = (i % 2 === 0);
      const tk = new THREE.Mesh(new THREE.BoxGeometry(0.05, met ? 0.3 : 0.18, 0.2), mat(met ? 0xF2F2F2 : 0xB9C2C9, { roughness:0.5 }));
      tk.position.set(i * 0.5 * MOV_U, 0.02, 0.62); tiltG.add(tk);
      if (met) E.addLabel('mk' + i, movN(i * 0.5, 1) + ' m', [-MOV_L * MOV_U / 2 + i * 0.5 * MOV_U, 0.45, 0.62]);
    }
    // carrito
    cart = new THREE.Group(); tiltG.add(cart);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.34, 0.8), mat(0xE2574C, { roughness:0.35, clearcoat:0.6 }));
    body.position.y = 0.38; cart.add(body);
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.14, 0.6), mat(0x2C3E50, { roughness:0.5 }));
    top.position.y = 0.6; cart.add(top);
    const wMat = mat(0x2B2B2B, { roughness:0.7, clearcoat:0.2 });
    [[-0.32, -0.42], [-0.32, 0.42], [0.32, -0.42], [0.32, 0.42]].forEach(([x, z]) => {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.1, 18), wMat);
      w.rotation.x = Math.PI / 2; w.position.set(x, 0.19, z); cart.add(w); wheels.push(w);
    });
    // sensores fotoeléctricos
    S.gates.forEach((G2, i) => {
      const g2 = new THREE.Group(); tiltG.add(g2);
      const cm = mat(i ? 0x27AE60 : 0x2E86C1, { roughness:0.5 });
      [-0.75, 0.75].forEach(z => {
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.1, 0.14), cm);
        post.position.set(0, 0.55, z); g2.add(post);
      });
      const bm = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 1.5), new THREE.MeshBasicMaterial({ color:0xE74C3C, transparent:true, opacity:0.55 }));
      bm.position.set(0, 0.8, 0); g2.add(bm); beam.push(bm);
      gateMesh.push(g2);
    });
    E.onFrame((t, dt) => tick(dt));
  }

  /* ---------------- alternativa 2D (sin WebGL) ---------------- */
  let cv2 = null, raf2 = 0;
  if (!E) {
    stage.append(h('div', { class:'ph', style:'position:absolute;top:46px;left:12px;right:12px;z-index:2' },
      'Sin WebGL: se muestra la vista lateral de la pista en 2D. La simulación, las gráficas, la energía y el reto funcionan igual.'));
    cv2 = h('canvas', { class:'mov-2d', role:'img', 'aria-label':'Vista lateral de la pista de movimiento con el carrito y los sensores' });
    stage.append(cv2);
    let last = performance.now();
    const loop = now => { raf2 = requestAnimationFrame(loop); if (document.hidden) { last = now; return; } const dt = Math.min((now - last) / 1000, 0.05); last = now; tick(dt); };
    raf2 = requestAnimationFrame(loop);
  }

  function drawStage(){
    if (E) {
      const a = th();
      tiltG.rotation.z = a;
      cart.position.set(S.s * MOV_U, 0, 0);
      if (movMotion()) { const dw = S.v * 0.016 / 0.19; wheels.forEach(w => w.rotation.y -= dw); }
      S.gates.forEach((G2, i) => { gateMesh[i].position.x = G2.pos * MOV_U; beam[i].material.opacity = (G2.t !== null && Math.abs(S.s - G2.pos) < 0.12) ? 1 : 0.5; });
      // las etiquetas de las marcas acompañan la inclinación del riel
      const ca = Math.cos(a), sa = Math.sin(a), x0 = -MOV_L * MOV_U / 2;
      for (let i = 0; i <= MOV_L / 0.5; i += 2) {
        const l = E.labels.get('mk' + i); if (!l) continue;
        const d = i * 0.5 * MOV_U;
        l.pos.set(x0 + d * ca - 0.45 * sa, d * sa + 0.45 * ca, 0.62);
      }
      return;
    }
    if (!cv2) return;
    const dpr = Math.min(devicePixelRatio || 1, 2), W = stage.clientWidth || 600, H = stage.clientHeight || 520;
    if (cv2.width !== W * dpr || cv2.height !== H * dpr) { cv2.width = W * dpr; cv2.height = H * dpr; }
    const c = cv2.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);
    const a = th(), m2px = (W - 120) / MOV_L, x0 = 60, y0 = H * 0.68;
    c.save(); c.translate(x0, y0); c.rotate(-a);
    c.fillStyle = cssVar('--ink-3') || '#7a7a7a'; c.fillRect(0, 0, MOV_L * m2px, 8);
    for (let i = 0; i <= MOV_L / 0.5; i++) {
      const met = (i % 2 === 0), px = i * 0.5 * m2px;
      c.fillStyle = met ? (cssVar('--ink') || '#222') : (cssVar('--ink-3') || '#999');
      c.fillRect(px - 1, met ? -16 : -10, 2, met ? 16 : 10);
      if (met) { c.save(); c.font = '10px "IBM Plex Mono", monospace'; c.textAlign = 'center'; c.fillText(movN(i * 0.5, 1) + ' m', px, -22); c.restore(); }
    }
    S.gates.forEach((G2, i) => {
      const px = G2.pos * m2px;
      c.fillStyle = i ? '#27AE60' : '#2E86C1'; c.fillRect(px - 2, -58, 4, 46);
      c.fillStyle = G2.t !== null ? '#E74C3C' : 'rgba(231,76,60,.35)'; c.fillRect(px - 10, -46, 20, 3);
    });
    const cxp = S.s * m2px;
    c.fillStyle = '#E2574C'; c.fillRect(cxp - 22, -30, 44, 22);
    c.fillStyle = '#2C3E50'; c.fillRect(cxp - 10, -40, 22, 10);
    c.fillStyle = '#2B2B2B';
    [-13, 13].forEach(d => { c.beginPath(); c.arc(cxp + d, -5, 6, 0, Math.PI * 2); c.fill(); });
    c.restore();
    c.fillStyle = cssVar('--ink-2') || '#444'; c.font = '600 12px "IBM Plex Sans", sans-serif';
    c.fillText(`t = ${movN(S.t, 2)} s · x = ${movN(S.s, 2)} m · v = ${movN(S.v, 2)} m/s · a = ${movN(forces(S).a, 2)} m/s²`, 16, H - 16);
  }

  /* ---------------- cierre: preguntas ---------------- */
  const quizBox = h('div', { class:'card stack', style:'margin-top:12px;display:' + (S.solved ? '' : 'none') },
    h('span', { class:'eyebrow lab' }, '7 · Cierre'));
  const doneQ = () => { S.quiz++; if (S.quiz >= 2) Store.completeActivity('cn-lab-movimiento', { score:'reto + cierre', attempts:S.runs }); };
  quizBox.append(quizBlock({
    q:'Partiendo del reposo, ¿qué aceleración se necesita para recorrer 2,0 m en 2,0 s?',
    ops:['0,5 m/s²', '1,0 m/s²', '2,0 m/s²'],
    ok:1,
    fb:'Con aceleración constante y velocidad inicial cero, x = ½·a·t². Despejando: a = 2x/t² = 2·2,0 m ÷ (2,0 s)² = 1,0 m/s². La velocidad media del recorrido fue 1,0 m/s y la velocidad final, 2,0 m/s.',
    wrong:['0,5 m/s es la rapidez media dividida entre el tiempo, no la aceleración. Usa x = ½·a·t² y despeja a.',
           '2,0 m/s² sale de dividir la distancia entre el tiempo al cuadrado sin el factor ½. Recuerda: x = ½·a·t².']
  }, doneQ));
  quizBox.append(quizBlock({
    q:'Apoyas el mismo carrito sobre una cara más ancha, sin cambiar su masa ni la superficie del riel. ¿Qué pasa con la fuerza de fricción?',
    ops:['Aumenta, porque hay más superficie en contacto', 'Se mantiene prácticamente igual', 'Disminuye, porque el peso se reparte en más superficie'],
    ok:1,
    fb:'La fricción de deslizamiento depende del coeficiente μ y de la fuerza normal (fr = μ·N), no del área de contacto. Al apoyarlo sobre otra cara, N sigue siendo el mismo y la fricción no cambia. Compruébalo en la simulación: solo cambia si cambias la masa, el ángulo o la superficie.',
    wrong:['Más área de contacto reparte la misma fuerza normal entre más puntos: la presión baja, pero la fricción total sigue siendo μ·N.',
           'El peso se reparte, sí, pero la fuerza normal total es la misma, así que fr = μ·N tampoco cambia.']
  }, doneQ));
  view.append(quizBox);

  /* ---------------- arranque ---------------- */
  chkCut.checked = false; selSpeed.value = '1';
  updateReadouts(); drawCharts(); drawForceDiagram(); setHud();
  if (!E) drawStage();
  window.addEventListener('resize', drawCharts);

  return { unmount(){
    if (raf2) cancelAnimationFrame(raf2);
    window.removeEventListener('resize', drawCharts);
    E && E.dispose();
  } };
});
</script>

<script>
/* =====================================================================
   CIENCIAS NATURALES · ECOSISTEMAS DEL ECUADOR
   Red trófica · flujo de energía · ciclos de materia · perturbaciones
   8.º EGB (U2: ecosistemas, energía y ciclos) · 9.º EGB (U3: biodiversidad

function ECR_sp(S, id){ return S.sp.find(x=>x.id===id) || {n:id, sci:'', lvl:0}; }
function ECR_pred(S, id){ return S.sp.filter(x => (x.come||[]).includes(id)); }
function ECR_num(v, dec){ const s = (dec!=null ? Number(v).toFixed(dec) : String(Math.round(v))); return s.replace('.', ','); }
function ECR_dec(v){ return v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'').replace('.',','); }
function ECR_kj(v){ return v>=10 ? ECR_mil(v) : ECR_dec(v); }
function ECR_mil(v){ return Math.round(v).toLocaleString('es-EC').replace(/,/g,'.'); }

/* Género gramatical de cada especie, para que los textos se lean bien
   ("la paja de páramo", "del venado", "los hongos del suelo"). */
const ECR_GEN = { pajonal:'la', achupalla:'la', colibri:'la', hongos:'los', lombriz:'la',
  'concha-prieta':'la', lisa:'la', garceta:'la', fragata:'la', bacterias:'las',
  chonta:'la', sotobosque:'las', hormiga:'la', guanta:'la', danta:'la', rana:'la', boa:'la', descomp:'los' };
Object.values(ECR_SYS).forEach(S => S.sp.forEach(sp => { sp.ar = ECR_GEN[sp.id] || 'el'; }));
function ecrArt(sp, may){ const t = (sp.ar||'el')+' '+sp.n.toLowerCase(); return may ? t.charAt(0).toUpperCase()+t.slice(1) : t; }
function ecrDel(sp){ const a = sp.ar||'el'; return (a==='el'?'del':a==='la'?'de la':a==='los'?'de los':'de las')+' '+sp.n.toLowerCase(); }
function ecrSysDe(S){ return (S.ar==='la'?'de la ':'del ')+S.n.toLowerCase(); }
function ecrSysEn(S){ return (S.ar==='la'?'en la ':'en el ')+S.n.toLowerCase(); }
function ecrAl(sp){ const a = sp.ar||'el'; return (a==='el'?'al':a==='la'?'a la':a==='los'?'a los':'a las')+' '+sp.n.toLowerCase(); }

    arr.forEach((s,i) => { pos[s.id] = { x: Math.round(90 + (W-180) * (n===1 ? 0.5 : i/(n-1))), y: yOf[l] }; }); });
  return { pos, W, H:670 };
}
function ecrShape(lvl, x, y, r){
  if (lvl===0) return `<polygon class="nshape" points="${x},${y-r} ${x+r},${y} ${x},${y+r} ${x-r},${y}"`;
  if (lvl===1) return `<circle class="nshape" cx="${x}" cy="${y}" r="${r}"`;
  if (lvl===2) return `<rect class="nshape" x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" rx="7"`;
  if (lvl===3) return `<polygon class="nshape" points="${x},${y-r*1.2} ${x+r*1.15},${y+r*0.82} ${x-r*1.15},${y+r*0.82}"`;
  const pts = []; for (let k=0;k<6;k++){ const a = Math.PI/6 + k*Math.PI/3; pts.push(`${(x+r*Math.cos(a)).toFixed(1)},${(y+r*Math.sin(a)).toFixed(1)}`); }
  return `<polygon class="nshape" points="${pts.join(' ')}"`;
}
function ecrArrow(p1, p2, r, color, w, op){
  const dx = p2.x-p1.x, dy = p2.y-p1.y, L = Math.hypot(dx,dy) || 1, ux = dx/L, uy = dy/L;
  const x1 = p1.x + ux*(r+4), y1 = p1.y + uy*(r+4), x2 = p2.x - ux*(r+12), y2 = p2.y - uy*(r+12);
  const hx = p2.x - ux*(r+2), hy = p2.y - uy*(r+2), px = -uy, py = ux, hw = 6.4*(w/2.2);
  return `<g opacity="${op}"><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`
    + `<polygon fill="${color}" points="${hx.toFixed(1)},${hy.toFixed(1)} ${(x2+px*hw).toFixed(1)},${(y2+py*hw).toFixed(1)} ${(x2-px*hw).toFixed(1)},${(y2-py*hw).toFixed(1)}"/></g>`;
}
/* edges: [{a:presa, b:depredador, nota}] · sel: id resaltado · si edges es null se usan todas las reales */
function ecrWebSVG(S, edges, sel){
  const L = ecrLayout(S), r = 29, ink3 = 'var(--ink-3)', eco = 'var(--eco)';
  const E = edges || S.sp.flatMap(p => (p.come||[]).map(a => ({ a, b:p.id, nota:(p.nota||{})[a] })));
  let g = '';
  const lvlY = {3:78, 2:214, 1:350, 0:486, 4:604};
  [[3,'N4 · superdepredadores'],[2,'N3 · consumidores secundarios'],[1,'N2 · consumidores primarios'],[0,'N1 · productores'],[4,'D · descomponedores']].forEach(([l,txt]) => {
    if (!S.sp.some(s=>s.lvl===+l)) return;
    g += `<line x1="16" y1="${lvlY[l]}" x2="944" y2="${lvlY[l]}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 6"/>`
      + `<text x="18" y="${lvlY[l]-40}" font-size="12" font-weight="600" fill="var(--ink-3)">${txt}</text>`;
  });
  E.forEach(e => {
    const p1 = L.pos[e.a], p2 = L.pos[e.b]; if (!p1||!p2) return;
    const hi = sel && (e.a===sel || e.b===sel);
    const dim = sel && !hi;
    g += ecrArrow(p1, p2, r, hi?eco:ink3, hi?3.6:2, dim?0.13:(hi?1:0.55));
    if (e.nota && !dim){ const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2; g += `<text x="${mx}" y="${my}" font-size="10.5" text-anchor="middle" fill="${hi?eco:ink3}" opacity="${hi?1:.75}" style="paint-order:stroke" stroke="var(--bg-3)" stroke-width="4">${e.nota}</text>`; }
  });
  S.sp.forEach(s => {
    const p = L.pos[s.id], on = sel===s.id, R = ECR_ROL[s.lvl];
    const rel = sel && !on && !E.some(e => (e.a===sel&&e.b===s.id)||(e.b===sel&&e.a===s.id));
    g += `<g class="ecr-node" tabindex="0" role="button" data-sp="${s.id}" opacity="${rel?0.32:1}" aria-label="${esc(s.n)}, ${R.n}. Abrir ficha">`
      + ecrShape(s.lvl, p.x, p.y, r) + ` fill="var(--bg-2)" stroke="${on?eco:'var(--ink-3)'}" stroke-width="${on?3.4:1.8}"/>`
      + `<svg x="${p.x-20}" y="${p.y-20}" width="40" height="40" viewBox="0 0 100 100" fill="${on?eco:'var(--ink-2)'}">${ECR_ART[s.art]||''}</svg>`
      + `<text x="${p.x}" y="${p.y+r+15}" font-size="11.5" font-weight="600" text-anchor="middle" fill="var(--ink)" style="paint-order:stroke" stroke="var(--bg-3)" stroke-width="3.5">${esc(s.n)}</text>`
      + `<text x="${p.x}" y="${p.y-r-7}" font-size="10" font-family="IBM Plex Mono, monospace" text-anchor="middle" fill="var(--ink-3)">${R.ab}</text>`
      + `</g>`;
  });
  return `<svg class="ecr-web" viewBox="0 0 ${L.W} ${L.H}" role="img" aria-label="Red trófica ${esc(ecrSysDe(S))}: las flechas van del ser vivo que es comido hacia el que lo come.">${g}</svg>`;
}

    const vals = []; for (let k=0;k<5;k++) vals.push(s.base * Math.pow(eff,k));
    for (let k=4;k>=0;k--){
      const v = vals[k], frac = v/s.base, w = Math.max(9, frac*100);
      pir.append(h('div',{class:'ecr-lvl'+(v<1?' faint':''), style:`width:${w}%`},
        h('b',{},nombres[k]), h('span',{class:'mono small'}, ECR_kj(v)+' kJ/m²·año'),
        h('span',{class:'small muted'}, v<1 ? 'energía insuficiente' : ej[k])));
    }
    const slider = h('input',{type:'range',min:5,max:20,step:1,value:St.eff,id:'ecr-eff','aria-label':'Porcentaje de energía que pasa al siguiente nivel'});
    slider.addEventListener('input', ()=>{ St.eff = +slider.value; render(); });
    const q = quizBlock({
      q:'¿Por qué en la naturaleza casi nunca hay más de cuatro o cinco niveles tróficos?',
      ops:['Porque no existen animales tan grandes como para comerse a un superdepredador',
           'Porque en cada paso se pierde alrededor del 90 % de la energía como calor y actividad vital, y arriba ya no queda energía suficiente para sostener una población',
           'Porque los superdepredadores prefieren no ser comidos',
           'Porque la energía se acaba y hay que esperar a que el sol la devuelva al último nivel'],
      ok:1,
      fb:`En tu pirámide, del nivel 1 al nivel 4 queda apenas ${ECR_dec(Math.pow(eff,3)*100)} % de la energía inicial. Un depredador del quinto nivel tendría que recorrer territorios inmensos para encontrar lo que necesita: no le compensa. Por eso las cadenas son cortas, y en ecosistemas poco productivos como el páramo, aún más.`,
      wrong:['El tamaño no es el problema: de hecho hay superdepredadores pequeños. Mira los números de la pirámide y fíjate en cuánta energía queda arriba.',
             'Los seres vivos no eligen su nivel trófico. La respuesta está en la energía disponible en cada escalón.',
             'La energía del sol entra siempre por el nivel 1, nunca por arriba: la energía fluye en un solo sentido y no regresa.']
    }, att => { if (!St.marks.pir){ St.marks.pir = true; Store.log('reto_parcial',{parte:'piramide', intentos:att}); } });
    return h('div',{class:'stack'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow eco'},'Pirámide de energía · '+s.n),
        h('p',{},'Cada nivel solo aprovecha una parte pequeña de la energía del nivel anterior. El resto se pierde: se usa en respirar, moverse y mantener el cuerpo, y termina disipado como calor.'),
        h('div',{class:'slider'}, h('label',{for:'ecr-eff'},'Energía que pasa al siguiente nivel'), h('output',{},ECR_num(St.eff)+' %'), slider),
        pir,
        h('p',{class:'small muted'},`Punto de partida: ${s.baseNota}. Los valores son aproximados y sirven para comparar órdenes de magnitud, no para memorizarlos. Las barras están a escala, con un ancho mínimo para que los niveles altos sigan siendo legibles.`),
        h('div',{class:'notice'}, h('span',{}, h('b',{},'Regla del 10 %: '), `con una eficiencia del ${ECR_num(St.eff)} %, de cada ${ECR_mil(s.base)} kJ que fijan los productores en un metro cuadrado durante un año solo llegan ${ECR_kj(vals[3])} kJ al cuarto nivel.`))),
      h('div',{class:'card stack'}, q), secNav());
  }

  /* ---------- Modelo de poblaciones (presa–depredador con capacidad de carga) ----------
     Cuatro compartimentos: P productores, H herbívoro, M depredador intermedio,
     T superdepredador. Integración paso a paso (método de Euler, dt = 0,02 años).
     Las unidades son un índice de población (0–100), no individuos reales.          */
  function ecrBase(){ return { rP:1.0, K:100, a1:0.012, b1:0.0125, a2:0.002, a3:0.030, a4:0.020, c1:0.35, cM:0.30, c3:0.16, mH:0.116, mM:0.120, mT:0.1456, dM:0.005, inmT:0, P0:1, T0:1, temporal:0, lento:false }; }
  function ecrStep(st, p, dt){
    const P=st.P, H=st.H, M=st.M, T=st.T;
    const dP = p.rP*P*(1-P/p.K) - p.a1*P*H - p.b1*P*M;
    const dH = p.c1*p.a1*P*H - p.mH*H - p.a2*H*M - p.a3*H*T;
    const dM = p.cM*(p.b1*P*M + p.a2*H*M) - p.mM*M - p.dM*M*M - p.a4*M*T;
    const dT = p.c3*(p.a3*H + p.a4*M)*T - p.mT*T + (p.inmT||0);
    return { P:Math.max(0,P+dP*dt), H:Math.max(0,H+dH*dt), M:Math.max(0,M+dM*dt), T:Math.max(0,T+dT*dt) };
  }
  function ecrEq(){ let st = {P:60,H:25,M:8,T:4}; const p = ecrBase(); for (let i=0;i<6000;i++) st = ecrStep(st, p, 0.02); return st; }
  function ecrSimular(pertId){
    const dt = 0.02, eq = ecrEq(), base = ecrBase();
    const pm = ecrBase(); ECR_PERT[pertId].ap(pm);
    const pts = { P:[], H:[], M:[], T:[] };
    let st = Object.assign({}, eq), t = -6, i = 0;
    const rec = () => { pts.P.push({x:t,y:st.P}); pts.H.push({x:t,y:st.H}); pts.M.push({x:t,y:st.M}); pts.T.push({x:t,y:st.T}); };
    rec();
    while (t < 30){
      const p = t < 0 ? base : pm;
      if (pm.temporal && t >= pm.temporal){ pm.rP = base.rP*0.92; pm.K = base.K*0.92; }
      st = ecrStep(st, p, dt); t += dt; i++;
      if (i % 12 === 0) rec();
      if (Math.abs(t) < dt/2){ st.P *= pm.P0; st.T *= pm.T0; }   // choque inicial de la perturbación
    }
    return { pts, eq, fin:st, params:pm, pert:pertId };
  }
  const ECR_DIR = v => v > 12 ? 'sube' : v < -12 ? 'baja' : 'igual';
  const ECR_DIRTXT = { sube:'Sube', baja:'Baja', igual:'Casi igual' };

  /* ---------- 5 · ¿Qué pasa si…? ---------- */
  function secPerturba(){
    const s = S(), keys = ['P','H','M','T'], etiq = { P:'Productor', H:'Consumidor primario', M:'Consumidor secundario', T:'Superdepredador' };
    const nom = k => ECR_sp(s, s.pop[k]).n;
    const box = h('div',{class:'stack'});
    const resBox = h('div',{class:'stack'});
    const pchips = h('div',{class:'stack'});
    const fb = h('div',{class:'notice',style:'display:none'});
    const chartWrap = h('div',{class:'card',style:'padding:12px;display:none'});
    const chart = h('canvas',{class:'chart',style:'height:260px'});
    chartWrap.append(h('span',{class:'eyebrow eco'},'Evolución de las poblaciones · índice 0–100'), chart,
      h('p',{class:'small muted'},'La perturbación ocurre en el año 0; antes, el ecosistema está en equilibrio. El modelo integra paso a paso cuatro ecuaciones de poblaciones (crecimiento con capacidad de carga y relaciones presa–depredador). El consumidor secundario también se alimenta de presas pequeñas —roedores, invertebrados— que no se representan por separado y que dependen de la vegetación. Sirve para ver tendencias y efectos indirectos, no para predecir números exactos.'));

    const sel = h('div',{class:'row',style:'flex-wrap:wrap'});
    s.perts.forEach(pid => { const P = ECR_PERT[pid];
      sel.append(h('button',{class:'chip'+(St.pertId===pid?' picked':''),'aria-pressed':String(St.pertId===pid), onclick:()=>{ St.pertId=pid; St.pred={}; St.predRun=false; St.sim=null; render(); }}, P.em+' '+P.n)); });

    if (St.pertId){
      const P = ECR_PERT[St.pertId];
      box.append(h('div',{class:'notice info'}, h('span',{}, h('b',{},P.n+'. '), P.d(s))));
      pchips.append(h('p',{style:'font-weight:600'},'Antes de simular, predice qué ocurrirá con cada población a mediano plazo:'));
      keys.forEach(k => {
        const fila = h('div',{class:'ecr-pred'},
          h('span',{}, h('b',{},nom(k)), ' ', h('span',{class:'small muted'},'· '+etiq[k])),
          h('div',{class:'opts'}, ['sube','baja','igual'].map(v => h('button',{class:'chip'+(St.pred[k]===v?' picked':''),'aria-pressed':String(St.pred[k]===v), disabled: St.predRun||null,
            onclick:()=>{ St.pred[k]=v; render(); }}, ECR_DIRTXT[v]))));
        pchips.append(fila);
      });
      const listo = keys.every(k => St.pred[k]);
      pchips.append(h('button',{class:'btn primary', style:'align-self:flex-start;margin-top:8px', disabled: (!listo||St.predRun)||null,
        onclick:()=>{ St.sim = ecrSimular(St.pertId); St.predRun = true; Store.log('prediccion',{recurso:'cn-eco-red', ecosistema:s.id, perturbacion:St.pertId, prediccion:Object.assign({},St.pred)}); render(); }},
        listo ? 'Ejecutar la simulación (36 años)' : 'Completa las cuatro predicciones'));
    } else box.append(h('div',{class:'notice'},'Elige una perturbación para empezar.'));

    if (St.sim){
      const R = St.sim, aciertos = [];
      const filas = keys.map(k => {
        const ini = R.eq[k], fin = R.fin[k], ch = ini>0 ? (fin-ini)/ini*100 : 0, d = ECR_DIR(ch), ok = St.pred[k]===d;
        if (ok) aciertos.push(k);
        return { k, ini, fin, ch, d, ok };
      });
      const casc = ECR_CASCADA(St.pertId, s, filas);
      if (!St.marks.pred){ St.marks.pred = aciertos.length >= 3; }
      chartWrap.style.display='';
      setTimeout(()=>{ lineChart(chart, { series:[
          { label:nom('P'), color:cssVar('--eco'), pts:R.pts.P },
          { label:nom('H'), color:cssVar('--lab'), pts:R.pts.H },
          { label:nom('M'), color:cssVar('--warn'), pts:R.pts.M },
          { label:nom('T'), color:cssVar('--bad'), pts:R.pts.T } ],
        xmin:-6, xmax:30, ymin:0, ymax:110, xticks:6, xlabel:'años desde la perturbación', ylabel:'índice de población',
        xfmt:v=>ECR_num(v)+' a', yfmt:v=>ECR_num(v) }); }, 30);
      const tabla = h('div',{class:'tablewrap'}, h('table',{class:'data'},
        h('thead',{}, h('tr',{}, h('th',{},'Población'), h('th',{},'Antes'), h('th',{},'A los 30 años'), h('th',{},'Cambio'), h('th',{},'Tu predicción'))),
        h('tbody',{}, filas.map(f => h('tr',{},
          h('td',{}, nom(f.k)), h('td',{class:'num'},ECR_num(f.ini,1)), h('td',{class:'num'},ECR_num(f.fin,1)),
          h('td',{class:'num'}, (f.ch>=0?'+':'−')+ECR_num(Math.abs(f.ch))+' % · '+ECR_DIRTXT[f.d]),
          h('td',{}, h('span',{class:'pill '+(f.ok?'ok':'bad')}, (f.ok?'✓ ':'✗ ')+ECR_DIRTXT[St.pred[f.k]])))))));
      fb.className = 'notice '+(aciertos.length>=3?'ok':'warn'); fb.style.display='flex';
      fb.innerHTML = `<span><b>Acertaste ${aciertos.length} de 4.</b> ${filas.filter(f=>!f.ok).map(f=>`Predijiste que ${ecrArt(ECR_sp(s,s.pop[f.k]))} ${ECR_DIRTXT[St.pred[f.k]].toLowerCase()}, pero ${f.d==='igual'?'se mantuvo casi igual':'se ' + (f.d==='sube'?'multiplicó':'redujo')} (${(f.ch>=0?'+':'−')+ECR_num(Math.abs(f.ch))} %).`).join(' ')} ${casc}</span>`;
      resBox.append(tabla);
    }
    return h('div',{class:'stack'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow eco'},'Perturbación · '+s.n),
        h('p',{},'Elige una perturbación real que ocurre hoy en el Ecuador, predice y después comprueba. Casi siempre hay efectos indirectos que no se ven a simple vista.'),
        sel, box, pchips, fb, resBox),
      chartWrap, secNav());
  }
  function ECR_CASCADA(pid, s, filas){
    const n = k => ecrArt(ECR_sp(s, s.pop[k])), nd = k => ecrDel(ECR_sp(s, s.pop[k])), na = k => ecrAl(ECR_sp(s, s.pop[k]));
    const T = { 'caza-tope': `<b>Cascada trófica.</b> Al desaparecer ${n('T')}, ${n('H')} deja de ser controlado y casi se duplica; al haber tantos herbívoros, ${n('P')} se consume más rápido de lo que crece y cae. Es el efecto indirecto que casi nadie predice: tocamos al depredador y el que se resiente es el productor. Mira también la curva ${nd('M')}: sube los primeros años porque ya nadie lo caza ("liberación del mesodepredador") y luego vuelve a bajar cuando la vegetación se agota. Los efectos indirectos llegan con retraso.`,
      'deforestacion': `<b>El golpe llega de abajo hacia arriba.</b> Solo se eliminó vegetación, pero fíjate en quién pierde más en porcentaje: ${n('T')}. Con menos productores hay menos energía en toda la pirámide, y el nivel más alto es el que primero se queda sin sustento, porque necesita territorios enormes.`,
      'quema': `<b>El fuego actúa en la base.</b> El pajonal rebrota tierno y parece recuperarse, pero la capacidad de carga del suelo quemado es menor: el sistema se estabiliza en valores más bajos y el superdepredador puede no volver nunca. Además, el suelo del páramo libera carbono y pierde su capacidad de retener agua.`,
      'sequia': `<b>Perturbación temporal, huella duradera.</b> La sequía dura unos ocho años y después la vegetación se recupera en parte, pero ${n('T')} sigue muy por debajo tres décadas más tarde: se reproduce despacio y necesita mucho territorio. Y mientras falta, ${n('H')} se mantiene alto y la vegetación no vuelve a su nivel anterior. Una perturbación "pasajera" puede dejar al ecosistema en otro estado.`,
      'invasora': `<b>Competencia invisible.</b> La especie invasora no aparece en la gráfica, pero ocupa espacio y recursos: baja la capacidad de carga y aumenta la presión sobre ${n('P')}. Todos los niveles se reajustan a la baja sin que ningún depredador haya desaparecido.`,
      'sobrepesca': `<b>Se extrae un solo eslabón… y se mueve toda la red.</b> Al sacar tanto ${n('H')} sube ${n('P')}, porque ya casi nadie lo consume, y baja ${n('T')}: la pesca compite con él por el mismo alimento. Además ${n('M')} se dispara y ocupa el espacio que dejó libre ${n('H')}. Por eso las vedas y las tallas mínimas no protegen solo a la especie capturada.` };
    return T[pid] || '';
  }

  /* ---------- 6 · Fluye o circula ---------- */
  const ECR_PROC = [
    { id:'fotosintesis', n:'Fotosíntesis', d:'Los productores capturan energía luminosa y con ella unen CO₂ y agua para formar glucosa. Aquí entran a la vez la energía (del sol) y la materia (el carbono del aire). Es la única puerta de entrada de energía al ecosistema.' },
    { id:'alimentacion', n:'Alimentación', d:'Al comer, un ser vivo incorpora materia y energía del anterior. Pero solo aprovecha una parte pequeña: el resto no llega a asimilarse o se gasta en vivir.' },
    { id:'respiracion', n:'Respiración celular', d:'Todos los seres vivos (incluidas las plantas) oxidan la glucosa para obtener ATP. Devuelven carbono a la atmósfera como CO₂ y liberan energía en forma de calor. La materia vuelve al ciclo; la energía, no.' },
    { id:'descomposicion', n:'Descomposición', d:'Hongos, bacterias y detritívoros transforman los restos y los excrementos. Devuelven al suelo o al agua el carbono, el nitrógeno y el fósforo, que las plantas volverán a usar. Sin este paso el ciclo se rompe.' },
    { id:'deposito', n:'Acumulación en el depósito', d:'Parte de la materia orgánica no se descompone del todo y se acumula. Ese carbono queda guardado durante décadas o siglos.' },
    { id:'combustion', n:'Quema y combustión', d:'Al quemar biomasa o combustibles fósiles se libera de golpe carbono que había tardado siglos en acumularse. Es la principal alteración humana del ciclo del carbono.' },
    { id:'calor', n:'Disipación en forma de calor', d:'En cada transferencia una gran parte de la energía se degrada a calor y sale del ecosistema. No se destruye (primera ley), pero ya no puede usarse para hacer trabajo biológico (segunda ley). Por eso la energía necesita reponerse cada día desde el sol.' }
  ];
  function ecrCicloSVG(modo, s){
    const cajas = [
      { id:'atm', x:330, y:20, w:250, h:56, t:'Atmósfera · CO₂' },
      { id:'prod', x:60, y:170, w:200, h:76, t:'Productores', s:ECR_sp(s,s.pop.P).n },
      { id:'cons', x:360, y:170, w:200, h:76, t:'Consumidores', s:ECR_sp(s,s.pop.H).n+' · '+ECR_sp(s,s.pop.T).n },
      { id:'desc', x:660, y:170, w:200, h:76, t:'Descomponedores', s:'hongos y bacterias' },
      { id:'dep', x:360, y:330, w:200, h:70, t:'Depósito', s:s.ciclo.dep },
      { id:'quema', x:660, y:330, w:200, h:70, t:'Quema / combustión', s:'alteración humana' }
    ];
    const sol = `<g><circle cx="80" cy="48" r="30" fill="none" stroke="var(--warn)" stroke-width="2.5"/><text x="80" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Sol</text>` +
      [0,45,90,135,180,225,270,315].map(a => { const r1=34,r2=44,rad=a*Math.PI/180; return `<line x1="${(80+r1*Math.cos(rad)).toFixed(1)}" y1="${(48+r1*Math.sin(rad)).toFixed(1)}" x2="${(80+r2*Math.cos(rad)).toFixed(1)}" y2="${(48+r2*Math.sin(rad)).toFixed(1)}" stroke="var(--warn)" stroke-width="2"/>`; }).join('') + `</g>`;
    let g = sol;
    const visibles = modo === 'materia' ? cajas : cajas.filter(c => ['prod','cons','desc'].includes(c.id));
    visibles.forEach(c => { g += `<g><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="12" fill="var(--bg-2)" stroke="var(--ink-3)" stroke-width="1.6"/>`
      + `<text x="${c.x+c.w/2}" y="${c.y+(c.s?26:34)}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${esc(c.t)}</text>`
      + (c.s?`<text x="${c.x+c.w/2}" y="${c.y+48}" text-anchor="middle" font-size="11.5" fill="var(--ink-3)">${esc(c.s)}</text>`:'') + `</g>`; });
    const lab = (x,y,txt,col) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${col}" style="paint-order:stroke" stroke="var(--bg-3)" stroke-width="4.5">${esc(txt)}</text>`;
    const fl = (x1,y1,x2,y2,txt,col,dash,tx,ty) => {
      const a = ecrArrow({x:x1,y:y1},{x:x2,y:y2}, 2, col, 2.6, 1).replace('<line','<line stroke-dasharray="'+(dash||'0')+'"');
      const mx=(x1+x2)/2, my=(y1+y2)/2;
      return a + lab(tx!=null?tx:mx, ty!=null?ty:my-6, txt, col);
    };
    const punta = (x,y,dir,col) => { const p = { up:[[x,y],[x-6,y+11],[x+6,y+11]], down:[[x,y],[x-6,y-11],[x+6,y-11]], left:[[x,y],[x+11,y-6],[x+11,y+6]], right:[[x,y],[x-11,y-6],[x-11,y+6]] }[dir];
      return `<polygon fill="${col}" points="${p.map(q=>q.join(',')).join(' ')}"/>`; };
    const flP = (d,hx,hy,dir,txt,tx,ty,col,dash) => `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${dash||'0'}"/>` + punta(hx,hy,dir,col) + lab(tx,ty,txt,col);
    const eco = 'var(--eco)', warn = 'var(--warn)', ink3 = 'var(--ink-3)';
    if (modo === 'materia'){
