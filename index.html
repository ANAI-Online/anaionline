  const areas = BIO.areas.filter(a => Store.areaStatus(a)==='actual');
  const learn = h('div',{class:'card stack',style:'margin-top:16px'}, h('span',{class:'eyebrow'},'Qué está estudiando ahora'),
    h('div',{class:'grid g2'}, areas.map(a => h('div',{class:'stack',style:'gap:6px'},
      h('div',{class:'row',style:'gap:8px'}, h('span',{},a.em), h('b',{},a.n)),
      h('p',{class:'small muted'},a.pregunta),
      h('div',{class:`progress ${a.dom}`},h('i',{style:`width:${areaPct(a)}%`})),
      h('span',{class:'small muted'}, areaPct(a)+' % de avance en esta área')))));
  view.append(learn);

  // Pendientes
  const pb = h('div',{class:'card stack',style:'margin-top:16px'}, h('span',{class:'eyebrow'},'Lo que tiene pendiente'));
  if (!pend.length) pb.append(h('div',{class:'notice ok'},'No tiene actividades pendientes. Todo lo asignado está entregado.'));
  pend.forEach(({a,it,dias}) => pb.append(h('div',{class:'act'},
    h('span',{class:'ico',style:'background:var(--bg-3)'}, dias<0?'⏰':'📌'),
    h('span',{}, h('div',{class:'t'},it.t), h('div',{class:'d'}, (dias<0?`Se venció hace ${-dias} día(s)`:dias===0?'Vence hoy':`Faltan ${dias} días`) + ' · ' + a.nota)),
    h('span',{class:'pill '+(dias<0?'bad':dias<=2?'warn':'')}, new Date(a.vence).toLocaleDateString('es-EC',{day:'2-digit',month:'short'})))));
  view.append(pb);

  // Logros y comentarios
  const g2 = h('div',{class:'grid g2',style:'margin-top:16px'});
  g2.append(h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Logros de este periodo'),
    h('div',{class:'row'}, BIO.badges.filter(b=>s.badges.includes(b.id)).map(b => h('span',{class:'pill ok'},`${b.em} ${b.n}`))),
    s.badges.length ? null : h('p',{class:'small muted'},'Todavía no obtiene insignias. Se consiguen al terminar exploraciones, misiones y laboratorios.'),
    h('p',{class:'small muted'},`Última actividad: ${s.lastActivity.t}, ${timeAgo(s.lastActivity.at)}.`)));
  g2.append(h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Comentarios de la docente'),
    BIO.comentarios.map(c => h('div',{class:'stack',style:'gap:2px'}, h('span',{class:'small muted'}, new Date(c.at).toLocaleDateString('es-EC',{day:'2-digit',month:'long'})), h('p',{class:'small'},c.txt))),
    h('a',{class:'btn sm',style:'align-self:flex-start',href:`mailto:${BIO.school.docente.email}?subject=${encodeURIComponent('Consulta sobre '+nombre)}`},'Escribir a la docente')));
  view.append(g2);

  // Cómo acompañar
  view.append(h('div',{class:'card stack',style:'margin-top:16px'}, h('span',{class:'eyebrow'},'Cómo acompañar en casa (sin ser experto en Biología)'),
    h('div',{class:'grid g3'},
      [['🗣','Pregúntele qué exploró','"¿Qué parte del corazón viste hoy? ¿Para qué sirve?" Explicar en voz alta consolida lo aprendido.'],
       ['⏱','20 minutos bastan','Es mejor entrar tres veces por semana un rato corto que una sola vez por mucho tiempo.'],
       ['🎯','Revise el reto','Cada recurso plantea un reto. Pregúntele si ya lo resolvió y qué respondió.']]
      .map(([em,t,d]) => h('div',{class:'stack',style:'gap:4px'}, h('span',{style:'font-size:1.4rem'},em), h('b',{},t), h('p',{class:'small muted'},d))))));

  view.append(h('div',{class:'notice info noprint',style:'margin-top:16px'}, h('span',{},'Con el servidor de la fase 2, este mismo resumen puede llegarle por correo una vez por semana, sin costo. Usted decide si lo quiere recibir.')));
  view.append(h('p',{class:'small muted',style:'margin-top:14px'},'Vista de solo lectura: el representante no puede modificar calificaciones ni actividades. Los datos mostrados corresponden al estudiante de demostración de este navegador.'));
});

function famGate(view){
  const inp = h('input',{type:'text',placeholder:'FAM-2K9P','aria-label':'Código de representante',style:'text-transform:uppercase;max-width:220px'});
  const msg = h('div',{class:'notice',style:'display:none'});
  view.append(h('div',{class:'page-head'}, h('div',{}, h('span',{class:'eyebrow'},'Representantes'), h('h1',{},'Avance de su representado'),
    h('p',{},'Escriba el código que le entregó la docente. Verá únicamente el avance del estudiante a su cargo: qué está estudiando, qué tiene pendiente y cómo acompañarlo.'))));
  view.append(h('div',{class:'card stack',style:'max-width:560px'},
    h('div',{class:'row'}, inp, h('button',{class:'btn primary',onclick:()=>{
      if (inp.value.trim().toUpperCase() !== BIO.familyCode){ msg.className='notice warn'; msg.textContent='Ese código no corresponde a ningún estudiante. Consúltelo con la docente.'; msg.style.display='flex'; return; }
      Store.ses.rol='familia'; Store.ses.onboarded=true; Store.save(); updateChips(); toast('Bienvenida. Vista de representante activada.'); render(); }},'Entrar')),
    msg, h('p',{class:'small muted'},`Para la demostración, el código es ${BIO.familyCode}. Cada estudiante tendrá el suyo.`)));
}
</script>
<script>
/* =====================================================================
   INICIO DE LA APLICACIÓN: barra superior, roles, avisos y bienvenida
   ===================================================================== */
function updateChips(){
  const rol = Store.ses.rol, y = Store.year();
  const nom = $('#chip-nombre'), cur = $('#chip-curso'), chip = $('#userchip');
  if (rol === 'docente'){ nom.textContent = BIO.school.docente.nombre; cur.textContent = 'Vista docente'; chip.setAttribute('href','#/docente'); $('.avatar').textContent = 'DB'; }
  else if (rol === 'familia'){ nom.textContent = 'Representante'; cur.textContent = Store.s.user.nombre; chip.setAttribute('href','#/familia'); $('.avatar').textContent = '👪'; }
  else { nom.textContent = Store.s.user.nombre; cur.textContent = (y ? BIO.year(y).n : 'Sin año asignado') + (Store.ses.paralelo ? ' · '+Store.ses.paralelo : '') + (Store.ses.invitado ? ' · invitado' : ''); chip.setAttribute('href','#/progreso'); $('.avatar').textContent = Store.s.user.iniciales; }
  buildNav(); updateNav(parseHash().path);
}
function roleModal(){
  const opt = (rol, em, t, d, go) => h('button',{class:'wz-role',onclick:()=>{ Store.ses.rol = rol; if (rol==='estudiante' && !Store.year()) Store.guest(2); Store.save(); updateChips(); closeModal(); navigate(go); toast(`Vista de ${t.toLowerCase()} activada.`); }},
    h('span',{class:'em'},em), h('b',{},t), h('span',{class:'small muted'},d));
  openModal(h('div',{class:'stack'}, h('span',{class:'eyebrow'},'Cambiar de vista'), h('h3',{},'¿Cómo quieres ver la plataforma?'),
    h('p',{class:'small muted'},'En la versión con servidor, cada persona entra con su propia cuenta y solo ve lo que le corresponde. Aquí puedes alternar para conocer las tres vistas.'),
    h('div',{class:'wz-roles'}, opt('estudiante','🎒','Estudiante','Tu año, tus retos y tu progreso.','#/'), opt('docente','🧑‍🏫','Docente','Calificaciones, reportes, códigos y adaptaciones.','#/docente'), opt('familia','👨‍👩‍👧','Representante','Avance y pendientes de tu representado.','#/familia')),
    h('div',{class:'row'},
      h('button',{class:'btn sm ghost',onclick:()=>{ closeModal(); openWizard('rol'); }},'Volver a la bienvenida'),
      h('button',{class:'btn sm ghost',onclick:()=>{ closeModal(); openWizard('login'); }},'Iniciar sesión con usuario'),
      Store.ses.userId ? h('button',{class:'btn sm ghost',onclick:()=>{ Users.logout(); Store.s.user = Object.assign({}, Store.s.user, { id:'demo-mateo', nombre:'Mateo Andrade', iniciales:'MA' }); Store.save(); updateChips(); closeModal(); toast('Sesión cerrada.'); navigate('#/'); }},'Cerrar sesión') : null,
      h('button',{class:'btn sm ghost',onclick:closeModal},'Cancelar'))));
}
(function init(){
  applyA11y(); Store.touchVisit();
  buildNav(); updateChips();
  $('#btn-home').addEventListener('click', ()=>navigate('#/'));
  const mb = $('#btn-motion'); const syncMotion = () => mb.setAttribute('aria-pressed', !Store.s.settings.motion); syncMotion();
  mb.addEventListener('click', ()=>{ Store.s.settings.motion = !Store.s.settings.motion; Store.save(); syncMotion(); applyA11y(); toast(Store.s.settings.motion?'Animaciones activadas.':'Animaciones pausadas.'); });
  $('#btn-role').addEventListener('click', roleModal);
  $('#btn-a11y').addEventListener('click', ()=>navigate('#/accesibilidad'));
  $('#btn-help').addEventListener('click', ()=>{
    openModal(h('div',{class:'stack'}, h('span',{class:'eyebrow'},'Ayuda'), h('h3',{},'¿Necesitas orientarte?'),
      h('div',{class:'wz-tips'},
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); navigate('#/'); setTimeout(()=>startTour(),400); }}, h('span',{class:'em'},'🧭'), h('div',{}, h('b',{},'Recorrido guiado de 1 minuto'), h('p',{class:'small muted'},'Te muestro dónde está cada cosa.'))),
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); navigate('#/mapa'); }}, h('span',{class:'em'},'🗺'), h('div',{}, h('b',{},'Mapa de la plataforma'), h('p',{class:'small muted'},'Dónde estás y cuál es tu siguiente paso.'))),
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); navigate('#/accesibilidad'); }}, h('span',{class:'em'},'🅰'), h('div',{}, h('b',{},'Mi forma de aprender'), h('p',{class:'small muted'},'Letra, contraste, voz y ritmo.'))),
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); openWizard('rol'); }}, h('span',{class:'em'},'🔁'), h('div',{}, h('b',{},'Volver a empezar la bienvenida'), h('p',{class:'small muted'},'Cambiar de rol, de año o de código.')))),
      h('button',{class:'btn sm ghost',style:'align-self:flex-start',onclick:closeModal},'Cerrar')));
  });
  // avisos
  const bell = $('#btn-bell'), panel = $('#bell-panel');
  bell.addEventListener('click', e => { e.stopPropagation(); const open = panel.classList.toggle('open'); bell.setAttribute('aria-expanded', String(open)); if (open) renderBell(); });
  document.addEventListener('click', e => { if (!e.target.closest('.bell-wrap')) closeBell(); });
  renderBell();
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeBell(); });
  if (!location.hash) location.hash = '#/';
  render();
  if (!Store.ses.onboarded) setTimeout(()=>openWizard(), 600);
})();
</script>
</body>
</html>
