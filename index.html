      g += fl(196, 166, 402, 66, 'respiración', ink3, null, 330, 148);
      g += fl(262, 208, 356, 208, 'alimento', eco, null, 309, 198);
      g += fl(474, 166, 474, 80, 'respiración', ink3, null, 520, 128);
      g += fl(562, 200, 656, 200, 'restos', eco, null, 609, 190);
      g += fl(752, 166, 574, 74, 'respiración', ink3, null, 690, 106);
      g += flP('M150 250 L150 306 L706 306 L706 254', 706, 250, 'up', 'hojarasca y raíces muertas', 330, 322, eco, '7 5');
      g += fl(742, 250, 566, 344, 'materia orgánica', eco, null, 690, 288);
      g += fl(566, 366, 654, 366, 'extracción', warn, null, 610, 356);
      g += flP('M866 344 L892 344 L892 48 L600 48', 586, 48, 'left', 'CO₂ liberado de golpe', 740, 40, warn);
      g += `<text x="480" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">La materia CIRCULA: los mismos átomos de carbono vuelven a usarse una y otra vez.</text>`;
    } else {
      g += fl(112, 76, 158, 166, 'energía luminosa', warn);
      g += fl(262, 196, 356, 196, '≈10 %', warn);
      g += fl(562, 196, 656, 196, '≈10 %', warn);
      [160,460,760].forEach(x => { g += fl(x, 252, x, 330, 'calor', ink3, '5 4');
        g += `<text x="${x}" y="${356}" text-anchor="middle" font-size="11.5" fill="var(--ink-3)">se disipa · no regresa</text>`; });
      g += `<text x="480" y="398" text-anchor="middle" font-size="12" fill="var(--ink-3)">De cada 100 unidades de energía que entran en un nivel, solo unas 10 llegan al siguiente.</text>`;
      g += `<text x="480" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">La energía FLUYE en un solo sentido: entra del sol, se degrada a calor y no regresa.</text>`;
    }
    return `<svg class="ecr-cyc" viewBox="0 0 900 460" role="img" aria-label="${modo==='materia'?'Ciclo del carbono: la materia circula entre atmósfera, productores, consumidores, descomponedores y el depósito del ecosistema.':'Flujo de energía: entra del sol, pasa de nivel en nivel perdiendo aproximadamente el 90 % en cada paso y se disipa como calor.'}">${g}</svg>`;
  }
  function secMateria(){
    const s = S();
    const modo = St.modo || 'materia';
    const svgBox = h('div',{html: ecrCicloSVG(modo, s)});
    const seg = h('div',{class:'segmented',role:'tablist'},
      ['materia','energia'].map(m => h('button',{role:'tab','aria-selected':String(modo===m), onclick:()=>{ St.modo=m; render(); }}, m==='materia'?'Ver la materia (carbono)':'Ver la energía')));
    const det = h('div',{class:'notice info'},'Elige un proceso para leer qué ocurre en él.');
    const procs = h('div',{class:'row',style:'flex-wrap:wrap'});
    ECR_PROC.forEach(p => procs.append(h('button',{class:'chip', onclick:()=>{ det.className='notice'; det.innerHTML=''; det.append(h('span',{}, h('b',{},p.n+'. '), p.d)); }}, p.n)));
    /* clasificación: fluye o circula */
    const items = [
      { id:'energia', n:'La energía', ok:'fluye', fb:'La energía entra una sola vez desde el sol, pasa de nivel en nivel y se va degradando a calor. No vuelve al principio: por eso el ecosistema necesita la luz del sol todos los días.' },
      { id:'carbono', n:'El carbono', ok:'circula', fb:'El mismo átomo de carbono pasa del aire a una planta, de la planta a un herbívoro, del herbívoro al descomponedor y otra vez al aire. Es materia: se recicla.' },
      { id:'agua', n:'El agua', ok:'circula', fb:'El agua se evapora, forma nubes, cae como lluvia, la absorben las raíces y vuelve a la atmósfera. En el páramo, además, queda retenida en el suelo y alimenta a las ciudades.' },
      { id:'nitrogeno', n:'El nitrógeno', ok:'circula', fb:'Bacterias fijadoras lo toman del aire, pasa a las proteínas de los seres vivos y otras bacterias lo devuelven a la atmósfera. Es un ciclo, aunque más lento y con muchos intermediarios.' },
      { id:'calor', n:'El calor que produce un animal al moverse', ok:'fluye', fb:'Ese calor sale del cuerpo y del ecosistema y ya no puede usarse para hacer trabajo biológico. Energía degradada: no se destruye, pero no vuelve a la red.' }
    ];
    St.clas = St.clas || {};
    const cfb = h('div',{class: St.clasFb ? St.clasFb.k : 'notice', style: St.clasFb ? '' : 'display:none', html: St.clasFb ? '<span>'+St.clasFb.m+'</span>' : ''});
    const lista = h('div',{class:'stack'});
    items.forEach(it => {
      const r = h('div',{class:'ecr-pred'}, h('span',{},it.n),
        h('div',{class:'opts'}, ['fluye','circula'].map(v => h('button',{class:'chip'+(St.clas[it.id]===v?(v===it.ok?' ok':' bad'):''),'aria-pressed':String(St.clas[it.id]===v),
          onclick:()=>{ St.clas[it.id]=v; const ok = v===it.ok;
            St.clasFb = { k:'notice '+(ok?'ok':'warn'),
              m:`<b>${ok?'Correcto: '+it.n.toLowerCase()+' '+it.ok+'.':'Aún no: '+it.n.toLowerCase()+' '+it.ok+'.'}</b> ${esc(it.fb)}` };
            const todas = items.every(x => St.clas[x.id]===x.ok);
            if (todas && !St.marks.ciclo){ St.marks.ciclo = true; toast('Distinguiste lo que fluye de lo que circula.'); }
            Store.log('respuesta',{pregunta:'fluye-o-circula', opcion:it.id+':'+v, correcto:ok});
            render(); }}, v==='fluye'?'Fluye (un solo sentido)':'Circula (vuelve a usarse)'))));
      lista.append(r);
    });
    return h('div',{class:'stack'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow eco'},'Materia y energía '+ecrSysEn(s)),
        h('p',{},'Es el error más frecuente: pensar que la energía "se recicla". Compara los dos esquemas del mismo ecosistema y fíjate en las flechas que no regresan.'),
        seg, svgBox, h('p',{class:'small muted'},s.ciclo.extra), procs, det),
      h('div',{class:'card stack'}, h('b',{},'Clasifica: ¿fluye o circula?'), lista, cfb), secNav());
  }

  /* ---------- 7 · Decisión de conservación ---------- */
  function secConserva(){
    const s = S(), nom = k => ECR_sp(s, s.pop[k]).n;
    if (!St.sim) return h('div',{class:'stack'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow eco'},'Decisión de conservación'),
        h('div',{class:'notice warn'},'Primero necesitas un ecosistema alterado: vuelve a la sección 5, elige una perturbación y ejecuta la simulación. Después podrás decidir qué medida aplicar.'),
        h('button',{class:'btn primary',style:'align-self:flex-start',onclick:()=>{ St.sec=4; render(); }},'Ir a la sección 5')), secNav());
    const chips = h('div',{class:'row',style:'flex-wrap:wrap'});
    Object.entries(ECR_MED).forEach(([id,M]) => chips.append(h('button',{class:'chip'+(St.med===id?' picked':''),'aria-pressed':String(St.med===id),
      onclick:()=>{ St.med=id; St.medRun=null; render(); }}, M.em+' '+M.n)));
    const box = h('div',{class:'stack'});
    if (St.med){
      const M = ECR_MED[St.med];
      box.append(h('div',{class:'notice info'}, h('span',{}, h('b',{},M.n+'. '), M.d)));
      box.append(h('button',{class:'btn primary',style:'align-self:flex-start', onclick:()=>{
        const pA = Object.assign({}, St.sim.params), pB = Object.assign({}, St.sim.params); M.ap(pB);
        const dt = 0.02, pts = {P:[],H:[],M:[],T:[]}, sin = {P:[],H:[],M:[],T:[]};
        let a = Object.assign({}, St.sim.fin), b = Object.assign({}, St.sim.fin), t = 0, i = 0;
        const mix = (u) => { const o = {}; Object.keys(pB).forEach(k => { o[k] = (typeof pB[k]==='number' && typeof pA[k]==='number') ? pA[k] + (pB[k]-pA[k])*u : pB[k]; }); return o; };
        const rec = () => { ['P','H','M','T'].forEach(k => { pts[k].push({x:t,y:b[k]}); sin[k].push({x:t,y:a[k]}); }); };
        rec();
        while (t < 10){ const u = pB.lento ? Math.min(1, t/8) : Math.min(1, t/1.5);
          a = ecrStep(a, pA, dt); b = ecrStep(b, mix(u), dt); t += dt; i++; if (i % 12 === 0) rec(); }
        St.medRun = { pts, sin, fin:b, finSin:a };
        Store.log('conservacion',{recurso:'cn-eco-red', ecosistema:s.id, medida:St.med, perturbacion:St.pertId});
        render();
      }},'Simular 10 años con esta medida'));
    } else box.append(h('div',{class:'notice'},'Elige la medida que aplicarías en este ecosistema.'));
    const chartWrap = h('div',{class:'card',style:'padding:12px;display:none'});
    const chart = h('canvas',{class:'chart',style:'height:250px'});
    chartWrap.append(h('span',{class:'eyebrow eco'},'Diez años después de aplicar la medida'), chart);
    if (St.medRun){
      const R = St.medRun, M = ECR_MED[St.med];
      chartWrap.style.display='';
      setTimeout(()=>{ lineChart(chart, { series:[
          { label:nom('P'), color:cssVar('--eco'), pts:R.pts.P },
          { label:nom('H'), color:cssVar('--lab'), pts:R.pts.H },
          { label:nom('M'), color:cssVar('--warn'), pts:R.pts.M },
          { label:nom('T'), color:cssVar('--bad'), pts:R.pts.T } ],
        xmin:0, xmax:10, ymin:0, ymax:110, xticks:5, xlabel:'años desde la medida', ylabel:'índice de población',
        xfmt:v=>ECR_num(v)+' a', yfmt:v=>ECR_num(v) }); }, 30);
      const tabla = h('div',{class:'tablewrap'}, h('table',{class:'data'},
        h('thead',{}, h('tr',{}, h('th',{},'Población'), h('th',{},'Hoy (alterado)'), h('th',{},'A 10 años sin medida'), h('th',{},'A 10 años con la medida'))),
        h('tbody',{}, ['P','H','M','T'].map(k => h('tr',{}, h('td',{},nom(k)),
          h('td',{class:'num'},ECR_num(St.sim.fin[k],1)), h('td',{class:'num'},ECR_num(R.finSin[k],1)), h('td',{class:'num'}, h('b',{},ECR_num(R.fin[k],1))))))));
      const mejor = ['P','H','M','T'].filter(k => R.fin[k] > R.finSin[k]*1.05).length;
      const extinto = R.fin.T < 0.5;
      const ta = h('textarea',{placeholder:'Elegí esta medida porque… La simulación muestra que… La principal limitación es…','aria-label':'Justificación de tu decisión',style:'min-height:110px'});
      box.append(tabla, h('div',{class:'notice ok'}, h('span',{}, h('b',{},'Resultado a 10 años. '),
          `Con esta medida suben ${mejor} de las 4 poblaciones respecto a no hacer nada. Cuidado: más no siempre es mejor; un herbívoro que crece sin depredador termina sobrepastoreando la vegetación. ${M.fb}`)),
        ...(extinto ? [h('div',{class:'notice warn'}, h('span',{}, h('b',{},'Atención: '), `${ecrArt(ECR_sp(s,s.pop.T))} está prácticamente extinguido en esta zona (índice ${ECR_num(R.fin.T,1)}). Ninguna medida local lo devuelve si ya no quedan individuos: solo puede regresar si llega desde otra población, y para eso hace falta conectividad, es decir, un corredor biológico, o una reintroducción planificada.`))] : []),
        h('div',{class:'field'}, h('label',{},'Justifica tu decisión con los datos de la simulación (mínimo 80 caracteres)'), ta,
          h('button',{class:'btn primary sm',style:'align-self:flex-start', onclick:()=>{
            if (ta.value.trim().length < 80) return toast('Desarrolla tu justificación: cita al menos una población y un número de la tabla.');
            Store.addNote('conclusion', `Conservación · ${s.n} · perturbación: ${ECR_PERT[St.pertId].n} · medida elegida: ${M.n}. ${ta.value.trim()}`, { recurso:'cn-eco-red', ecosistema:s.id });
            St.marks.conserva = true; toast('Guardado en tu cuaderno. Tu docente podrá revisarlo.');
            Store.log('respuesta_abierta',{actividad:'cn-eco-red', longitud:ta.value.length, medida:St.med}); render();
          }},'Guardar en el cuaderno')));
      if (St.marks.conserva) box.append(h('div',{class:'notice ok'},'Justificación guardada en tu cuaderno de campo.'));
    }
    return h('div',{class:'stack'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow eco'},'Decisión de conservación · '+s.n),
        h('p',{},`El ecosistema quedó alterado por: ${ECR_PERT[St.pertId].n.toLowerCase()}. Ninguna medida arregla todo: cada una actúa sobre una parte distinta de la red y tiene un costo. Elige una, simula diez años y defiende tu decisión.`),
        chips, box), chartWrap, secNav());
  }

  /* ---------- 8 · Reto final ---------- */
  function secReto(){
    const s = S(), T = ECR_sp(s, s.pop.T), H = ECR_sp(s, s.pop.H), P = ECR_sp(s, s.pop.P), M = ECR_sp(s, s.pop.M);
    const hechos = Object.entries({ red:'Construiste la red trófica', pred:'Acertaste al menos 3 de 4 en la predicción', pir:'Explicaste el límite de niveles tróficos', ciclo:'Distinguiste lo que fluye de lo que circula', conserva:'Justificaste una medida de conservación' });
    const lista = h('ul',{class:'ecr-check'});
    hechos.forEach(([k,txt]) => lista.append(h('li',{class: St.marks[k]?'ok':''}, h('span',{class:'ck','aria-hidden':'true'}, St.marks[k]?'✓':''), h('span',{}, txt))));
    const q = quizBlock({
      q:`${ecrSysEn(s).charAt(0).toUpperCase()+ecrSysEn(s).slice(1)}, la cacería hace desaparecer ${ecrAl(T)}. ¿Qué es lo más probable a mediano plazo?`,
      ops:[ `${ecrArt(P,true)} aumentará, porque ya no queda ningún depredador en el ecosistema`,
            `${ecrArt(H,true)} aumentará y ${ecrArt(P)} disminuirá: es una cascada trófica`,
            `No cambiará nada, porque ${ecrArt(T)} es una sola especie entre muchas`,
            `Todas las poblaciones disminuirán, porque el ecosistema pierde la energía que aportaba ${ecrArt(T)}` ],
      ok:1,
      fb:`Es el efecto que viste en la simulación: sin control, ${ecrArt(H)} se multiplica y sobreexplota ${ecrAl(P)}. ${ecrArt(M,true)} también se libera de su depredador. A esto se le llama cascada trófica, y explica por qué proteger a un superdepredador protege en realidad a toda la vegetación.`,
      wrong:[ `${ecrArt(P,true)} es un productor: no lo controlan los depredadores, sino los herbívoros que lo comen. Si hay más herbívoros, habrá menos vegetación.`,
              `Los superdepredadores son pocos, pero su papel es clave: regulan a los herbívoros. Vuelve a la sección 5 y mira qué le pasa al productor cuando eliminas al depredador tope.`,
              `${ecrArt(T,true)} no aporta energía al ecosistema: la energía entra únicamente por los productores, con la fotosíntesis. Lo que aporta es regulación.` ]
    }, att => {
      if (St.marks.reto) return;
      St.marks.reto = true;
      const score = Object.values(St.marks).filter(Boolean).length;
      const min = Math.round((Date.now()-St.start)/60000);
      Store.completeActivity('cn-eco-red', { score:`${score}/6`, attempts: St.errs + (att-1), duracionMin:min, ecosistema:s.id });
      Store.grantBadge('ecologo');
      retoSt.className = 'notice ok'; retoSt.textContent = 'Reto resuelto ✓';
      toast('Actividad completada: red trófica y ecosistemas del Ecuador.');
      render();
    });
    return h('div',{class:'stack'},
      h('div',{class:'card stack'}, h('span',{class:'eyebrow eco'},'Reto final'),
        h('p',{},'Lo que hiciste hasta aquí:'), lista,
        h('p',{class:'small muted'},'Puedes resolver el reto aunque falte alguna casilla, pero tu resultado será mejor si antes construyes la red, compruebas tu predicción y justificas una medida.')),
      h('div',{class:'card stack'}, q,
        St.marks.reto ? h('div',{class:'notice ok'}, h('span',{}, h('b',{},'Actividad completada. '), `Prueba ahora el mismo análisis en otro ecosistema: ${Object.values(ECR_SYS).filter(x=>x.id!==s.id).map(x=>(x.ar==='la'?'la ':'el ')+x.n.toLowerCase()).join(' o ')} funcionan con las mismas reglas, aunque las especies cambien.`)) : null),
      secNav());
  }

  /* ---------- render ---------- */
  function render(){
    renderNav(); body.innerHTML='';
    const f = [secEspecies, secRed, secConstruye, secEnergia, secPerturba, secMateria, secConserva, secReto][St.sec];
    body.append(f());
    Store.log('seccion',{recurso:'cn-eco-red', seccion:SEC[St.sec].id, ecosistema:St.sys});
  }
  renderSys(); render();
});
</script>

<script>
/* =====================================================================
   VISTAS DEL ESTUDIANTE · CIENCIAS NATURALES (EGB Superior)
   Rutas: #/cn, #/cn/dominio/:dom, #/cn/unidad/:id, #/cn/progreso,
          #/cn/proximos/:id
   Funciones globales: cnNivelActual, cnProgresoUnidad, cnProgresoGrado,
          cnSiguientePaso
   ===================================================================== */

/* ---------- Grado del estudiante ---------- */
function cnNivelActual(){
  const ses = (Store && Store.ses) || {};
  const n = +ses.nivel; if (n===8 || n===9 || n===10) return n;
  const y = +ses.year;  if (y===8 || y===9 || y===10) return y;
  return 8;
}
function cnNivelDeclarado(){
  const ses = (Store && Store.ses) || {};
  return [8,9,10].includes(+ses.nivel) || [8,9,10].includes(+ses.year);
}

/* ---------- Progreso ---------- */
const cnHecho = id => !!(Store.s.activities[id] && Store.s.activities[id].done);
function cnPct(items){
  if (!items || !items.length) return 0;
  const tot = items.reduce((a,i)=>a+(i.peso||1),0);
  const got = items.reduce((a,i)=>a+(cnHecho(i.id)?(i.peso||1):0),0);
  return Math.round(got/tot*100);
}
function cnProgresoUnidad(unidadId){ return cnPct(BIO.cnGradeItems.filter(i=>i.unidad===unidadId)); }
function cnProgresoGrado(grado){ return cnPct(BIO.cnItemsDe(grado)); }
function cnProgresoDominio(grado, dom){
  const us = BIO.cnUnidadesDe(grado, dom);
  const ids = us.map(u=>u.id);
  const items = BIO.cnGradeItems.filter(i=>ids.includes(i.unidad));
  return items.length ? cnPct(items) : 0;
}

/* ---------- Siguiente paso recomendado ---------- */
function cnSiguientePaso(){
  const g = cnNivelActual(), us = BIO.cnUnidadesDe(g);
  for (const u of us) for (const rid of (u.recursos||[])){
    const r = BIO.cnRecurso(rid);
    if (r.ok && r.act && !cnHecho(r.act))
      return { em:r.em||'🔬', t:r.t, d:r.reto || r.d || '', href:r.href };
  }
  for (const u of us) for (const rid of (u.recursos||[])){
    const r = BIO.cnRecurso(rid);
    if (r.ok) return { em:r.em||'🔬', t:'Vuelve a '+r.t, d:'Ya resolviste todos los retos disponibles de tu grado. Repetir un laboratorio con otros datos afina tu explicación.', href:r.href };
  }
  return { em:'🗺', t:'Abre tu primera unidad', d:'Empieza por el reto de la unidad y luego revisa lo que dice el currículo.', href:'#/cn/dominio/cvt' };
}

/* ---------- Ayudantes de presentación ---------- */
const cnDominio = id => BIO.cn.dominios.find(d=>d.id===id);
const CN_ETIQUETA = { actual:'Tu grado', repaso:'Repaso', proximo:'Más adelante' };
function cnEstadoUnidad(u){ const g = cnNivelActual(); return u.grado===g ? 'actual' : u.grado<g ? 'repaso' : 'proximo'; }
function cnRecursosDe(u){ return (u.recursos||[]).map(BIO.cnRecurso).filter(r=>r.t); }
function cnHrefRecurso(r){ return r.ok ? r.href : '#/cn/proximos/'+r.id; }
function cnBarra(pct, dom, etiqueta){
  return h('div',{class:'progress '+dom, role:'img', 'aria-label':(etiqueta||'Avance')+': '+pct+' %'}, h('i',{style:'width:'+pct+'%'}));
}

/* Tarjeta de recurso: propósito y reto primero, estado siempre con texto */
function cnResTile(r, dom){
  if (!r || !r.t) return null;
  const done = !!(r.act && cnHecho(r.act));
  return h('a',{class:'tile res '+dom+(r.ok?'':' planned'), href:cnHrefRecurso(r)},
    h('span',{class:'ico'}, r.em||'🔬'),
    h('span',{class:'tipo'}, r.tipo||'Recurso'),
    h('h3',{}, r.t),
    h('p',{}, r.d||''),
    r.reto ? h('div',{class:'res-reto'}, h('b',{}, done ? '✓ Reto resuelto' : (r.ok ? '🎯 Tu reto' : '🎯 Propósito')), h('span',{}, r.reto)) : null,

/* Tarjeta de unidad */
function cnUnidadTile(u){
  const d = cnDominio(u.dom), st = cnEstadoUnidad(u), pct = cnProgresoUnidad(u.id);
  const rs = cnRecursosDe(u), ok = rs.filter(r=>r.ok).length;
  return h('a',{class:'tile area-tile '+d.dom+' '+st, href:'#/cn/unidad/'+u.id},
    h('span',{class:'yeartag '+st}, CN_ETIQUETA[st]),
    h('div',{class:'row',style:'justify-content:space-between;align-items:flex-start'},
      h('span',{class:'ico'}, d.em),
      h('span',{class:'mono small muted'}, BIO.nivel(u.grado).corto+' · U'+u.n)),
    h('h3',{}, u.t),
    h('p',{}, u.reto),
    h('span',{class:'small muted',style:'margin-top:auto'}, ok+' recurso'+(ok===1?'':'s')+' disponible'+(ok===1?'':'s')+' · '+(rs.length-ok)+' en construcción'),
    h('div',{class:'row',style:'gap:10px;align-items:center'}, h('div',{style:'flex:1'}, cnBarra(pct, d.dom, 'Avance de la unidad')), h('span',{class:'mono small muted'}, pct+' %')));
}

/* Tarjeta de dominio (inicio de Ciencias Naturales) */
function cnDominioTile(dom, grado){
  const us = BIO.cnUnidadesDe(grado, dom.id), pct = cnProgresoDominio(grado, dom.id);
  const rs = us.flatMap(cnRecursosDe), ok = rs.filter(r=>r.ok).length;
  return h('a',{class:'tile area-tile '+dom.dom+' actual', href:'#/cn/dominio/'+dom.id},
    h('span',{class:'yeartag actual'}, BIO.nivel(grado).corto),
    h('div',{class:'row',style:'justify-content:space-between;align-items:flex-start'},
      h('span',{class:'ico'}, dom.em),
      h('span',{class:'mono small muted'}, us.map(u=>'U'+u.n).join(' · '))),
    h('h3',{}, dom.n),
    h('p',{}, dom.d),
    h('ul',{class:'small muted',style:'padding-left:18px;display:flex;flex-direction:column;gap:3px;margin:0'},
      us.map(u => h('li',{}, u.t+' · '+cnProgresoUnidad(u.id)+' %'))),
    h('span',{class:'small muted',style:'margin-top:auto'}, ok+' recurso'+(ok===1?'':'s')+' disponible'+(ok===1?'':'s')+' en este grado'),
    h('div',{class:'row',style:'gap:10px;align-items:center'}, h('div',{style:'flex:1'}, cnBarra(pct, dom.dom, 'Avance del dominio')), h('span',{class:'mono small muted'}, pct+' %')));
}

/* Franja de competencias del área */
function cnCompetencias(){
  return h('div',{class:'cn-comp-grid'}, BIO.cn.competencias.map(c =>
    h('div',{class:'cn-comp'}, h('span',{class:'c'}, c.c), h('b',{}, c.n), h('span',{class:'d'}, c.d))));
}

/* Progresión Fundamenta → Conecta → Transfiere */
function cnProgresion(grado){
  return h('div',{class:'cn-prog'}, BIO.cn.progresion.map((p,i) => {
    const on = p.id===grado;
    return h('div',{class:'cn-step'+(on?' on':''), 'aria-current': on ? 'step' : 'false'},
      h('span',{class:'n'}, 'Paso '+(i+1)+' de 3 · '+BIO.nivel(p.id).corto),
      h('b',{}, p.t),
      h('p',{}, p.d),
      h('span',{class:'tag'}, on ? '● Aquí estás tú' : (p.id<grado ? 'Ya lo recorriste' : 'Viene después')));
  }));
}

/* Laboratorios y simuladores disponibles del grado */
function cnRecursosDisponibles(grado){
  const vistos = {}, out = [];
  BIO.cnUnidadesDe(grado).forEach(u => cnRecursosDe(u).forEach(r => {
    if (r.ok && !vistos[r.id]){ vistos[r.id]=1; out.push([r, cnDominio(u.dom).dom]); }
  }));
  return out;
}

    h('div',{class:'grid',style:'grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px'},
      CN_LOGROS.map(l => { let on=false; try { on = l.ok(); } catch(e){ on=false; }
        return h('div',{class:'badge-tile'+(on?'':' locked'), title:l.d},
          h('span',{class:'em'}, l.em), h('span',{class:'n'}, l.n), h('span',{class:'d'}, (on?'Conseguido · ':'Pendiente · ')+l.d)); })));

  /* siguiente paso */
  const next = cnSiguientePaso();
  const sig = h('div',{class:'card stack'}, h('span',{class:'eyebrow'},'Tu siguiente paso'),
    h('h3',{}, next.t), h('p',{class:'small muted'}, next.d),
    h('a',{class:'btn primary sm',href:next.href,style:'align-self:flex-start'},'Continuar'));

  g2.append(h('div',{class:'stack'}, porDom, acts), h('div',{class:'stack'}, sig, bd));
  view.append(g2);
  view.append(h('p',{class:'small muted',style:'margin-top:18px'},
    'El avance se calcula con las actividades registradas de tu grado; cada una pesa según su tipo. Los retos de repaso de otros grados no bajan tu porcentaje.'));
  view.append(h('div',{class:'row',style:'gap:8px;flex-wrap:wrap;margin-top:10px'},
    h('a',{class:'btn sm ghost',href:'#/cn'},'← Inicio de Ciencias Naturales'),
    h('a',{class:'btn sm ghost',href:'#/cuaderno'},'Mi cuaderno de campo')));
});

/* =====================================================================
   RECURSO EN CONSTRUCCIÓN
   ===================================================================== */
route('/cn/proximos/:id', (view, p) => {
  const r = BIO.cnRecurso(p.id);
  if (!r.t){ navigate('#/cn'); return; }
  if (r.ok){ navigate(r.href); return; }
  const unidades = BIO.cn.unidades.filter(u => (u.recursos||[]).includes(r.id));
  const u0 = unidades[0], dom = u0 ? cnDominio(u0.dom) : BIO.cn.dominios[0];
  const g = cnNivelActual();

  view.append(h('div',{class:'page-head'},
    h('div',{}, h('span',{class:'eyebrow '+dom.dom}, (r.tipo||'Recurso')+' · en construcción'),
      h('h1',{}, (r.em||'🔧')+' '+r.t),
      h('p',{}, r.d||''))));
  view.append(h('div',{class:'notice warn',style:'margin-bottom:14px'},
    h('span',{},'Este recurso todavía no está disponible. Preferimos decírtelo con claridad antes que mostrarte una pantalla vacía: aquí tienes qué tendrá, a qué unidad pertenece y qué puedes hacer mientras tanto.')));

  view.append(h('div',{class:'grid g2',style:'margin-bottom:18px'},
    h('div',{class:'card stack'}, h('span',{class:'eyebrow '+dom.dom},'Qué tendrá'),
      h('p',{}, r.d||''),
      r.reto ? h('div',{class:'res-reto'}, h('b',{},'🎯 Propósito'), h('span',{}, r.reto)) : null),
    h('div',{class:'card stack'}, h('span',{class:'eyebrow '+dom.dom},'A qué unidad pertenece'),
      unidades.length
        ? h('ul',{style:'padding-left:18px;display:flex;flex-direction:column;gap:6px;margin:0'},
            unidades.map(u => h('li',{}, h('a',{href:'#/cn/unidad/'+u.id}, BIO.nivel(u.grado).corto+' · '+cnDominio(u.dom).corto+' · U'+u.n+': '+u.t))))
        : h('p',{class:'small muted'},'Es un recurso transversal: se usará en varias unidades.'),
      unidades.length ? h('p',{class:'small muted'},'Mientras tanto, en esa unidad ya puedes revisar el reto, la evidencia que se te pedirá y los recursos que sí están listos.') : null)));

  const alt = [];
  const vistos = {};
  unidades.forEach(u => cnRecursosDe(u).forEach(x => { if (x.ok && !vistos[x.id]){ vistos[x.id]=1; alt.push([x, cnDominio(u.dom).dom]); } }));
  cnRecursosDisponibles(g).forEach(([x,d]) => { if (!vistos[x.id]){ vistos[x.id]=1; alt.push([x,d]); } });

  view.append(h('div',{class:'area-sec-head'},
    h('span',{class:'secn '+dom.dom},'▶'),
    h('div',{}, h('h2',{},'Mientras tanto, esto sí puedes hacer'),
      h('span',{class:'small muted'},'Recursos disponibles de esta unidad y de tu grado.'))));
  view.append(alt.length
    ? h('div',{class:'grid g3',style:'margin-bottom:18px'}, alt.slice(0,6).map(([x,d]) => cnResTile(x, d)))
    : h('div',{class:'ph',style:'margin-bottom:18px'},'Todavía no hay recursos disponibles para tu grado.'));

  view.append(h('div',{class:'row',style:'gap:8px;flex-wrap:wrap'},
    u0 ? h('a',{class:'btn',href:'#/cn/unidad/'+u0.id},'Ver la unidad completa') : null,
    h('a',{class:'btn ghost',href:'#/cn'},'← Inicio de Ciencias Naturales')));
});
</script>
<script>
/* =====================================================================
   INICIO DE LA APLICACIÓN: barra superior, roles, avisos y bienvenida
   ===================================================================== */
function updateChips(){
  const rol = Store.ses.rol, y = Store.year(), prog = Store.prog();
  const nom = $('#chip-nombre'), cur = $('#chip-curso'), chip = $('#userchip');
  if (rol === 'admin'){ nom.textContent = 'Administración'; cur.textContent = BIO.school.institucion; chip.setAttribute('href','#/admin'); $('.avatar').textContent = 'AD'; }
  else if (rol === 'docente'){ const d = Store.ses.docenteId && (Store.s.docentes||{})[Store.ses.docenteId];
    nom.textContent = d ? d.nombre : BIO.school.docente.nombre;
    cur.textContent = 'Docente de ' + (BIO.programas[prog]||BIO.programas.bio).n;
    chip.setAttribute('href','#/docente'); $('.avatar').textContent = d ? ((d.nombres||'D')[0]+(d.apellidos||'')[0]).toUpperCase() : 'DB'; }
  else if (rol === 'familia'){ nom.textContent = 'Representante'; cur.textContent = Store.s.user.nombre; chip.setAttribute('href','#/familia'); $('.avatar').textContent = '👪'; }
  else { nom.textContent = Store.s.user.nombre; cur.textContent = (y ? BIO.nivel(y).n : 'Sin curso asignado') + (Store.ses.paralelo ? ' · '+Store.ses.paralelo : '') + (Store.ses.invitado ? ' · invitado' : ''); chip.setAttribute('href','#/progreso'); $('.avatar').textContent = Store.s.user.iniciales; }
  const cn = prog === 'cn';
  const mn = $('#marca-n'), ms = $('#marca-sub'), logo = $('.logo');
  if (mn) mn.textContent = cn ? 'ANAI Ciencias' : 'ANAI BioLab';
  if (ms) ms.textContent = cn ? 'Ciencias Naturales · EGB' : 'Biología · Bachillerato';
  if (logo) logo.setAttribute('href', cn ? '#/cn' : '#/');
  const si = $('#search-input');
  if (si) si.setAttribute('placeholder', cn ? 'Buscar: densidad, circuitos, red trófica…' : 'Buscar: mitocondria, ventrículo, fotosíntesis…');
  buildNav(); updateNav(parseHash().path);
}
function cerrarSesion(){
  Users.logout(); updateChips(); closeModal(); closeBell();
  toast('Sesión cerrada.'); navigate('#/');
  setTimeout(()=>openWizard('rol'), 350);
}
function roleModal(){
  const opt = (rol, em, t, d, go) => h('button',{class:'wz-role',onclick:()=>{ Store.ses.rol = rol; if (rol==='estudiante' && !Store.year()) Store.guest(2); Store.save(); updateChips(); closeModal(); navigate(go); toast(`Vista de ${t.toLowerCase()} activada.`); }},
    h('span',{class:'em'},em), h('b',{},t), h('span',{class:'small muted'},d));
  openModal(h('div',{class:'stack'}, h('span',{class:'eyebrow'},'Cambiar de vista'), h('h3',{},'¿Cómo quieres ver la plataforma?'),
    h('p',{class:'small muted'},'En la versión con servidor, cada persona entra con su propia cuenta y solo ve lo que le corresponde. Aquí puedes alternar para conocer las tres vistas.'),
    h('div',{class:'wz-roles'}, opt('estudiante','🎒','Estudiante','Tu curso, tus retos y tu progreso.', Store.prog()==='cn' ? '#/cn' : '#/'), opt('docente','🧑‍🏫','Docente','Calificaciones, reportes y seguimiento de tus cursos.','#/docente'), opt('familia','👨‍👩‍👧','Representante','Avance y pendientes de tu representado.','#/familia')),
    h('div',{class:'row'}, h('button',{class:'btn sm',onclick:()=>{ closeModal(); navigate('#/admin'); }},'Entrar como administración')),
    h('div',{class:'row'},
      h('button',{class:'btn sm ghost',onclick:()=>{ closeModal(); openWizard('rol'); }},'Volver a la bienvenida'),
      h('button',{class:'btn sm ghost',onclick:()=>{ closeModal(); openWizard('login'); }},'Iniciar sesión con usuario'),
      h('button',{class:'btn sm',onclick:cerrarSesion},'Cerrar sesión'),
      h('button',{class:'btn sm ghost',onclick:closeModal},'Cancelar'))));
}
(function init(){
  applyA11y(); Store.touchVisit();
  buildNav(); updateChips();
  $('#btn-home').addEventListener('click', ()=>navigate('#/'));
  const mb = $('#btn-motion'); const syncMotion = () => mb.setAttribute('aria-pressed', !Store.s.settings.motion); syncMotion();
  mb.addEventListener('click', ()=>{ Store.s.settings.motion = !Store.s.settings.motion; Store.save(); syncMotion(); applyA11y(); toast(Store.s.settings.motion?'Animaciones activadas.':'Animaciones pausadas.'); });
  $('#btn-role').addEventListener('click', roleModal);
  $('#userchip').addEventListener('click', e => { e.preventDefault(); roleModal(); });
  $('#btn-a11y').addEventListener('click', ()=>navigate('#/accesibilidad'));
  $('#btn-help').addEventListener('click', ()=>{
    openModal(h('div',{class:'stack'}, h('span',{class:'eyebrow'},'Ayuda'), h('h3',{},'¿Necesitas orientarte?'),
      h('div',{class:'wz-tips'},
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); navigate('#/'); setTimeout(()=>startTour(),400); }}, h('span',{class:'em'},'🧭'), h('div',{}, h('b',{},'Recorrido guiado de 1 minuto'), h('p',{class:'small muted'},'Te muestro dónde está cada cosa.'))),
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); navigate('#/mapa'); }}, h('span',{class:'em'},'🗺'), h('div',{}, h('b',{},'Mapa de la plataforma'), h('p',{class:'small muted'},'Dónde estás y cuál es tu siguiente paso.'))),
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); navigate('#/accesibilidad'); }}, h('span',{class:'em'},'🅰'), h('div',{}, h('b',{},'Mi forma de aprender'), h('p',{class:'small muted'},'Letra, contraste, voz y ritmo.'))),
        h('button',{class:'wz-tip',onclick:()=>{ closeModal(); openWizard('rol'); }}, h('span',{class:'em'},'🔁'), h('div',{}, h('b',{},'Volver a empezar la bienvenida'), h('p',{class:'small muted'},'Cambiar de rol, de año o de código.')))),
      h('button',{class:'btn sm ghost',style:'align-self:flex-start',onclick:closeModal},'Cerrar')));
  });
  // avisos
  const bell = $('#btn-bell'), panel = $('#bell-panel');
  bell.addEventListener('click', e => { e.stopPropagation(); const open = panel.classList.toggle('open'); bell.setAttribute('aria-expanded', String(open)); if (open) renderBell(); });
  document.addEventListener('click', e => { if (!e.target.closest('.bell-wrap')) closeBell(); });
  renderBell();
  document.addEventListener('keydown', e => { if (e.key==='Escape') closeBell(); });
  if (!location.hash) location.hash = '#/';
  render();
  if (!Store.ses.onboarded) setTimeout(()=>openWizard(), 600);
})();
</script>
</body>
